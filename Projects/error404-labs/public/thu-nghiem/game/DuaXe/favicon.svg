<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a0533"/>
    </linearGradient>
    <linearGradient id="flame" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#ff4400"/>
      <stop offset="40%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- Checkered stripe -->
  <rect x="8" y="8" width="48" height="4" fill="#fff" opacity="0.15"/>
  <rect x="8" y="52" width="48" height="4" fill="#fff" opacity="0.15"/>
  <!-- Car body -->
  <rect x="16" y="26" width="32" height="14" rx="4" fill="#00ccff"/>
  <!-- Car top -->
  <rect x="22" y="22" width="20" height="8" rx="3" fill="#0088cc"/>
  <!-- Windshield -->
  <rect x="24" y="23" width="6" height="6" rx="1" fill="#aaddff" opacity="0.6"/>
  <rect x="34" y="23" width="6" height="6" rx="1" fill="#aaddff" opacity="0.6"/>
  <!-- Wheels -->
  <rect x="12" y="32" width="5" height="4" rx="1.5" fill="#222"/>
  <rect x="47" y="32" width="5" height="4" rx="1.5" fill="#222"/>
  <rect x="12" y="38" width="5" height="4" rx="1.5" fill="#222"/>
  <rect x="47" y="38" width="5" height="4" rx="1.5" fill="#222"/>
  <!-- Racing stripe -->
  <rect x="16" y="31" width="32" height="2" fill="#fff" opacity="0.3"/>
  <!-- Headlights -->
  <rect x="15" y="28" width="2" height="4" rx="0.5" fill="#ffff88"/>
  <rect x="15" y="34" width="2" height="4" rx="0.5" fill="#ff4444"/>
  <!-- Nitro flame -->
  <rect x="48" y="30" width="7" height="2" rx="1" fill="url(#flame)" opacity="0.9"/>
  <rect x="48" y="34" width="5" height="2" rx="1" fill="url(#flame)" opacity="0.7"/>
  <!-- Speed lines -->
  <line x1="24" y1="14" x2="24" y2="20" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
  <line x1="32" y1="12" x2="32" y2="20" stroke="#00ff88" stroke-width="1.5" opacity="0.7"/>
  <line x1="40" y1="14" x2="40" y2="20" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
  <!-- Glow accents -->
  <circle cx="32" cy="33" r="20" fill="none" stroke="#00ccff" stroke-width="0.5" opacity="0.2"/>
</svg>
