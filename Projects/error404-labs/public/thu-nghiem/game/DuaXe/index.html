// ── AI Lane-Changing Logic ──────────────────────────────────
// ══════════════════════════════════════════════════════════════

function updateTrafficAI(c,dt,currentSpeed){
  c.switchTimer-=dt;
  if(c.switchTimer>0) return;

  // Check if obstacle ahead
  let obstacleAhead=false, obstacleDist=999;
  for(const o of obstacles){
    if(!o.active) continue;
    if(Math.abs(o.lane-c.lane)<0.8 && o.y>c.y && o.y-c.y<250 && o.y-c.y>0){
      obstacleAhead=true; obstacleDist=o.y-c.y;
    }
  }

  // Check for slow car ahead
  let carAhead=false, carAheadDist=999;
  for(const tc of trafficCars){
    if(tc===c) continue;
    if(Math.abs(tc.lane-c.lane)<0.6 && tc.y>c.y && tc.y-c.y<200 && tc.y-c.y>0){
      carAhead=true; carAheadDist=tc.y-c.y;
    }
  }

  // Player info
  const playerLaneDiff=playerLane-c.lane;
  const playerDist=Math.abs(c.y-playerY);
  const playerNear=playerDist<200;

  // Adjacent lanes
  const leftClear=laneClear(c.lane-1,c.y,currentSpeed);
  const rightClear=laneClear(c.lane+1,c.y,currentSpeed);

  let shouldSwitch=false, targetDir=0;

  // ─── ƯU TIÊN 1: Né player ───
  // Nếu player đang cùng làn hoặc sắp đâm từ phía sau → né ra xa player
  if(playerNear){
    const sameLane=Math.abs(playerLaneDiff)<1.0;
    const willHit=playerDist<100 && sameLane;
    const closeLane=Math.abs(playerLaneDiff)<1.8 && playerDist<80;
    if(sameLane || willHit || closeLane){
      // Xác định hướng né: luôn ra xa player
      let avoidDir=0;
      if(playerLaneDiff>0.3) avoidDir=-1;           // player bên phải → né trái
      else if(playerLaneDiff<-0.3) avoidDir=1;      // player bên trái → né phải
      else if(c.lane>0) avoidDir=-1;                // cùng làn, ưu tiên trái
      else if(c.lane<LANE_COUNT-1) avoidDir=1;      // cùng làn, phải nếu trái hết
      // Chỉ né nếu làn đó an toàn, KHÔNG bao giờ né vào hướng player
      const targetLane=c.lane+avoidDir;
      if(avoidDir!==0 && targetLane>=0 && targetLane<LANE_COUNT && laneClear(targetLane,c.y,currentSpeed)){
        shouldSwitch=true; targetDir=avoidDir;
      }
    }
  }

  // ─── ƯU TIÊN 2: Tránh chướng ngại vật ───
  if(!shouldSwitch && obstacleAhead && obstacleDist<180){
    if(leftClear && c.lane>0){shouldSwitch=true;targetDir=-1}
    else if(rightClear && c.lane<LANE_COUNT-1){shouldSwitch=true;targetDir=1}
  }

  // ─── ƯU TIÊN 3: Tránh xe chậm phía trước ───
  if(!shouldSwitch && carAhead && carAheadDist<120){
    if(leftClear && c.lane>0){shouldSwitch=true;targetDir=-1}
    else if(rightClear && c.lane<LANE_COUNT-1){shouldSwitch=true;targetDir=1}
  }

  // ─── Random lane change (CHỈ khi player ở xa) ───
  if(!shouldSwitch && !playerNear && Math.random()<c.switchChance){
    const dir=Math.random()<0.5?1:-1;
    const nl=c.lane+dir;
    if(nl>=0&&nl<LANE_COUNT&&laneClear(nl,c.y,currentSpeed)){
      shouldSwitch=true; targetDir=dir;
    }
  }

  // Cautious override (nhưng không ghi đè né player)
  if(c.cautious>0.5 && Math.random()>0.1 && !playerNear) shouldSwitch=false;

  if(shouldSwitch && targetDir!==0){
    c.lane+=targetDir;
    c.lane=clamp(c.lane,0,LANE_COUNT-1);
    c.switchTimer=rand(0.8,c.maxSwitchTimer);
    c.brakeLight=true;
    setTimeout(()=>{c.brakeLight=false;},300);
  }else{
    c.switchTimer=rand(0.5,1.2);
  }
}

function laneClear(lane,y,currentSpeed){
  if(lane<0||lane>=LANE_COUNT) return false;
  // Check for cars in target lane
  for(const c of trafficCars){
    if(Math.abs(c.lane-lane)<0.6 && Math.abs(c.y-y)<120) return false;
  }
  // Check for obstacles
  for(const o of obstacles){
    if(!o.active) continue;
    if(Math.abs(o.lane-lane)<0.8 && Math.abs(o.y-y)<150) return false;
  }
  return true;
}

// ── Background / Road (Theme-aware) ──────────────────────
function drawBackground(){
  const theme=getCurrentTheme();
  const skyHue=theme.themeHue;

  // Sky gradient
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,theme.skyTop);
  grad.addColorStop(0.3,theme.skyMid);
  grad.addColorStop(0.6,theme.skyBot);
  grad.addColorStop(1,theme.skyBot);
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  // City silhouettes
  if(theme.hasBuildings){
    ctx.fillStyle='rgba(0,0,0,0.25)';
    for(let i=0;i<16;i++){
      const bw=18+((i*7)%15), bh=60+((i*13)%60);
      const bx=(i*29)%W;
      ctx.fillRect(bx,50+bh-bw,bw,bh);
      // Windows
      ctx.fillStyle='rgba(255,200,50,0.1)';
      for(let wy=0;wy<bh-14;wy+=12)
        for(let wx=3;wx<bw-6;wx+=10)
          if(((i+wx+wy)*7)%10>2) ctx.fillRect(bx+wx,50+bh-bw+6+wy,5,6);
      ctx.fillStyle='rgba(0,0,0,0.25)';
    }
  }

  // Desert landscape
  if(theme.themeHue>30&&theme.themeHue<50){
    ctx.fillStyle='rgba(180,130,60,0.15)';
    for(let i=0;i<12;i++){
      const cx=(i*43+17)%W, cy=100+((i*13)%60);
      ctx.beginPath();
      ctx.arc(cx,cy+20,18+((i*7)%15),Math.PI,0);
      ctx.fill();
    }
    // Cacti
    ctx.fillStyle='rgba(40,60,20,0.2)';
    for(let i=0;i<5;i++){
      const cx=(i*97+33)%W, cy=90+((i*17)%40);
      ctx.fillRect(cx-2,cy-25,4,30);
      const armDir=i%2?1:-1;
      ctx.fillRect(cx+armDir*8,cy-18,10,3);
      ctx.fillRect(cx+armDir*8,cy-25,3,12);
    }
  }

  // Stars
  if(theme.hasStars){
    for(let i=0;i<theme.starCount;i++){
      ctx.globalAlpha=(0.2+Math.sin(gameTime*2+i*1.7)*0.2)*(theme.themeHue>200?1:0.5);
      ctx.fillStyle='#fff';
      const sz=0.5+(i%3)*0.5;
      ctx.fillRect((i*137+50)%W,(i*97+15)%180,sz,sz);
    }
    ctx.globalAlpha=1;
  }

  // Grass verges (alternating for highway feel)
  if(theme.themeHue>200&&theme.themeHue<230){
    // Highway: striped grass
    for(let y=-(roadOffset%40);y<H;y+=80){
      ctx.fillStyle=y%160<80?'#2a5a2a':'#3a6a3a';
      ctx.fillRect(0,y,ROAD_L-8,40);
      ctx.fillRect(ROAD_R+8,y,W-ROAD_R-8,40);
    }
  }else{
    ctx.fillStyle=theme.grass;
    ctx.fillRect(0,0,ROAD_L-8,H);
    ctx.fillRect(ROAD_R+8,0,W-ROAD_R-8,H);
  }

  // Road surface (gradient top to bottom)
  const rGrad=ctx.createLinearGradient(0,0,0,H);
  rGrad.addColorStop(0,theme.roadTop);
  rGrad.addColorStop(0.5,theme.roadBot);
  rGrad.addColorStop(1,theme.roadTop);
  ctx.fillStyle=rGrad; ctx.fillRect(ROAD_L,0,ROAD_W,H);

  // Road texture nhẹ
  ctx.fillStyle='rgba(255,255,255,0.02)';
  for(let y=-(roadOffset%12);y<H;y+=12){
    const xOff=Math.floor(y/24)%2;
    ctx.fillRect(ROAD_L+(xOff*6),y,6,6);
  }

  // Lề đường (curb) — dải trắng hai bên
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.fillRect(ROAD_L-3,0,3,H);
  ctx.fillRect(ROAD_R,0,3,H);

  // Edge markers (cọc tiêu đỏ/trắng)
  const edgeColor0=theme.roadEdge0; // màu thứ nhất (thường đỏ/cam)
  const edgeColor1=theme.roadEdge1; // màu thứ hai (thường trắng/vàng)
  for(let y=-(roadOffset%48);y<H;y+=48){
    if(y>8){
      // Cọc tiêu trái
      ctx.fillStyle=y%96<48?edgeColor0:edgeColor1;
      ctx.fillRect(ROAD_L-8,y,5,24);
      // Cọc tiêu phải
      ctx.fillRect(ROAD_R+3,y,5,24);
    }
  }

  // Lane markings (vạch kẻ lane)
  ctx.fillStyle=theme.laneMark;
  for(let l=1;l<LANE_COUNT;l++){
    const lx=ROAD_L+l*LANE_W-1;
    if(theme.themeHue>230&&theme.themeHue<250){
      ctx.globalAlpha=0.18;
      ctx.fillRect(lx,0,2,H);
      ctx.globalAlpha=1;
    }else{
      for(let y=-(roadOffset%80);y<H;y+=80)
        if(y%160<80&&y>0) ctx.fillRect(lx,y,2,36);
    }
  }

  // Cat's eye reflectors (chấm phản quang giữa lane)
  ctx.fillStyle='rgba(255,200,100,0.15)';
  for(let l=0;l<LANE_COUNT;l++){
    const cx=ROAD_L+l*LANE_W+LANE_W/2;
    for(let y=-(roadOffset%160);y<H;y+=160){
      if(y>0) {
        ctx.beginPath(); ctx.arc(cx-1,y+40,2,0,Math.PI*2); ctx.fill();
      }
    }
  }

  // Road center reflective marker
  if(!(theme.themeHue>230&&theme.themeHue<250)){
    ctx.fillStyle='rgba(255,255,100,0.05)';
    const cx=(ROAD_L+ROAD_R)/2-1;
    for(let y=-(roadOffset%120);y<H;y+=120)
      if(y%240<120&&y>0) ctx.fillRect(cx,y,2,55);
  }

  // ── Reflective Wet Road (Rain theme) ──
  if(theme.themeHue>230&&theme.themeHue<250){
    // Wet road shine streaks
    ctx.save();
    for(let y=-(roadOffset%30);y<H;y+=30){
      const alpha=0.02+Math.sin(y*0.1+gameTime*0.5)*0.015;
      if(alpha<0.01) continue;
      ctx.fillStyle=`rgba(180,200,255,${alpha})`;
      const streakW=4+Math.sin(y*0.2)*2;
      const streakX=ROAD_L+Math.sin(y*0.15+gameTime)*10+(y%60)*4;
      ctx.fillRect(streakX,y,streakW,8);
      // Mirror reflection (upside down)
      ctx.fillStyle=`rgba(180,200,255,${alpha*0.5})`;
      ctx.fillRect(streakX+2,y-16,streakW-1,6);
    }
    // Road mirror (horizontal reflection lines)
    ctx.fillStyle='rgba(150,180,230,0.03)';
    for(let y=-(roadOffset%40);y<H;y+=40){
      ctx.fillRect(ROAD_L,y,ROAD_W,1);
    }
    // Street light reflections on wet road
    for(let i=0;i<6;i++){
      const rx=ROAD_L+20+i*((ROAD_W-40)/5);
      const ry=(roadOffset*0.5+i*130)%H;
      const refA=0.04+Math.sin(gameTime*2+i)*0.02;
      ctx.fillStyle=`rgba(255,220,100,${refA})`;
      ctx.beginPath();
      ctx.ellipse(rx,ry,6,20,0,0,Math.PI*2);
      ctx.fill();
      // Elongated reflection
      ctx.fillStyle=`rgba(255,220,100,${refA*0.3})`;
      ctx.beginPath();
      ctx.ellipse(rx,ry-40,4,30,0,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ── Rain Render ───────────────────────────────────────────
function drawRain(){
  const theme=getCurrentTheme();
  if(!theme.hasRain||rainDrops.length===0) return;
  ctx.strokeStyle='rgba(180,200,255,0.15)';
  ctx.lineWidth=1;
  for(const drop of rainDrops){
    const windOffset=Math.sin(drop.y*0.01+gameTime*2)*drop.wind;
    ctx.globalAlpha=drop.alpha;
    ctx.beginPath();
    ctx.moveTo(drop.x+windOffset,drop.y);
    ctx.lineTo(drop.x+windOffset+drop.wind*0.1,drop.y+drop.len);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawDust(){
  const theme=getCurrentTheme();
  if(!theme.dustColor||dustParticles.length===0) return;
  for(const d of dustParticles){
    ctx.globalAlpha=d.alpha*(0.5+Math.sin(gameTime*0.5+d.x)*0.5);
    ctx.fillStyle=`rgb(${theme.dustColor.r},${theme.dustColor.g},${theme.dustColor.b})`;
    ctx.fillRect(d.x,d.y,d.size,d.size*0.5);
  }
  ctx.globalAlpha=1;
}

// ── Obstacle Render ───────────────────────────────────────
function drawObstacles(){
  for(const o of obstacles){
    if(!o.active) continue;
    ctx.save();
    const cx=o.x, cy=o.y, bw=o.w, bh=o.h;

    if(o.type==='construction'){
      // ── Rào chắn công trường ──
      // Bóng đổ
      ctx.fillStyle='rgba(0,0,0,0.25)';
      ctx.beginPath(); roundRect(ctx,cx-bw/2+3,cy+3,bw,bh,3); ctx.fill();

      // Thân rào chắn
      ctx.shadowColor='#ff6600'; ctx.shadowBlur=10;
      ctx.fillStyle='#cc5500';
      ctx.beginPath(); roundRect(ctx,cx-bw/2,cy,bw,bh,3); ctx.fill();
      ctx.shadowBlur=0;

      // Sọc cảnh báo chéo (chevron pattern)
      ctx.save();
      ctx.beginPath(); roundRect(ctx,cx-bw/2,cy,bw,bh,3); ctx.clip();
      for(let s=-bw;s<bw+bh;s+=14){
        ctx.fillStyle=(Math.floor(s/14)%2)?'rgba(255,200,0,0.5)':'rgba(255,255,255,0.3)';
        ctx.save(); ctx.translate(cx,cy+bh/2);
        ctx.rotate(0.5);
        ctx.fillRect(s-bw/2,-bh/2,12,bh);
        ctx.restore();
      }
      ctx.restore();

      // Viền
      ctx.strokeStyle='rgba(255,200,0,0.6)'; ctx.lineWidth=1.5;
      ctx.beginPath(); roundRect(ctx,cx-bw/2,cy,bw,bh,3); ctx.stroke();

      // Icon công trường
      ctx.fillStyle='#ffdd00';
      ctx.font='bold 16px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor='#ff6600'; ctx.shadowBlur=6;
      ctx.fillText('\u26A1',cx,cy+bh/2);
      ctx.shadowBlur=0;
    }

    else if(o.type==='oil'){
      // ── Vệt dầu loang ──
      const wobble=Math.sin(o.animTimer*1.5)*2;

      // Bóng
      ctx.fillStyle='rgba(0,0,0,0.15)';
      ctx.beginPath();
      ctx.ellipse(cx+2,cy+bh/2+3,bw/2+2,bh/2+2,0,0,Math.PI*2);
      ctx.fill();

      // Vệt dầu chính
      ctx.shadowColor='rgba(0,255,200,0.12)'; ctx.shadowBlur=18;
      const oilG=ctx.createRadialGradient(cx,cy+bh/2,0,cx,cy+bh/2,bw/2);
      oilG.addColorStop(0,'rgba(15,10,30,0.7)');
      oilG.addColorStop(0.3,'rgba(25,20,45,0.55)');
      oilG.addColorStop(0.6,'rgba(45,55,75,0.3)');
      oilG.addColorStop(1,'rgba(30,30,50,0.08)');
      ctx.fillStyle=oilG;
      ctx.beginPath();
      ctx.ellipse(cx+wobble,cy+bh/2,bw/2,bh/2,0,0,Math.PI*2);
      ctx.fill();

      // Ánh cầu vồng
      for(let i=0;i<4;i++){
        const hue=(o.animTimer*30+i*90)%360;
        ctx.fillStyle=`hsla(${hue},90%,55%,${0.05+Math.sin(o.animTimer*2+i)*0.02})`;
        ctx.beginPath();
        ctx.ellipse(cx+wobble+i*2,cy+bh/2-2+i*3,bw/3-i*2,bh/4,0.2,0,Math.PI*2);
        ctx.fill();
      }
      ctx.shadowBlur=0;

      // Bọt khí nhỏ
      for(let i=0;i<3;i++){
        const bx=cx+Math.sin(o.animTimer*1.5+i*2)*bw*0.3;
        const by=cy+bh/2+Math.cos(o.animTimer*2+i)*bh*0.2;
        ctx.fillStyle='rgba(200,220,255,0.08)';
        ctx.beginPath(); ctx.arc(bx,by,2+Math.sin(o.animTimer+i)*0.5,0,Math.PI*2); ctx.fill();
      }
    }

    else if(o.type==='barrier'){
      // ── Rào chắn bê-tông ──
      const bobY=Math.sin(o.animTimer*2)*2;

      // Bóng
      ctx.fillStyle='rgba(0,0,0,0.3)';
      ctx.beginPath(); roundRect(ctx,cx-bw/2+4,cy-bh/2+bobY+5,bw,bh,4); ctx.fill();

      // Thân rào
      ctx.shadowColor='#cc0000'; ctx.shadowBlur=14;
      ctx.fillStyle='#cc2222';
      ctx.beginPath(); roundRect(ctx,cx-bw/2,cy-bh/2+bobY,bw,bh,4); ctx.fill();
      ctx.shadowBlur=0;

      // Sọc phản quang trắng
      ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.fillRect(cx-bw/2+3,cy-bh/2+bobY+5,bw-6,4);
      ctx.fillRect(cx-bw/2+3,cy+bh/2+bobY-9,bw-6,4);

      // Chevron pattern
      ctx.save();
      ctx.beginPath(); roundRect(ctx,cx-bw/2,cy-bh/2+bobY,bw,bh,4); ctx.clip();
      for(let y=-bh/2;y<bh/2;y+=10){
        const px=cx-bw/2+((y+bh/2)%20<10?2:bw*0.3);
        ctx.fillStyle='rgba(255,255,255,0.15)';
        ctx.fillRect(px,cy+y+bobY,bw*0.4,5);
      }
      ctx.restore();

      // Đèn nháy cảnh báo
      const flashOn=Math.sin(o.animTimer*6)>0;
      ctx.shadowColor=flashOn?'#ff0000':'#880000';
      ctx.shadowBlur=flashOn?22:8;
      ctx.fillStyle=flashOn?'#ff2200':'#991111';
      ctx.beginPath();
      ctx.arc(cx,cy-bh/2+bobY-7,5,0,Math.PI*2);
      ctx.fill();

      // Đèn phụ
      ctx.fillStyle=flashOn?'#ff8800':'#884400';
      ctx.shadowColor=flashOn?'#ff8800':'#884400';
      ctx.shadowBlur=flashOn?15:5;
      ctx.beginPath();
      ctx.arc(cx-10,cy-bh/2+bobY-7,3,0,Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx+10,cy-bh/2+bobY-7,3,0,Math.PI*2);
      ctx.fill();
      ctx.shadowBlur=0;

      // Chữ DỪNG
      ctx.fillStyle='#fff';
      ctx.font='bold 11px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor='#000'; ctx.shadowBlur=4;
      ctx.fillText('DỪNG',cx,cy+bobY);
      ctx.shadowBlur=0;
    }

    ctx.restore();
  }
}

// ── Car Drawer (đẹp như asset free) ──────────────────────────
function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
  let rot = Math.PI / 2 * 3;
  let x = cx;
  let y = cy;
  let step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerRadius;
    y = cy + Math.sin(rot) * outerRadius;
    ctx.lineTo(x, y);
    rot += step;
    x = cx + Math.cos(rot) * innerRadius;
    y = cy + Math.sin(rot) * innerRadius;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerRadius);
  ctx.closePath();
  ctx.fill();
}

function drawCar(x,y,w,h,color,accent,isPlayer,flash,typeKey){
  x=Math.round(x); y=Math.round(y);
  const r=Math.min(w,h)*0.1;
  const frontY=y-h*0.48;  // đầu xe (hướng lên)
  const rearY=y+h*0.48;   // đuôi xe

  // Get customization configurations
  let cust = null;
  let carColor = color;
  let carAccent = accent;
  if (isPlayer) {
    cust = (screen === 'garage') ? (previewCustomizations || carCustomizations[selectedCar]) : carCustomizations[selectedCar];
    if (cust && cust.paint !== 'default') {
      carColor = cust.paint;
    }
  }

  // Player glow
  if(isPlayer){
    const g=ctx.createRadialGradient(x,y,0,x,y,85);
    g.addColorStop(0,carColor+'60'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(x-85,y-85,170,170);
  }

  const alpha=flash?0.35:1;
  ctx.globalAlpha=alpha;

  // ── Shadow ──
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(x+4,y+6,w*0.52,h*0.52,0,0,0,Math.PI*2);
  ctx.fill();

  // ── Neon Underglow ──
  if (isPlayer && cust && cust.underglow !== 'none') {
    let ugColor = null;
    if (cust.underglow === 'blue') ugColor = 'rgba(0, 200, 255, 0.4)';
    else if (cust.underglow === 'red') ugColor = 'rgba(255, 30, 30, 0.4)';
    else if (cust.underglow === 'lime') ugColor = 'rgba(57, 255, 20, 0.4)';
    else if (cust.underglow === 'rgb') {
      let hue = (gameTime * 200) % 360;
      ugColor = `hsla(${hue}, 100%, 50%, 0.4)`;
    }
    if (ugColor) {
      ctx.save();
      ctx.shadowColor = ugColor.replace('0.4', '1.0');
      ctx.shadowBlur = 25;
      ctx.fillStyle = ugColor;
      ctx.beginPath();
      ctx.ellipse(x, y + h * 0.1, w * 0.62, h * 0.46, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ── Body xe thể thao ──
  ctx.shadowColor=isPlayer?carColor+'80':'transparent'; ctx.shadowBlur=isPlayer?18:0;
  ctx.fillStyle=carColor;
  ctx.beginPath();
  const bw=w*0.38, bh=h*0.42;
  const noseW=w*0.28;
  // Nửa trái thân xe
  ctx.moveTo(x-noseW,frontY+2);
  ctx.bezierCurveTo(x-bw-2,frontY+bh*0.15, x-bw,frontY+bh*0.5, x-bw,frontY+bh);
  ctx.lineTo(x-bw,rearY-bh);
  ctx.bezierCurveTo(x-bw,rearY-bh*0.5, x-bw-2,rearY-2, x-noseW,rearY-2);
  // Nửa phải thân xe
  ctx.lineTo(x+noseW,rearY-2);
  ctx.bezierCurveTo(x+bw+2,rearY-2, x+bw,rearY-bh*0.5, x+bw,rearY-bh);
  ctx.lineTo(x+bw,frontY+bh);
  ctx.bezierCurveTo(x+bw,frontY+bh*0.5, x+bw+2,frontY+bh*0.15, x+noseW,frontY+2);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;

  // ── Highlight body ──
  const hl=ctx.createLinearGradient(x,frontY-5,x,rearY+5);
  hl.addColorStop(0,'rgba(255,255,255,0.28)');
  hl.addColorStop(0.3,'rgba(255,255,255,0.1)');
  hl.addColorStop(0.6,'rgba(0,0,0,0.05)');
  hl.addColorStop(1,'rgba(0,0,0,0.3)');
  ctx.fillStyle=hl;
  ctx.beginPath();
  ctx.moveTo(x-noseW,frontY+2);
  ctx.bezierCurveTo(x-bw-2,frontY+bh*0.15, x-bw,frontY+bh*0.5, x-bw,frontY+bh);
  ctx.lineTo(x-bw,rearY-bh);
  ctx.bezierCurveTo(x-bw,rearY-bh*0.5, x-bw-2,rearY-2, x-noseW,rearY-2);
  ctx.lineTo(x+noseW,rearY-2);
  ctx.bezierCurveTo(x+bw+2,rearY-2, x+bw,rearY-bh*0.5, x+bw,rearY-bh);
  ctx.lineTo(x+bw,frontY+bh);
  ctx.bezierCurveTo(x+bw,frontY+bh*0.5, x+bw+2,frontY+bh*0.15, x+noseW,frontY+2);
  ctx.closePath(); ctx.fill();

  // ── Decals ──
  if(isPlayer && cust){
    const decal = cust.decal;
    if(decal === 'stripes'){
      ctx.fillStyle='rgba(255,255,255,0.22)';
      ctx.fillRect(x-w*0.07,frontY+3,w*0.14,h*0.9);
      ctx.fillStyle='rgba(255,255,255,0.12)';
      ctx.fillRect(x-w*0.035,frontY+3,w*0.07,h*0.9);
    } else if(decal === 'flames'){
      ctx.fillStyle = 'rgba(255, 85, 0, 0.35)';
      // Trái
      ctx.beginPath();
      ctx.moveTo(x - bw + 2, y - 10);
      ctx.lineTo(x - bw + 7, y + 5);
      ctx.lineTo(x - w*0.12, y + 12);
      ctx.lineTo(x - bw + 4, y + 20);
      ctx.closePath(); ctx.fill();
      // Phải
      ctx.beginPath();
      ctx.moveTo(x + bw - 2, y - 10);
      ctx.lineTo(x + bw - 7, y + 5);
      ctx.lineTo(x + w*0.12, y + 12);
      ctx.lineTo(x + bw - 4, y + 20);
      ctx.closePath(); ctx.fill();
    } else if(decal === 'stars'){
      ctx.fillStyle = 'rgba(255, 215, 0, 0.45)';
      drawStar(ctx, x, y - 18, 5, 7, 3);
      drawStar(ctx, x - bw*0.5, y + 12, 5, 4, 1.8);
      drawStar(ctx, x + bw*0.5, y + 12, 5, 4, 1.8);
    } else if(decal === 'cyber'){
      ctx.strokeStyle = 'rgba(0, 255, 240, 0.45)';
      ctx.lineWidth = 1;
      ctx.save();
      ctx.beginPath();
      ctx.rect(x - bw, y - bh, bw*2, bh*2);
      ctx.clip();
      for (let offset = -40; offset < 40; offset += 8) {
        ctx.beginPath();
        ctx.moveTo(x - bw, y + offset);
        ctx.lineTo(x + bw, y + offset + 8);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ── Kính lái ──
  const windG=ctx.createLinearGradient(x,frontY+bh*0.1,x,frontY+bh*0.55);
  windG.addColorStop(0,'rgba(170,210,255,0.65)');
  windG.addColorStop(0.5,'rgba(130,180,240,0.4)');
  windG.addColorStop(1,'rgba(100,160,230,0.2)');
  ctx.fillStyle=windG;
  ctx.beginPath();
  ctx.moveTo(x-w*0.34,frontY+bh*0.2);
  ctx.quadraticCurveTo(x-w*0.28,frontY+bh*0.08,x-w*0.14,frontY+bh*0.04);
  ctx.lineTo(x+w*0.14,frontY+bh*0.04);
  ctx.quadraticCurveTo(x+w*0.28,frontY+bh*0.08,x+w*0.34,frontY+bh*0.2);
  ctx.lineTo(x+w*0.28,frontY+bh*0.55);
  ctx.lineTo(x-w*0.28,frontY+bh*0.55);
  ctx.closePath(); ctx.fill();

  // ── Kính sau ──
  ctx.fillStyle='rgba(130,180,240,0.25)';
  ctx.beginPath();
  ctx.moveTo(x-w*0.24,rearY-bh*0.45);
  ctx.quadraticCurveTo(x-w*0.28,rearY-bh*0.25,x-w*0.3,rearY-bh*0.1);
  ctx.lineTo(x+w*0.3,rearY-bh*0.1);
  ctx.quadraticCurveTo(x+w*0.28,rearY-bh*0.25,x+w*0.24,rearY-bh*0.45);
  ctx.closePath(); ctx.fill();

  // ── Kính hông ──
  ctx.fillStyle='rgba(100,160,230,0.12)';
  ctx.fillRect(x-bw+1,frontY+bh*0.6,4,h*0.22);
  ctx.fillRect(x+bw-5,frontY+bh*0.6,4,h*0.22);

  // ── Đèn pha LED (animated) ──
  const headPulse=isPlayer?0.85+Math.sin(gameTime*6+playerSway)*0.15:1;
  ctx.shadowColor='#ffffcc'; ctx.shadowBlur=16*headPulse;
  ctx.fillStyle=isPlayer?`rgb(${220+Math.floor(Math.sin(gameTime*5)*35)},${220+Math.floor(Math.sin(gameTime*5)*30)},${200})`:'#eeeedd';
  ctx.beginPath(); ctx.ellipse(x-w*0.28,frontY+2,4,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+w*0.28,frontY+2,4,2.5,0,0,Math.PI*2); ctx.fill();
  // LED DRL (Daytime Running Lights)
  const drlBright=isPlayer?0.2+Math.sin(gameTime*4)*0.08:0.15;
  ctx.fillStyle=`rgba(255,255,200,${drlBright})`;
  ctx.fillRect(x-w*0.24,frontY-12,3,12);
  ctx.fillRect(x+w*0.21,frontY-12,3,12);
  // Đèn xi-nhan
  if(isPlayer&&Math.abs(playerSway)>2){
    const turnFlash=Math.sin(gameTime*12)>0;
    const turnSide=playerSway>0?'right':'left';
    ctx.shadowColor=turnFlash?'#ff8800':'transparent';
    ctx.shadowBlur=turnFlash?18:0;
    ctx.fillStyle=turnFlash?'#ff8800':'rgba(255,136,0,0.2)';
    if(turnSide==='left'){
      ctx.fillRect(x-w*0.35,frontY-4,5,3);
      ctx.fillRect(x-w*0.35,rearY-4,5,3);
    }else{
      ctx.fillRect(x+w*0.30,frontY-4,5,3);
      ctx.fillRect(x+w*0.30,rearY-4,5,3);
    }
    ctx.shadowBlur=0;
  }

  // ── Đèn hậu LED (animated) ──
  const brakeGlow=isPlayer&&(speed<120||leftPressed||rightPressed)?1:(!isPlayer?0.7:0.4);
  const brakeBlur=10+brakeGlow*20;
  ctx.shadowColor='#ff3333'; ctx.shadowBlur=brakeBlur;
  ctx.fillStyle=`rgb(${Math.floor(180+brakeGlow*75)},${Math.floor(30-brakeGlow*20)},${Math.floor(30-brakeGlow*20)})`;
  ctx.fillRect(x-w*0.28,rearY-6,6,5);
  ctx.fillRect(x+w*0.22,rearY-6,6,5);
  // Brake light glow halo
  if(brakeGlow>0.5){
    ctx.shadowBlur=30;
    ctx.fillStyle=`rgba(255,0,0,${brakeGlow*0.15})`;
    ctx.beginPath(); ctx.arc(x-w*0.25,rearY-4,8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+w*0.25,rearY-4,8,0,Math.PI*2); ctx.fill();
  }
  if(!isPlayer){
    const tc=trafficCars.find(c=>c.x===x&&c.y===y);
    if(tc&&tc.brakeLight){
      ctx.shadowColor='#ff0000'; ctx.shadowBlur=30;
      ctx.fillStyle='#ff2200';
      ctx.fillRect(x-w*0.28,rearY-6,6,6);
      ctx.fillRect(x+w*0.22,rearY-6,6,6);
      ctx.fillStyle='rgba(255,0,0,0.12)';
      ctx.beginPath(); ctx.arc(x-w*0.25,rearY-4,12,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+w*0.25,rearY-4,12,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.shadowBlur=0;

  // ── Bánh xe ──
  const wheelW=5, wheelH=10;
  const wPosX=x-w*0.47, wPosX2=x+w*0.47;
  const wPosY1=frontY+bh*0.55, wPosY2=rearY-bh*0.55;

  // Wheel arches
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.ellipse(wPosX,wPosY1,wheelW,wheelH,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(wPosX2,wPosY1,wheelW,wheelH,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(wPosX,wPosY2,wheelW,wheelH,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(wPosX2,wPosY2,wheelW,wheelH,0,0,Math.PI*2); ctx.fill();

  // Custom wheels customization
  let rimColor = '#777';
  let hubColor = '#aaa';
  let isNeonWheel = false;
  let isClassicWheel = false;
  let isSportsWheel = false;

  if (isPlayer && cust) {
    const wheel = cust.wheel;
    if (wheel === 'classic') {
      rimColor = '#999';
      hubColor = '#444';
      isClassicWheel = true;
    } else if (wheel === 'sports') {
      rimColor = '#bbbbcc';
      hubColor = '#d43f00';
      isSportsWheel = true;
    } else if (wheel === 'neon') {
      rimColor = '#00f5ff';
      hubColor = '#fff';
      isNeonWheel = true;
    } else if (wheel === 'gold') {
      rimColor = '#ffd700';
      hubColor = '#ffaa00';
    }
  }

  // Rims
  ctx.fillStyle=rimColor;
  ctx.beginPath(); ctx.ellipse(wPosX,wPosY1,wheelW-2,wheelH-3,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(wPosX2,wPosY1,wheelW-2,wheelH-3,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(wPosX,wPosY2,wheelW-2,wheelH-3,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(wPosX2,wPosY2,wheelW-2,wheelH-3,0,0,Math.PI*2); ctx.fill();

  // Chấu mâm
  if (isClassicWheel) {
    ctx.strokeStyle = '#222'; ctx.lineWidth = 0.5;
    for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 3) {
      const dx = Math.cos(angle) * (wheelW - 2);
      const dy = Math.sin(angle) * (wheelH - 3);
      ctx.beginPath();
      ctx.moveTo(wPosX, wPosY1); ctx.lineTo(wPosX + dx, wPosY1 + dy);
      ctx.moveTo(wPosX2, wPosY1); ctx.lineTo(wPosX2 + dx, wPosY1 + dy);
      ctx.moveTo(wPosX, wPosY2); ctx.lineTo(wPosX + dx, wPosY2 + dy);
      ctx.moveTo(wPosX2, wPosY2); ctx.lineTo(wPosX2 + dx, wPosY2 + dy);
      ctx.stroke();
    }
  } else if (isSportsWheel) {
    ctx.fillStyle = '#111';
    for (let angle = 0; angle < Math.PI * 2; angle += Math.PI * 2 / 5) {
      const dx = Math.cos(angle) * (wheelW - 2);
      const dy = Math.sin(angle) * (wheelH - 3);
      ctx.beginPath();
      ctx.arc(wPosX + dx * 0.5, wPosY1 + dy * 0.5, 0.8, 0, Math.PI * 2);
      ctx.arc(wPosX2 + dx * 0.5, wPosY1 + dy * 0.5, 0.8, 0, Math.PI * 2);
      ctx.arc(wPosX + dx * 0.5, wPosY2 + dy * 0.5, 0.8, 0, Math.PI * 2);
      ctx.arc(wPosX2 + dx * 0.5, wPosY2 + dy * 0.5, 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Hubs
  ctx.fillStyle=hubColor;
  const hubR=2.5;
  ctx.beginPath(); ctx.arc(wPosX,wPosY1,hubR,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(wPosX2,wPosY1,hubR,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(wPosX,wPosY2,hubR,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(wPosX2,wPosY2,hubR,0,Math.PI*2); ctx.fill();

  if (isNeonWheel) {
    ctx.save();
    ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(0, 245, 255, 0.4)';
    ctx.beginPath(); ctx.arc(wPosX,wPosY1,hubR+1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(wPosX2,wPosY1,hubR+1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(wPosX,wPosY2,hubR+1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(wPosX2,wPosY2,hubR+1,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // ── Spoiler ──
  if(isPlayer && cust){
    const spoiler = cust.spoiler;
    if(spoiler === 'low'){
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(x-w*0.35,rearY-2,w*0.7,3);
    } else if(spoiler === 'sport'){
      ctx.fillStyle='rgba(0,0,0,0.6)';
      ctx.fillRect(x-w*0.38,rearY-5,w*0.76,3);
      ctx.fillStyle=carColor;
      ctx.fillRect(x-w*0.25,rearY-5,3,3);
      ctx.fillRect(x+w*0.25-3,rearY-5,3,3);
    } else if(spoiler === 'gt'){
      ctx.fillStyle='rgba(15,15,15,0.85)';
      ctx.fillRect(x-w*0.44,rearY-7,w*0.88,4);
      ctx.fillStyle='rgba(255,50,0,0.8)';
      ctx.fillRect(x-w*0.44,rearY-9,2,7);
      ctx.fillRect(x+w*0.44-2,rearY-9,2,7);
      ctx.fillStyle='#333';
      ctx.fillRect(x-w*0.22,rearY-7,3,5);
      ctx.fillRect(x+w*0.22-3,rearY-7,3,5);
    } else if(spoiler === 'carbon'){
      ctx.fillStyle='#111';
      ctx.fillRect(x-w*0.42,rearY-8,w*0.84,3);
      ctx.fillStyle='#222';
      ctx.fillRect(x-w*0.38,rearY-5,w*0.76,2);
      ctx.fillStyle='#555';
      ctx.fillRect(x-w*0.2,rearY-8,3,6);
      ctx.fillRect(x+w*0.2-3,rearY-8,3,6);
    }
  } else if (isPlayer) {
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.fillRect(x-w*0.38,rearY-3,w*0.76,3);
    ctx.fillStyle='rgba(255,255,255,0.1)';
    ctx.fillRect(x-w*0.32,rearY-2,w*0.64,2);
  }

  // ── Nitro (ngọn lửa đa lớp) ──
  if(isPlayer&&nitroActive){
    const nTime=gameTime*20;
    let coreColor = '#00ddff';
    let middleColor = '#ff8800';
    let sparkColor = '#ffcc00';
    let coreGlow = '#00ccff';
    let midGlow = '#ff6600';
    let smokeColor = 'rgba(180, 180, 200, 0.06)';

    if (cust) {
      const nitroCol = cust.nitro;
      if (nitroCol === 'red') {
        coreColor = '#ff0033'; middleColor = '#ff5500'; sparkColor = '#ffcc00';
        coreGlow = '#ff0000'; midGlow = '#ff3300';
      } else if (nitroCol === 'purple') {
        coreColor = '#a800ff'; middleColor = '#ff00ee'; sparkColor = '#00ffff';
        coreGlow = '#8800ff'; midGlow = '#ff00cc';
      } else if (nitroCol === 'green') {
        coreColor = '#39ff14'; middleColor = '#00ff88'; sparkColor = '#ffff00';
        coreGlow = '#00ff00'; midGlow = '#00ffaa';
      } else if (nitroCol === 'gold') {
        coreColor = '#ffd700'; middleColor = '#ffaa00'; sparkColor = '#ffffff';
        coreGlow = '#ffd700'; midGlow = '#ffaa00';
      }
    }

    // Lớp 1: Lửa trong
    ctx.shadowColor=coreGlow; ctx.shadowBlur=40;
    for(let i=0;i<4;i++){
      const fx=x+(i-1.5)*10+Math.sin(nTime+i*2)*3;
      const fy=rearY+rand(2,8);
      const len=rand(18,35);
      ctx.fillStyle=coreColor;
      ctx.beginPath();
      ctx.moveTo(fx-2,fy);
      ctx.quadraticCurveTo(fx-1,fy+len*0.6,fx,fy+len);
      ctx.quadraticCurveTo(fx+1,fy+len*0.6,fx+2,fy);
      ctx.fill();
    }
    // Lớp 2: Lửa giữa
    ctx.shadowColor=midGlow; ctx.shadowBlur=35;
    for(let i=0;i<5;i++){
      const fx=x+(i-2)*9+Math.sin(nTime+10+i*3)*4;
      const fy=rearY+rand(3,12);
      const len=rand(14,28);
      ctx.fillStyle=middleColor;
      ctx.beginPath();
      ctx.moveTo(fx-3,fy);
      ctx.lineTo(fx,fy+len);
      ctx.lineTo(fx+3,fy);
      ctx.fill();
    }
    // Lớp 3: Tia lửa
    ctx.shadowBlur=25;
    ctx.shadowColor=sparkColor;
    for(let i=0;i<3;i++){
      const fx=x+(i-1)*12+Math.sin(nTime+20+i*5)*5;
      const fy=rearY+rand(5,15);
      ctx.fillStyle=i%2?sparkColor:'#ff4400';
      const sz=rand(2,5);
      ctx.beginPath(); ctx.arc(fx,fy,sz,0,Math.PI*2); ctx.fill();
    }
    // Lớp 4: Khói xả
    ctx.shadowBlur=0;
    ctx.fillStyle=smokeColor;
    for(let i=0;i<3;i++){
      const fx=x+(i-1)*15+Math.sin(nTime+30+i*7)*3;
      const fy=rearY+rand(8,20);
      ctx.beginPath(); ctx.arc(fx,fy,rand(8,16),0,Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur=0;
  }

  // ── License Plate ──
  if (isPlayer && cust) {
    const pText = cust.plate || 'TURBO';
    const pBg = cust.plateBg || '#ffffff';
    const pTextColor = cust.plateText || '#000000';
    ctx.save();
    ctx.shadowBlur = 0;
    ctx.fillStyle = pBg;
    const pW = 16;
    const pH = 6;
    const pX = x - pW / 2;
    const pY = rearY - 3;
    ctx.fillRect(pX, pY, pW, pH);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(pX, pY, pW, pH);
    ctx.fillStyle = pTextColor;
    ctx.font = 'bold 4.5px "Segoe UI",monospace,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pText.toUpperCase(), x, pY + pH / 2 + 0.3);
    ctx.restore();
  }

  ctx.globalAlpha=1;
}

// ── HUD (Modern Arcade) ──────────────────────────────────
function drawHUD(){
  ctx.textBaseline='alphabetic';
  const mode=GAME_MODES[selectedMode]||GAME_MODES.endless;

  // ── Top bar glass morphism ──
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.3)'; ctx.shadowBlur=20;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); roundRect(ctx,0,0,W,56,0); ctx.fill();
  ctx.shadowBlur=0;
  // Bottom border glow
  ctx.fillStyle='rgba(0,200,255,0.08)';
  ctx.fillRect(0,54,W,2);

  // ── Row 1: Score (left) | Timer (center) | Speed + KM/H (right) ──
  // ── Row 2: Level (left) | Coins + Hearts (right) ──
  const row1Y=26, row2Y=48;
  const rightEdge=W-14;

  // ── Score (trái, hàng trên) ──
  ctx.textAlign='left';
  const scorePulse=Math.sin(gameTime*3)*0.04+1;
  ctx.save();
  ctx.translate(14,row1Y);
  ctx.scale(scorePulse,scorePulse);
  ctx.shadowColor='rgba(255,255,255,0.15)'; ctx.shadowBlur=8;
  ctx.fillStyle='#fff'; ctx.font='bold 22px "Segoe UI",system-ui,sans-serif';
  ctx.fillText('\u{1F3C6} '+score,0,0);
  ctx.restore();

  // ── Mode Timer (Time Trial) ──
  if(mode.hasTimer&&mode.timerDuration){
    const remaining=Math.max(0,mode.timerDuration-gameModeTimer);
    const secs=Math.ceil(remaining);
    const timerWarn=secs<=10;
    ctx.textAlign='left';
    ctx.shadowColor=timerWarn?'rgba(255,50,50,0.5)':'rgba(255,215,0,0.2)';
    ctx.shadowBlur=timerWarn?16:8;
    ctx.fillStyle=timerWarn?`rgb(255,${50+Math.floor(Math.sin(gameTime*12)*40)},${50+Math.floor(Math.sin(gameTime*12)*40)})`:'#ffd700';
    ctx.font='bold 18px "Segoe UI",system-ui,sans-serif';
    // Đặt timer ngay sau score (đo độ rộng score để tránh overlap)
    ctx.font='bold 22px "Segoe UI",system-ui,sans-serif';
    const scoreW=ctx.measureText('\u{1F3C6} '+Math.floor(score)).width;
    const timerX=Math.max(110,14+scoreW*scorePulse+16);
    ctx.font='bold 18px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('\u23F1\uFE0F '+secs+'s',timerX,row1Y);
    if(timerWarn){
      ctx.fillStyle=`rgba(255,30,30,${0.08+Math.sin(gameTime*10)*0.06})`;
      ctx.fillRect(0,0,W,56);
    }
    ctx.shadowBlur=0;
  }

  // ── Speed Gauge ──
  const displaySpeed=speed*(nitroActive?1.7:1);
  const spdVal=Math.round(displaySpeed*0.45);
  const speedPct=displaySpeed/MAX_SPEED;
  // Speed bar (ngắn lại để nhường chỗ text bên phải)
  const sbX=W*0.48,sbY=10,sbW=W*0.32,sbH=4;
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.08)';
  ctx.beginPath(); roundRect(ctx,sbX,sbY,sbW,sbH,2); ctx.fill();
  // Speed bar fill
  const sbG=ctx.createLinearGradient(sbX,sbY,sbX+sbW,sbY);
  sbG.addColorStop(0,nitroActive?'#00ff88':'#0088ff');
  sbG.addColorStop(0.6,nitroActive?'#00e5ff':'#00ccff');
  sbG.addColorStop(1,nitroActive?'#ff00ff':'#ff6600');
  ctx.fillStyle=sbG;
  ctx.shadowColor=nitroActive?'#00ffaa':'#0088ff';
  ctx.shadowBlur=nitroActive?10:4;
  ctx.beginPath(); roundRect(ctx,sbX,sbY,sbW*Math.min(speedPct,1),sbH,2); ctx.fill();
  ctx.shadowBlur=0;

  // ── Speed number + KM/H (phải, hàng trên) ──
  ctx.fillStyle=nitroActive?'#0ff':'#8cf';
  ctx.font='bold 18px "Segoe UI",system-ui,sans-serif';
  const spdStr=String(spdVal).padStart(3,'0');
  // KM/H font 9px ~22px rộng. Cả cụm speed+KM/H khít lề phải (rightEdge=466)
  const kmhW=22; // approximate
  const spdEndX=rightEdge-kmhW-2; // speed kết thúc tại đây, KM/H bắt đầu sau 2px
  ctx.textAlign='right';
  ctx.fillText(spdStr,spdEndX,row1Y);
  ctx.fillStyle='rgba(150,200,255,0.4)'; ctx.font='9px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign='left';
  ctx.fillText('KM/H',spdEndX+2,row1Y);

  // ── Level + XP Bar (trái, hàng dưới) ──
  const xpProgress=getXpProgress(xp,level);
  const xpForNext=getXpForNextLevel(level);
  const xpBarW=90, xpBarH=4, xpBarX=14, xpBarY=row2Y+4;
  // Level number
  ctx.fillStyle='rgba(200,255,220,0.6)'; ctx.font='bold 10px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign='left';
  ctx.fillText('LV.'+level,xpBarX,xpBarY-1);
  // XP bar background
  ctx.fillStyle='rgba(255,255,255,0.08)';
  ctx.beginPath(); roundRect(ctx,xpBarX,xpBarY,xpBarW,xpBarH,2); ctx.fill();
  // XP bar fill (gradient cyan→green)
  if(xpProgress>0){
    const grad=ctx.createLinearGradient(xpBarX,xpBarY,xpBarX+xpBarW,xpBarY);
    grad.addColorStop(0,'#00cc88'); grad.addColorStop(1,'#00ffaa');
    ctx.fillStyle=grad;
    ctx.shadowColor='rgba(0,255,170,0.25)'; ctx.shadowBlur=6;
    ctx.beginPath(); roundRect(ctx,xpBarX+1,xpBarY+1,(xpBarW-2)*Math.min(xpProgress,1),xpBarH-2,1.5); ctx.fill();
    ctx.shadowBlur=0;
  }
  // XP text nhỏ bên cạnh bar
  ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.font='7px "Segoe UI",system-ui,sans-serif';
  ctx.fillText(xp+'/'+(getTotalXpForLevel(level)+xpForNext),xpBarX+94,xpBarY+5);

  // ── Buff icons (hàng thứ 3, dưới pause button) ──
  const buffY=94;
  let buffX=xpBarX;
  if(scoreMult>1){buffX+=22;
    ctx.fillStyle='rgba(255,200,50,0.5)'; ctx.font='8px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('\u2B50x'+scoreMult,buffX,buffY);
  }
  if(coinValueMult>1){buffX+=34;
    ctx.fillStyle='rgba(255,215,0,0.5)'; ctx.font='8px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('$x'+coinValueMult,buffX,buffY);
  }
  if(nitroRefillMult>1){buffX+=30;
    ctx.fillStyle='rgba(0,200,255,0.45)'; ctx.font='8px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('\u26A1x'+nitroRefillMult.toFixed(1),buffX,buffY);
  }
  if(nearMissMult>1){buffX+=32;
    ctx.fillStyle='rgba(255,150,0,0.45)'; ctx.font='8px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('\u26A0x'+nearMissMult,buffX,buffY);
  }
  if(bonusInvincible>0){buffX+=26;
    ctx.fillStyle='rgba(100,200,255,0.45)'; ctx.font='8px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('\u{1F6E1} +'+bonusInvincible+'s',buffX,buffY);
  }

  // ── Right side bottom row: Hearts ──
  ctx.textAlign='right';
  const maxHearts=Math.min(Math.max(mode.lives||3,maxLives),6);
  for(let i=0;i<maxHearts;i++){
    const hx=rightEdge-i*22;
    const alive=i<lives;
    ctx.shadowColor=alive?'rgba(255,50,50,0.3)':'transparent';
    ctx.shadowBlur=alive?10:0;
    ctx.font=alive?'14px "Segoe UI",system-ui,sans-serif':'13px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle=alive?'#ff3355':'rgba(255,255,255,0.15)';
    ctx.fillText(alive?'\u2764\uFE0F':'\u{1F9F6}',hx,row2Y);
  }
  ctx.shadowBlur=0;

  // ── Near miss streak ──
  if(nearMissStreak>=3){
    ctx.fillStyle='rgba(255,170,0,0.5)';
    ctx.font='bold 11px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign='center';
    const nmFlash=Math.sin(gameTime*5)*0.2+0.8;
    ctx.globalAlpha=nmFlash;
    ctx.fillText('\u26A1 '+nearMissStreak+'x SUÝT!',W/2,76);
    ctx.globalAlpha=1;
  }

  // ── Difficulty indicator ──
  if(adaptDifficulty>0.3){
    const diffAlpha=(adaptDifficulty-0.3)*0.5;
    ctx.fillStyle=`rgba(255,100,50,${diffAlpha})`;
    ctx.font='9px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign='left';
    const diffLabel=adaptDifficulty<0.5?'BÌNH THƯỜNG':adaptDifficulty<0.7?'KHÓ':'ÁC MỘNG';
    ctx.shadowColor='rgba(255,100,50,0.2)'; ctx.shadowBlur=4;
    ctx.fillText('\u26A0 '+diffLabel,14,88);
    ctx.shadowBlur=0;
  }
  
  // ── Wanted Level Display ──
  if(wantedLevel>0){
    const wAlpha=0.6+Math.sin(gameTime*6)*0.2;
    ctx.fillStyle=`rgba(255,0,0,${wAlpha})`;
    ctx.font='bold 10px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign='left';
    ctx.shadowColor='rgba(255,0,0,0.4)'; ctx.shadowBlur=8;
    const stars='★'.repeat(wantedLevel)+'☆'.repeat(3-wantedLevel);
    ctx.fillText('TRUY NÃ '+stars,14,100);
    ctx.shadowBlur=0;
  }
  
  // ── Police Chase Warning ──
  if(policeChase&&policeChase.active){
    const pAlpha=0.5+Math.sin(gameTime*8)*0.3;
    ctx.fillStyle=`rgba(255,50,50,${pAlpha})`;
    ctx.font='bold 11px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign='center';
    ctx.shadowColor='rgba(255,0,0,0.5)'; ctx.shadowBlur=10;
    ctx.fillText('\u{1F6A8} CẢNH SÁT ĐUỔI \u{1F6A8}',W/2,108);
    ctx.shadowBlur=0;
  }

  // ── Nitro Bar (Bottom - Modern) ──
  const nbW=260,nbH=10,nbX=(W-nbW)/2,nbY=H-32;
  // Outer glow container
  ctx.shadowColor=nitroActive?'rgba(0,255,170,0.25)':'rgba(0,100,255,0.1)';
  ctx.shadowBlur=nitroActive?20:8;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); roundRect(ctx,nbX-4,nbY-4,nbW+8,nbH+8,8); ctx.fill();
  ctx.shadowBlur=0;

  const nRatio=nitro/NITRO_MAX;
  // Segment-based nitro bar
  const segCount=10;
  for(let i=0;i<segCount;i++){
    const segW=(nbW-4)/segCount-2;
    const segX=nbX+2+i*((nbW-4)/segCount);
    const filled=i/segCount<nRatio;
    if(nitroActive){
      ctx.fillStyle=filled?(i%2===0?'#00ff88':'#00e5ff'):'rgba(255,255,255,0.05)';
      ctx.shadowColor=filled?'#00ffaa':'transparent';
      ctx.shadowBlur=filled?12:0;
    }else{
      ctx.fillStyle=filled?(i%2===0?'#0066ff':'#0088ff'):'rgba(255,255,255,0.04)';
      ctx.shadowColor=filled?'#0066ff':'transparent';
      ctx.shadowBlur=filled?6:0;
    }
    ctx.beginPath(); roundRect(ctx,segX,nbY,segW,nbH,3); ctx.fill();
  }
  ctx.shadowBlur=0;

  // Nitro label
  ctx.textAlign='center';
  ctx.fillStyle=nitroActive?'#0ff':'rgba(255,255,255,0.4)';
  ctx.font='bold 9px "Segoe UI",system-ui,sans-serif';
  const nitroLabelFlash=nitroActive?Math.sin(gameTime*8)*0.3+0.7:1;
  ctx.globalAlpha=nitroLabelFlash;
  ctx.fillText(nitroActive?'NITRO \u26A1 TĂNG TỐC':'NITRO',W/2,nbY-6);
  ctx.globalAlpha=1;

  // ── Pause button (glass) ──
  ctx.fillStyle='rgba(255,255,255,0.06)';
  ctx.shadowColor='rgba(0,0,0,0.2)'; ctx.shadowBlur=8;
  ctx.beginPath(); roundRect(ctx,10,58,28,22,6); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.font='bold 11px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('\u23F8',24,69);
  ctx.restore();
}

// ── Screen Shake (directional + frequency) ──────────────
let shakeFreq=0; // shake frequency multiplier
let shakeDirX=0, shakeDirY=0; // directional bias
function triggerShake(intensity, dirX, dirY, freq){
  shakeIntensity=Math.max(shakeIntensity,intensity);
  shakeDirX=dirX||0;
  shakeDirY=dirY||-1;
  shakeFreq=Math.max(shakeFreq,freq||1);
}
function updateShake(dt){
  if(shakeIntensity>0){
    // Smooth decay
    shakeIntensity*=0.92-dt*0.3;
    shakeFreq=lerp(shakeFreq,1,dt*3);
    // Directional shake: bias towards direction
    const fx=shakeDirX*shakeIntensity*0.3;
    const fy=shakeDirY*shakeIntensity*0.3;
    shakeX=rand(-shakeIntensity,shakeIntensity)*1.2*shakeFreq+fx;
    shakeY=rand(-shakeIntensity,shakeIntensity)*0.8*shakeFreq+fy;
    if(shakeIntensity<0.15){
      shakeIntensity=0;shakeX=0;shakeY=0;
      shakeDirX=0;shakeDirY=0;shakeFreq=0;
    }
  }
}

// ── Collision ────────────────────────────────────────────
function rectOverlap(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

// ══════════════════════════════════════════════════════════════
// ── GAME UPDATE (enhanced) ──────────────────────────────────
// ══════════════════════════════════════════════════════════════

function updateGame(dt){
  if(screen!=='game'||paused) return;

  gameTime+=dt;

  // ── Theme Transition ──
  const gameMode=GAME_MODES[selectedMode]||GAME_MODES.endless;
  if(!gameMode.forceTheme){
    themeTimer+=dt;
    if(themeTimer>=THEME_CHANGE_INTERVAL){
      themeTimer=0;
      // Start transition to next theme
      currentThemeIdx=nextThemeIdx;
      nextThemeIdx=(currentThemeIdx+1)%THEME_KEYS.length;
      themeTransition=0;
      SFX.themeChange();
      // Reinitialize weather
      initRain();
      initDust();
    }
    if(themeTransition<1){
      themeTransition=Math.min(1,themeTransition+dt/THEME_TRANSITION_DURATION);
    }
  }

  // ── Railway gate collision (check BEFORE speed ramp) ──
  railwayBlocked=false;
  {
    const pr={x:playerX-PLAYER_W/2,y:playerY-PLAYER_H/2,w:PLAYER_W,h:PLAYER_H};
    for(const g of railwayGates){
      if(g.gateTarget>0.5&&!g.trainPassed){
        const gateRect={x:ROAD_L-5,y:g.y-60,w:ROAD_R-ROAD_L+10,h:120};
        if(rectOverlap(pr,gateRect)){
          railwayBlocked=true;
          if(playerY>g.y-70) playerY=g.y-70;
        }
      }
    }
  }
  // Visual feedback when blocked (with cooldown)
  if(railwayBlocked){
    railwayBlockMsgTimer-=dt;
    if(railwayBlockMsgTimer<=0){
      spawnFloatingText(playerX,playerY-65,'⚠️ ĐỢI TÀU!','#ff4444',22);
      triggerShake(2);
      railwayBlockMsgTimer=1.5;
    }
  }else{
    railwayBlockMsgTimer=0;
  }

  // ── Speed Ramp ──
  if(!railwayBlocked){
    speed=Math.min(MAX_SPEED,BASE_SPEED+gameTime*0.55);
  }

  // ── Level từ XP tích lũy ──
  const newLevel=getLevelFromXp(xp);
  if(newLevel>level){
    level=newLevel;
    applyLevelPerks(level);
    spawnLevelUpEffect(level);
    saveData(); // Lưu ngay level mới
  }else if(level!==getLevelFromXp(xp)){
    level=getLevelFromXp(xp);
  }

  // ── Adaptive Difficulty ──
  difficultyTimer+=dt;
  if(difficultyTimer>5){ // Recalculate every 5 seconds
    difficultyTimer=0;
    const timeAlive=gameTime-gameStartTime;
    const baseAdapt=Math.min(1,timeAlive/120); // Max difficulty after 2 minutes
    const perfBonus=Math.min(0.3,(score/5000)*0.3);
    adaptDifficulty=Math.min(1,baseAdapt+perfBonus);
  }

  // ── Nitro ──
  if(nitroActive){
    nitro-=NITRO_DRAIN*dt;
    if(nitro<=0){nitro=0;nitroActive=false}
    nitroTimer+=dt;
  }else{
    nitro=Math.min(NITRO_MAX,nitro+NITRO_REFILL*dt*nitroRefillMult);
  }
  const currentSpeed=railwayBlocked?0:speed*(nitroActive?1.7:1);
  const spd=currentSpeed*dt;

  // ── Road Scroll ──
  roadOffset+=spd;

  // ── Lane Switch (smooth) ──
  if(playerTargetLane!==playerLane){
    const step=6*dt;
    const diff=playerTargetLane-playerLane;
    if(Math.abs(diff)<step) playerLane=playerTargetLane;
    else playerLane+=Math.sign(diff)*step;
  }
  playerX=ROAD_L+playerLane*LANE_W+LANE_W/2;

  // ── Oil Slide Effect ──
  if(oilDuration>0){
    oilDuration-=dt;
    // Xoay tròn xe
    const spinSpeed=oilSlide*4;
    oilAngle+=spinSpeed*dt;
    oilSlide=lerp(oilSlide,0,dt*1.8);
    // Trôi làn theo góc xoay
    const drift=Math.sin(oilAngle)*0.15;
    playerLane=clamp(playerLane+drift*dt*2,0,LANE_COUNT-1);
    // Khi sắp hết hiệu ứng, kéo về target lane
    if(oilDuration<0.4 && oilTargetLane>=0){
      const diff=oilTargetLane-playerLane;
      if(Math.abs(diff)>0.05) playerLane+=diff*dt*3;
      else playerLane=oilTargetLane;
    }
    if(oilDuration<=0){
      oilSlide=0; oilAngle=0; oilTargetLane=-1;
    }
  }

  // ── Visual Bob ──
  carBob+=dt*4;
  playerSway=lerp(playerSway,0,dt*6);

  // ── Invincibility ──
  if(invincibleTimer>0){invincibleTimer-=dt;hitFlash+=dt*8}

  // ── Mode Timer ──
  const mode=GAME_MODES[selectedMode]||GAME_MODES.endless;
  if(mode.hasTimer&&mode.timerDuration){
    gameModeTimer+=dt;
    const remaining=mode.timerDuration-gameModeTimer;
    if(remaining<=0){
      // Time's up! end with bonus score
      const timeBonus=Math.floor(gameTime*10*scoreMult);
      score+=timeBonus; xp+=timeBonus;
      screen='over';endScore=score;
      if(score>highScore) highScore=score;
      totalCoins+=score;
      saveData();
      spawnParticles(playerX,playerY,80,'#00ffaa',350,7,0.8);
      spawnSparks(playerX,playerY,20,'#00ffaa');
      document.getElementById('touchCtrls').classList.remove('active');
      stopEngineSound();
      return;
    }
  }

  // ── Spawners (mode-adjusted) ──
  spawnTimer-=dt;
  if(spawnTimer<=0){
    spawnTraffic();
    const minSpawn=(0.3-adaptDifficulty*0.15)/mode.trafficMult;
    const maxSpawn=(1.6-adaptDifficulty*0.4)/mode.trafficMult;
    spawnTimer=rand(Math.max(0.2,minSpawn),Math.max(0.4,maxSpawn));
  }
  coinSpawnTimer-=dt;
  if(coinSpawnTimer<=0){
    spawnCoin();
    coinSpawnTimer=rand(0.6/mode.coinMult,1.8/mode.coinMult);
  }

  // Obstacle spawner (CHỈ ở mode Vượt Chướng Ngại Vật)
  if(mode.key==='obstacleRush'){
    obstacleTimer-=dt;
    if(obstacleTimer<=0){
      spawnObstacle();
      if(Math.random()<0.45) spawnObstacle();
      const baseInterval=(3.5-adaptDifficulty*1.5)/mode.obstacleMult;
      obstacleTimer=rand(Math.max(1.0,baseInterval-0.8),Math.max(2.0,baseInterval+0.8));
    }
  }

  // ── Update Rain ──
  const theme=getCurrentTheme();
  if(theme.hasRain){
    for(const drop of rainDrops){
      drop.y+=drop.speed*dt;
      drop.x+=drop.wind*dt*0.3;
      if(drop.y>H){drop.y=-rand(0,20);drop.x=rand(0,W)}
      if(drop.x>W) drop.x=0;
      if(drop.x<0) drop.x=W;
    }
  }

  // ── Update Dust ──
  if(theme.dustColor){
    for(const d of dustParticles){
      d.y+=d.speed*dt;
      d.x+=d.drift*dt*0.5;
      if(d.y>H){d.y=-rand(10,40);d.x=rand(ROAD_L,ROAD_R)}
    }
  }

  // ── Update Traffic ──
  // Traffic uses base speed (keeps moving even when player blocked at railway)
  const trafficSpeed=railwayBlocked?speed*0.3:currentSpeed;
  for(let i=trafficCars.length-1;i>=0;i--){
    const c=trafficCars[i];
    // Move car based on its own speed
    c.y+=trafficSpeed*dt*c.speedMult*0.85;

    // AI lane-changing logic
    updateTrafficAI(c,dt,trafficSpeed);

    // Smooth lane movement
    const targetX=c.laneX;
    c.x=lerp(c.x,targetX,dt*5);

    if(c.y>H+160){trafficCars.splice(i,1);continue}
    if(!c.passed&&c.y>playerY+PLAYER_H/2+15){
      c.passed=true;
      const passScore=Math.floor((5+speed*0.02)*scoreMult);
      score+=passScore; xp+=passScore;
    }
    // Near-miss
    const dx=Math.abs(c.x-playerX), dy=Math.abs(c.y-playerY);
    if(!c.sparkTimer&&dy<PLAYER_H*0.55&&dx<LANE_W*0.5&&dx>PLAYER_W*0.25){
      c.sparkTimer=1;
      combo++; comboTimer=2; comboSpeed=0;
      const bonus=50*combo;
      const nmScore=Math.floor(bonus*nearMissMult*scoreMult);
      score+=nmScore; nearMissStreak++; xp+=nmScore;
      spawnFloatingText(playerX,playerY-65,'SUÝT! +'+nmScore,'#ffaa00',18);
      spawnParticles(playerX,playerY,12,'#ffaa00',120,3,0.5);
      spawnParticles(c.x,c.y,8,'#ff6600',90,2,0.4);
      triggerShake(3); SFX.nearMiss();
    }
  }

  // ── Update Coins ──
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    c.y+=spd*0.9; c.bob+=dt*3;
    if(c.y>H+40){coins.splice(i,1);continue}
    const dx=Math.abs(c.x-playerX), dy=Math.abs(c.y-playerY);
    if(dx<PLAYER_W/2+COIN_R&&dy<PLAYER_H/2+COIN_R){
      const bonus=Math.floor(100*(combo||1));
      const coinScore=Math.floor(bonus*coinValueMult*scoreMult);
      score+=coinScore; xp+=coinScore;
      spawnFloatingText(c.x,c.y,'+'+coinScore,'#ffd700',20);
      spawnParticles(c.x,c.y,10,'#ffd700',100,3,0.5);
      combo++; comboTimer=2;
      coins.splice(i,1); triggerShake(1.5);
      SFX.coin();
    }
  }

  // ── Update Obstacles ──
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    o.update(dt,spd);
    if(!o.active||o.y>H+120){obstacles.splice(i,1);continue}

    // Collision with player
    if(invincibleTimer<=0&&!o.hit){
      const pr={x:playerX-PLAYER_W/2,y:playerY-PLAYER_H/2,w:PLAYER_W,h:PLAYER_H};
      if(rectOverlap(pr,o.rect)){
        o.hit=true;
        if(o.type==='oil'){
          // Oil spill: trượt + xoay tròn
          const spinDir=Math.random()<0.5?1:-1;
          const laneShift=Math.random()<0.5?-1:1;
          oilAngle=0;
          oilSlide=spinDir*rand(1.5,3);
          oilDuration=rand(1.0,1.8);
          oilTargetLane=clamp(Math.round(playerLane)+laneShift,0,LANE_COUNT-1);
          spawnFloatingText(playerX,playerY-65,'TRƠN TRƯỢT!','#88aaff',16);
          spawnParticles(o.x,o.y,15,'#446688',80,4,0.5);
          triggerShake(5); SFX.oil();
        }else if(o.type==='construction'){
          // Construction: damage + slow
          lives--;
          // Reckless driving increases wanted level
          if(Math.random()<0.3) wantedLevel=Math.min(3,wantedLevel+1);
          if(lives<=0){
            screen='over';endScore=score;
            if(score>highScore) highScore=score;
            totalCoins+=score;
            saveData();
            spawnParticles(playerX,playerY,60,'#ff6600',300,6,0.8);
            spawnSparks(playerX,playerY,25,'#ff6600');
            document.getElementById('touchCtrls').classList.remove('active');
            stopEngineSound();stopBGM();
            break;
          }
          invincibleTimer=1.5;
          speed=Math.max(BASE_SPEED,speed*0.5);
          combo=0;
          spawnFloatingText(playerX,playerY-65,'VA CHẠM!','#ff6600',20);
          spawnParticles(o.x,o.y,30,'#ff8800',200,5,0.6);
          triggerShake(12); SFX.crash();
        }else if(o.type==='barrier'){
          // Barrier: heavy damage
          lives-=2;
          if(lives<=0){
            screen='over';endScore=score;
            if(score>highScore) highScore=score;
            totalCoins+=score;
            saveData();
            spawnParticles(playerX,playerY,70,'#ff2200',350,7,0.8);
            spawnSparks(playerX,playerY,30,'#ff2200');
            document.getElementById('touchCtrls').classList.remove('active');
            stopEngineSound();stopBGM();
            break;
          }
          invincibleTimer=2+bonusInvincible;
          speed=Math.max(BASE_SPEED*0.5,speed*0.3);
          combo=0;
          spawnFloatingText(playerX,playerY-80,'RÀO CHẮN!','#ff2222',22);
          spawnParticles(o.x,o.y,40,'#ff4400',250,6,0.7);
          triggerShake(18); SFX.barrier();
        }
      }
    }
  }

  // ── Combo decay ──
  if(comboTimer>0){
    comboTimer-=dt; comboSpeed+=dt*2;
    if(comboTimer<=0){combo=0;nearMissStreak=0}
  }

  // ── Combo milestone sound ──
  if(combo===3&&comboTimer>0) SFX.combo(3);
  if(combo===5&&comboTimer>0) SFX.combo(5);
  if(combo===10&&comboTimer>0) SFX.levelUp();

  // ── Collision with traffic ──
  if(invincibleTimer<=0){
    const pr={x:playerX-PLAYER_W/2,y:playerY-PLAYER_H/2,w:PLAYER_W,h:PLAYER_H};
    
    // Train collision (instant game over)
    for(const t of trains){
      if(t.active){
        const trainVisualW=(t.carCount-1)*70+62;
        const trainRect={x:t.x-10,y:t.y-t.h/2-5,w:trainVisualW+20,h:t.h+10};
        if(rectOverlap(pr,trainRect)){
          lives=0;
          screen='over'; endScore=score;
          if(score>highScore) highScore=score;
          totalCoins+=score;
          saveData();
          spawnParticles(playerX,playerY,80,'#ff2200',400,8,1);
          spawnSparks(playerX,playerY,30,'#ffaa00');
          triggerShake(25);
          SFX.crash();
          document.getElementById('touchCtrls').classList.remove('active');
          stopEngineSound();stopBGM();
          break;
        }
      }
    }
    
    // Accident site collision (damage)
    for(const a of accidentSites){
      if(a.active&&invincibleTimer<=0){
        for(const car of a.cars){
          const carRect={x:car.x+car.offset-16,y:a.y-10,w:32,h:20};
          if(rectOverlap(pr,carRect)){
            lives--;
            invincibleTimer=1.5;
            speed=Math.max(BASE_SPEED,speed*0.4);
            combo=0;
            spawnFloatingText(playerX,playerY-65,'TAI NẠN!','#ff4400',20);
            spawnParticles(playerX,playerY,25,'#ff6600',200,5,0.6);
            triggerShake(12); SFX.crash();
            if(lives<=0){
              screen='over'; endScore=score;
              if(score>highScore) highScore=score;
              totalCoins+=score;
              saveData();
              spawnParticles(playerX,playerY,60,'#ff2200',300,6,0.8);
              document.getElementById('touchCtrls').classList.remove('active');
              stopEngineSound();stopBGM();
              break;
            }
            break;
          }
        }
      }
    }
    
    for(const c of trafficCars){
      if(rectOverlap(pr,c.rect)){
        lives--; invincibleTimer=2+bonusInvincible; hitFlash=0;
        
        // Wanted level increase for hitting emergency vehicles
        if(c.typeKey==='ambulance'||c.typeKey==='police'){
          wantedLevel=Math.min(3,wantedLevel+1);
          wantedTimer=20;
          spawnFloatingText(playerX,playerY-80,'TRUY NÃ! ★'.repeat(wantedLevel),'#ff4444',18);
        }
        
        spawnParticles(playerX,playerY,35,c.color,200,5,0.6);
        spawnParticles(playerX,playerY,25,'#ff4400',250,4,0.5);
        triggerShake(14); SFX.crash();
        if(lives<=0){
          screen='over'; endScore=score;
          if(score>highScore) highScore=score;
          totalCoins+=score;
          saveData();
          spawnParticles(playerX,playerY,60,'#ff2200',300,6,0.8);
          spawnParticles(playerX,playerY,30,'#ffaa00',200,4,0.6);
          spawnSparks(playerX,playerY,25,'#ff4400');
          document.getElementById('touchCtrls').classList.remove('active');
          stopEngineSound();stopBGM();
          break;
        }else{
          speed=Math.max(BASE_SPEED,speed*0.55);
          combo=0; comboTimer=0;
        }
        break;
      }
    }
  }

  // ── Speed Lines (tăng khi nitro) ──
  const speedLineChance=nitroActive?0.6:(currentSpeed/MAX_SPEED)*0.35;
  if(Math.random()<speedLineChance) spawnSpeedLines();
  for(let i=speedLines.length-1;i>=0;i--){
    const sl=speedLines[i];
    sl.y+=sl.speed*dt; sl.alpha-=dt*0.4;
    if(sl.y>H||sl.alpha<=0){speedLines.splice(i,1)}
  }

  // ── Exhaust Particles (enhanced) ──
  if(Math.random()<0.4+speed/MAX_SPEED*0.3){
    const exColor=nitroActive?'#66ddff':'#888899';
    const exSize=nitroActive?rand(2,6):rand(2,5);
    const exVy=nitroActive?rand(40,80):rand(25,55);
    particles.push(new Particle(
      playerX+rand(-14,14), playerY+PLAYER_H/2,
      rand(-8,8), exVy,
      rand(0.3,0.8), exColor, exSize
    ));
    // Khói xả phụ (secondary exhaust)
    if(speed>BASE_SPEED*2&&Math.random()<0.3){
      particles.push(new Particle(
        playerX+rand(-8,8), playerY+PLAYER_H/2+5,
        rand(-4,4), rand(15,30),
        rand(0.4,0.9), 'rgba(150,150,170,0.3)', rand(3,7)
      ));
    }
  }
  if(nitroActive&&Math.random()<0.6)
    spawnParticles(playerX,playerY+PLAYER_H/2,rand(1,3),'#ff6600',rand(100,200),3,0.4);
  // Fire sparks from exhaust when nitro
  if(nitroActive&&Math.random()<0.2){
    spawnSparks(playerX+rand(-12,12), playerY+PLAYER_H/2, rand(1,3), '#ffcc00', Math.PI/2+rand(-0.5,0.5));
  }

  // ── Update Particles ──
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=90*dt; p.life-=dt;
    if(p.life<=0||p.x<-60||p.x>W+60||p.y>H+60) particles.splice(i,1);
  }

  // ── Floating Texts ──
  for(let i=floatingTexts.length-1;i>=0;i--){
    const ft=floatingTexts[i];
    ft.y+=ft.vy*dt; ft.life-=dt*0.7;
    if(ft.life<=0) floatingTexts.splice(i,1);
  }

  // ── Tire Smoke ──
  // Khi chuyển làn gấp (sway lớn) hoặc nitro + chuyển làn
  const turningHard=Math.abs(playerSway)>3;
  const braking=leftPressed||rightPressed;
  if((turningHard||(nitroActive&&turningHard))&&tireSmoke.length<SMOKE_CAP){
    const intensity=Math.min(1,Math.abs(playerSway)/8);
    const smokeCount=Math.floor(1+intensity*2);
    const tireY=playerY+PLAYER_H*0.3;
    spawnTireSmoke(playerX-PLAYER_W*0.3,tireY,smokeCount,intensity);
    spawnTireSmoke(playerX+PLAYER_W*0.3,tireY,smokeCount,intensity);
    if(nitroActive&&turningHard) spawnTireSmoke(playerX-PLAYER_W*0.3,tireY,2,1);
    if(nitroActive&&turningHard) spawnTireSmoke(playerX+PLAYER_W*0.3,tireY,2,1);
  }
  // Update tire smoke
  for(let i=tireSmoke.length-1;i>=0;i--){
    const s=tireSmoke[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=s.gravity*dt;
    s.life-=dt; s.alpha*=0.97;
    if(s.life<=0||s.alpha<0.01) tireSmoke.splice(i,1);
  }

  // ── Skid Marks ──
  if(turningHard&&Math.abs(playerSway)>4&&Math.random()<0.4){
    const markAlpha=Math.min(0.25,Math.abs(playerSway)*0.03);
    spawnSkidMark(playerX-PLAYER_W*0.35,playerY+PLAYER_H*0.4,rand(3,7),markAlpha);
    spawnSkidMark(playerX+PLAYER_W*0.35,playerY+PLAYER_H*0.4,rand(3,7),markAlpha);
  }
  // Nitro skid marks (lửa cháy trên đường khi drift + nitro)
  if(nitroActive&&turningHard&&Math.random()<0.3){
    spawnSkidMark(playerX-PLAYER_W*0.35,playerY+PLAYER_H*0.45,rand(5,9),0.18);
    spawnSkidMark(playerX+PLAYER_W*0.35,playerY+PLAYER_H*0.45,rand(5,9),0.18);
  }
  // Update skid marks
  for(let i=skidMarks.length-1;i>=0;i--){
    const m=skidMarks[i];
    m.y+=spd*0.95;
    m.life-=dt; m.alpha*=0.98;
    if(m.life<=0||m.alpha<0.01||m.y>H+20) skidMarks.splice(i,1);
  }

  // ── Spark updates ──
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=200*dt;
    s.life-=dt; s.size*=0.96;
    if(s.life<=0||s.size<0.3) sparks.splice(i,1);
  }

  // ── Enhanced Shake ──
  updateShake(dt);
  
  // ── Living Traffic Ecosystem Updates ──
  updatePedestrians(dt);
  updateScenery(dt,spd);
  updateBillboards(dt,spd);
  updateRailways(dt,spd);
  updateTrafficLights(dt,spd);
  updateHelicopters(dt);
  updateAccidents(dt,spd);
  updateWildlife(dt,spd);
  updatePolice(dt,currentSpeed);
  updateWeatherReactive();
  
  // Spawn new ecosystem elements
  if(Math.random()<0.15) spawnPedestrians();
  if(Math.random()<0.08) spawnScenery();
  if(Math.random()<0.04) spawnBillboards();
  spawnAccident();
  spawnWildlife();

  // ── Engine Audio ──
  if(audioStarted&&engineOsc){
    updateEngineSound(currentSpeed,nitroActive);
  }
}

// ══════════════════════════════════════════════════════════════
// ── RENDER (enhanced) ──────────────────────────────────────
// ══════════════════════════════════════════════════════════════

function renderGame(){
  ctx.textBaseline='alphabetic';
  ctx.save();
  ctx.translate(shakeX,shakeY);

  const theme=getCurrentTheme();

  drawBackground();

  // Dust particles (behind everything)
  drawDust();

  // Speed lines (enhanced - hiệu ứng tốc độ cao)
  for(const sl of speedLines){
    const slAlpha=sl.alpha*(nitroActive?1.8:1);
    const speedPct=Math.min(1,(sl.speed-600)/1000);
    // Color shifts from white to blue at high speed
    const hue=200+speedPct*40;
    ctx.fillStyle=`hsla(${hue},80%,70%,${slAlpha*0.15})`;
    ctx.fillRect(sl.x,sl.y,sl.w,sl.h*2.5);
    // Outer glow
    const blurW=sl.w+2+speedPct*2;
    ctx.fillStyle=`hsla(${hue},80%,80%,${slAlpha*0.05})`;
    ctx.fillRect(sl.x-blurW/2,sl.y-1,blurW,sl.h*2.5+2);
  }

  // ── Skid Marks (vết trượt trên đường) ──
  for(const m of skidMarks){
    ctx.fillStyle=`rgba(30,30,40,${m.alpha})`;
    ctx.fillRect(m.x-m.w/2,m.y-m.h/2,m.w,m.h);
    // Vết trượt đậm hơn ở giữa
    ctx.fillStyle=`rgba(20,20,30,${m.alpha*0.5})`;
    ctx.fillRect(m.x-m.w/4,m.y-m.h/4,m.w/2,m.h/2);
  }

  // ── Tire Smoke (khói lốp) ──
  for(const s of tireSmoke){
    const lifeRatio=s.life/s.maxLife;
    ctx.globalAlpha=s.alpha*lifeRatio;
    ctx.fillStyle='rgba(180,180,200,0.2)';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.size*lifeRatio,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(200,200,220,0.08)';
    ctx.beginPath(); ctx.arc(s.x-2,s.y-1,s.size*lifeRatio*0.6,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // Coins
  const coinG=ctx.createRadialGradient(0,0,0,0,0,COIN_R);
  coinG.addColorStop(0,'#ffee88'); coinG.addColorStop(0.5,'#ffd700'); coinG.addColorStop(1,'#cc9900');
  for(const c of coins){
    const cy=c.y+Math.sin(c.bob)*3;
    ctx.save(); ctx.translate(c.x,cy);
    ctx.shadowColor='#ffd700'; ctx.shadowBlur=20;
    ctx.beginPath(); ctx.arc(0,0,COIN_R,0,Math.PI*2);
    ctx.fillStyle=coinG; ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#8a6a00'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('$',0,1);
    ctx.fillStyle='rgba(255,255,255,0.5)';
    const sa=Math.sin(c.bob*2.5)*0.5+0.5;
    ctx.globalAlpha=sa;
    ctx.fillRect(COIN_R*0.5,-COIN_R*0.5,3,3); ctx.fillRect(-COIN_R*0.5,COIN_R*0.4,2,2);
    ctx.globalAlpha=1;
    ctx.restore();
  }

  // Obstacles (behind traffic but on road)
  drawObstacles();

  // Accident sites
  drawAccidents();
  
  // Traffic lights
  drawTrafficLights();

  // Traffic cars (sorted by y for depth)
  const sortedTraffic=[...trafficCars].sort((a,b)=>a.y-b.y);
  for(const c of sortedTraffic){
    const typeInfo=TRAFFIC_TYPES[c.typeKey]||TRAFFIC_TYPES.normal;
    drawCar(c.x,c.y,c.w,c.h,c.color,typeInfo.accent,false,false,c.typeKey);
    
    // Special rendering for new vehicle types
    if(c.typeKey==='ambulance'||c.typeKey==='police'){
      // Emergency lights
      const sirenOn=Math.sin(gameTime*10)>0;
      const sirenOn2=Math.sin(gameTime*10+Math.PI)>0;
      ctx.save();
      // Red light
      ctx.shadowColor=sirenOn?'#ff0000':'#660000';
      ctx.shadowBlur=sirenOn?20:4;
      ctx.fillStyle=sirenOn?'#ff0000':'#991111';
      ctx.beginPath(); ctx.arc(c.x-8,c.y-c.h*0.4,3,0,Math.PI*2); ctx.fill();
      // Blue light
      ctx.shadowColor=sirenOn2?'#0066ff':'#002266';
      ctx.shadowBlur=sirenOn2?20:4;
      ctx.fillStyle=sirenOn2?'#0066ff':'#113366';
      ctx.beginPath(); ctx.arc(c.x+8,c.y-c.h*0.4,3,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      ctx.restore();
    }
    if(c.typeKey==='motorcycle'){
      // Motorcycle rider silhouette
      ctx.fillStyle='rgba(0,0,0,0.4)';
      ctx.beginPath(); ctx.arc(c.x,c.y-2,4,0,Math.PI*2); ctx.fill();
      // Helmet
      ctx.fillStyle='#333';
      ctx.beginPath(); ctx.arc(c.x,c.y-5,3,0,Math.PI*2); ctx.fill();
    }
    if(c.typeKey==='bus'){
      // Bus windows
      ctx.fillStyle='rgba(180,220,255,0.25)';
      for(let wy=0;wy<4;wy++){
        ctx.fillRect(c.x-c.w*0.3,c.y-c.h*0.35+wy*8,c.w*0.6,4);
      }
    }
  }

  // Railway crossings and trains (in front of traffic for visibility)
  drawRailways();

  // ── Đèn pha player (dynamic headlight beam) ──
  const hlIntensity=Math.max(0,(1-theme.ambientLight)*0.9+speed/MAX_SPEED*0.2);
  if(hlIntensity>0.08){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const hlPulse=0.9+Math.sin(gameTime*5+playerSway)*0.1;
    const beamIntensity=hlIntensity*hlPulse;

    // Chùm sáng chính (hình nón)
    const hlGrad=ctx.createRadialGradient(
      playerX,playerY-12,3,
      playerX,playerY-90,50
    );
    hlGrad.addColorStop(0,`rgba(255,255,230,${beamIntensity*0.25})`);
    hlGrad.addColorStop(0.4,`rgba(200,220,255,${beamIntensity*0.08})`);
    hlGrad.addColorStop(1,'rgba(200,220,255,0)');
    ctx.fillStyle=hlGrad;
    ctx.beginPath();
    ctx.moveTo(playerX-12,playerY-5);
    ctx.quadraticCurveTo(playerX-28,playerY-70,playerX-35,playerY-150);
    ctx.lineTo(playerX+35,playerY-150);
    ctx.quadraticCurveTo(playerX+28,playerY-70,playerX+12,playerY-5);
    ctx.closePath(); ctx.fill();

    // Chùm sáng phụ (loe rộng hơn)
    const wideGrad=ctx.createRadialGradient(
      playerX,playerY-20,5,
      playerX,playerY-60,80
    );
    wideGrad.addColorStop(0,`rgba(200,220,255,${beamIntensity*0.06})`);
    wideGrad.addColorStop(1,'rgba(200,220,255,0)');
    ctx.fillStyle=wideGrad;
    ctx.beginPath();
    ctx.moveTo(playerX-20,playerY-5);
    ctx.lineTo(playerX-50,playerY-120);
    ctx.lineTo(playerX+50,playerY-120);
    ctx.lineTo(playerX+20,playerY-5);
    ctx.closePath(); ctx.fill();

    // Vệt sáng trên mặt đường (ánh sáng phản xạ)
    const roadGlow=ctx.createRadialGradient(
      playerX,playerY+PLAYER_H/2,5,
      playerX,playerY+PLAYER_H/2+40,60
    );
    roadGlow.addColorStop(0,`rgba(255,240,200,${beamIntensity*0.04})`);
    roadGlow.addColorStop(1,'rgba(255,240,200,0)');
    ctx.fillStyle=roadGlow;
    ctx.beginPath(); ctx.arc(playerX,playerY+PLAYER_H/2+20,60,0,Math.PI*2); ctx.fill();

    ctx.restore();
  }

  // Player dynamic shadow/glow
  const playerGlowIntensity=nitroActive?0.35:0.1+speed/MAX_SPEED*0.15;
  if(playerGlowIntensity>0.05){
    const glowColor=CAR_COLORS[selectedCar];
    const pg=ctx.createRadialGradient(playerX,playerY,10,playerX,playerY,80);
    pg.addColorStop(0,glowColor+Math.floor(playerGlowIntensity*40).toString(16).padStart(2,'0'));
    pg.addColorStop(1,'transparent');
    ctx.fillStyle=pg;
    ctx.fillRect(playerX-80,playerY-80,160,160);
    // Nitro glow ring
    if(nitroActive){
      const ringG=ctx.createRadialGradient(playerX,playerY+PLAYER_H/2,5,playerX,playerY+PLAYER_H/2,40);
      ringG.addColorStop(0,'rgba(255,100,0,0.15)');
      ringG.addColorStop(0.5,'rgba(255,200,0,0.08)');
      ringG.addColorStop(1,'transparent');
      ctx.fillStyle=ringG;
      ctx.beginPath(); ctx.arc(playerX,playerY+PLAYER_H/2,40,0,Math.PI*2); ctx.fill();
    }
  }

  // Player (with sway tilt, oil spin, enhanced animation)
  const tilt=playerSway*0.03;
  const pBob=Math.sin(carBob)*1.5;
  const rotAngle=tilt+oilAngle;
  ctx.save();
  ctx.translate(playerX,playerY+pBob);
  ctx.rotate(rotAngle);
  ctx.translate(-playerX,-playerY-pBob);
  const flash=invincibleTimer>0&&Math.floor(hitFlash)%2===0;
  drawCar(playerX,playerY+pBob,PLAYER_W,PLAYER_H,CAR_COLORS[selectedCar],CAR_ACCENTS[selectedCar],true,flash);
  ctx.restore();

  // Railway blocked warning overlay
  if(railwayBlocked){
    const warnPulse=0.3+Math.sin(gameTime*8)*0.15;
    ctx.fillStyle=`rgba(255,50,0,${warnPulse})`;
    ctx.fillRect(0,0,W,H);
    // Warning stripes at player
    ctx.strokeStyle=`rgba(255,200,0,${warnPulse+0.2})`;
    ctx.lineWidth=3;
    const stripeY=playerY-PLAYER_H/2-20;
    ctx.setLineDash([12,8]);
    ctx.beginPath(); ctx.moveTo(ROAD_L,stripeY); ctx.lineTo(ROAD_R,stripeY); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Rain (on top of everything on road)
  drawRain();
  
  // Pedestrians (on sidewalks)
  drawPedestrians();
  
  // Roadside scenery
  drawScenery();
  
  // Billboards
  drawBillboards();
  
  // Wildlife
  drawWildlife();

  // Fog overlay (dùng màu từ theme)
  if(theme.fogDensity>0){
    ctx.fillStyle=theme.fogColor;
    ctx.fillRect(0,0,W,H);
  }
  
  // Helicopters (above fog, in sky)
  drawHelicopters();
  
  // Police pursuit (on top of everything)
  drawPolice();

  // Dark overlay dựa trên ambientLight (tối cho ban đêm)
  const darkAmount=Math.max(0,1-theme.ambientLight)*0.85;
  if(darkAmount>0.01){
    ctx.fillStyle=`rgba(0,0,0,${darkAmount})`;
    ctx.fillRect(0,0,W,H);
  }

  // ── Sparks (tia lửa) ──
  for(const s of sparks){
    ctx.globalAlpha=s.life/s.maxLife;
    ctx.shadowColor=s.color; ctx.shadowBlur=8;
    ctx.fillStyle=s.color;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0; ctx.globalAlpha=1;

  // ── Floating texts (animated scale + bounce) ──
  for(const ft of floatingTexts){
    const lifeRatio=Math.max(0,ft.life);
    const scale=1+Math.sin(lifeRatio*Math.PI)*0.15;
    ctx.save();
    ctx.translate(ft.x,ft.y);
    ctx.scale(scale,scale);
    ctx.globalAlpha=Math.min(1,lifeRatio*2);
    ctx.fillStyle=ft.color;
    ctx.font='bold '+ft.size+'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor=ft.color; ctx.shadowBlur=14;
    ctx.fillText(ft.text,0,0);
    ctx.restore();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;

  // Combo banner (animated scale + pulse)
  if(combo>1){
    const ca=Math.sin(comboSpeed*4)*0.2+0.8;
    const cScale=1+Math.sin(comboSpeed*6)*0.05;
    ctx.save();
    ctx.translate(W/2,92);
    ctx.scale(cScale,cScale);
    ctx.globalAlpha=ca;
    ctx.fillStyle=hslStr(combo*40,100,55);
    ctx.font='bold 34px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=30;
    ctx.fillText(combo+'x LIÊN HOÀN!',0,0);
    // Subtitle for high combos
    if(combo>=5){
      ctx.fillStyle='#ffd700';
      ctx.font='bold 14px "Segoe UI",system-ui,sans-serif';
      ctx.shadowColor='rgba(255,215,0,0.3)'; ctx.shadowBlur=12;
      ctx.fillText('\u26A1 KINH HOÀNG \u26A1',0,24);
    }
    ctx.shadowBlur=0; ctx.globalAlpha=1;
    ctx.restore();
  }

  // Speed blur (motion blur effect)
  const sr=speed/MAX_SPEED;
  if(sr>0.35){
    const blurAlpha=(sr-0.35)*0.18;
    ctx.fillStyle=`rgba(0,0,0,${blurAlpha})`;
    ctx.fillRect(0,0,W,H);
    // Directional blur - streaks at edges
    if(sr>0.6){
      ctx.fillStyle=`rgba(100,150,255,${(sr-0.6)*0.02})`;
      for(let i=0;i<3;i++){
        const bx=i*W/3;
        ctx.fillRect(bx-2,0,2,H);
      }
    }
    // Nitro blur enhancement
    if(nitroActive){
      ctx.fillStyle=`rgba(0,100,255,${blurAlpha*0.5})`;
      ctx.fillRect(0,0,W,H);
    }
  }

  // Theme transition vignette
  if(themeTransition<1){
    const v=Math.abs(themeTransition-0.5)*2;
    ctx.fillStyle=`rgba(0,0,0,${(1-v)*0.15})`;
    ctx.fillRect(0,0,W,H);
  }

  // Vignette ban đêm — tối dần về rìa màn hình
  const vignetteStrength=Math.max(0,(1-theme.ambientLight)*0.7);
  if(vignetteStrength>0.01){
    const vg=ctx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.7);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,`rgba(0,0,0,${vignetteStrength})`);
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  }

  ctx.restore(); // end shake transform

  // HUD (fixed, no shake)
  drawHUD();

  // Near-miss streak
  if(nearMissStreak>=3){
    ctx.fillStyle='rgba(255,170,0,0.55)';
    ctx.font='bold 13px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign='center';
    ctx.fillText('\u{1F525} '+nearMissStreak+'x Suýt Va Chạm!',W/2,70);
  }

  // Nitro screen pulse (enhanced)
  if(nitroActive){
    const nPulse=Math.sin(nitroTimer*25);
    // Blue pulse
    ctx.fillStyle=`rgba(0,180,255,${nPulse*0.03+0.03})`;
    ctx.fillRect(0,0,W,H);
    // Red shift edge glow
    const edgeG=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.55);
    edgeG.addColorStop(0,'rgba(0,0,0,0)');
    edgeG.addColorStop(1,`rgba(255,100,0,${nPulse*0.01+0.01})`);
    ctx.fillStyle=edgeG;
    ctx.fillRect(0,0,W,H);
  }

  // UI transition overlay
  if(uiTransAlpha<1&&uiTransScreen){
    const fadeAlpha=1-uiTransAlpha;
    ctx.fillStyle=`rgba(0,0,0,${fadeAlpha*0.4})`;
    ctx.fillRect(0,0,W,H);
  }
}

// ── UI Transition helper ─────────────────────────────────
function transitionTo(screenTarget){
  if(screen===screenTarget) return;

  if (screen === 'garage') {
    hideGarageUI();
  }

  uiTransScreen=screen;
  uiTransAlpha=0;
  uiTransTimer=0.15;
  screen=screenTarget;
  if(screenTarget!=='game'){stopEngineSound();stopBGM()}

  if (screenTarget === 'garage') {
    previewCustomizations = { ...carCustomizations[selectedCar] };
    showGarageUI();
  }

  // Audio feedback
  if(screenTarget==='title'||screenTarget==='garage') SFX.uiClose();
  else SFX.uiOpen();
}

// ── Title Screen ─────────────────────────────────────────
function drawTitleScreen(){
  ctx.textBaseline='alphabetic';
  // UI transition: khi mới vào title từ màn hình khác
  const uiAlpha=Math.min(1,uiTransAlpha+0.02);
  uiTransAlpha=uiAlpha;

  drawBackground();
  ctx.fillStyle=`rgba(0,0,0,${0.45*(1-uiTransAlpha*0.2)})`;
  ctx.fillRect(0,0,W,H);

  // UI fade-in scale
  const uiScale=uiAlpha*0.2+0.8;
  ctx.save();
  ctx.translate(W/2,H/2);
  ctx.scale(uiScale,uiScale);
  ctx.translate(-W/2,-H/2);

  // Animated title
  const pulse=Math.sin(gameTime*2)*0.04+1;
  ctx.save();
  ctx.translate(W/2,120);
  ctx.scale(pulse,pulse);

  ctx.shadowColor='#00aaff'; ctx.shadowBlur=45;
  ctx.fillStyle='#00ccff';
  ctx.font='bold 60px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign='center';
  ctx.fillText('TURBO',0,-4);

  ctx.shadowColor='#ff4400'; ctx.shadowBlur=45;
  ctx.fillStyle='#ff6600';
  ctx.font='bold 50px "Segoe UI",system-ui,sans-serif';
  ctx.fillText('RUSH',0,52);
  ctx.shadowBlur=0;
  ctx.restore();

  // Version indicator
  ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=6;
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.font='13px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign='center';
  ctx.fillText('V3.0 — Hệ Sinh Thái Giao Thông Sống',W/2,200);
  ctx.shadowBlur=0;

  ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=8;
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.font='bold 15px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign='center';
  ctx.fillText('\u{1F3C1} ĐUA XE ARCADE',W/2,228);
  ctx.shadowBlur=0;

  // Play button
  const bx=W/2-110,by=300,bw=220,bh=56;
  const btnP=Math.sin(gameTime*3)*0.06+1;
  ctx.save();
  ctx.translate(W/2,by+bh/2);
  ctx.scale(btnP,btnP);
  ctx.translate(-W/2,-by-bh/2);

  ctx.shadowColor='#00ff88'; ctx.shadowBlur=30;
  const btnG=ctx.createLinearGradient(bx,by,bx,by+bh);
  btnG.addColorStop(0,'#00cc66'); btnG.addColorStop(1,'#009944');
  ctx.fillStyle=btnG;
  ctx.beginPath(); roundRect(ctx,bx,by,bw,bh,16); ctx.fill();
  ctx.shadowBlur=0;

  ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=8;
  ctx.fillStyle='#fff';
  ctx.font='bold 26px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('\u25B6  CHƠI',W/2,by+bh/2+1);
