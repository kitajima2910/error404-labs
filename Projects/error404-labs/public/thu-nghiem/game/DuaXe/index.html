<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Turbo Rush 2 — Đua Xe Arcade</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0a0a2e">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;overflow:hidden;background:#000;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  -webkit-overflow-scrolling:none;overscroll-behavior:none;
}
#gameWrap{
  position:relative;width:100dvw;height:100dvh;display:flex;align-items:center;justify-content:center;
  background:#0a0a12;overflow:hidden;
}
canvas#c{display:block;image-rendering:auto;flex-shrink:0;margin:auto}
#touchCtrls{
  position:fixed;bottom:0;left:0;right:0;height:50vh;pointer-events:none;z-index:10;
  display:flex;justify-content:space-between;align-items:flex-end;padding:0 8px 24px;
}
#touchCtrls.active{pointer-events:auto}
.tz{
  pointer-events:auto;width:30vw;height:30vw;max-width:140px;max-height:140px;
  border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.12);
  display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:rgba(255,255,255,0.5);
  transition:all 0.1s;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.tz:active,.tz.pressed{transform:scale(0.88);background:rgba(255,255,255,0.18);border-color:rgba(255,255,255,0.35)}
.tz-nitro{
  width:28vw;height:28vw;max-width:120px;max-height:120px;
  background:linear-gradient(135deg,rgba(0,200,255,0.12),rgba(100,0,255,0.12));
  border-color:rgba(0,200,255,0.2);font-size:1.8rem;margin-bottom:12px;
}
.tz-nitro:active,.tz-nitro.pressed{
  background:linear-gradient(135deg,rgba(0,200,255,0.25),rgba(100,0,255,0.25));
  border-color:rgba(0,200,255,0.5);
}
.tz-left{margin-right:auto}.tz-right{margin-left:auto}
#tzWrap{display:flex;flex-direction:column;align-items:center;gap:4px;margin-left:auto}
@media(min-width:768px){
  #touchCtrls{display:none}
}

/* ── PREMIUM SHOWROOM OVERLAY CSS ── */
@keyframes showroomPulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
@keyframes doorSlide { 0%{transform:translateY(0)} 50%{transform:translateY(-3px)} 100%{transform:translateY(0)} }
@keyframes glowRotate { 0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(360deg)} }
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
@keyframes floatUp { 0%{transform:translateY(0);opacity:0} 20%{opacity:1} 100%{transform:translateY(-30px);opacity:0} }

#garageUI {
  position: absolute; top:0; left:0; width:100%; height:100%;
  z-index: 20;
  display: flex; flex-direction: column;
  color: #fff; pointer-events: auto; overflow: hidden;
  background: transparent;
}
/* Showroom top bar — glass premium */
.showroom-header {
  position: absolute; top:0; left:0; right:0;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.5em 1em 0.4em;
  background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 70%, transparent 100%);
  z-index: 22;
}
.showroom-title {
  font-size: 1.1em; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(90deg, #00ccff, #aa66ff, #00ccff);
  background-size: 200% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: shimmer 3s linear infinite;
  text-transform: uppercase;
}
.showroom-title-icon { -webkit-text-fill-color: initial; margin-right: 4px; }
.showroom-stats {
  display: flex; align-items: center; gap: 0.8em;
}
.showroom-coins {
  font-size: 1em; font-weight: 700; color: #ffd700;
  text-shadow: 0 0 12px rgba(255,215,0,0.4);
  background: rgba(0,0,0,0.4); padding: 0.15em 0.7em;
  border-radius: 20px; border: 1px solid rgba(255,215,0,0.2);
}
.showroom-coins::before { content:'$ '; }
.showroom-xp {
  font-size: 0.7em; padding: 0.15em 0.5em;
  background: rgba(0,200,255,0.12); border-radius: 12px;
  border: 1px solid rgba(0,200,255,0.2); color: rgba(200,255,220,0.8);
}
/* Bottom panel — glass floating control panel */
.showroom-panel {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(0deg, rgba(5,5,20,0.92) 0%, rgba(5,5,20,0.7) 80%, transparent 100%);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(0,200,255,0.12);
  padding: 0.5em 0.6em 0.7em;
  z-index: 22;
  display: flex; flex-direction: column; gap: 0.3em;
  max-height: 48%;
  transition: max-height 0.3s ease;
}
.showroom-panel.collapsed { max-height: 52px; }

/* Tab navigation — scrollable horizontal pills */
.showroom-tabs {
  display: flex; gap: 0.35em; overflow-x: auto;
  padding: 0.15em 0; flex-shrink: 0;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.showroom-tabs::-webkit-scrollbar { display: none; }
.showroom-tab {
  flex-shrink: 0; padding: 0.35em 0.7em;
  border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.55);
  font-size: 0.72em; font-weight: 700;
  cursor: pointer; transition: all 0.25s ease;
  white-space: nowrap;
  backdrop-filter: blur(4px);
}
.showroom-tab:hover {
  background: rgba(255,255,255,0.08);
  color: #fff;
  border-color: rgba(0,200,255,0.3);
}
.showroom-tab.active {
  background: linear-gradient(135deg, rgba(0,200,255,0.2), rgba(150,0,255,0.15));
  border-color: rgba(0,200,255,0.5);
  color: #00e5ff;
  box-shadow: 0 0 12px rgba(0,200,255,0.15), inset 0 0 12px rgba(0,200,255,0.05);
}
/* Rarity glow tab accent */
.showroom-tab.rarity-rare-tab.active { border-color: #00e5ff; box-shadow: 0 0 12px rgba(0,229,255,0.25); }
.showroom-tab.rarity-epic-tab.active { border-color: #d400ff; box-shadow: 0 0 12px rgba(212,0,255,0.25); }
.showroom-tab.rarity-legendary-tab.active { border-color: #ffd700; box-shadow: 0 0 12px rgba(255,215,0,0.25); }

/* Items list — scrollable cards */
.showroom-items {
  flex: 1; overflow-y: auto; display: flex; flex-direction: column;
  gap: 0.3em; padding: 0.1em 0.2em 0.2em;
  scrollbar-width: thin;
  scrollbar-color: rgba(0,200,255,0.15) transparent;
}
.showroom-items::-webkit-scrollbar { width: 3px; }
.showroom-items::-webkit-scrollbar-track { background: transparent; }
.showroom-items::-webkit-scrollbar-thumb { background: rgba(0,200,255,0.2); border-radius: 3px; }

/* Premium item card */
.item-card {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.5em 0.6em;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
  cursor: pointer; position: relative; overflow: hidden;
}
.item-card::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.02), transparent);
  transform: translateX(-100%);
  transition: transform 0.5s;
}
.item-card:hover::before { transform: translateX(100%); }
.item-card:hover {
  background: rgba(255,255,255,0.05);
  border-color: rgba(255,255,255,0.15);
  transform: translateX(3px);
}
.item-card:active { transform: scale(0.98); }
.item-card.equipped {
  background: rgba(0,200,255,0.06);
  border-color: rgba(0,200,255,0.35);
  box-shadow: 0 0 12px rgba(0,200,255,0.08);
}
/* Rarity border glow */
.item-card.rarity-border-rare { border-color: rgba(0,229,255,0.2); box-shadow: inset 0 0 15px rgba(0,229,255,0.03); }
.item-card.rarity-border-epic { border-color: rgba(212,0,255,0.2); box-shadow: inset 0 0 15px rgba(212,0,255,0.03); }
.item-card.rarity-border-legendary {
  border-color: rgba(255,215,0,0.3);
  box-shadow: inset 0 0 20px rgba(255,215,0,0.05), 0 0 15px rgba(255,215,0,0.05);
  animation: showroomPulse 2s ease-in-out infinite;
}

.item-info { display: flex; flex-direction: column; gap: 1px; }
.item-name { font-weight: 700; font-size: 0.82em; }
.item-rarity { font-size: 0.6em; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
.item-status { display: flex; align-items: center; gap: 0.4em; }
.item-price { font-weight: 700; color: #ffd700; font-size: 0.75em; text-shadow: 0 0 6px rgba(255,215,0,0.2); }

.item-btn {
  border: none; border-radius: 6px; color: #fff;
  padding: 0.35em 0.7em; font-weight: 700; font-size: 0.65em;
  cursor: pointer; transition: all 0.15s ease;
  position: relative; overflow: hidden;
}
.item-btn::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  transform: translateX(-100%);
}
.item-btn:hover::after { transform: translateX(100%); transition: transform 0.4s; }
.item-btn:hover { transform: scale(1.04); filter: brightness(1.15); }
.item-btn:active { transform: scale(0.95); }
.item-btn.btn-unlock {
  background: linear-gradient(135deg, #ffd700, #ff8800);
  color: #000; font-weight: 800;
  box-shadow: 0 0 10px rgba(255,215,0,0.2);
}
.item-btn.btn-equip {
  background: linear-gradient(135deg, #00c6ff, #7a00ff);
  box-shadow: 0 0 8px rgba(0,198,255,0.15);
}
.item-btn.disabled { opacity: 0.3; cursor: not-allowed; background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.2); box-shadow: none; }
.item-btn.disabled:hover { transform: none; filter: none; }

/* Rarity text colors with animated glow */
.rarity-common { color: #b0bec5; }
.rarity-rare { color: #00e5ff; text-shadow: 0 0 8px rgba(0,229,255,0.3); }
.rarity-epic { color: #d400ff; text-shadow: 0 0 8px rgba(212,0,255,0.3); }
.rarity-legendary {
  color: #ffd700;
  text-shadow: 0 0 10px rgba(255,215,0,0.4);
  animation: showroomPulse 2s ease-in-out infinite;
}

/* Plate customization */
.plate-input-container { display: flex; flex-direction: column; gap: 0.5em; padding: 0.1em; }
.plate-textbox {
  background: rgba(0,0,0,0.5); border: 1px solid rgba(0,200,255,0.25);
  border-radius: 8px; color: #fff;
  padding: 0.5em 0.7em; font-size: 1.1em; font-weight: 800;
  text-align: center; letter-spacing: 2px; text-transform: uppercase;
  width: 100%; box-sizing: border-box;
}
.plate-textbox:focus { border-color: #00e5ff; outline: none; box-shadow: 0 0 12px rgba(0,229,255,0.15); }
.plate-styles-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.35em; margin-top: 0.3em; }
.plate-style-card {
  padding: 0.5em; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px; text-align: center; cursor: pointer;
  background: rgba(255,255,255,0.01); transition: all 0.2s;
}
.plate-style-card:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.2); transform: scale(1.03); }
.plate-style-card:active { transform: scale(0.95); }
.plate-style-card.selected {
  border-color: #00ccff; background: rgba(0,200,255,0.08);
  box-shadow: 0 0 15px rgba(0,200,255,0.08);
}
.plate-preview-badge { display: inline-block; padding: 2px 6px; font-weight: 800; font-size: 0.7em; border-radius: 3px; margin-bottom: 3px; }

/* Loadout cards */
.loadout-slots { display: flex; flex-direction: column; gap: 0.4em; padding: 0.1em; }
.loadout-card {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 0.5em 0.7em;
  transition: all 0.2s;
}
.loadout-card:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.12); }
.loadout-name { font-weight: 700; font-size: 0.82em; }
.loadout-desc { font-size: 0.65em; color: rgba(255,255,255,0.35); }
.loadout-actions { display: flex; gap: 4px; }

/* Showroom action buttons */
.showroom-actions {
  display: flex; gap: 0.4em; align-items: center;
  padding: 0.15em 0;
}
.showroom-btn {
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px; background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.7); padding: 0.35em 0.8em;
  font-size: 0.72em; font-weight: 700; cursor: pointer;
  transition: all 0.2s; backdrop-filter: blur(4px);
  white-space: nowrap;
}
.showroom-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.25); color: #fff; }
.showroom-btn:active { transform: scale(0.96); }
.showroom-btn.btn-primary {
  background: linear-gradient(135deg, rgba(0,200,255,0.25), rgba(100,0,255,0.2));
  border-color: rgba(0,200,255,0.35);
  color: #00e5ff;
}
.showroom-btn.btn-danger {
  background: rgba(255,50,50,0.12);
  border-color: rgba(255,50,50,0.25);
  color: rgba(255,80,80,0.8);
}
.showroom-btn.btn-danger:hover { background: rgba(255,50,50,0.2); border-color: rgba(255,50,50,0.4); color: #ff6666; }

/* Color dot for paint preview */
.color-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); margin-left: 4px; vertical-align: middle; }
.color-dot-lg { width: 16px; height: 16px; }

/* Unlock celebration overlay */
#unlockCelebration {
  position: absolute; inset: 0; z-index: 25;
  pointer-events: none; display: none;
}
.celebration-text {
  position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
  font-size: 1.8em; font-weight: 900;
  text-align: center;
  animation: floatUp 1.2s ease-out forwards;
  text-shadow: 0 0 30px currentColor;
}

/* Legendary item card special glow */
.item-card.legendary-glow {
  animation: legendaryGlow 1.5s ease-in-out infinite;
}
@keyframes legendaryGlow {
  0%,100% { box-shadow: 0 0 8px rgba(255,215,0,0.15), inset 0 0 15px rgba(255,215,0,0.03); }
  50% { box-shadow: 0 0 20px rgba(255,215,0,0.25), inset 0 0 25px rgba(255,215,0,0.05); }
}
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="c"></canvas>

  <!-- ── PREMIUM SHOWROOM OVERLAY ── -->
  <div id="garageUI" style="display:none;">
    <!-- Top bar -->
    <div class="showroom-header">
      <div class="showroom-title"><span class="showroom-title-icon">★</span> PHÒNG TRƯNG BÀY</div>
      <div class="showroom-stats">
        <span class="showroom-xp" id="garageXpText">Cấp 1</span>
        <span class="showroom-coins" id="garageCoinsText">0</span>
      </div>
    </div>

    <!-- Unlock celebration overlay -->
    <div id="unlockCelebration"><div class="celebration-text" id="celebrationText"></div></div>

    <!-- Bottom floating panel -->
    <div class="showroom-panel" id="showroomPanel">
      <!-- Tab pills -->
      <div class="showroom-tabs" id="showroomTabs">
        <button class="showroom-tab active" data-tab="car">🚗 Mẫu xe</button>
        <button class="showroom-tab" data-tab="paint">🎨 Màu sơn</button>
        <button class="showroom-tab" data-tab="decal">✨ Tem xe</button>
        <button class="showroom-tab" data-tab="wheel">⚙️ Bánh xe</button>
        <button class="showroom-tab" data-tab="spoiler">🏁 Cánh gió</button>
        <button class="showroom-tab" data-tab="underglow">💡 Neon gầm</button>
        <button class="showroom-tab" data-tab="nitro">🔥 Lửa Nitro</button>
        <button class="showroom-tab" data-tab="plate">💳 Biển số</button>
        <button class="showroom-tab" data-tab="loadout">💾 Trang Bị</button>
      </div>
      
      <!-- Items list -->
      <div class="showroom-items" id="garageItemsList"></div>

      <!-- Action bar -->
      <div class="showroom-actions">
        <button class="showroom-btn btn-danger" id="garageBackBtn">✕ ĐÓNG</button>
        <span style="flex:1;"></span>
        <span id="selectedCarName" style="font-size:0.7em;font-weight:700;color:rgba(255,255,255,0.5);"></span>
        <button class="showroom-btn btn-primary" id="garageRotateBtn" style="display:none;">⟳ XOAY</button>
      </div>
    </div>
  </div>

  <div id="touchCtrls">
    <button class="tz tz-left" id="tzL">◀</button>
    <div id="tzWrap">
      <button class="tz tz-nitro" id="tzN">⚡</button>
      <button class="tz tz-right" id="tzR">▶</button>
    </div>
  </div>
</div>
<script>
// ══════════════════════════════════════════════════════════════
// TURBO RUSH 2 — Game Đua Xe Arcade 2D
// Version 2.0: Chủ đề đường phố, AI thông minh, chướng ngại vật
// ══════════════════════════════════════════════════════════════

// ── Canvas Setup ──────────────────────────────────────────
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=480, H=800;
canvas.width=W; canvas.height=H;

function fitCanvas(){
  const wrap=document.getElementById('gameWrap');
  const wrapW=wrap.clientWidth;
  const wrapH=wrap.clientHeight;
  if(wrapW===0||wrapH===0) return;
  const scale=Math.min(wrapW/W, wrapH/H);
  const wPx = Math.round(W*scale);
  const hPx = Math.round(H*scale);
  canvas.style.width=wPx+'px';
  canvas.style.height=hPx+'px';
  
  const garageUI = document.getElementById('garageUI');
  if(garageUI) {
    garageUI.style.width = wPx + 'px';
    garageUI.style.height = hPx + 'px';
    // Base font size is 14px, scaled alongside scale factor
    garageUI.style.fontSize = (14 * scale) + 'px';
  }
}
// ResizeObserver theo dõi kích thước wrap chính xác hơn resize event
const ro=new ResizeObserver(()=>fitCanvas());
ro.observe(document.getElementById('gameWrap'));
window.addEventListener('resize',fitCanvas);
// Gọi nhiều lần để đảm bảo canvas center đúng
setTimeout(fitCanvas,50);
setTimeout(fitCanvas,200);
fitCanvas();

// ── Constants ──────────────────────────────────────────────
const ROAD_L=50, ROAD_R=430, ROAD_W=ROAD_R-ROAD_L;
const LANE_COUNT=4, LANE_W=ROAD_W/LANE_COUNT;
const PLAYER_W=52, PLAYER_H=96;
const TRAFFIC_W=50, TRAFFIC_H=88;
const COIN_R=12;
const BASE_SPEED=240;
const MAX_SPEED=720;
const NITRO_MAX=100, NITRO_DRAIN=45, NITRO_REFILL=12;
const THEME_CHANGE_INTERVAL=35; // seconds between theme transitions
const THEME_TRANSITION_DURATION=4; // seconds for smooth transition

// ── Device Detection & Performance ─────────────────────────
const IS_LOW_END=!/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)&&navigator.hardwareConcurrency?navigator.hardwareConcurrency<4:true;
const PARTICLE_CAP=IS_LOW_END?30:80;
const SMOKE_CAP=IS_LOW_END?8:20;
const SKID_CAP=IS_LOW_END?15:40;

// ── Utility ────────────────────────────────────────────────
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v))}
function rand(mn,mx){return Math.random()*(mx-mn)+mn}
function randi(mn,mx){return Math.floor(rand(mn,mx+1))}
function hslStr(h,s,l,a=1){
  return a<1?`hsla(${h},${s}%,${l}%,${a.toFixed(2)})`:`hsl(${h},${s}%,${l}%)`;
}
function rgbStr(r,g,b,a=1){return a<1?`rgba(${r|0},${g|0},${b|0},${a.toFixed(2)})`:`rgb(${r|0},${g|0},${b|0})`}
function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return{r,g,b}}
function lerpColor(c1,c2,t){
  return rgbStr(
    lerp(c1.r,c2.r,t),lerp(c1.g,c2.g,t),lerp(c1.b,c2.b,t)
  );
}

// ── Persistence ───────────────────────────────────────────
// ── XP / Level helpers ──────────────────────────────────
// Công thức: lên cấp N cần 100×(N²−1) XP tích lũy
// Level 1→2: 300XP, 2→3: 500XP, 3→4: 700XP...
function getTotalXpForLevel(lvl){return 100*(lvl*lvl-1)}
function getLevelFromXp(xp){return Math.max(1,Math.floor(Math.sqrt(xp/100+1)))}
function getXpForNextLevel(lvl){return 100*(2*lvl+1)}
function getXpProgress(xp,lvl){
  const curr=getTotalXpForLevel(lvl);
  const next=getTotalXpForLevel(lvl+1);
  return (xp-curr)/(next-curr);
}
// ── Level-up Effect ──
function spawnLevelUpEffect(newLevel){
  // Flash màn hình
  shakeIntensity=8; triggerShake(5);
  // Text nổi bật

// ── Apply Perks cho level hiện tại ──
function applyLevelPerks(lvl){
  scoreMult=1; coinValueMult=1; nitroRefillMult=1;
  nearMissMult=1; bonusInvincible=0; maxLives=3;
  if(lvl>=2) nitroRefillMult=1.2;
  if(lvl>=3) maxLives=4;
  if(lvl>=4) coinValueMult=2;
  if(lvl>=5) scoreMult=1.5;
  if(lvl>=6) maxLives=5;
  if(lvl>=7) bonusInvincible=0.5;
  if(lvl>=8) nearMissMult=2;
  if(lvl>=9) scoreMult=2;
  if(lvl>=10) maxLives=6;
  if(lives<maxLives) lives=maxLives;
}

// Obstacle base - for construction zones, oil spills, moving barriers
class Obstacle{
  constructor(type,lane,y,width,height){
    this.type=type; // 'construction' | 'oil' | 'barrier'
    this.lane=lane;
    this.baseLane=lane;
    this.y=y; this.w=width; this.h=height;
    this.x=ROAD_L+this.lane*LANE_W+LANE_W/2;
    this.active=true;
    this.animTimer=0;
    this.hit=false;
    // For moving barriers
    this.moveDir=1;
    this.moveSpeed=0;
    this.moveRange=0;
    if(type==='barrier'){
      this.moveDir=Math.random()<0.5?1:-1;
      this.moveSpeed=rand(0.8,1.8);
      this.moveRange=randi(1,2);
    }
    // For construction zones
    this.coneBob=rand(0,Math.PI*2);
  }
  get rect(){
    return{x:this.x-this.w/2,y:this.y-this.h/2,w:this.w,h:this.h};
  }
  update(dt,spd){
    this.animTimer+=dt;
    if(this.type==='barrier'){
      // Move back and forth across lanes
      const rangePx=this.moveRange*LANE_W;
      const dx=Math.sin(this.animTimer*this.moveSpeed)*rangePx*0.8;
      this.lane=this.baseLane+(dx/LANE_W);
      this.x=ROAD_L+this.lane*LANE_W+LANE_W/2;
    }
    this.y+=spd*0.85;
    if(this.y>H+120) this.active=false;
  }
}

// ── Object Pool cho Particle ─────────────────────────────
class SimplePool{
  constructor(factory,reset,initialSize=20){
    this.pool=[]; this.factory=factory; this.reset=reset;
    for(let i=0;i<initialSize;i++) this.pool.push(factory());
  }
  acquire(){
    return this.pool.pop()||this.factory();
  }
  release(obj){
    this.reset(obj); this.pool.push(obj);
  }
}

    roadEdge1:lerpColor(ct.roadEdge[1],nt.roadEdge[1],t),
    grass:lerpColor(ct.grass,nt.grass,t),
    grassAlt:lerpColor(ct.grassAlt,nt.grassAlt,t),
    laneMark:isRain?'rgba(180,200,255,0.3)':'rgba(255,255,255,0.45)',
    fogColor:t>0.5?nt.fogColor:ct.fogColor,
    ambientLight:lerp(ct.ambientLight,nt.ambientLight,t),
    hasBuildings:t>0.5?nt.hasBuildings:ct.hasBuildings,
    hasStars:t>0.5?nt.hasStars:ct.hasStars,
    starCount:Math.round(lerp(ct.starCount,nt.starCount,t)),
    hasRain:t>0.5?nt.hasRain:ct.hasRain,
    rainCount:Math.round(lerp(ct.rainCount,nt.rainCount,t)),
    themeHue:lerp(ct.themeHue,nt.themeHue,t),
    hazardWeights:t>0.5?nt.hazardWeights:ct.hazardWeights,
    trafficDensity:lerp(ct.trafficDensity,nt.trafficDensity,t),
    dustColor:t>0.5?nt.dustColor:ct.dustColor,
    dustCount:Math.round(lerp(ct.dustCount,nt.dustCount,t)),
  };
}

function getHazardWeight(type){
  const theme=getCurrentTheme();
  return theme.hazardWeights[type]||0.3;
}

function pickTrafficType(){
  // Weight based on difficulty and theme
  const weights={
    normal:0.28, aggressive:0.12+adaptDifficulty*0.08,
    cautious:0.15, weaver:0.08+adaptDifficulty*0.04,
    truck:0.08, sports:0.08+adaptDifficulty*0.06,
    bus:0.05, motorcycle:0.08, ambulance:0.02, police:0.01+adaptDifficulty*0.02
  };
  let total=0;
  for(const k of Object.keys(weights)) total+=weights[k];
  let r=Math.random()*total;
  for(const k of Object.keys(weights)){
    r-=weights[k];
    if(r<=0) return k;
  }
  return 'normal';
}

function spawnTraffic(){
  const theme=getCurrentTheme();
  const maxCars=Math.round(4+adaptDifficulty*4+theme.trafficDensity*2);
  if(trafficCars.length>=maxCars) return;
  const lane=randi(0,LANE_COUNT-1);
  // Check for other cars in same lane nearby
  for(const c of trafficCars) if(Math.abs(c.lane-lane)<0.8&&c.y<300&&c.y>-120) return;
  const typeKey=pickTrafficType();
  const spdMult=TRAFFIC_TYPES[typeKey].speedMult;
  const carSpeed=speed*spdMult*(0.9+adaptDifficulty*0.1);
  const car=new TrafficCar(lane,-rand(80,200),carSpeed,typeKey,currentThemeIdx);
  // Maybe pre-assign lane change for variety
  if(Math.random()<0.12+adaptDifficulty*0.08&&lane>0&&lane<LANE_COUNT-1){
    car.targetLane=Math.random()<0.5?lane-1:lane+1;
  }
  trafficCars.push(car);
}

function spawnCoin(){
  if(coins.length>=5) return;
  const lane=randi(0,LANE_COUNT-1);
  for(const c of coins) if(c.lane===lane&&c.y<200) return;
  // Don't spawn on obstacles
  for(const o of obstacles) if(Math.abs(o.lane-lane)<0.8&&o.y<300) return;
  coins.push(new CoinObj(lane,-rand(60,200)));
}

function spawnObstacle(){
  const mode=GAME_MODES[selectedMode]||GAME_MODES.endless;
  const maxObs=mode.key==='obstacleRush' ? 5+Math.floor(adaptDifficulty*2) : 3+Math.floor(adaptDifficulty*2);
  if(obstacles.length>=maxObs) return;
  // Pick hazard type based on theme weights
  const theme=getCurrentTheme();
  const hazTotal=theme.hazardWeights.oil+theme.hazardWeights.construction+theme.hazardWeights.barrier;
  let r=Math.random()*hazTotal;
  let type='oil';
  if((r-=theme.hazardWeights.oil)<=0) type='oil';
  else if((r-=theme.hazardWeights.construction)<=0) type='construction';
  else type='barrier';

  // Pick lanes that aren't too crowded
  const lane=randi(0,LANE_COUNT-1);
  for(const o of obstacles) if(Math.abs(o.lane-lane)<0.8&&o.y<300) return;
  for(const c of trafficCars) if(Math.abs(c.lane-lane)<0.6&&c.y<200) return;

  let w,h;
  if(type==='construction'){w=LANE_W*0.7;h=30;}
  else if(type==='oil'){w=LANE_W*0.8;h=18;}
  else {w=LANE_W*0.6;h=50;}

  const obs=new Obstacle(type,lane,-rand(80,150),w,h);
  obstacles.push(obs);
}

// ── Pedestrian System ──
const PEDESTRIAN_COLORS=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#34495e'];
const PEDESTRIAN_NAMES=['Ng','Tn','Hn','Lm','Qn','Bh'];
class Pedestrian{
  constructor(x,y,dir){
    this.x=x; this.y=y; this.dir=dir; // dir: 1=down(screen), -1=up
    this.speed=rand(15,35);
    this.color=PEDESTRIAN_COLORS[randi(0,PEDESTRIAN_COLORS.length-1)];
    this.walkPhase=rand(0,Math.PI*2);
    this.active=true;
    this.armSwing=0;
    this.headBob=0;
  }
  update(dt){
    this.y+=this.speed*this.dir*dt;
    this.walkPhase+=dt*8;
    this.armSwing=Math.sin(this.walkPhase)*3;
    this.headBob=Math.abs(Math.sin(this.walkPhase*0.5))*1.5;
    if(this.dir>0&&this.y>H+30) this.active=false;
    if(this.dir<0&&this.y<-30) this.active=false;
  }
  draw(ctx){
    const bobY=this.headBob;
    const armA=this.armSwing;
    // Body
    ctx.fillStyle=this.color;
    ctx.beginPath(); roundRect(ctx,this.x-4,this.y-8+bobY,8,12,2); ctx.fill();
    // Head
    ctx.fillStyle='#f5cba7';
    ctx.beginPath(); ctx.arc(this.x,this.y-12+bobY,4,0,Math.PI*2); ctx.fill();
    // Hair
    ctx.fillStyle='#2c3e50';
    ctx.beginPath(); ctx.arc(this.x,this.y-14+bobY,4,Math.PI,0); ctx.fill();
    // Legs
    ctx.fillStyle='#2c3e50';
    ctx.fillRect(this.x-3,this.y+4,2,6+armA*0.3);
    ctx.fillRect(this.x+1,this.y+4,2,6-armA*0.3);
    // Arms
    ctx.strokeStyle=this.color; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(this.x-4,this.y-4+bobY); ctx.lineTo(this.x-7,this.y+armA); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(this.x+4,this.y-4+bobY); ctx.lineTo(this.x+7,this.y-armA); ctx.stroke();
  }
}

const BILLBOARD_MSGS=[
  'TURBO RUSH','VÙNG NITRO','VUA DRIFT','TỐC ĐỘ CAO',
  'ĐIỂM DỪNG','THỜI GIAN ĐUA','CHẠY NHANH','KHÔNG GIỚI HẠN',
  'THÀNH PHỐ NEON','ÁC QUỶ TỐC ĐỘ','CHIẾN BINH ĐƯỜNG','TĂNG TỐC',
  'KHU VỰC ARCADE','ĐƯỜNG 1','GIỜ CAO ĐIỂM','ĐENTITY THROTLE'
];
const BILLBOARD_COLORS=['#ff4444','#44aaff','#44ff44','#ffaa00','#ff44ff','#44ffff'];

class Billboard{
  constructor(x,y){
    this.x=x; this.y=y;
    this.w=rand(30,50); this.h=rand(18,28);
    this.msg=BILLBOARD_MSGS[randi(0,BILLBOARD_MSGS.length-1)];
    this.bgColor=BILLBOARD_COLORS[randi(0,BILLBOARD_COLORS.length-1)];
    this.glowPhase=rand(0,Math.PI*2);
    this.active=true;
  }
  update(dt,speed){
    this.y+=speed*dt;
    this.glowPhase+=dt*2;
    if(this.y>H+60) this.active=false;
  }
  draw(ctx){
    const glow=0.6+Math.sin(this.glowPhase)*0.2;
    // Pole
    ctx.fillStyle='rgba(100,100,120,0.6)';
    ctx.fillRect(this.x-1.5,this.y,3,30);
    // Board
    ctx.shadowColor=this.bgColor; ctx.shadowBlur=8*glow;
    ctx.fillStyle='rgba(20,20,40,0.85)';
    ctx.beginPath(); roundRect(ctx,this.x-this.w/2,this.y-this.h/2-4,this.w,this.h,4); ctx.fill();
    // Border
    ctx.strokeStyle=this.bgColor; ctx.lineWidth=1.5;
    ctx.globalAlpha=glow;
    ctx.beginPath(); roundRect(ctx,this.x-this.w/2,this.y-this.h/2-4,this.w,this.h,4); ctx.stroke();
    ctx.globalAlpha=1;
    // Text
    ctx.shadowBlur=0;
    ctx.fillStyle=this.bgColor;
    ctx.font=`bold ${Math.min(8,this.w/this.msg.length*1.2)|0}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(this.msg,this.x,this.y-4);
  }
}

const SCENARY_TYPES=['tree','pole','bush','sign','fireHydrant','trashCan'];
class SceneryItem{
  constructor(x,y,type){
    this.x=x; this.y=y; this.type=type||SCENARY_TYPES[randi(0,SCENARY_TYPES.length-1)];
    this.active=true;
    this.scale=rand(0.7,1.2);
    this.variant=randi(0,3);
  }
  update(dt,speed){
    this.y+=speed*dt;
    if(this.y>H+40) this.active=false;
  }
  draw(ctx){
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.scale(this.scale,this.scale);
    const v=this.variant;
    if(this.type==='tree'){
      // Trunk
      ctx.fillStyle='#5d4037';
      ctx.fillRect(-2,-20,4,22);
      // Foliage layers
      ctx.fillStyle=v===0?'#2e7d32':v===1?'#388e3c':'#1b5e20';
      ctx.beginPath(); ctx.arc(0,-26,10+v*2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=v===0?'#43a047':v===1?'#4caf50':'#2e7d32';
      ctx.beginPath(); ctx.arc(0,-30,7+v,0,Math.PI*2); ctx.fill();
    }else if(this.type==='pole'){
      // Street light pole
      ctx.fillStyle='#78909c';
      ctx.fillRect(-1.5,-35,3,37);
      // Lamp head
      ctx.fillStyle='#eceff1';
      ctx.beginPath(); ctx.arc(0,-35,5,0,Math.PI*2); ctx.fill();
      // Light glow
      ctx.fillStyle='rgba(255,240,180,0.08)';
      ctx.beginPath(); ctx.arc(0,-35,12,0,Math.PI*2); ctx.fill();
    }else if(this.type==='bush'){
      ctx.fillStyle=v===0?'#558b2f':v===1?'#689f38':'#33691e';
      ctx.beginPath(); ctx.arc(0,-5,8+v*2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=v===0?'#7cb342':v===1?'#8bc34a':'#558b2f';
      ctx.beginPath(); ctx.arc(3,-7,6+v,0,Math.PI*2); ctx.fill();
    }else if(this.type==='sign'){
      // Road sign
      ctx.fillStyle='#78909c'; ctx.fillRect(-1.5,-25,3,27);
      ctx.fillStyle='#1565c0';
      ctx.beginPath(); roundRect(ctx,-10,-32,20,14,2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 6px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(v===0?'TỐC ĐỘ':v===1?'ĐUA':'ĐI!',0,-25);
    }else if(this.type==='fireHydrant'){
      ctx.fillStyle='#c62828';
      ctx.fillRect(-3,-10,6,12);
      ctx.beginPath(); ctx.arc(0,-10,4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#e53935';
      ctx.fillRect(-5,-8,10,3);
    }else if(this.type==='trashCan'){
      ctx.fillStyle='#546e7a';
      ctx.beginPath(); roundRect(ctx,-4,-12,8,14,2); ctx.fill();
      ctx.fillStyle='#78909c';
      ctx.fillRect(-5,-12,10,3);
    }
    ctx.restore();
  }
}

// ── Railway Crossing System ──
class RailwayCrossing{
  constructor(y){
    this.y=y; this.active=true;
    this.gateAngle=0; // 0=open, PI/2=closed
    this.gateTarget=0;
    this.warningPhase=0;
    this.trainPassed=false;
    this.trainTimer=rand(3,6); // time before train arrives
    this.gateX_left=ROAD_L-15;
    this.gateX_right=ROAD_R+15;
    this.warningFlash=false;
  }
  update(dt,speed){
    this.y+=speed*dt;
    this.warningPhase+=dt*6;
    this.warningFlash=Math.sin(this.warningPhase)>0;
    
    if(this.y<-100){this.active=false;return}
    
    // Train approaching - close gates
    if(this.trainTimer>0){
      this.trainTimer-=dt;
      if(this.trainTimer<2){
        this.gateTarget=Math.PI/2.2; // close gates
      }
    }
    
    // Smooth gate animation
    this.gateAngle+=(this.gateTarget-this.gateAngle)*dt*5;
  }
  draw(ctx){
    if(this.y<-50||this.y>H+50) return;
    
    // Crossing posts
    ctx.fillStyle='#424242';
    ctx.fillRect(ROAD_L-20,this.y-15,4,30);
    ctx.fillRect(ROAD_R+16,this.y-15,4,30);
    
    // Warning lights (flashing red)
    if(this.gateTarget>0.5){
      const flash=this.warningFlash;
      ctx.shadowColor=flash?'#ff0000':'#660000';
      ctx.shadowBlur=flash?20:5;
      ctx.fillStyle=flash?'#ff2200':'#881111';
      ctx.beginPath(); ctx.arc(ROAD_L-18,this.y-15,4,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ROAD_R+18,this.y-15,4,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
    
    // Gate arms (animated closing)
    const gateLen=(ROAD_R-ROAD_L)/2+15;
    ctx.save();
    // Left gate
    ctx.translate(ROAD_L-15,this.y+5);
    ctx.rotate(this.gateAngle);
    ctx.fillStyle='#ff6600';
    ctx.fillRect(0,-1.5,gateLen,3);
    // Stripes
    ctx.fillStyle='#fff';
    for(let i=5;i<gateLen;i+=12){
      ctx.fillRect(i,-1.5,5,3);
    }
    ctx.restore();
    
    ctx.save();
    // Right gate
    ctx.translate(ROAD_R+15,this.y+5);
    ctx.rotate(-this.gateAngle);
    ctx.fillStyle='#ff6600';
    ctx.fillRect(-gateLen,-1.5,gateLen,3);
    ctx.fillStyle='#fff';
    for(let i=-gateLen+5;i<0;i+=12){
      ctx.fillRect(i,-1.5,5,3);
    }
    ctx.restore();
    
    // Crossbuck sign
    ctx.save();
    ctx.translate((ROAD_L+ROAD_R)/2,this.y-20);
    ctx.strokeStyle='#ffcc00'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-8,-8); ctx.lineTo(8,8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8,-8); ctx.lineTo(-8,8); ctx.stroke();
    ctx.fillStyle='#ffcc00'; ctx.font='bold 7px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('ĐƯỜNG SẮT',0,-12);
    ctx.restore();
  }
}

class Train{
  constructor(crossing){
    this.crossing=crossing;
    this.x=-200; // start off-screen left
    this.y=crossing.y-8;
    this.speed=rand(200,350);
    this.w=250; this.h=24;
    this.carCount=randi(3,6);
    this.active=true;
    this.passed=false;
    this.wagons=[];
    for(let i=0;i<this.carCount;i++){
      this.wagons.push({
        color:['#8d6e63','#546e7a','#78909c','#455a64','#6d4c41'][i%5],
        hasContainer:Math.random()<0.5,
        containerColor:['#c62828','#1565c0','#2e7d32','#f57f17'][randi(0,3)]
      });
    }
  }
  update(dt){
    this.x+=this.speed*dt;
    if(this.x>W+300){
      this.active=false;
      this.crossing.gateTarget=0; // open gates
      this.crossing.trainPassed=true;
    }
  }
  draw(ctx){
    ctx.save();
    const trainW=this.w*this.carCount;
    
    for(let i=0;i<this.carCount;i++){
      const wx=this.x+i*70;
      if(wx>W+50||wx<-100) continue;
      const w=this.wagons[i];
      
      // Wagon body
      ctx.fillStyle=w.color;
      ctx.beginPath(); roundRect(ctx,wx,this.y-10,62,20,3); ctx.fill();
      
      // Container on top
      if(w.hasContainer){
        ctx.fillStyle=w.containerColor;
        ctx.beginPath(); roundRect(ctx,wx+2,this.y-18,58,10,2); ctx.fill();
      }
      
      // Wheels
      ctx.fillStyle='#222';
      ctx.beginPath(); ctx.arc(wx+10,this.y+10,5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(wx+50,this.y+10,5,0,Math.PI*2); ctx.fill();
      
      // Coupler
      if(i<this.carCount-1){
        ctx.fillStyle='#333';
        ctx.fillRect(wx+62,this.y-3,8,6);
      }
      
      // Headlights on first wagon
      if(i===0){
        ctx.fillStyle='#ffff88';
        ctx.shadowColor='#ffff00'; ctx.shadowBlur=10;
        ctx.beginPath(); ctx.arc(wx+62,this.y-4,3,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(wx+62,this.y+4,3,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      }
    }
    ctx.restore();
  }
}

function updateRailways(dt,speed){
  railwayCooldown-=dt;
  
  // Spawn new railway crossing
  if(railwayCooldown<=0&&railwayGates.length===0&&Math.random()<0.003){
    railwayGates.push(new RailwayCrossing(-80));
    railwayCooldown=rand(25,50);
  }
  
  // Update crossings
  for(let i=railwayGates.length-1;i>=0;i--){
    const g=railwayGates[i];
    g.update(dt,speed);
    
    // Spawn train when gate is closing
    if(g.trainTimer<=0&&!g.trainPassed&&trains.length===0){
      trains.push(new Train(g));
      SFX.trainHorn();
    }
    
    if(!g.active) railwayGates.splice(i,1);
  }
  
  // Update trains
  for(let i=trains.length-1;i>=0;i--){
    trains[i].update(dt);
    if(!trains[i].active) trains.splice(i,1);
  }
}

function drawRailways(){
  for(const g of railwayGates) g.draw(ctx);
  for(const t of trains) t.draw(ctx);
}

// ── Police Pursuit System ──
class PolicePursuit{
  constructor(){
    this.active=true;
    this.lane=randi(0,LANE_COUNT-1);
    this.y=-100;
    this.speed=0;
    this.sirenPhase=0;
    this.chaseTimer=0;
    this.maxDuration=rand(8,15);
    this.retro=false; // true = retro low-poly style
  }
  update(dt,currentSpeed){
    this.sirenPhase+=dt*12;
    this.chaseTimer+=dt;
    
    // Police car tries to catch up to player
    const targetSpeed=currentSpeed*0.95;
    this.speed+=(targetSpeed-this.speed)*dt*3;
    this.y+=this.speed*dt*0.85;
    
    // Follow player lane (slowly)
    const targetLane=playerLane;
    const laneDiff=targetLane-this.lane;
    if(Math.abs(laneDiff)>0.1){
      this.lane+=Math.sign(laneDiff)*dt*0.8;
    }
    this.lane=clamp(this.lane,0,LANE_COUNT-1);
    
    // Chase expires
    if(this.chaseTimer>this.maxDuration){
      this.active=false;
    }
    
    // Despawn if too far below player
    if(this.y>playerY+400){
      this.active=false;
    }
  }
  draw(ctx){
    const x=ROAD_L+this.lane*LANE_W+LANE_W/2;
    const y=this.y;
    
    // Police car body
    ctx.fillStyle='#1a237e';
    ctx.beginPath();
    ctx.moveTo(x-22,y-40);ctx.lineTo(x+22,y-40);
    ctx.lineTo(x+25,y-10);ctx.lineTo(x+25,y+30);
    ctx.lineTo(x+22,y+40);ctx.lineTo(x-22,y+40);
    ctx.lineTo(x-25,y+30);ctx.lineTo(x-25,y-10);
    ctx.closePath();ctx.fill();
    
    // White stripe
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.fillRect(x-25,y-5,50,10);
    
    // Siren lights (alternating red/blue)
    const sirenOn=Math.sin(this.sirenPhase)>0;
    const sirenOn2=Math.sin(this.sirenPhase+Math.PI)>0;
    
    // Red light
    ctx.shadowColor=sirenOn?'#ff0000':'#660000';
    ctx.shadowBlur=sirenOn?25:5;
    ctx.fillStyle=sirenOn?'#ff0000':'#991111';
    ctx.beginPath(); ctx.arc(x-8,y-38,4,0,Math.PI*2); ctx.fill();
    
    // Blue light
    ctx.shadowColor=sirenOn2?'#0066ff':'#002266';
    ctx.shadowBlur=sirenOn2?25:5;
    ctx.fillStyle=sirenOn2?'#0066ff':'#113366';
    ctx.beginPath(); ctx.arc(x+8,y-38,4,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    
    // Headlights
    ctx.fillStyle='#ffffcc';
    ctx.beginPath(); ctx.ellipse(x-15,y-42,3,2,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+15,y-42,3,2,0,0,Math.PI*2); ctx.fill();
    
    // POLICE text
    ctx.fillStyle='#fff';
    ctx.font='bold 6px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('CẢNH SÁT',x,y);
    
    // Rear lights
    ctx.fillStyle='#ff0000';
    ctx.shadowColor='#ff0000'; ctx.shadowBlur=8;
    ctx.fillRect(x-20,y+36,5,3);
    ctx.fillRect(x+15,y+36,5,3);
    ctx.shadowBlur=0;
  }
}

function updatePolice(dt,currentSpeed){
  // Trigger police chase based on wanted level
  if(wantedLevel>0){
    wantedTimer-=dt;
    if(wantedTimer<=0){
      wantedLevel=Math.max(0,wantedLevel-1);
      wantedTimer=15;
    }

// ── Wildlife Crossing System ──
const WILDLIFE_TYPES=[
  {name:'deer',color:'#8d6e63',w:16,h:12,speed:50},
  {name:'dog',color:'#a1887f',w:10,h:8,speed:70},
  {name:'rabbit',color:'#d7ccc8',w:6,h:5,speed:90},
  {name:'fox',color:'#e65100',w:12,h:9,speed:60},
];
class WildlifeAnimal{
  constructor(){
    const type=WILDLIFE_TYPES[randi(0,WILDLIFE_TYPES.length-1)];
    this.type=type.name;
    this.color=type.color;
    this.w=type.w; this.h=type.h;
    this.animalSpeed=type.speed;
    this.dir=Math.random()<0.5?1:-1;
    this.x=this.dir>0?ROAD_L-20:ROAD_R+20;
    this.y=-rand(30,100);
    this.laneTarget=randi(0,LANE_COUNT-1);
    this.active=true;
    this.scared=false;
    this.scareTimer=0;
    this.legPhase=0;
  }
  update(dt,speed){
    this.y+=speed*dt*0.5; // road scrolls, animal also walks
    this.legPhase+=dt*10;
    
    // Move across road
    if(!this.scared){
      const targetX=ROAD_L+this.laneTarget*LANE_W+LANE_W/2;
      const dx=targetX-this.x;
      this.x+=Math.sign(dx)*this.animalSpeed*dt;
      
      // Check if player is close - scare!
      const dist=Math.abs(this.x-playerX)+Math.abs(this.y-playerY);
      if(dist<120){
        this.scared=true;
        this.scareTimer=1.5;
        this.dir=this.x>playerX?1:-1; // run away from player
      }
    }else{
      this.x+=this.dir*this.animalSpeed*2*dt;
      this.scareTimer-=dt;
      if(this.scareTimer<=0) this.active=false;
    }
    
    if(this.y>H+40||this.y<-80) this.active=false;
    if(this.x<-60||this.x>W+60) this.active=false;
  }
  draw(ctx){
    ctx.save();
    ctx.translate(this.x,this.y);
    if(this.dir<0) ctx.scale(-1,1);
    
    const legOff=Math.sin(this.legPhase)*2;
    
    if(this.type==='deer'){
      // Body
      ctx.fillStyle=this.color;
      ctx.beginPath(); ctx.ellipse(0,0,this.w/2,this.h/3,0,0,Math.PI*2); ctx.fill();
      // Legs
      ctx.fillStyle='#6d4c41';
      ctx.fillRect(-4,this.h/3,2,6+legOff);
      ctx.fillRect(2,this.h/3,2,6-legOff);
      // Head
      ctx.fillStyle=this.color;
      ctx.beginPath(); ctx.ellipse(this.w/3,-3,4,3,0,0,Math.PI*2); ctx.fill();
      // Antlers
      ctx.strokeStyle='#5d4037'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(this.w/3,-5); ctx.lineTo(this.w/3+3,-10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(this.w/3,-5); ctx.lineTo(this.w/3-2,-9); ctx.stroke();
    }else if(this.type==='dog'){
      ctx.fillStyle=this.color;
      ctx.beginPath(); ctx.ellipse(0,0,this.w/2,this.h/3,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#795548';
      ctx.fillRect(-3,this.h/3,2,5+legOff);
      ctx.fillRect(1,this.h/3,2,5-legOff);
      ctx.fillStyle=this.color;
      ctx.beginPath(); ctx.ellipse(this.w/3,-2,3,2.5,0,0,Math.PI*2); ctx.fill();
      // Tail
      ctx.strokeStyle=this.color; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-this.w/3,0); ctx.lineTo(-this.w/3-3,-4+legOff); ctx.stroke();
    }else if(this.type==='rabbit'){
      ctx.fillStyle=this.color;
      ctx.beginPath(); ctx.ellipse(0,0,this.w/2,this.h/3,0,0,Math.PI*2); ctx.fill();
      ctx.fillRect(-2,this.h/3,1.5,4+legOff);
      ctx.fillRect(0.5,this.h/3,1.5,4-legOff);
      ctx.beginPath(); ctx.ellipse(this.w/3,-1,2.5,2,0,0,Math.PI*2); ctx.fill();
      // Ears
      ctx.fillRect(this.w/3,-5,1.5,5);
      ctx.fillRect(this.w/3+2,-4,1.5,4);
    }else{ // fox
      ctx.fillStyle=this.color;
      ctx.beginPath(); ctx.ellipse(0,0,this.w/2,this.h/3,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#bf360c';
      ctx.fillRect(-3,this.h/3,2,5+legOff);
      ctx.fillRect(1,this.h/3,2,5-legOff);
      ctx.fillStyle=this.color;
      ctx.beginPath(); ctx.ellipse(this.w/3,-2,3,2.5,0,0,Math.PI*2); ctx.fill();
      // Fluffy tail
      ctx.fillStyle='#e65100';
      ctx.beginPath(); ctx.arc(-this.w/3-2,-1,4,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

class TrafficLight{
  constructor(y){
    this.y=y;
    this.green=true; // true = green for player direction
    this.timer=rand(4,8);
    this.phases=['green','yellow','red'];
    this.phaseIdx=0;
    this.active=true;
    this.x_left=ROAD_L-10;
    this.x_right=ROAD_R+10;
  }
  update(dt,speed){
    this.y+=speed*dt;
    if(this.y>H+40) this.active=false;
    
    this.timer-=dt;
    if(this.timer<=0){
      this.phaseIdx=(this.phaseIdx+1)%3;
      this.timer=this.phaseIdx===0?rand(4,8):this.phaseIdx===1?1.5:rand(3,6);
      this.green=this.phaseIdx===0;
    }
  }
  draw(ctx){
    if(this.y<-20||this.y>H+20) return;
    
    const currentPhase=this.phases[this.phaseIdx];
    
    for(const x of [this.x_left,this.x_right]){
      // Pole
      ctx.fillStyle='#424242';
      ctx.fillRect(x-1.5,this.y-25,3,28);
      
      // Housing
      ctx.fillStyle='#212121';
      ctx.beginPath(); roundRect(ctx,x-5,this.y-28,10,20,3); ctx.fill();
      
      // Red
      ctx.fillStyle=currentPhase==='red'?'#ff1744':'#4a0000';
      if(currentPhase==='red'){ctx.shadowColor='#ff0000';ctx.shadowBlur=8}
      ctx.beginPath(); ctx.arc(x,this.y-24,2.5,0,Math.PI*2); ctx.fill();
      
      // Yellow
      ctx.fillStyle=currentPhase==='yellow'?'#ffea00':'#4a4000';
      if(currentPhase==='yellow'){ctx.shadowColor='#ffea00';ctx.shadowBlur=8}
      ctx.beginPath(); ctx.arc(x,this.y-20,2.5,0,Math.PI*2); ctx.fill();
      
      // Green
      ctx.fillStyle=currentPhase==='green'?'#00e676':'#003300';
      if(currentPhase==='green'){ctx.shadowColor='#00ff00';ctx.shadowBlur=8}
      ctx.beginPath(); ctx.arc(x,this.y-16,2.5,0,Math.PI*2); ctx.fill();
      
      ctx.shadowBlur=0;
    }
  }
}

class Helicopter{
  constructor(){

    this.y=rand(-80,-20);

    this.speedY=rand(10,25);
    this.rotorPhase=0;

  }
  update(dt){
    this.rotorPhase+=dt*30;

    this.y+=this.speedY*dt;
    if(this.searchLight) this.lightAngle+=dt*1.5;
    if(this.y>H+60) this.active=false;
    if(this.x<-100||this.x>W+100) this.active=false;
  }
  draw(ctx){
    ctx.save();
    ctx.globalAlpha=0.5; // distant feel
    const x=this.x,y=this.y;
    
    // Shadow on ground (far below)
    ctx.fillStyle='rgba(0,0,0,0.08)';
    ctx.beginPath(); ctx.ellipse(x,y+200,25,8,0,0,Math.PI*2); ctx.fill();
    
    // Body
    ctx.fillStyle='#455a64';
    ctx.beginPath(); ctx.ellipse(x,y,12,6,0,0,Math.PI*2); ctx.fill();
    // Cockpit
    ctx.fillStyle='#80cbc4';
    ctx.beginPath(); ctx.ellipse(x+8,y-1,5,4,0.3,0,Math.PI*2); ctx.fill();
    // Tail boom
    ctx.fillStyle='#546e7a';
    ctx.fillRect(x-18,y-1,10,2);
    // Tail rotor
    ctx.fillStyle='#78909c';
    ctx.beginPath(); ctx.ellipse(x-20,y,1.5,5,0,0,Math.PI*2); ctx.fill();
    
    // Main rotor
    ctx.strokeStyle='rgba(150,150,160,0.4)';
    ctx.lineWidth=1.5;
    const rotorLen=22;
    const ra=this.rotorPhase;
    ctx.beginPath();
    ctx.moveTo(x+Math.cos(ra)*rotorLen,y-4+Math.sin(ra)*2);
    ctx.lineTo(x-Math.cos(ra)*rotorLen,y-4-Math.sin(ra)*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x+Math.cos(ra+Math.PI/2)*rotorLen,y-4+Math.sin(ra+Math.PI/2)*2);
    ctx.lineTo(x-Math.cos(ra+Math.PI/2)*rotorLen,y-4-Math.sin(ra+Math.PI/2)*2);
    ctx.stroke();
    
    // Rotor hub
    ctx.fillStyle='#90a4ae';
    ctx.beginPath(); ctx.arc(x,y-4,2,0,Math.PI*2); ctx.fill();
    
    // Search light
    if(this.searchLight){
      const lx=x+Math.sin(this.lightAngle)*40;
      const ly=y+180+Math.cos(this.lightAngle)*20;
      ctx.globalAlpha=0.15;
      ctx.fillStyle='#ffff88';
      ctx.beginPath();
      ctx.moveTo(x,y+5);
      ctx.lineTo(lx-15,ly);
      ctx.lineTo(lx+15,ly);
      ctx.closePath(); ctx.fill();
      // Spotlight dot
      ctx.globalAlpha=0.25;
      ctx.beginPath(); ctx.arc(lx,ly,8,0,Math.PI*2); ctx.fill();
    }
    
    ctx.restore();
  }
}

// ── Accident System ──
class AccidentSite{
  constructor(y){
    this.y=y;
    this.lane=randi(0,LANE_COUNT-1);
    this.active=true;
    this.timer=0;
    this.duration=rand(6,12);
    this.smokePhase=0;
    // Damaged cars at accident
    this.cars=[];
    const count=randi(1,3);
    for(let i=0;i<count;i++){
      this.cars.push({
        x:ROAD_L+(this.lane+rand(-0.5,0.5))*LANE_W+LANE_W/2,
        offset:rand(-15,15),
        angle:rand(-0.3,0.3),
        color:['#c62828','#1565c0','#2e7d32','#f57f17'][randi(0,3)],
        damaged:Math.random()<0.5
      });
    }
  }
  update(dt,speed){
    this.y+=speed*dt;
    this.timer+=dt;
    this.smokePhase+=dt*3;
    if(this.timer>this.duration||this.y>H+100) this.active=false;
  }
  draw(ctx){
    if(this.y<-40||this.y>H+40) return;
    
    // Caution tape / cones
    const coneCount=4;
    for(let i=0;i<coneCount;i++){
      const cx=ROAD_L+(this.lane-0.5)*LANE_W+i*LANE_W/(coneCount-1);
      const cy=this.y;
      // Cone
      ctx.fillStyle='#ff6600';
      ctx.beginPath();
      ctx.moveTo(cx-4,cy+8);ctx.lineTo(cx+4,cy+8);ctx.lineTo(cx,cy-4);
      ctx.closePath();ctx.fill();
      ctx.fillStyle='#fff';
      ctx.fillRect(cx-2,cy,4,2);
    }
    
    // Damaged cars
    for(const car of this.cars){
      ctx.save();
      ctx.translate(car.x+car.offset,this.y);
      ctx.rotate(car.angle);
      
      // Car body (crashed)
      ctx.fillStyle=car.color;
      ctx.beginPath();
      ctx.rect(-18,-12,36,24);
      ctx.fill();
      
      // Damage marks
      if(car.damaged){
        ctx.fillStyle='rgba(0,0,0,0.3)';
        ctx.fillRect(-15,-8,8,6);
        ctx.fillStyle='#333';
        ctx.fillRect(-16,-10,3,10); // broken window
      }
      
      ctx.restore();
    }
    
    // Smoke rising
    ctx.globalAlpha=0.3;
    for(let i=0;i<4;i++){
      const sx=this.cars[0]?.x||this.lane*LANE_W+ROAD_L;
      const sy=this.y-10-i*8+Math.sin(this.smokePhase+i)*3;
      const sr=5+i*3+Math.sin(this.smokePhase*0.5+i)*2;
      ctx.fillStyle=`rgba(80,80,90,${0.15-i*0.03})`;
      ctx.beginPath(); ctx.arc(sx+rand(-5,5),sy,sr,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
}

function updateWeatherReactive(){
  const theme=getCurrentTheme();
  // Adjust wind based on rain
  if(theme.hasRain){
    weatherIntensity=lerp(weatherIntensity,1,0.02);
    windDirection=Math.sin(gameTime*0.3)*20;
  }else{
    weatherIntensity=lerp(weatherIntensity,0,0.01);
    windDirection=0;
  }
  // Apply weather to traffic behavior
  for(const c of trafficCars){
    if(weatherIntensity>0.5){
      // Cars drive slower and more cautiously in rain
      c.speedMult*=0.98;
      c.switchChance*=0.8;
      c.cautious=Math.min(0.9,c.cautious+0.01);
    }
  }
}

// ── Round Rect Helper ─────────────────────────────────────
function roundRect(ctx,x,y,w,h,r){
  if(r===0){ctx.rect(x,y,w,h);return}
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ── Sound System (procedural Web Audio) ──────────────────
let audioCtx=null;
let bgmSource=null;
let bgmGain=null;
let bgmBuffer=null;
function initAudio(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}

// ── BGM: Procedural Synthwave Racing Track ──
// Generates a high-energy synthwave loop using Web Audio API
// No external dependencies needed!
const BGM_BPM=128;
const BGM_BEAT=60/BGM_BPM;
let bgmLoading=false;

function generateBGM(){
  if(!audioCtx||bgmLoading) return Promise.resolve(null);
  bgmLoading=true;
  try{
    // Offline rendering to create a seamless loop
    const beats=8; // 8-bar loop
    const totalTime=beats*4*BGM_BEAT;
    const sampleRate=audioCtx.sampleRate;
    const offline=new OfflineAudioContext(2,Math.ceil(sampleRate*totalTime),sampleRate);

    const masterGain=offline.createGain();
    masterGain.gain.setValueAtTime(0.65,0);
    masterGain.connect(offline.destination);

    // ── Bassline (acid-style square wave arpeggio) ──
    const bassNotes=[55,55,65.4,55, 73.4,65.4,55,49, 55,55,65.4,55, 82.4,73.4,65.4,73.4];
    const bassOsc=offline.createOscillator();
    const bassGain=offline.createGain();
    bassOsc.type='sawtooth';
    bassOsc.frequency.setValueAtTime(55,0);
    bassGain.gain.setValueAtTime(0.12,0);
    bassOsc.connect(bassGain);

    // Bass filter
    const bassFilter=offline.createBiquadFilter();
    bassFilter.type='lowpass';
    bassFilter.frequency.setValueAtTime(400,0);
    bassFilter.Q.setValueAtTime(2,0);
    bassGain.connect(bassFilter);
    bassFilter.connect(masterGain);

    for(let i=0;i<bassNotes.length*2;i++){
      const note=bassNotes[i%bassNotes.length];
      const t=i*BGM_BEAT;
      // Slide between notes for that synthwave feel
      bassOsc.frequency.setTargetAtTime(note*2,t,0.05);
      const vol=0.12+Math.sin(i*0.5)*0.03;
      bassGain.gain.setTargetAtTime(vol,t,0.03);
      bassGain.gain.setTargetAtTime(0.01,t+BGM_BEAT*0.7,0.02);
    }
    bassOsc.start(0);
    bassOsc.stop(totalTime);

    // ── Arpeggio (synthwave classic) ──
    const arpNotes=[261.6,329.6,392,523.3, 392,329.6,261.6,196, 293.7,349.2,440,587.3, 440,349.2,293.7,220];
    const arpOsc=offline.createOscillator();
    const arpGain=offline.createGain();
    arpOsc.type='square';
    arpGain.gain.setValueAtTime(0.08,0);

    const arpFilter=offline.createBiquadFilter();
    arpFilter.type='lowpass';
    arpFilter.frequency.setValueAtTime(800,0);
    arpFilter.frequency.setTargetAtTime(3000,8,0.5);
    arpOsc.connect(arpGain);
    arpGain.connect(arpFilter);
    arpFilter.connect(masterGain);

    for(let i=0;i<arpNotes.length*4;i++){
      const note=arpNotes[i%arpNotes.length];
      const t=i*BGM_BEAT*0.5;
      arpOsc.frequency.setTargetAtTime(note,t,0.02);
      arpGain.gain.setTargetAtTime(0.07+Math.sin(i*0.3)*0.02,t,0.02);
      arpGain.gain.setTargetAtTime(0.001,t+BGM_BEAT*0.35,0.01);
    }
    arpOsc.start(0);
    arpOsc.stop(totalTime);

    // ── Lead pad (evolving synthwave chords) ──
    const chordProg=[[261.6,329.6,392],[293.7,349.2,440],[220,277.2,329.6],[196,246.9,293.7]];
    const padOsc1=offline.createOscillator();
    const padOsc2=offline.createOscillator();
    const padGain=offline.createGain();
    padOsc1.type='sine';
    padOsc2.type='sine';
    padGain.gain.setValueAtTime(0.06,0);

    const padFilter=offline.createBiquadFilter();
    padFilter.type='lowpass';
    padFilter.frequency.setValueAtTime(1200,0);
    padFilter.frequency.setTargetAtTime(4000,totalTime*0.5,1);
    padFilter.Q.setValueAtTime(1,0);
    padOsc1.connect(padGain);
    padOsc2.connect(padGain);
    padGain.connect(padFilter);
    padFilter.connect(masterGain);

    for(let i=0;i<chordProg.length*2;i++){
      const chord=chordProg[i%chordProg.length];
      const t=i*2*BGM_BEAT;
      padOsc1.frequency.setTargetAtTime(chord[0],t,0.05);
      padOsc2.frequency.setTargetAtTime(chord[1],t,0.05);
      // Also add the 3rd note via frequency modulation
      const chordVol=0.05+Math.sin(i*1.2)*0.02;
      padGain.gain.setTargetAtTime(chordVol,t,0.1);
    }
    padOsc1.start(0);
    padOsc2.start(0);
    padOsc1.stop(totalTime);
    padOsc2.stop(totalTime);

    // ── Kick drum ──
    const kickGain=offline.createGain();
    kickGain.gain.setValueAtTime(0.3,0);
    kickGain.connect(masterGain);

    for(let i=0;i<beats*4;i++){
      const t=i*BGM_BEAT;
      // Only on quarter notes (beats 1,2,3,4)
      const kickOsc=offline.createOscillator();
      const kickEnv=offline.createGain();
      kickOsc.type='sine';
      kickOsc.frequency.setValueAtTime(150,t);
      kickOsc.frequency.exponentialRampToValueAtTime(30,t+0.08);
      kickEnv.gain.setValueAtTime(0.5,t);
      kickEnv.gain.exponentialRampToValueAtTime(0.001,t+0.15);
      kickOsc.connect(kickEnv);
      kickEnv.connect(kickGain);
      kickOsc.start(t);
      kickOsc.stop(t+0.15);
    }

    // ── Hi-hat / Closed hat pattern ──
    const hatGain=offline.createGain();
    hatGain.gain.setValueAtTime(0.08,0);
    hatGain.connect(masterGain);

    for(let i=0;i<beats*8;i++){
      const t=i*BGM_BEAT*0.5;
      // Noise-based hi-hat
      const hatOsc=offline.createOscillator();
      const hatEnv=offline.createGain();
      hatOsc.type='square';
      hatOsc.frequency.setValueAtTime(6000+Math.random()*2000,t);
      hatEnv.gain.setValueAtTime(0.15+Math.random()*0.05,t);
      hatEnv.gain.exponentialRampToValueAtTime(0.001,t+0.04);
      hatOsc.connect(hatEnv);
      hatEnv.connect(hatGain);
      hatOsc.start(t);
      hatOsc.stop(t+0.04);
    }

    // ── Snare/clap on beats 2 & 4 ──
    const snareGain=offline.createGain();
    snareGain.gain.setValueAtTime(0.15,0);
    snareGain.connect(masterGain);

    for(let i=1;i<beats*4;i+=2){
      const t=i*BGM_BEAT;
      const snareOsc=offline.createOscillator();
      const snareNoise=offline.createOscillator();
      const snareEnv=offline.createGain();
      snareOsc.type='triangle';
      snareOsc.frequency.setValueAtTime(200,t);
      snareOsc.frequency.exponentialRampToValueAtTime(80,t+0.08);
      snareNoise.type='sawtooth';
      snareNoise.frequency.setValueAtTime(3000,t);
      snareEnv.gain.setValueAtTime(0.2,t);
      snareEnv.gain.exponentialRampToValueAtTime(0.001,t+0.12);
      snareOsc.connect(snareEnv);
      snareNoise.connect(snareEnv);
      snareEnv.connect(snareGain);
      snareOsc.start(t);
      snareNoise.start(t);
      snareOsc.stop(t+0.12);
      snareNoise.stop(t+0.12);
    }

    // ── Compressor on master for punch ──
    const compressor=offline.createDynamicsCompressor();
    compressor.threshold.setValueAtTime(-24,0);
    compressor.knee.setValueAtTime(30,0);
    compressor.ratio.setValueAtTime(12,0);
    compressor.attack.setValueAtTime(0.003,0);
    compressor.release.setValueAtTime(0.25,0);
    masterGain.disconnect();
    masterGain.connect(compressor);
    compressor.connect(offline.destination);

    // Render the buffer
    return offline.startRendering()
      .then(buf=>{bgmBuffer=buf;bgmLoading=false;return buf})
      .catch(err=>{console.warn('BGM render failed:',err);bgmLoading=false;return null});
  }catch(e){
    console.warn('BGM init failed:',e);
    bgmLoading=false;
    return Promise.resolve(null);
  }
}

function startBGM(){
  if(!audioCtx||bgmSource||!bgmBuffer) return;
  try{
    bgmSource=audioCtx.createBufferSource();
    bgmSource.buffer=bgmBuffer;
    bgmSource.loop=true;
    bgmGain=audioCtx.createGain();
    bgmGain.gain.setValueAtTime(0.40,audioCtx.currentTime);
    bgmSource.connect(bgmGain);
    bgmGain.connect(audioCtx.destination);
    bgmSource.start();
  }catch(e){}
}

function stopBGM(){
  try{
    if(bgmSource){bgmSource.stop();bgmSource.disconnect();bgmSource=null}
    if(bgmGain){bgmGain.disconnect();bgmGain=null}
  }catch(e){}
}

function resumeBGM(){
  if(!audioCtx||bgmSource||!bgmBuffer) startBGM();
}

function fadeOutBGM(dur){
  if(!bgmGain||!audioCtx) return;
  try{
    bgmGain.gain.setTargetAtTime(0,audioCtx.currentTime,dur||0.3);
    setTimeout(()=>{if(bgmGain) bgmGain.gain.value=0},(dur||0.3)*5000);
  }catch(e){}
}
function startEngineSound(){

    windGain.gain.setValueAtTime(0.0015,audioCtx.currentTime);
    windOsc.connect(windGain); windGain.connect(audioCtx.destination);
    windOsc.start();

}
function updateEngineSound(spd, nitroOn){
  if(!engineOsc||!audioCtx) return;
  try{
    const freq=55+spd*0.12;
    engineOsc.frequency.setTargetAtTime(Math.min(freq,220),audioCtx.currentTime,0.1);
    const vol=0.002+spd*0.000015;
    engineGain.gain.setTargetAtTime(Math.min(vol,0.012),audioCtx.currentTime,0.1);
    if(nitroOn){
      const nFreq=220+Math.sin(audioCtx.currentTime*8)*30;
      engineOsc.frequency.setTargetAtTime(nFreq,audioCtx.currentTime,0.05);
      engineGain.gain.setTargetAtTime(0.015,audioCtx.currentTime,0.05);
    }
    // Wind
    windOsc.frequency.setTargetAtTime(600+spd*0.5,audioCtx.currentTime,0.15);
    windGain.gain.setTargetAtTime(Math.min(0.0005+spd*0.000015,0.008),audioCtx.currentTime,0.15);
  }catch(e){}
}
function stopEngineSound(){
  try{
    if(engineOsc){engineOsc.stop();engineOsc=null}
    if(windOsc){windOsc.stop();windOsc=null}
    if(engineGain){engineGain.disconnect();engineGain=null}
    if(windGain){windGain.disconnect();windGain=null}

}
