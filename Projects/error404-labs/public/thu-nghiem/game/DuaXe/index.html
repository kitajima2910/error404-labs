// ── SHOWROOM STATE ──
let showroomRotX = 0;       // rotation angle for 3D-style car display
let showroomTargetRotX = 0;
let showroomZoom = 1;
let showroomTargetZoom = 1;
let showroomCamY = 0;
let showroomTargetCamY = 0;
let showroomCeilPulse = 0;
let showroomLightning = 0;  // lightning flash timer
let showroomDoorAnim = 0;   // garage door animation
let showroomIdleParticles = [];
const SHOWROOM_ROT_SPEED = 0.5;
let showroomDragStartX = 0;
let showroomIsDragging = false;
let unlockCelebrationTimer = 0;
let unlockCelebrationType = '';
let showroomLastRarity = '';

function drawShowroomBackground() {
  const theme = getCurrentTheme();
  const w = W, h = H, cx = w / 2;

  // ── Dark showroom background ──
  const grad = ctx.createRadialGradient(cx, h * 0.35, 0, cx, h * 0.35, h * 0.9);
  grad.addColorStop(0, '#0d0d24');
  grad.addColorStop(0.4, '#08081a');
  grad.addColorStop(0.7, '#050510');
  grad.addColorStop(1, '#020208');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // ── Spotlight cones from top ──
  const spotAlpha = 0.04 + Math.sin(showroomCeilPulse * 2) * 0.01 + 0.01;
  
  // Left spotlight (blueish)
  ctx.save();
  const sg1 = ctx.createRadialGradient(cx - 75, -20, 10, cx - 75, h * 0.7, h * 1.1);
  sg1.addColorStop(0, `rgba(0, 180, 255, ${spotAlpha * 1.5})`);
  sg1.addColorStop(0.3, `rgba(0, 120, 255, ${spotAlpha * 0.6})`);
  sg1.addColorStop(1, 'rgba(0, 50, 200, 0)');
  ctx.fillStyle = sg1;
  ctx.beginPath();
  ctx.moveTo(cx - 130, -5);
  ctx.lineTo(cx - 20, -5);
  ctx.lineTo(cx + 60, h * 1.05);
  ctx.lineTo(cx - 200, h * 1.05);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Right spotlight (purple)
  ctx.save();
  const sg2 = ctx.createRadialGradient(cx + 75, -20, 10, cx + 75, h * 0.7, h * 1.1);
  sg2.addColorStop(0, `rgba(150, 0, 255, ${spotAlpha})`);
  sg2.addColorStop(0.3, `rgba(100, 0, 200, ${spotAlpha * 0.5})`);
  sg2.addColorStop(1, 'rgba(50, 0, 150, 0)');
  ctx.fillStyle = sg2;
  ctx.beginPath();
  ctx.moveTo(cx - 60, -5);
  ctx.lineTo(cx + 130, -5);
  ctx.lineTo(cx + 200, h * 1.05);
  ctx.lineTo(cx - 60, h * 1.05);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // ── Ceiling grid lines ──
  ctx.strokeStyle = 'rgba(0, 200, 255, 0.03)';
  ctx.lineWidth = 1;
  for (let i = -6; i <= 6; i++) {
    const lx = cx + i * 45 + Math.sin(showroomCeilPulse * 0.5 + i) * 2;
    ctx.beginPath();
    ctx.moveTo(lx, -2);
    ctx.lineTo(lx - i * 3, h * 0.2);
    ctx.stroke();
  }

  // ── Floor reflection plane ──
  const floorY = h * 0.82;
  const fg = ctx.createLinearGradient(0, floorY, 0, h);
  fg.addColorStop(0, 'rgba(20, 25, 50, 0.85)');
  fg.addColorStop(0.3, 'rgba(10, 15, 35, 0.9)');
  fg.addColorStop(1, 'rgba(2, 2, 10, 1)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, floorY, w, h - floorY);

  // ── Glossy floor reflection lines ──
  ctx.fillStyle = 'rgba(0, 200, 255, 0.02)';
  for (let i = 0; i < 20; i++) {
    const rx = cx - 170 + i * 18 + Math.sin(showroomCeilPulse + i * 0.7) * 5;
    ctx.fillRect(rx, floorY + 10, 1, h - floorY - 15);
  }
  // Horizontal reflection lines
  ctx.fillStyle = 'rgba(0, 200, 255, 0.015)';
  for (let y = floorY + 5; y < h; y += 14) {
    const ly = y + Math.sin(showroomCeilPulse + y * 0.05) * 2;
    ctx.fillRect(cx - 150, ly, 300, 1);
  }

  // ── Garage Doors (animated) ──
  const doorCount = 3;
  const doorW = 85;
  const doorH = floorY * 0.55;
  const doorStartX = cx - (doorCount * doorW + (doorCount - 1) * 8) / 2;
  const doorTopY = 18;

  // Door open/close animation based on showroomDoorAnim
  const doorOpenAmt = 0.25 + Math.sin(showroomDoorAnim * 0.3) * 0.08 + 0.08;

  for (let i = 0; i < doorCount; i++) {
    const dx = doorStartX + i * (doorW + 8);
    const openH = doorH * doorOpenAmt;
    const doorY = doorTopY + (doorH - openH);

    // Door panel background (dark)
    ctx.fillStyle = 'rgba(15, 15, 30, 0.9)';
    ctx.fillRect(dx, doorY, doorW, openH);

    // Door border (neon trim)
    ctx.strokeStyle = `rgba(0, 200, 255, ${0.08 + Math.sin(showroomCeilPulse + i * 2) * 0.03 + 0.03})`;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(dx, doorY, doorW, openH);

    // Door panel lines
    ctx.strokeStyle = 'rgba(0, 200, 255, 0.04)';
    ctx.lineWidth = 0.5;
    for (let p = doorY + 12; p < doorY + openH - 8; p += 14) {
      ctx.beginPath();
      ctx.moveTo(dx + 6, p);
      ctx.lineTo(dx + doorW - 6, p);
      ctx.stroke();
    }

    // Door handle
    ctx.fillStyle = 'rgba(150, 200, 255, 0.1)';
    ctx.fillRect(dx + doorW / 2 - 8, doorY + openH * 0.45, 16, 4);

    // Door top light strip
    ctx.fillStyle = `rgba(0, 200, 255, ${0.04 + Math.sin(showroomCeilPulse * 2 + i * 1.5) * 0.02 + 0.02})`;
    ctx.fillRect(dx, doorY, doorW, 2);
  }

  // ── Ambient floating particles ──
  for (let i = showroomIdleParticles.length - 1; i >= 0; i--) {
    const p = showroomIdleParticles[i];
    p.x += p.vx * 0.016;
    p.y += p.vy * 0.016;
    p.life -= 0.008;
    p.size *= 0.998;
    if (p.life <= 0 || p.size < 0.3) {
      showroomIdleParticles.splice(i, 1);
      continue;
    }
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life * 0.4;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Spawn ambient particles
  if (Math.random() < 0.15 && showroomIdleParticles.length < 25) {
    showroomIdleParticles.push({
      x: rand(20, W - 20),
      y: rand(20, h * 0.7),
      vx: rand(-3, 3),
      vy: rand(-6, -1),
      size: rand(1, 2.5),
      life: rand(0.8, 2),
      color: Math.random() < 0.5 ? 'rgba(0, 200, 255, 0.3)' : 'rgba(150, 100, 255, 0.2)'
    });
  }

  // ── Cinematic light flare (moving) ──
  const flareX = cx + Math.sin(showroomCeilPulse * 0.7) * 120;
  const flareY = 60 + Math.cos(showroomCeilPulse * 0.5) * 30;
  const flareG = ctx.createRadialGradient(flareX, flareY, 0, flareX, flareY, 40);
  flareG.addColorStop(0, 'rgba(200, 220, 255, 0.04)');
  flareG.addColorStop(0.5, 'rgba(100, 150, 255, 0.02)');
  flareG.addColorStop(1, 'transparent');
  ctx.fillStyle = flareG;
  ctx.beginPath();
  ctx.arc(flareX, flareY, 40, 0, Math.PI * 2);
  ctx.fill();

  // Lens flare streak
  ctx.save();
  ctx.translate(flareX, flareY);
  ctx.rotate(0.3);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.015)';
  ctx.fillRect(-60, -1, 120, 2);
  ctx.restore();
}

function drawGarageScreen() {
  const uiAlpha = Math.min(1, uiTransAlpha + 0.02);
  uiTransAlpha = uiAlpha;
  const cust = previewCustomizations || carCustomizations[selectedCar];
  const cx = W / 2;

  // ── Draw showroom environment ──
  drawShowroomBackground();

  // ── Car Preview with 3D-style rotation ──
  // Smooth rotation
  const rotDiff = showroomTargetRotX - showroomRotX;
  if (Math.abs(rotDiff) > 0.001) showroomRotX += rotDiff * 0.08;
  const rotAngle = showroomRotX;

  // Smooth zoom
  const zoomDiff = showroomTargetZoom - showroomZoom;
  if (Math.abs(zoomDiff) > 0.001) showroomZoom += zoomDiff * 0.06;

  // Car position with smooth cam
  const camDiff = showroomTargetCamY - showroomCamY;
  if (Math.abs(camDiff) > 0.1) showroomCamY += camDiff * 0.05;

  // Bob animation
  const pBob = Math.sin(gameTime * 1.5 + showroomRotX * 0.5) * 2;
  const carScale = 1.4 * showroomZoom;
  const previewY = 300 + pBob + showroomCamY;
  const floorY = H * 0.82;
  const reflectionScale = 0.7;

  // Determine color
  let carColor = CAR_COLORS[selectedCar];
  if (cust && cust.paint !== 'default') carColor = cust.paint;
  let carAccent = CAR_ACCENTS[selectedCar];

  // ── 3D-style rotation rendering ──
  // We simulate 3D rotation by:
  // 1. Horizontally compressing width based on cos(angle)
  // 2. Showing side details via sin(angle)
  // 3. Adding perspective shift
  
  const rotCompress = Math.abs(Math.cos(rotAngle)); // 1 at front, 0.2 at side
  const rotSide = Math.sin(rotAngle);               // 0 at front, ±1 at side
  const visualW = PLAYER_W * (0.4 + rotCompress * 0.6);
  const visualH = PLAYER_H;

  ctx.save();
  ctx.translate(cx, previewY);
  ctx.scale(carScale, carScale);
  ctx.translate(-cx, -previewY);

  // ── Stage Glow Platform ──
  const stageY = previewY + visualH * 0.5 + 5;
  // Outer glow ring
  const stageGlow = ctx.createRadialGradient(cx, stageY, 0, cx, stageY, 85);
  stageGlow.addColorStop(0, 'rgba(0, 200, 255, 0.06)');
  stageGlow.addColorStop(0.5, 'rgba(0, 150, 255, 0.03)');
  stageGlow.addColorStop(1, 'rgba(0, 50, 150, 0)');
  ctx.fillStyle = stageGlow;
  ctx.beginPath();
  ctx.ellipse(cx, stageY + 5, 100, 16, 0, 0, Math.PI * 2);
  ctx.fill();

  // Ring border
  ctx.strokeStyle = `rgba(0, 200, 255, ${0.15 + Math.sin(gameTime * 2) * 0.05})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(cx, stageY, 85, 12, 0, 0, Math.PI * 2);
  ctx.stroke();

  // ── Floor reflection ──
  const reflectY = previewY + visualH * 0.9;
  const reflectH = visualH * 0.4;
  ctx.save();
  ctx.globalAlpha = 0.08 + Math.abs(rotCompress) * 0.04;
  ctx.scale(1, -0.5);
  ctx.translate(0, -reflectY * 2);

  // Draw simplified reflection car
  const refW = visualW * 0.7;
  ctx.fillStyle = carColor;
  ctx.globalAlpha = 0.06;
  ctx.beginPath();
  ctx.ellipse(cx, reflectY, refW * 0.45, reflectH * 0.25, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;

  // ── Draw preview car with rotation compression ──
  ctx.save();

  // Apply 3D-style perspective transform
  ctx.translate(cx, previewY);
  // Scale width based on rotation angle for 3D effect
  ctx.scale(0.4 + rotCompress * 0.6, 1);
  ctx.translate(-cx, -previewY);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(cx + 3, previewY + visualH * 0.52 + 3, visualW * 0.5, visualH * 0.08, 0, 0, Math.PI * 2);
  ctx.fill();

  // Rarity glow ring under car
  let rarityGlowColor = 'rgba(0, 200, 255, 0.15)';
  const currentTab = currentGarageTab;
  const items = CUSTOMIZATION_ITEMS[currentTab];
  if (items && cust) {
    const currentItemId = cust[currentTab];
    if (currentItemId) {
      for (const item of items) {
        if (item.id === currentItemId || (currentTab === 'paint' && item.val === currentItemId)) {
          if (item.rarity === 'legendary') rarityGlowColor = 'rgba(255, 215, 0, 0.25)';
          else if (item.rarity === 'epic') rarityGlowColor = 'rgba(212, 0, 255, 0.2)';
          else if (item.rarity === 'rare') rarityGlowColor = 'rgba(0, 229, 255, 0.18)';
          break;
        }
      }
    }
  }
  // Legendary glow pulsing
  const glowPulse = 0.7 + Math.sin(gameTime * 2.5) * 0.3;
  ctx.shadowColor = rarityGlowColor.replace(/[\d.]+\)$/, glowPulse * 0.5 + ')');
  ctx.shadowBlur = 25 * glowPulse;

  // Underglow
  if (cust && cust.underglow !== 'none') {
    let ugColor = null;
    if (cust.underglow === 'blue') ugColor = `rgba(0, 200, 255, ${0.3 * glowPulse})`;
    else if (cust.underglow === 'red') ugColor = `rgba(255, 30, 30, ${0.3 * glowPulse})`;
    else if (cust.underglow === 'lime') ugColor = `rgba(57, 255, 20, ${0.3 * glowPulse})`;
    else if (cust.underglow === 'rgb') {
      const hue = (gameTime * 150) % 360;
      ugColor = `hsla(${hue}, 100%, 50%, ${0.3 * glowPulse})`;
    }
    if (ugColor) {
      ctx.shadowColor = ugColor.replace(/[\d.]+\)$/, '0.6)');
      ctx.shadowBlur = 30 * glowPulse;
      ctx.fillStyle = ugColor;
      ctx.beginPath();
      ctx.ellipse(cx, previewY + 8, visualW * 0.6, visualH * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.shadowBlur = 0;

  // Draw actual car (apply rot side info for detail)
  drawCar(cx, previewY, visualW, visualH, carColor, carAccent, true, false);
  ctx.restore(); // end rotation transform

  // ── Rim light highlight (on side based on rotation) ──
  if (rotSide !== 0) {
    const rimX = cx + Math.sign(rotSide) * visualW * 0.55 * (0.4 + rotCompress * 0.6);
    const rimG = ctx.createLinearGradient(rimX, previewY - 30, rimX + Math.sign(rotSide) * 30, previewY + 30);
    rimG.addColorStop(0, `rgba(200, 220, 255, ${Math.abs(rotSide) * 0.04})`);
    rimG.addColorStop(1, 'transparent');
    ctx.fillStyle = rimG;
    ctx.fillRect(Math.min(rimX, rimX + Math.sign(rotSide) * 30), previewY - 40, Math.abs(30), 80);
  }

  ctx.restore(); // end car scale

  // ── Exhaust particles with rotation influence ──
  if (Math.random() < 0.12) {
    const exX = cx + Math.sin(rotAngle) * 15;
    const exY = previewY + visualH * 0.45 * carScale;
    showroomIdleParticles.push({
      x: exX, y: exY,
      vx: rand(-5, 5) + rotSide * 3,
      vy: rand(15, 35),
      size: rand(2, 5),
      life: rand(0.5, 1),
      color: 'rgba(200, 200, 210, 0.08)'
    });
  }

  // ── Unlock celebration effect ──
  if (unlockCelebrationTimer > 0) {
    unlockCelebrationTimer -= 0.016;
    const intensity = Math.min(1, unlockCelebrationTimer / 1.5);
    
    // Burst particles
    for (let i = 0; i < 2; i++) {
      const a = rand(0, Math.PI * 2);
      const sp = rand(60, 200) * intensity;
      showroomIdleParticles.push({
        x: cx + rand(-20, 20),
        y: previewY,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 50,
        size: rand(2, 5),
        life: rand(0.3, 0.8) * intensity,
        color: unlockCelebrationType === 'legendary' ? '#ffd700' : 
               unlockCelebrationType === 'epic' ? '#d400ff' : '#00e5ff'
      });
    }

    // Flash overlay
    ctx.fillStyle = `rgba(255, 255, 255, ${intensity * 0.06})`;
    ctx.fillRect(0, 0, W, H);

    // Text via DOM
    const celEl = document.getElementById('unlockCelebration');
    const celText = document.getElementById('celebrationText');
    if (celEl && celText) {
      celEl.style.display = 'block';
      const rarityColor = unlockCelebrationType === 'legendary' ? '#ffd700' :
                          unlockCelebrationType === 'epic' ? '#d400ff' : '#00e5ff';
      celText.style.color = rarityColor;
      let label = 'MỞ KHOÁ!';
      if (unlockCelebrationType === 'legendary') label = '🔥 HUYỀN THOẠI!';
      else if (unlockCelebrationType === 'epic') label = '⚡ KỲ BÍ!';
      celText.textContent = label;
      setTimeout(() => { if (celEl) celEl.style.display = 'none'; }, 1200);
    }
  }

  // ── Update selected car name ──
  const nameEl = document.getElementById('selectedCarName');
  if (nameEl) {
    let nameStr = CAR_NAMES[selectedCar];
    if (currentGarageTab !== 'car' && cust) {
      const items = CUSTOMIZATION_ITEMS[currentGarageTab];
      if (items) {
        const currentId = cust[currentGarageTab];
        for (const item of items) {
          if (item.id === currentId || (currentGarageTab === 'paint' && item.val === currentId)) {
            nameStr = item.name;
            break;
          }
        }
      }
    }
    nameEl.textContent = '★ ' + nameStr;
  }

  // ── Showroom ambient pulse ──
  showroomCeilPulse += 0.016;
  showroomDoorAnim += 0.016;
  gameTime += 0.016;
}

function handleTap(mx,my){
  if(screen==='title'){
    if(mx>=W/2-110&&mx<=W/2+110&&my>=300&&my<=356){SFX.click();startGame()}
    else if(mx>=W/2-85&&mx<=W/2+85&&my>=374&&my<=418){SFX.click();transitionTo('garage')}
    else {
      // Check mode buttons
      for(const b of modeButtons){
        if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){
          if(selectedMode!==b.key){selectedMode=b.key;SFX.select()}
          return;
        }
      }
    }
  }else if(screen==='game'){
    if(!paused){
      if(mx>=12&&mx<=42&&my>=56&&my<=80){paused=true;document.getElementById('touchCtrls').classList.remove('active');stopEngineSound();stopBGM();SFX.click()}
    }else{
      if(mx>=W/2-120&&mx<=W/2+120&&my>=270&&my<=328){paused=false;document.getElementById('touchCtrls').classList.add('active');startEngineSound();resumeBGM();SFX.click()}
      else if(mx>=W/2-120&&mx<=W/2+120&&my>=352&&my<=404){transitionTo('title');paused=false;SFX.click();document.getElementById('touchCtrls').classList.remove('active')}
    }
  }else if(screen==='over'){
    if(mx>=W/2-125&&mx<=W/2+125&&my>=370&&my<=424){SFX.click();startGame()}
    else if(mx>=W/2-85&&mx<=W/2+85&&my>=442&&my<=484){SFX.click();transitionTo('title')}
  }else if(screen==='garage'){
    // Garage uses DOM event listeners + canvas drag-to-rotate
    // No tap actions needed on canvas — drag only
  }
}

function startGame(){
  const mode=GAME_MODES[selectedMode]||GAME_MODES.endless;
  score=0; lives=mode.lives||3; speed=mode.initialSpeed||BASE_SPEED;
  level=getLevelFromXp(xp); // Level từ XP tích lũy
  applyLevelPerks(level);   // Áp dụng perks cho level hiện tại
  nitro=NITRO_MAX; nitroActive=false; nitroTimer=0;
  combo=0; comboTimer=0; comboSpeed=0; nearMissStreak=0;
  playerLane=1; playerTargetLane=1; playerSway=0;
  trafficCars=[]; coins=[]; obstacles=[]; particles=[]; floatingTexts=[]; speedLines=[];
  roadOffset=0; gameTime=0; invincibleTimer=0; hitFlash=0;
  shakeIntensity=0; shakeX=0; shakeY=0;
  spawnTimer=1.5; coinSpawnTimer=0.8;
  obstacleTimer=mode.key==='obstacleRush'?0.5:3;
  oilSlide=0; oilDuration=0; oilAngle=0; oilTargetLane=-1;
  adaptDifficulty=0; difficultyTimer=0;
  gameStartTime=0; gameModeTimer=0;
  // Reset living traffic ecosystem
  pedestrians=[]; billboards=[]; sceneryItems=[];
  railwayGates=[]; trains=[]; helicopters=[];
  trafficLights=[]; policeChase=null; wantedLevel=0; wantedTimer=0;
  accidentSites=[]; wildlifeAnimals=[];
  weatherIntensity=0; windDirection=0;
  railwayCooldown=15; railwayBlocked=false; lastSceneryY=0; lastPedestrianY=0; lastBillboardY=0;
  // Theme: force theme if mode specifies, else random
  if(mode.forceTheme){
    currentThemeIdx=THEME_KEYS.indexOf(mode.forceTheme);
    if(currentThemeIdx<0) currentThemeIdx=0;
    nextThemeIdx=currentThemeIdx; // Giữ nguyên theme, không chuyển
    themeTransition=0;
    themeTimer=9999; // Không bao giờ hết hạn
  }else{
    currentThemeIdx=randi(0,THEME_KEYS.length-1);
    nextThemeIdx=(currentThemeIdx+1)%THEME_KEYS.length;
    themeTimer=0; themeTransition=1;
  }
  paused=false; screen='game';
  initRain(); initDust();
  initAudio();
  if(!bgmBuffer) try{generateBGM().then(()=>startBGM())}catch(e){}else startBGM();
  startEngineSound();
  document.getElementById('touchCtrls').classList.add('active');
}

// ── GAME LOOP ──────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════

let lastTime=0;

function gameLoop(time){
  const dt=Math.min((time-lastTime)/1000,0.05);
  lastTime=time;

  const leftIn=touchLeft||keys['ArrowLeft']||keys['KeyA'];
  const rightIn=touchRight||keys['ArrowRight']||keys['KeyD'];
  const nitroIn=touchNitro||keys['Space']||keys['ArrowUp']||keys['KeyW'];

  // Start audio on first interaction
  if(!audioStarted&&(leftIn||rightIn||nitroIn||screen!=='title')){
    initAudio();
    audioStarted=true;
  }

  if(screen==='game'&&!paused){
    if(leftIn&&!leftPressed){
      if(playerTargetLane>0){playerTargetLane--;playerSway=-5;triggerShake(0.5,1,0,1.5);SFX.skid()}
    }
    if(rightIn&&!rightPressed){
      if(playerTargetLane<LANE_COUNT-1){playerTargetLane++;playerSway=5;triggerShake(0.5,1,0,1.5);SFX.skid()}
    }
    leftPressed=leftIn;
    rightPressed=rightIn;

    if(nitroIn&&nitro>0&&!nitroActive){
      nitroActive=true; nitroTimer=0; triggerShake(4); SFX.nitro();
    }
    if(!nitroIn&&nitroActive) nitroActive=false;

    updateGame(dt);
  }

  ctx.clearRect(0,0,W,H);
  if(screen==='title') drawTitleScreen();
  else if(screen==='game'){renderGame();if(paused)drawPauseScreen()}
  else if(screen==='over') drawGameOverScreen();
  else if(screen==='garage') drawGarageScreen();

  requestAnimationFrame(gameLoop);
}

window.selectCarInGarage = function(idx) {
  if (unlockedCars.has(idx)) {
    selectedCar = idx;
    previewCustomizations = { ...carCustomizations[selectedCar] };
    saveData();
    SFX.select();
    renderGarageTab('car');
  }
};

window.buyCarInGarage = function(idx) {
  const price = CAR_COSTS[idx];
  if (!unlockedCars.has(idx) && totalCoins >= price) {
    totalCoins -= price;
    unlockedCars.add(idx);
    selectedCar = idx;
    previewCustomizations = { ...carCustomizations[selectedCar] };
    saveData();
    SFX.coin();
    document.getElementById('garageCoinsText').innerText = totalCoins;
    renderGarageTab('car');
    // Celebration
    const rarity = idx === 4 ? 'legendary' : idx >= 3 ? 'epic' : 'rare';
    triggerUnlockCelebration(rarity);
  }
};

window.equipCosmetic = function(type, val) {
  if (!previewCustomizations) {
    previewCustomizations = { ...carCustomizations[selectedCar] };
  }
  previewCustomizations[type] = val;
  carCustomizations[selectedCar][type] = val;
  saveData();
  SFX.select();
  renderGarageTab(type);
};

window.buyCosmetic = function(type, itemId, price, optionalVal) {
  if (totalCoins >= price) {
    totalCoins -= price;
    
    if (type === 'paint') unlockedPaints.add(itemId);
    else if (type === 'decal') unlockedDecals.add(itemId);
    else if (type === 'wheel') unlockedWheels.add(itemId);
    else if (type === 'spoiler') unlockedSpoilers.add(itemId);
    else if (type === 'underglow') unlockedUnderglows.add(itemId);
    else if (type === 'nitro') unlockedNitros.add(itemId);
    
    const targetVal = optionalVal !== undefined ? optionalVal : itemId;
    previewCustomizations[type] = targetVal;
    carCustomizations[selectedCar][type] = targetVal;
    
    saveData();
    SFX.coin();
    document.getElementById('garageCoinsText').innerText = totalCoins;
    renderGarageTab(type);
    // Trigger celebration based on rarity
    const itemData = CUSTOMIZATION_ITEMS[type === 'paint' ? 'paint' : type === 'decal' ? 'decal' : type === 'wheel' ? 'wheel' : type === 'spoiler' ? 'spoiler' : type === 'underglow' ? 'underglow' : type === 'nitro' ? 'nitro' : null];
    if (itemData) {
      const found = itemData.find(i => i.id === itemId);
      if (found) triggerUnlockCelebration(found.rarity || 'common');
    }
  } else {
    SFX.click();
  }
};

  SFX.coin();
  spawnFloatingText(W/2, 180, 'ĐÃ LƯU CẤU HÌNH!', '#00ffaa', 18);

function setupGarageEventListeners() {
  document.getElementById('garageBackBtn').addEventListener('click', () => {
    SFX.click();
    hideGarageUI();
    transitionTo('title');
  });
  
  // Tab switching with showroom animation
  const tabButtons = document.querySelectorAll('.showroom-tab');
  tabButtons.forEach(btn => {
    btn.addEventListener('click', (e) => {
      const tab = e.currentTarget.getAttribute('data-tab');
      SFX.click();
      renderGarageTab(tab);
    });
  });
  
  // ── Drag-to-rotate showroom car ──
  let isDragging = false;
  let dragStartX = 0;
  let dragStartRot = 0;
  
  canvas.addEventListener('mousedown', (e) => {
    if (screen !== 'garage') return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    // Only start drag if touching upper area (car preview zone)
    if (my < H * 0.55) {
      isDragging = true;
      dragStartX = mx;
      dragStartRot = showroomTargetRotX;
      e.preventDefault();
    }
  });
  
  canvas.addEventListener('mousemove', (e) => {
    if (!isDragging || screen !== 'garage') return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const dx = (mx - dragStartX) / W;
    showroomTargetRotX = Math.max(-Math.PI * 0.45, Math.min(Math.PI * 0.45, dragStartRot - dx * Math.PI));
  });
  
  canvas.addEventListener('mouseup', () => { isDragging = false; });
  canvas.addEventListener('mouseleave', () => { isDragging = false; });
  
  // Touch events for mobile
  canvas.addEventListener('touchstart', (e) => {
    if (screen !== 'garage') return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const mx = (touch.clientX - rect.left) * (canvas.width / rect.width);
    const my = (touch.clientY - rect.top) * (canvas.height / rect.height);
    if (my < H * 0.55) {
      isDragging = true;
      dragStartX = mx;
      dragStartRot = showroomTargetRotX;
      e.preventDefault();
    }
  }, { passive: false });
  
  canvas.addEventListener('touchmove', (e) => {
    if (!isDragging || screen !== 'garage') return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const mx = (touch.clientX - rect.left) * (canvas.width / rect.width);
    const dx = (mx - dragStartX) / W;
    showroomTargetRotX = Math.max(-Math.PI * 0.45, Math.min(Math.PI * 0.45, dragStartRot - dx * Math.PI));
    e.preventDefault();
  }, { passive: false });
  
  canvas.addEventListener('touchend', () => { isDragging = false; });
}
