<head>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0a0a2e">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;overflow:hidden;background:#000;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  -webkit-overflow-scrolling:none;overscroll-behavior:none;
}
#gameWrap{
  position:relative;width:100dvw;height:100dvh;display:flex;align-items:center;justify-content:center;
  background:#0a0a12;overflow:hidden;
}
canvas#c{display:block;image-rendering:auto;flex-shrink:0;margin:auto}
#touchCtrls{
  position:fixed;bottom:0;left:0;right:0;height:50vh;pointer-events:none;z-index:10;
  display:flex;justify-content:space-between;align-items:flex-end;padding:0 8px 24px;
}
#touchCtrls.active{pointer-events:auto}
.tz{
  pointer-events:auto;width:30vw;height:30vw;max-width:140px;max-height:140px;
  border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.12);
  display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:rgba(255,255,255,0.5);
  transition:all 0.1s;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.tz:active,.tz.pressed{transform:scale(0.88);background:rgba(255,255,255,0.18);border-color:rgba(255,255,255,0.35)}
.tz-nitro{
  width:28vw;height:28vw;max-width:120px;max-height:120px;
  background:linear-gradient(135deg,rgba(0,200,255,0.12),rgba(100,0,255,0.12));
  border-color:rgba(0,200,255,0.2);font-size:1.8rem;margin-bottom:12px;
}
.tz-nitro:active,.tz-nitro.pressed{
  background:linear-gradient(135deg,rgba(0,200,255,0.25),rgba(100,0,255,0.25));
  border-color:rgba(0,200,255,0.5);
}
.tz-left{margin-right:auto}.tz-right{margin-left:auto}
#tzWrap{display:flex;flex-direction:column;align-items:center;gap:4px;margin-left:auto}
@media(min-width:768px){
  #touchCtrls{display:none}
}
</style>
</head>

// ══════════════════════════════════════════════════════════════

// ── Canvas Setup ──────────────────────────────────────────
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=480, H=800;
canvas.width=W; canvas.height=H;

function fitCanvas(){
  const wrap=document.getElementById('gameWrap');
  const wrapW=wrap.clientWidth;
  const wrapH=wrap.clientHeight;
  if(wrapW===0||wrapH===0) return;
  const scale=Math.min(wrapW/W, wrapH/H);
  canvas.style.width=Math.round(W*scale)+'px';
  canvas.style.height=Math.round(H*scale)+'px';
}
// ResizeObserver theo dõi kích thước wrap chính xác hơn resize event
const ro=new ResizeObserver(()=>fitCanvas());
ro.observe(document.getElementById('gameWrap'));
window.addEventListener('resize',fitCanvas);
// Gọi nhiều lần để đảm bảo canvas center đúng
setTimeout(fitCanvas,50);
setTimeout(fitCanvas,200);
fitCanvas();

// ── Constants ──────────────────────────────────────────────

const THEME_CHANGE_INTERVAL=35; // seconds between theme transitions
const THEME_TRANSITION_DURATION=4; // seconds for smooth transition

// ── Utility ────────────────────────────────────────────────
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v))}
function rand(mn,mx){return Math.random()*(mx-mn)+mn}
function randi(mn,mx){return Math.floor(rand(mn,mx+1))}
function hslStr(h,s,l,a=1){
  return a<1?`hsla(${h},${s}%,${l}%,${a.toFixed(2)})`:`hsl(${h},${s}%,${l}%)`;
}
function rgbStr(r,g,b,a=1){return a<1?`rgba(${r|0},${g|0},${b|0},${a.toFixed(2)})`:`rgb(${r|0},${g|0},${b|0})`}
function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return{r,g,b}}
function lerpColor(c1,c2,t){
  return rgbStr(
    lerp(c1.r,c2.r,t),lerp(c1.g,c2.g,t),lerp(c1.b,c2.b,t)
  );
}

// ── Persistence ───────────────────────────────────────────
function saveData(){
  try{localStorage.setItem('turborush2',JSON.stringify({
    hs:highScore, coins:totalCoins, unlocks:[...unlockedCars], sel:selectedCar
  }))}catch(e){}
}
function loadData(){
  try{
    const d=JSON.parse(localStorage.getItem('turborush2'));
    if(d){
      highScore=d.hs||0; totalCoins=d.coins||0;
      unlockedCars=new Set(d.unlocks||[0]);
      unlockedCars.add(0);
      selectedCar=d.sel||0;
    }
  }catch(e){}
}

const TRAFFIC_TYPES={

};

const CAR_COLORS=['#2a7fff','#ff3344','#222244','#ffcc00','#00e5ff'];
const CAR_ACCENTS=['#0055cc','#cc1122','#8844ff','#ffaa00','#ff00ff'];

// ── Classes ────────────────────────────────────────────────
class TrafficCar{
  constructor(lane,y,speed,typeKey,themeIdx){
    const type=TRAFFIC_TYPES[typeKey]||TRAFFIC_TYPES.normal;
    this.lane=lane; this.y=y; this.speed=speed;
    this.typeKey=typeKey;
    this.color=type.color; this.accent=type.accent;
    this.w=type.w; this.h=type.h;
    this.passed=false; this.active=true;
    this.x=ROAD_L+this.lane*LANE_W+LANE_W/2;
    this.switchTimer=rand(0,type.maxSwitchTimer);
    this.switchLane=null;
    this.targetLane=lane;
    this.sparkTimer=0;
    this.speedMult=type.speedMult;
    this.aggressive=type.aggressive;
    this.cautious=type.cautious;
    this.switchChance=type.switchChance;
    this.maxSwitchTimer=type.maxSwitchTimer;
    this.honkTimer=0;
    this.brakeLight=false;
    this.bobOff=rand(0,Math.PI*2);
  }
  get rect(){
    return{x:this.x-this.w/2,y:this.y-this.h/2,w:this.w,h:this.h};
  }
  get laneX(){
    return ROAD_L+this.lane*LANE_W+LANE_W/2;
  }
}

class CoinObj{
  constructor(lane,y){
    this.lane=lane; this.y=y; this.collected=false;
    this.x=ROAD_L+this.lane*LANE_W+LANE_W/2;
    this.r=COIN_R; this.bob=rand(0,Math.PI*2);
  }
}

// Obstacle base - for construction zones, oil spills, moving barriers
class Obstacle{
  constructor(type,lane,y,width,height){
    this.type=type; // 'construction' | 'oil' | 'barrier'
    this.lane=lane;
    this.baseLane=lane;
    this.y=y; this.w=width; this.h=height;
    this.x=ROAD_L+this.lane*LANE_W+LANE_W/2;
    this.active=true;
    this.animTimer=0;
    this.hit=false;
    // For moving barriers
    this.moveDir=1;
    this.moveSpeed=0;
    this.moveRange=0;
    if(type==='barrier'){
      this.moveDir=Math.random()<0.5?1:-1;
      this.moveSpeed=rand(0.8,1.8);
      this.moveRange=randi(1,2);
    }
    // For construction zones
    this.coneBob=rand(0,Math.PI*2);
  }
  get rect(){
    return{x:this.x-this.w/2,y:this.y-this.h/2,w:this.w,h:this.h};
  }
  update(dt,spd){
    this.animTimer+=dt;
    if(this.type==='barrier'){
      // Move back and forth across lanes
      const rangePx=this.moveRange*LANE_W;
      const dx=Math.sin(this.animTimer*this.moveSpeed)*rangePx*0.8;
      this.lane=this.baseLane+(dx/LANE_W);
      this.x=ROAD_L+this.lane*LANE_W+LANE_W/2;
    }
    this.y+=spd*0.85;
    if(this.y>H+120) this.active=false;
  }
}

class Particle{
  constructor(x,y,vx,vy,life,color,size){
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.life=life; this.maxLife=life; this.color=color;
    this.size=size||4; this.active=true;
  }
}
class FloatingText{
  constructor(x,y,text,color,size){
    this.x=x; this.y=y; this.text=text;
    this.color=color; this.size=size||24;
    this.life=1; this.vy=-80;
  }
}

// ── Spawn Helpers ─────────────────────────────────────────
let spawnTimer=2, coinSpawnTimer=1.5, endScore=0;

function getCurrentTheme(){
  const ct=THEMES[THEME_KEYS[currentThemeIdx]];
  const nt=THEMES[THEME_KEYS[nextThemeIdx]];
  const t=themeTransition;
  // Smooth blend between current and next theme
  // For boolean/categorical props, snap at midpoint
  const isRain=nt===THEMES.rain;
  return {
    name: t>0.5?nt.name:ct.name,
    skyTop:lerpColor(ct.skyTop,nt.skyTop,t),
    skyMid:lerpColor(ct.skyMid,nt.skyMid,t),
    skyBot:lerpColor(ct.skyBot,nt.skyBot,t),
    roadTop:lerpColor(ct.roadTop,nt.roadTop,t),
    roadBot:lerpColor(ct.roadBot,nt.roadBot,t),
    roadEdge0:lerpColor(ct.roadEdge[0],nt.roadEdge[0],t),
    roadEdge1:lerpColor(ct.roadEdge[1],nt.roadEdge[1],t),
    grass:lerpColor(ct.grass,nt.grass,t),
    grassAlt:lerpColor(ct.grassAlt,nt.grassAlt,t),
    laneMark:isRain?'rgba(180,200,255,0.3)':'rgba(255,255,255,0.45)',
    fogColor:t>0.5?nt.fogColor:ct.fogColor,
    ambientLight:lerp(ct.ambientLight,nt.ambientLight,t),
    hasBuildings:t>0.5?nt.hasBuildings:ct.hasBuildings,
    hasStars:t>0.5?nt.hasStars:ct.hasStars,
    starCount:Math.round(lerp(ct.starCount,nt.starCount,t)),
    hasRain:t>0.5?nt.hasRain:ct.hasRain,
    rainCount:Math.round(lerp(ct.rainCount,nt.rainCount,t)),
    themeHue:lerp(ct.themeHue,nt.themeHue,t),
    hazardWeights:t>0.5?nt.hazardWeights:ct.hazardWeights,
    trafficDensity:lerp(ct.trafficDensity,nt.trafficDensity,t),
    dustColor:t>0.5?nt.dustColor:ct.dustColor,
    dustCount:Math.round(lerp(ct.dustCount,nt.dustCount,t)),
  };
}

function getHazardWeight(type){
  const theme=getCurrentTheme();
  return theme.hazardWeights[type]||0.3;
}

function pickTrafficType(){
  // Weight based on difficulty and theme
  const weights={
    normal:0.35, aggressive:0.15+adaptDifficulty*0.1,
    cautious:0.2, weaver:0.1+adaptDifficulty*0.05,
    truck:0.1, sports:0.1+adaptDifficulty*0.08
  };
  let total=0;
  for(const k of Object.keys(weights)) total+=weights[k];
  let r=Math.random()*total;
  for(const k of Object.keys(weights)){
    r-=weights[k];
    if(r<=0) return k;
  }
  return 'normal';
}

function spawnTraffic(){
  const theme=getCurrentTheme();
  const maxCars=Math.round(4+adaptDifficulty*4+theme.trafficDensity*2);
  if(trafficCars.length>=maxCars) return;
  const lane=randi(0,LANE_COUNT-1);
  // Check for other cars in same lane nearby
  for(const c of trafficCars) if(Math.abs(c.lane-lane)<0.8&&c.y<300&&c.y>-120) return;
  const typeKey=pickTrafficType();
  const spdMult=TRAFFIC_TYPES[typeKey].speedMult;
  const carSpeed=speed*spdMult*(0.9+adaptDifficulty*0.1);
  const car=new TrafficCar(lane,-rand(80,200),carSpeed,typeKey,currentThemeIdx);
  // Maybe pre-assign lane change for variety
  if(Math.random()<0.12+adaptDifficulty*0.08&&lane>0&&lane<LANE_COUNT-1){
    car.targetLane=Math.random()<0.5?lane-1:lane+1;
  }
  trafficCars.push(car);
}

  for(const o of obstacles) if(Math.abs(o.lane-lane)<0.8&&o.y<300) return;
  coins.push(new CoinObj(lane,-rand(60,200)));
}

function spawnObstacle(){
  const mode=GAME_MODES[selectedMode]||GAME_MODES.endless;
  const maxObs=mode.key==='obstacleRush' ? 5+Math.floor(adaptDifficulty*2) : 3+Math.floor(adaptDifficulty*2);
  if(obstacles.length>=maxObs) return;
  // Pick hazard type based on theme weights
  const theme=getCurrentTheme();
  const hazTotal=theme.hazardWeights.oil+theme.hazardWeights.construction+theme.hazardWeights.barrier;
  let r=Math.random()*hazTotal;
  let type='oil';
  if((r-=theme.hazardWeights.oil)<=0) type='oil';
  else if((r-=theme.hazardWeights.construction)<=0) type='construction';
  else type='barrier';

  // Pick lanes that aren't too crowded
  const lane=randi(0,LANE_COUNT-1);
  for(const o of obstacles) if(Math.abs(o.lane-lane)<0.8&&o.y<300) return;
  for(const c of trafficCars) if(Math.abs(c.lane-lane)<0.6&&c.y<200) return;

  let w,h;
  if(type==='construction'){w=LANE_W*0.7;h=30;}
  else if(type==='oil'){w=LANE_W*0.8;h=18;}
  else {w=LANE_W*0.6;h=50;}

  const obs=new Obstacle(type,lane,-rand(80,150),w,h);
  obstacles.push(obs);
}

// ── Round Rect Helper ─────────────────────────────────────
function roundRect(ctx,x,y,w,h,r){
  if(r===0){ctx.rect(x,y,w,h);return}
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

let audioCtx=null;
function initAudio(){if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playBeep(freq,dur,type,vol){
  try{
    initAudio();
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type=type||'sine';
    osc.frequency.setValueAtTime(freq,audioCtx.currentTime);
    if(typeof freq==='object'&&freq.end)
      osc.frequency.exponentialRampToValueAtTime(freq.end,audioCtx.currentTime+dur);
    gain.gain.setValueAtTime(vol||0.08,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

// ── AI Lane-Changing Logic ──────────────────────────────────
// ══════════════════════════════════════════════════════════════

function updateTrafficAI(c,dt,currentSpeed){
  c.switchTimer-=dt;
  if(c.switchTimer>0) return;

  // Check if obstacle ahead
  let obstacleAhead=false, obstacleDist=999;
  for(const o of obstacles){
    if(!o.active) continue;
    if(Math.abs(o.lane-c.lane)<0.8 && o.y>c.y && o.y-c.y<250 && o.y-c.y>0){
      obstacleAhead=true; obstacleDist=o.y-c.y;
    }
  }

  // Check for slow car ahead
  let carAhead=false, carAheadDist=999;
  for(const tc of trafficCars){
    if(tc===c) continue;
    if(Math.abs(tc.lane-c.lane)<0.6 && tc.y>c.y && tc.y-c.y<200 && tc.y-c.y>0){
      carAhead=true; carAheadDist=tc.y-c.y;
    }
  }

  // Player info
  const playerLaneDiff=playerLane-c.lane;
  const playerDist=Math.abs(c.y-playerY);
  const playerNear=playerDist<200;

  // Adjacent lanes
  const leftClear=laneClear(c.lane-1,c.y,currentSpeed);
  const rightClear=laneClear(c.lane+1,c.y,currentSpeed);

  let shouldSwitch=false, targetDir=0;

  // ─── ƯU TIÊN 1: Né player ───
  // Nếu player đang cùng làn hoặc sắp đâm từ phía sau → né ra xa player
  if(playerNear){
    const sameLane=Math.abs(playerLaneDiff)<1.0;
    const willHit=playerDist<100 && sameLane;
    const closeLane=Math.abs(playerLaneDiff)<1.8 && playerDist<80;
    if(sameLane || willHit || closeLane){
      // Xác định hướng né: luôn ra xa player
      let avoidDir=0;
      if(playerLaneDiff>0.3) avoidDir=-1;           // player bên phải → né trái
      else if(playerLaneDiff<-0.3) avoidDir=1;      // player bên trái → né phải
      else if(c.lane>0) avoidDir=-1;                // cùng làn, ưu tiên trái
      else if(c.lane<LANE_COUNT-1) avoidDir=1;      // cùng làn, phải nếu trái hết
      // Chỉ né nếu làn đó an toàn, KHÔNG bao giờ né vào hướng player
      const targetLane=c.lane+avoidDir;
      if(avoidDir!==0 && targetLane>=0 && targetLane<LANE_COUNT && laneClear(targetLane,c.y,currentSpeed)){
        shouldSwitch=true; targetDir=avoidDir;
      }
    }
  }

  // ─── ƯU TIÊN 2: Tránh chướng ngại vật ───
  if(!shouldSwitch && obstacleAhead && obstacleDist<180){
    if(leftClear && c.lane>0){shouldSwitch=true;targetDir=-1}
    else if(rightClear && c.lane<LANE_COUNT-1){shouldSwitch=true;targetDir=1}
  }

  // ─── ƯU TIÊN 3: Tránh xe chậm phía trước ───
  if(!shouldSwitch && carAhead && carAheadDist<120){
    if(leftClear && c.lane>0){shouldSwitch=true;targetDir=-1}
    else if(rightClear && c.lane<LANE_COUNT-1){shouldSwitch=true;targetDir=1}
  }

  // ─── Random lane change (CHỈ khi player ở xa) ───
  if(!shouldSwitch && !playerNear && Math.random()<c.switchChance){
    const dir=Math.random()<0.5?1:-1;
    const nl=c.lane+dir;
    if(nl>=0&&nl<LANE_COUNT&&laneClear(nl,c.y,currentSpeed)){
      shouldSwitch=true; targetDir=dir;
    }
  }

  // Cautious override (nhưng không ghi đè né player)
  if(c.cautious>0.5 && Math.random()>0.1 && !playerNear) shouldSwitch=false;

  if(shouldSwitch && targetDir!==0){
    c.lane+=targetDir;
    c.lane=clamp(c.lane,0,LANE_COUNT-1);
    c.switchTimer=rand(0.8,c.maxSwitchTimer);
    c.brakeLight=true;
    setTimeout(()=>{c.brakeLight=false;},300);
  }else{
    c.switchTimer=rand(0.5,1.2);
  }
}

function laneClear(lane,y,currentSpeed){
  if(lane<0||lane>=LANE_COUNT) return false;
  // Check for cars in target lane
  for(const c of trafficCars){
    if(Math.abs(c.lane-lane)<0.6 && Math.abs(c.y-y)<120) return false;
  }
  // Check for obstacles
  for(const o of obstacles){
    if(!o.active) continue;
    if(Math.abs(o.lane-lane)<0.8 && Math.abs(o.y-y)<150) return false;
  }
  return true;
}

// ── Background / Road (Theme-aware) ──────────────────────
function drawBackground(){
  const theme=getCurrentTheme();
  const skyHue=theme.themeHue;

  // Sky gradient
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,theme.skyTop);
  grad.addColorStop(0.3,theme.skyMid);
  grad.addColorStop(0.6,theme.skyBot);
  grad.addColorStop(1,theme.skyBot);
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  // City silhouettes
  if(theme.hasBuildings){
    ctx.fillStyle='rgba(0,0,0,0.25)';
    for(let i=0;i<16;i++){
      const bw=18+((i*7)%15), bh=60+((i*13)%60);
      const bx=(i*29)%W;
      ctx.fillRect(bx,50+bh-bw,bw,bh);
      // Windows
      ctx.fillStyle='rgba(255,200,50,0.1)';
      for(let wy=0;wy<bh-14;wy+=12)
        for(let wx=3;wx<bw-6;wx+=10)
          if(((i+wx+wy)*7)%10>2) ctx.fillRect(bx+wx,50+bh-bw+6+wy,5,6);
      ctx.fillStyle='rgba(0,0,0,0.25)';
    }
  }

  // Desert landscape
  if(theme.themeHue>30&&theme.themeHue<50){
    ctx.fillStyle='rgba(180,130,60,0.15)';
    for(let i=0;i<12;i++){
      const cx=(i*43+17)%W, cy=100+((i*13)%60);
      ctx.beginPath();
      ctx.arc(cx,cy+20,18+((i*7)%15),Math.PI,0);
      ctx.fill();
    }
    // Cacti
    ctx.fillStyle='rgba(40,60,20,0.2)';
    for(let i=0;i<5;i++){
      const cx=(i*97+33)%W, cy=90+((i*17)%40);
      ctx.fillRect(cx-2,cy-25,4,30);
      const armDir=i%2?1:-1;
      ctx.fillRect(cx+armDir*8,cy-18,10,3);
      ctx.fillRect(cx+armDir*8,cy-25,3,12);
    }
  }

  // Stars
  if(theme.hasStars){
    for(let i=0;i<theme.starCount;i++){
      ctx.globalAlpha=(0.2+Math.sin(gameTime*2+i*1.7)*0.2)*(theme.themeHue>200?1:0.5);
      ctx.fillStyle='#fff';
      const sz=0.5+(i%3)*0.5;
      ctx.fillRect((i*137+50)%W,(i*97+15)%180,sz,sz);
    }
    ctx.globalAlpha=1;
  }

  // Grass verges (alternating for highway feel)
  if(theme.themeHue>200&&theme.themeHue<230){
    // Highway: striped grass
    for(let y=-(roadOffset%40);y<H;y+=80){
      ctx.fillStyle=y%160<80?'#2a5a2a':'#3a6a3a';
      ctx.fillRect(0,y,ROAD_L-8,40);
      ctx.fillRect(ROAD_R+8,y,W-ROAD_R-8,40);
    }
  }else{
    ctx.fillStyle=theme.grass;
    ctx.fillRect(0,0,ROAD_L-8,H);
    ctx.fillRect(ROAD_R+8,0,W-ROAD_R-8,H);
  }

  // Road surface (gradient top to bottom)
  const rGrad=ctx.createLinearGradient(0,0,0,H);
  rGrad.addColorStop(0,theme.roadTop);
  rGrad.addColorStop(0.5,theme.roadBot);
  rGrad.addColorStop(1,theme.roadTop);
  ctx.fillStyle=rGrad; ctx.fillRect(ROAD_L,0,ROAD_W,H);

  // Edge markers (red/white posts per theme)
  const edgeColor0=theme.roadEdge0;
  const edgeColor1=theme.roadEdge1;
  for(let y=-(roadOffset%60);y<H;y+=60){
    if(y>0){
      ctx.fillStyle=y%120<60?edgeColor0:edgeColor1;
      ctx.fillRect(ROAD_L-8,y,4,28);
      ctx.fillRect(ROAD_R+4,y,4,28);
    }
  }

  // Lane markings
  ctx.fillStyle=theme.laneMark;
  for(let l=1;l<LANE_COUNT;l++){
    const lx=ROAD_L+l*LANE_W-1;
    // Rain theme: continuous faint lines instead of dashes
    if(theme.themeHue>230&&theme.themeHue<250){
      ctx.globalAlpha=0.15;
      ctx.fillRect(lx,0,2,H);
      ctx.globalAlpha=1;
    }else{
      for(let y=-(roadOffset%80);y<H;y+=80)
        if(y%160<80&&y>0) ctx.fillRect(lx,y,2,36);
    }
  }

  // Road center reflective marker
  if(!(theme.themeHue>230&&theme.themeHue<250)){
    ctx.fillStyle='rgba(255,255,100,0.05)';
    const cx=(ROAD_L+ROAD_R)/2-1;
    for(let y=-(roadOffset%120);y<H;y+=120)
      if(y%240<120&&y>0) ctx.fillRect(cx,y,2,55);
  }
}

// ── Rain Render ───────────────────────────────────────────
function drawRain(){
  const theme=getCurrentTheme();
  if(!theme.hasRain||rainDrops.length===0) return;
  ctx.strokeStyle='rgba(180,200,255,0.15)';
  ctx.lineWidth=1;
  for(const drop of rainDrops){
    const windOffset=Math.sin(drop.y*0.01+gameTime*2)*drop.wind;
    ctx.globalAlpha=drop.alpha;
    ctx.beginPath();
    ctx.moveTo(drop.x+windOffset,drop.y);
    ctx.lineTo(drop.x+windOffset+drop.wind*0.1,drop.y+drop.len);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawDust(){
  const theme=getCurrentTheme();
  if(!theme.dustColor||dustParticles.length===0) return;
  for(const d of dustParticles){
    ctx.globalAlpha=d.alpha*(0.5+Math.sin(gameTime*0.5+d.x)*0.5);
    ctx.fillStyle=`rgb(${theme.dustColor.r},${theme.dustColor.g},${theme.dustColor.b})`;
    ctx.fillRect(d.x,d.y,d.size,d.size*0.5);
  }
  ctx.globalAlpha=1;
}

// ── Obstacle Render ───────────────────────────────────────
function drawObstacles(){
  for(const o of obstacles){
    if(!o.active) continue;
    ctx.save();
    const cx=o.x, cy=o.y;

    if(o.type==='construction'){
      // Construction zone — đơn giản, rõ ràng
      ctx.shadowColor='#ff6600'; ctx.shadowBlur=10;
      ctx.fillStyle='#cc5500';
      roundRect(ctx,cx-o.w/2,cy,o.w,o.h,4); ctx.fill();
      ctx.shadowBlur=0;
      // Viền cảnh báo
      ctx.strokeStyle='#ffcc00'; ctx.lineWidth=2;
      roundRect(ctx,cx-o.w/2,cy,o.w,o.h,4); ctx.stroke();
      // Icon ⚠
      ctx.fillStyle='#ffcc00';
      ctx.font='bold 14px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('⚠',cx,cy+o.h/2);
    }

    else if(o.type==='oil'){
      // Oil spill — vệt dầu đơn giản
      ctx.shadowColor='rgba(0,255,200,0.15)'; ctx.shadowBlur=12;
      ctx.fillStyle='rgba(20,20,40,0.55)';
      ctx.beginPath();
      ctx.ellipse(cx,cy+o.h/2,o.w/2,o.h/2,0,0,Math.PI*2);
      ctx.fill();
      ctx.shadowBlur=0;
    }

    else if(o.type==='barrier'){
      // Barrier — rào chắn đơn giản
      ctx.shadowColor='#ff0000'; ctx.shadowBlur=14;
      ctx.fillStyle='#cc2222';
      roundRect(ctx,cx-o.w/2,cy-o.h/2,o.w,o.h,5); ctx.fill();
      ctx.shadowBlur=0;
      // Dải phản quang trắng
      ctx.fillStyle='rgba(255,255,255,0.7)';
      ctx.fillRect(cx-o.w/2+4,cy-o.h/2+6,o.w-8,4);
      ctx.fillRect(cx-o.w/2+4,cy+o.h/2-10,o.w-8,4);
      // Chữ STOP
      ctx.fillStyle='#fff';
      ctx.font='bold 12px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('STOP',cx,cy);
    }

    ctx.restore();
  }
}

// ── Car Drawer (enhanced) ────────────────────────────────
function drawCar(x,y,w,h,color,accent,isPlayer,flash,typeKey){
  x=Math.round(x); y=Math.round(y); const r=Math.min(w,h)*0.1;

  // Player glow
  if(isPlayer){
    const g=ctx.createRadialGradient(x,y,0,x,y,65);
    g.addColorStop(0,color+'30'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(x-65,y-65,130,130);
  }

  const alpha=flash?0.5:1;
  ctx.globalAlpha=alpha;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); roundRect(ctx,x-w/2+4,y-h/2+6,w,h,r); ctx.fill();

  // Body
  ctx.fillStyle=color;
  ctx.beginPath(); roundRect(ctx,x-w/2,y-h/2,w,h,r); ctx.fill();

  // Highlight gradient
  const hl=ctx.createLinearGradient(x,y-h/2,x,y+h/2);
  hl.addColorStop(0,'rgba(255,255,255,0.22)');
  hl.addColorStop(0.3,'rgba(255,255,255,0.05)');
  hl.addColorStop(1,'rgba(0,0,0,0.2)');
  ctx.fillStyle=hl;
  ctx.beginPath(); roundRect(ctx,x-w/2,y-h/2,w,h,r); ctx.fill();

  // Windshield
  ctx.fillStyle='rgba(150,200,255,0.4)';
  ctx.beginPath(); roundRect(ctx,x-w*0.3,y-h*0.35,w*0.6,h*0.18,3); ctx.fill();
  ctx.fillStyle='rgba(150,200,255,0.25)';
  ctx.beginPath(); roundRect(ctx,x-w*0.25,y-h*0.13,w*0.5,h*0.12,2); ctx.fill();
  ctx.beginPath(); roundRect(ctx,x-w*0.25,y+h*0.22,w*0.5,h*0.1,2); ctx.fill();

  // Accents
  ctx.fillStyle=accent;
  ctx.fillRect(x-w/2+4,y-h/2+5,w-8,3);
  ctx.fillRect(x-w/2+4,y+h/2-8,w-8,3);

  // Lights
  ctx.shadowBlur=10; ctx.shadowColor='#ffffcc';
  ctx.fillStyle='#ffffcc';
  ctx.fillRect(x-w*0.3,y-h/2-2,7,4); ctx.fillRect(x+w*0.3-7,y-h/2-2,7,4);
  ctx.shadowColor='#ff3333'; ctx.fillStyle='#ff3333';
  ctx.fillRect(x-w*0.3,y+h/2-2,7,4); ctx.fillRect(x+w*0.3-7,y+h/2-2,7,4);
  ctx.shadowBlur=0;

  // Brake light for traffic
  if(!isPlayer){
    const tc=trafficCars.find(c=>c.x===x&&c.y===y);
    if(tc&&tc.brakeLight){
      ctx.fillStyle='#ff0000';
      ctx.shadowColor='#ff0000'; ctx.shadowBlur=15;
      ctx.fillRect(x-w*0.3,y+h/2-2,7,4);
      ctx.fillRect(x+w*0.3-7,y+h/2-2,7,4);
      ctx.shadowBlur=0;
    }
  }

  // Wheels
  ctx.fillStyle='#111';
  ctx.fillRect(x-w/2-4,y-h*0.32,6,16); ctx.fillRect(x+w/2-2,y-h*0.32,6,16);
  ctx.fillRect(x-w/2-4,y+h*0.22,6,16); ctx.fillRect(x+w/2-2,y+h*0.22,6,16);
  ctx.fillStyle='#444';
  ctx.fillRect(x-w/2-3,y-h*0.3,3,12); ctx.fillRect(x+w/2-1,y-h*0.3,3,12);
  ctx.fillRect(x-w/2-3,y+h*0.24,3,12); ctx.fillRect(x+w/2-1,y+h*0.24,3,12);

  // Nitro flame
  if(isPlayer&&nitroActive){
    ctx.shadowColor='#ff4400'; ctx.shadowBlur=25;
    for(let i=0;i<4;i++){
      const fx=x+(i-1.5)*9, fy=y+h/2+rand(3,18);
      ctx.fillStyle=i%2?'#ff6600':'#ffaa00';
      ctx.fillRect(fx-4,fy,8,rand(10,22));
    }
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}

// ── HUD ──────────────────────────────────────────────────
function drawHUD(){
  ctx.textBaseline='alphabetic';
  // Top bar background
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.beginPath(); roundRect(ctx,0,0,W,54,0); ctx.fill();

  // Score
  ctx.textAlign='left';
  ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=4;
  ctx.fillStyle='#fff'; ctx.font='bold 22px "Segoe UI",system-ui,sans-serif';
  ctx.fillText('\u{1F3C6} '+score,14,36);
  ctx.shadowBlur=0;

  // (Combo multiplier đã bỏ — gây overlap score)

  // Mode timer (Time Trial)
  const gameMode=GAME_MODES[selectedMode]||GAME_MODES.endless;
  if(gameMode.hasTimer&&gameMode.timerDuration){
    const remaining=Math.max(0,gameMode.timerDuration-gameModeTimer);
    const secs=Math.ceil(remaining);
    ctx.fillStyle=secs<=10?'#ff4444':'#ffd700';
    ctx.font='bold 20px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign='center';
    ctx.fillText('\u23F1\uFE0F '+secs+'s',W/2,30);
    if(secs<=10){
      ctx.fillStyle=`rgba(255,50,50,${0.1+Math.sin(gameTime*10)*0.05})`;
      ctx.fillRect(0,0,W,54);
    }
  }

  // Speed digital gauge (dời sang trái để không đụng hearts)
  const displaySpeed=speed*(nitroActive?1.7:1);
  const spd=Math.round(displaySpeed*0.45);
  ctx.fillStyle='#8cf'; ctx.font='bold 20px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign='center';
  ctx.fillText(spd,W*0.68,28);
  ctx.fillStyle='rgba(150,200,255,0.5)'; ctx.font='10px "Segoe UI",system-ui,sans-serif';
  ctx.fillText('KM/H',W*0.68,43);

  // Level (trái) + Hearts (phải) — cùng hàng dưới
  ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font='11px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign='left';   ctx.fillText('CẤP '+level,14,52);

  // Hearts — bên phải, không còn overlay theme name
  ctx.textAlign='right'; ctx.font='18px "Segoe UI",system-ui,sans-serif';
  const modeCfg=GAME_MODES[selectedMode]||GAME_MODES.endless;
  const maxHearts=Math.min(modeCfg.lives||3,5);
  let h=''; for(let i=0;i<maxHearts;i++) h+=i<lives?'\u2764\uFE0F':'\u{1F9F6}';
  ctx.fillText(h,W-14,52);

  // Coins right side (hàng trên cùng bên phải)
  ctx.fillStyle='#ffd700'; ctx.font='bold 18px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign='right'; ctx.shadowColor='rgba(255,200,0,0.3)'; ctx.shadowBlur=6;
  ctx.fillText('$ '+(totalCoins+gameCoins),W-14,34);
  ctx.shadowBlur=0;

  // Difficulty indicator (subtle)
  if(adaptDifficulty>0.3){
    ctx.fillStyle='rgba(255,100,50,'+((adaptDifficulty-0.3)*0.5)+')';
    ctx.font='10px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign='left';
    const diffLabel=adaptDifficulty<0.5?'NORMAL':adaptDifficulty<0.7?'KHÓ':'ÁC MỘNG';
    ctx.fillText(diffLabel,14,70);
  }

  // Nitro bar (bottom)
  const nbW=280,nbH=14,nbX=(W-nbW)/2,nbY=H-36;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); roundRect(ctx,nbX-4,nbY-4,nbW+8,nbH+8,8); ctx.fill();

  const nRatio=nitro/NITRO_MAX;
  const nG=ctx.createLinearGradient(nbX,nbY,nbX+nbW,nbY);
  if(nitroActive){
    nG.addColorStop(0,'#00e5ff'); nG.addColorStop(0.5,'#00ff88'); nG.addColorStop(1,'#00e5ff');
  }else{
    nG.addColorStop(0,'#0055ff'); nG.addColorStop(0.5,'#0088ff'); nG.addColorStop(1,'#0055ff');
  }
  ctx.fillStyle=nG;
  if(nitroActive){ctx.shadowColor='#00ffaa';ctx.shadowBlur=18}
  ctx.beginPath(); roundRect(ctx,nbX,nbY,nbW*nRatio,nbH,6); ctx.fill();
  ctx.shadowBlur=0;

  ctx.textAlign='center';
  ctx.fillStyle=nitroActive?'#0ff':'rgba(255,255,255,0.5)';
  ctx.font='bold 11px "Segoe UI",system-ui,sans-serif';
  ctx.fillText(nitroActive?'\u26A1 NITRO TĂNG TỐC \u26A1':'NITRO',W/2,nbY-5);

  // Nitro tick marks
  ctx.fillStyle='rgba(255,255,255,0.08)';
  for(let i=1;i<5;i++) ctx.fillRect(nbX+nbW*(i/5),nbY,1,nbH);

  // Pause button
  ctx.fillStyle='rgba(255,255,255,0.08)';
  ctx.beginPath(); roundRect(ctx,12,56,30,24,6); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.font='bold 13px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('\u23F8',27,68);
}

// ── Screen Shake ─────────────────────────────────────────
function triggerShake(intensity){
  shakeIntensity=Math.max(shakeIntensity,intensity);
}

// ── Collision ────────────────────────────────────────────
function rectOverlap(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

// ══════════════════════════════════════════════════════════════
// ── GAME UPDATE (enhanced) ──────────────────────────────────
// ══════════════════════════════════════════════════════════════

function updateGame(dt){
  if(screen!=='game'||paused) return;

  gameTime+=dt;

  // ── Theme Transition ──
  themeTimer+=dt;
  if(themeTimer>=THEME_CHANGE_INTERVAL){
    themeTimer=0;
    // Start transition to next theme
    currentThemeIdx=nextThemeIdx;
    nextThemeIdx=(currentThemeIdx+1)%THEME_KEYS.length;
    themeTransition=0;
    SFX.themeChange();
    // Reinitialize weather
    initRain();
    initDust();
  }
  if(themeTransition<1){
    themeTransition=Math.min(1,themeTransition+dt/THEME_TRANSITION_DURATION);
  }

  // ── Speed Ramp ──
  speed=Math.min(MAX_SPEED,BASE_SPEED+gameTime*0.55);
  level=Math.floor(speed/BASE_SPEED)+1;

  // ── Adaptive Difficulty ──
  difficultyTimer+=dt;
  if(difficultyTimer>5){ // Recalculate every 5 seconds
    difficultyTimer=0;
    const timeAlive=gameTime-gameStartTime;
    const baseAdapt=Math.min(1,timeAlive/120); // Max difficulty after 2 minutes
    const perfBonus=Math.min(0.3,(score/5000)*0.3);
    adaptDifficulty=Math.min(1,baseAdapt+perfBonus);
  }

  // ── Nitro ──
  if(nitroActive){
    nitro-=NITRO_DRAIN*dt;
    if(nitro<=0){nitro=0;nitroActive=false}
    nitroTimer+=dt;
  }else{
    nitro=Math.min(NITRO_MAX,nitro+NITRO_REFILL*dt);
  }
  const currentSpeed=speed*(nitroActive?1.7:1);
  const spd=currentSpeed*dt;

  // ── Road Scroll ──
  roadOffset+=spd;

  // ── Lane Switch (smooth) ──
  if(playerTargetLane!==playerLane){
    const step=6*dt;
    const diff=playerTargetLane-playerLane;
    if(Math.abs(diff)<step) playerLane=playerTargetLane;
    else playerLane+=Math.sign(diff)*step;
  }
  playerX=ROAD_L+playerLane*LANE_W+LANE_W/2;

  // ── Oil Slide Effect ──
  if(oilDuration>0){
    oilDuration-=dt;
    // Xoay tròn xe
    const spinSpeed=oilSlide*4;
    oilAngle+=spinSpeed*dt;
    oilSlide=lerp(oilSlide,0,dt*1.8);
    // Trôi làn theo góc xoay
    const drift=Math.sin(oilAngle)*0.15;
    playerLane=clamp(playerLane+drift*dt*2,0,LANE_COUNT-1);
    // Khi sắp hết hiệu ứng, kéo về target lane
    if(oilDuration<0.4 && oilTargetLane>=0){
      const diff=oilTargetLane-playerLane;
      if(Math.abs(diff)>0.05) playerLane+=diff*dt*3;
      else playerLane=oilTargetLane;
    }
    if(oilDuration<=0){
      oilSlide=0; oilAngle=0; oilTargetLane=-1;
    }
  }

  // ── Visual Bob ──
  carBob+=dt*4;
  playerSway=lerp(playerSway,0,dt*6);

  // ── Invincibility ──
  if(invincibleTimer>0){invincibleTimer-=dt;hitFlash+=dt*8}

  // ── Mode Timer ──
  const mode=GAME_MODES[selectedMode]||GAME_MODES.endless;
  if(mode.hasTimer&&mode.timerDuration){
    gameModeTimer+=dt;
    const remaining=mode.timerDuration-gameModeTimer;
    if(remaining<=0){
      // Time's up! end with bonus score
      score+=Math.floor(gameTime*10);
      screen='over';endScore=score;
      if(score>highScore) highScore=score;
      totalCoins+=gameCoins;
      saveData();
      spawnParticles(playerX,playerY,80,'#00ffaa',350,7,0.8);
      document.getElementById('touchCtrls').classList.remove('active');
      return;
    }
  }

  // ── Spawners (mode-adjusted) ──
  spawnTimer-=dt;
  if(spawnTimer<=0){
    spawnTraffic();
    const minSpawn=(0.3-adaptDifficulty*0.15)/mode.trafficMult;
    const maxSpawn=(1.6-adaptDifficulty*0.4)/mode.trafficMult;
    spawnTimer=rand(Math.max(0.2,minSpawn),Math.max(0.4,maxSpawn));
  }
  coinSpawnTimer-=dt;
  if(coinSpawnTimer<=0){
    spawnCoin();
    coinSpawnTimer=rand(0.6/mode.coinMult,1.8/mode.coinMult);
  }

  // Obstacle spawner (mode-adjusted)
  obstacleTimer-=dt;
  if(obstacleTimer<=0){
    if(mode.key==='obstacleRush'){
      // Spawn 1-2 obstacles mỗi lần
      spawnObstacle();
      if(Math.random()<0.45) spawnObstacle();
    }else{
      spawnObstacle();
    }
    const baseInterval=(3.5-adaptDifficulty*1.5)/mode.obstacleMult;
    obstacleTimer=rand(Math.max(1.0,baseInterval-0.8),Math.max(2.0,baseInterval+0.8));
  }

  // ── Update Rain ──
  const theme=getCurrentTheme();
  if(theme.hasRain){
    for(const drop of rainDrops){
      drop.y+=drop.speed*dt;
      drop.x+=drop.wind*dt*0.3;
      if(drop.y>H){drop.y=-rand(0,20);drop.x=rand(0,W)}
      if(drop.x>W) drop.x=0;
      if(drop.x<0) drop.x=W;
    }
  }

  // ── Update Dust ──
  if(theme.dustColor){
    for(const d of dustParticles){
      d.y+=d.speed*dt;
      d.x+=d.drift*dt*0.5;
      if(d.y>H){d.y=-rand(10,40);d.x=rand(ROAD_L,ROAD_R)}
    }
  }

  // ── Update Traffic ──
  for(let i=trafficCars.length-1;i>=0;i--){
    const c=trafficCars[i];
    // Move car based on its own speed
    c.y+=currentSpeed*dt*c.speedMult*0.85;

    // AI lane-changing logic
    updateTrafficAI(c,dt,currentSpeed);

    // Smooth lane movement
    const targetX=c.laneX;
    c.x=lerp(c.x,targetX,dt*5);

    if(c.y>H+160){trafficCars.splice(i,1);continue}
    if(!c.passed&&c.y>playerY+PLAYER_H/2+15){
      c.passed=true;
      score+=Math.floor(5+speed*0.02);
    }
    // Near-miss
    const dx=Math.abs(c.x-playerX), dy=Math.abs(c.y-playerY);
    if(!c.sparkTimer&&dy<PLAYER_H*0.55&&dx<LANE_W*0.5&&dx>PLAYER_W*0.25){
      c.sparkTimer=1;
      combo++; comboTimer=2; comboSpeed=0;
      const bonus=50*combo;
      score+=bonus; nearMissStreak++;
      spawnFloatingText(playerX,playerY-65,'SUÝT! +'+bonus,'#ffaa00',18);
      spawnParticles(playerX,playerY,12,'#ffaa00',120,3,0.5);
      spawnParticles(c.x,c.y,8,'#ff6600',90,2,0.4);
      triggerShake(3); SFX.nearMiss();
    }
  }

  // ── Update Coins ──
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    c.y+=spd*0.9; c.bob+=dt*3;
    if(c.y>H+40){coins.splice(i,1);continue}
    const dx=Math.abs(c.x-playerX), dy=Math.abs(c.y-playerY);
    if(dx<PLAYER_W/2+COIN_R&&dy<PLAYER_H/2+COIN_R){
      const bonus=Math.floor(100*(combo||1));
      gameCoins++; score+=bonus;
      spawnFloatingText(c.x,c.y,'+'+bonus+' $','#ffd700',20);
      spawnParticles(c.x,c.y,10,'#ffd700',100,3,0.5);
      combo++; comboTimer=2;
      coins.splice(i,1); triggerShake(1.5);
      SFX.coin();
    }
  }

  // ── Update Obstacles ──
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    o.update(dt,spd);
    if(!o.active||o.y>H+120){obstacles.splice(i,1);continue}

    // Collision with player
    if(invincibleTimer<=0&&!o.hit){
      const pr={x:playerX-PLAYER_W/2,y:playerY-PLAYER_H/2,w:PLAYER_W,h:PLAYER_H};
      if(rectOverlap(pr,o.rect)){
        o.hit=true;
        if(o.type==='oil'){
          // Oil spill: trượt + xoay tròn
          const spinDir=Math.random()<0.5?1:-1;
          const laneShift=Math.random()<0.5?-1:1;
          oilAngle=0;
          oilSlide=spinDir*rand(1.5,3);
          oilDuration=rand(1.0,1.8);
          oilTargetLane=clamp(Math.round(playerLane)+laneShift,0,LANE_COUNT-1);
          spawnFloatingText(playerX,playerY-65,'TRƠN TRƯỢT!','#88aaff',16);
          spawnParticles(o.x,o.y,15,'#446688',80,4,0.5);
          triggerShake(5); SFX.oil();
        }else if(o.type==='construction'){
          // Construction: damage + slow
          lives--;
          if(lives<=0){
            screen='over';endScore=score;
            if(score>highScore) highScore=score;
            totalCoins+=gameCoins;
            saveData();
            spawnParticles(playerX,playerY,60,'#ff6600',300,6,0.8);
            document.getElementById('touchCtrls').classList.remove('active');
            break;
          }
          invincibleTimer=1.5;
          speed=Math.max(BASE_SPEED,speed*0.5);
          combo=0;
          spawnFloatingText(playerX,playerY-65,'VA CHẠM!','#ff6600',20);
          spawnParticles(o.x,o.y,30,'#ff8800',200,5,0.6);
          triggerShake(12); SFX.crash();
        }else if(o.type==='barrier'){
          // Barrier: heavy damage
          lives-=2;
          if(lives<=0){
            screen='over';endScore=score;
            if(score>highScore) highScore=score;
            totalCoins+=gameCoins;
            saveData();
            spawnParticles(playerX,playerY,70,'#ff2200',350,7,0.8);
            document.getElementById('touchCtrls').classList.remove('active');
            break;
          }
          invincibleTimer=2;
          speed=Math.max(BASE_SPEED*0.5,speed*0.3);
          combo=0;
          spawnFloatingText(playerX,playerY-80,'RÀO CHẮN!','#ff2222',22);
          spawnParticles(o.x,o.y,40,'#ff4400',250,6,0.7);
          triggerShake(18); SFX.barrier();
        }
      }
    }
  }

  // ── Combo decay ──
  if(comboTimer>0){
    comboTimer-=dt; comboSpeed+=dt*2;
    if(comboTimer<=0){combo=0;nearMissStreak=0}
  }

  // ── Collision with traffic ──
  if(invincibleTimer<=0){
    const pr={x:playerX-PLAYER_W/2,y:playerY-PLAYER_H/2,w:PLAYER_W,h:PLAYER_H};
    for(const c of trafficCars){
      if(rectOverlap(pr,c.rect)){
        lives--; invincibleTimer=2; hitFlash=0;
        spawnParticles(playerX,playerY,35,c.color,200,5,0.6);
        spawnParticles(playerX,playerY,25,'#ff4400',250,4,0.5);
        triggerShake(14); SFX.crash();
        if(lives<=0){
          screen='over'; endScore=score;
          if(score>highScore) highScore=score;
          totalCoins+=gameCoins;
          saveData();
          spawnParticles(playerX,playerY,60,'#ff2200',300,6,0.8);
          spawnParticles(playerX,playerY,30,'#ffaa00',200,4,0.6);
          document.getElementById('touchCtrls').classList.remove('active');
        }else{
          speed=Math.max(BASE_SPEED,speed*0.55);
          combo=0; comboTimer=0;
        }
        break;
      }
    }
  }

  // ── Speed Lines ──
  if(Math.random()<(currentSpeed/MAX_SPEED)*0.3) spawnSpeedLines();
  for(let i=speedLines.length-1;i>=0;i--){
    const sl=speedLines[i];
    sl.y+=sl.speed*dt; sl.alpha-=dt*0.4;
    if(sl.y>H||sl.alpha<=0){speedLines.splice(i,1)}
  }

  // ── Exhaust Particles ──
  if(Math.random()<0.35){
    particles.push(new Particle(
      playerX+rand(-14,14), playerY+PLAYER_H/2,
      rand(-6,6), rand(25,55),
      rand(0.3,0.7), nitroActive?'#66ddff':'#888899', rand(2,5)
    ));
  }
  if(nitroActive&&Math.random()<0.5)
    spawnParticles(playerX,playerY+PLAYER_H/2,2,'#ff6600',rand(100,200),3,0.4);

  // ── Update Particles ──
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=90*dt; p.life-=dt;
    if(p.life<=0||p.x<-60||p.x>W+60||p.y>H+60) particles.splice(i,1);
  }

  // ── Floating Texts ──
  for(let i=floatingTexts.length-1;i>=0;i--){
    const ft=floatingTexts[i];
    ft.y+=ft.vy*dt; ft.life-=dt*0.7;
    if(ft.life<=0) floatingTexts.splice(i,1);
  }

  // ── Shake Decay (smoother) ──
  if(shakeIntensity>0){
    shakeX=rand(-shakeIntensity,shakeIntensity)*1.2;
    shakeY=rand(-shakeIntensity,shakeIntensity)*0.8;
    shakeIntensity*=0.92;
    if(shakeIntensity<0.2){shakeIntensity=0;shakeX=0;shakeY=0}
  }
}

// ══════════════════════════════════════════════════════════════
// ── RENDER (enhanced) ──────────────────────────────────────
// ══════════════════════════════════════════════════════════════

function renderGame(){
  ctx.textBaseline='alphabetic';
  ctx.save();
  ctx.translate(shakeX,shakeY);

  const theme=getCurrentTheme();

  drawBackground();

  // Dust particles (behind everything)
  drawDust();

  // Speed lines
  for(const sl of speedLines){
    ctx.fillStyle='rgba(255,255,255,'+(sl.alpha*0.25)+')';
    ctx.fillRect(sl.x,sl.y,sl.w,sl.h*2.5);
  }

  // Coins
  const coinG=ctx.createRadialGradient(0,0,0,0,0,COIN_R);
  coinG.addColorStop(0,'#ffee88'); coinG.addColorStop(0.5,'#ffd700'); coinG.addColorStop(1,'#cc9900');
  for(const c of coins){
    const cy=c.y+Math.sin(c.bob)*3;
    ctx.save(); ctx.translate(c.x,cy);
    ctx.shadowColor='#ffd700'; ctx.shadowBlur=20;
    ctx.beginPath(); ctx.arc(0,0,COIN_R,0,Math.PI*2);
    ctx.fillStyle=coinG; ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#8a6a00'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('$',0,1);
    ctx.fillStyle='rgba(255,255,255,0.5)';
    const sa=Math.sin(c.bob*2.5)*0.5+0.5;
    ctx.globalAlpha=sa;
    ctx.fillRect(COIN_R*0.5,-COIN_R*0.5,3,3); ctx.fillRect(-COIN_R*0.5,COIN_R*0.4,2,2);
    ctx.globalAlpha=1;
    ctx.restore();
  }

  // Obstacles (behind traffic but on road)
  drawObstacles();

  // Traffic cars (sorted by y for depth)
  const sortedTraffic=[...trafficCars].sort((a,b)=>a.y-b.y);
  for(const c of sortedTraffic){
    const typeInfo=TRAFFIC_TYPES[c.typeKey]||TRAFFIC_TYPES.normal;
    drawCar(c.x,c.y,c.w,c.h,c.color,typeInfo.accent,false,false,c.typeKey);
  }

  // Player (with sway tilt, oil spin)
  const tilt=playerSway*0.03;
  const pBob=Math.sin(carBob)*1.5;
  const rotAngle=tilt+oilAngle;
  ctx.save();
  ctx.translate(playerX,playerY+pBob);
  ctx.rotate(rotAngle);
  ctx.translate(-playerX,-playerY-pBob);
  const flash=invincibleTimer>0&&Math.floor(hitFlash)%2===0;
  drawCar(playerX,playerY+pBob,PLAYER_W,PLAYER_H,CAR_COLORS[selectedCar],CAR_ACCENTS[selectedCar],true,flash);
  ctx.restore();

  // Rain (on top of everything on road)
  drawRain();

  // Fog overlay
  if(theme.fogDensity>0){
    ctx.fillStyle=`rgba(80,80,120,${theme.fogDensity*0.5})`;
    ctx.fillRect(0,0,W,H);
  }

  // Floating texts
  for(const ft of floatingTexts){
    ctx.globalAlpha=ft.life;
    ctx.fillStyle=ft.color; ctx.font='bold '+ft.size+'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign='center';
    ctx.shadowColor=ft.color; ctx.shadowBlur=14;
    ctx.fillText(ft.text,ft.x,ft.y);
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;

  // Combo banner
  if(combo>1){
    const ca=Math.sin(comboSpeed*4)*0.2+0.8;
    ctx.globalAlpha=ca;
    ctx.fillStyle=hslStr(combo*40,100,55);
    ctx.font='bold 34px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign='center';
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=25;
    ctx.fillText(combo+'x COMBO!',W/2,88);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  // Speed blur
  const sr=speed/MAX_SPEED;
  if(sr>0.5){
    ctx.fillStyle=`rgba(0,0,0,${(sr-0.5)*0.12})`;
    ctx.fillRect(0,0,W,H);
  }

  // Theme transition vignette
  if(themeTransition<1){
    const v=Math.abs(themeTransition-0.5)*2;
    ctx.fillStyle=`rgba(0,0,0,${(1-v)*0.15})`;
    ctx.fillRect(0,0,W,H);
  }

  ctx.restore(); // end shake transform

  // HUD (fixed, no shake)
  drawHUD();

  // Near-miss streak
  if(nearMissStreak>=3){
    ctx.fillStyle='rgba(255,170,0,0.55)';
    ctx.font='bold 13px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign='center';
    ctx.fillText('\u{1F525} '+nearMissStreak+'x Suýt Va Chạm!',W/2,70);
  }

  // Nitro screen pulse
  if(nitroActive){
    ctx.fillStyle=`rgba(0,180,255,${Math.sin(nitroTimer*25)*0.025+0.025})`;
    ctx.fillRect(0,0,W,H);
  }
}

const keys={};
let touchLeft=false,touchRight=false,touchNitro=false;
let leftPressed=false,rightPressed=false;

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','KeyA','KeyD','KeyW','Space'].includes(e.code))
    e.preventDefault();
  if(e.code==='Enter'&&screen==='over') startGame();
  if(e.code==='Escape'){
    if(screen==='game'){
      paused=!paused;
      document.getElementById('touchCtrls').classList.toggle('active',!paused);
    }else if(screen==='over'||screen==='garage'){
      screen='title';
    }
  }
});
document.addEventListener('keyup',e=>{keys[e.code]=false});

const tzL=document.getElementById('tzL'),tzR=document.getElementById('tzR'),tzN=document.getElementById('tzN');

tzL.addEventListener('touchend',e=>{e.preventDefault();touchLeft=false;tPress(tzL,false)});
tzL.addEventListener('touchcancel',e=>{touchLeft=false;tPress(tzL,false)});
tzR.addEventListener('touchstart',e=>{e.preventDefault();touchRight=true;tPress(tzR,true)});
tzR.addEventListener('touchend',e=>{e.preventDefault();touchRight=false;tPress(tzR,false)});
tzR.addEventListener('touchcancel',e=>{touchRight=false;tPress(tzR,false)});
tzN.addEventListener('touchstart',e=>{e.preventDefault();touchNitro=true;tPress(tzN,true)});
tzN.addEventListener('touchend',e=>{e.preventDefault();touchNitro=false;tPress(tzN,false)});
tzN.addEventListener('touchcancel',e=>{touchNitro=false;tPress(tzN,false)});

tzL.addEventListener('mouseup',()=>{touchLeft=false;tPress(tzL,false)});
tzL.addEventListener('mouseleave',()=>{touchLeft=false;tPress(tzL,false)});
tzR.addEventListener('mousedown',()=>{touchRight=true;tPress(tzR,true)});
tzR.addEventListener('mouseup',()=>{touchRight=false;tPress(tzR,false)});
tzR.addEventListener('mouseleave',()=>{touchRight=false;tPress(tzR,false)});
tzN.addEventListener('mousedown',()=>{touchNitro=true;tPress(tzN,true)});
tzN.addEventListener('mouseup',()=>{touchNitro=false;tPress(tzN,false)});
tzN.addEventListener('mouseleave',()=>{touchNitro=false;tPress(tzN,false)});

canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  handleTap((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));
});
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0], r=canvas.getBoundingClientRect();
  handleTap((t.clientX-r.left)*(W/r.width),(t.clientY-r.top)*(H/r.height));
},{passive:false});

function handleTap(mx,my){
  if(screen==='title'){
    if(mx>=W/2-110&&mx<=W/2+110&&my>=300&&my<=356){SFX.click();startGame()}
    else if(mx>=W/2-85&&mx<=W/2+85&&my>=374&&my<=418){SFX.click();screen='garage'}
    else {
      // Check mode buttons
      for(const b of modeButtons){
        if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){
          if(selectedMode!==b.key){selectedMode=b.key;SFX.select()}
          return;
        }
      }
    }
  }else if(screen==='game'){
    if(!paused){
      if(mx>=12&&mx<=42&&my>=56&&my<=80){paused=true;document.getElementById('touchCtrls').classList.remove('active');SFX.click()}
    }else{
      if(mx>=W/2-120&&mx<=W/2+120&&my>=270&&my<=328){paused=false;document.getElementById('touchCtrls').classList.add('active');SFX.click()}
      else if(mx>=W/2-120&&mx<=W/2+120&&my>=352&&my<=404){screen='title';paused=false;SFX.click();document.getElementById('touchCtrls').classList.remove('active')}
    }
  }else if(screen==='over'){
    if(mx>=W/2-125&&mx<=W/2+125&&my>=370&&my<=424){SFX.click();startGame()}
    else if(mx>=W/2-85&&mx<=W/2+85&&my>=442&&my<=484){SFX.click();screen='title'}
  }else if(screen==='garage'){
    for(const b of garageButtons){
      if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){
        if(b.type==='back'){SFX.click();screen='title';return}
        if(b.type==='car'){
          const i=b.index;
          if(unlockedCars.has(i)){
            if(selectedCar!==i){selectedCar=i;saveData();SFX.select()}
          }else if(totalCoins>=CAR_COSTS[i]){
            totalCoins-=CAR_COSTS[i];
            unlockedCars.add(i);selectedCar=i;
            saveData();SFX.coin();
          }else{SFX.click()}
          return;
        }
      }
    }
  }
}

function startGame(){
  const mode=GAME_MODES[selectedMode]||GAME_MODES.endless;
  score=0; gameCoins=0; lives=mode.lives||3; speed=mode.initialSpeed||BASE_SPEED; level=1;
  nitro=NITRO_MAX; nitroActive=false; nitroTimer=0;
  combo=0; comboTimer=0; comboSpeed=0; nearMissStreak=0;
  playerLane=1; playerTargetLane=1; playerSway=0;
  trafficCars=[]; coins=[]; obstacles=[]; particles=[]; floatingTexts=[]; speedLines=[];
  roadOffset=0; gameTime=0; invincibleTimer=0; hitFlash=0;
  shakeIntensity=0; shakeX=0; shakeY=0;
  spawnTimer=1.5; coinSpawnTimer=0.8;
  obstacleTimer=mode.key==='obstacleRush'?0.5:3;
  oilSlide=0; oilDuration=0; oilAngle=0; oilTargetLane=-1;
  adaptDifficulty=0; difficultyTimer=0;
  gameStartTime=0; gameModeTimer=0;
  // Theme: force theme if mode specifies, else random
  if(mode.forceTheme){
    currentThemeIdx=THEME_KEYS.indexOf(mode.forceTheme);
    if(currentThemeIdx<0) currentThemeIdx=0;
  }else{
    currentThemeIdx=randi(0,THEME_KEYS.length-1);
  }
  nextThemeIdx=(currentThemeIdx+1)%THEME_KEYS.length;
  themeTimer=0; themeTransition=1;
  paused=false; screen='game';
  initRain(); initDust();
  document.getElementById('touchCtrls').classList.add('active');
}

// ══════════════════════════════════════════════════════════════
// ── GAME LOOP ──────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════

let lastTime=0;

function gameLoop(time){
  const dt=Math.min((time-lastTime)/1000,0.05);
  lastTime=time;

  const leftIn=touchLeft||keys['ArrowLeft']||keys['KeyA'];
  const rightIn=touchRight||keys['ArrowRight']||keys['KeyD'];
  const nitroIn=touchNitro||keys['Space']||keys['ArrowUp']||keys['KeyW'];

  if(screen==='game'&&!paused){
    if(leftIn&&!leftPressed){
      if(playerTargetLane>0){playerTargetLane--;playerSway=-5;triggerShake(0.5)}
    }
    if(rightIn&&!rightPressed){
      if(playerTargetLane<LANE_COUNT-1){playerTargetLane++;playerSway=5;triggerShake(0.5)}
    }
    leftPressed=leftIn;
    rightPressed=rightIn;

    if(nitroIn&&nitro>0&&!nitroActive){
      nitroActive=true; nitroTimer=0; triggerShake(4); SFX.nitro();
    }
    if(!nitroIn&&nitroActive) nitroActive=false;

    updateGame(dt);
  }

  ctx.clearRect(0,0,W,H);
  if(screen==='title') drawTitleScreen();
  else if(screen==='game'){renderGame();if(paused)drawPauseScreen()}
  else if(screen==='over') drawGameOverScreen();
  else if(screen==='garage') drawGarageScreen();

  requestAnimationFrame(gameLoop);
}

// ══════════════════════════════════════════════════════════════
// ── INIT ──────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════

loadData();
initRain();
initDust();
requestAnimationFrame(gameLoop);
