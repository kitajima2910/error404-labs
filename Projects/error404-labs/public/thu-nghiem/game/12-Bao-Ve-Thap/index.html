        <style>
            * {

                padding: 0;
                box-sizing: border-box;

                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                font-family: 'Segoe UI', system-ui, sans-serif;
                overflow: hidden;
                user-select: none;
            }

            #gameContainer {
                position: relative;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 0 60px rgba(100, 140, 255, 0.15);
            }

            canvas {
                display: block;
            }

            #ui {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                padding: 10px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: linear-gradient(
                    180deg,
                    rgba(10, 10, 30, 0.95) 0%,
                    rgba(10, 10, 30, 0.7) 80%,
                    transparent 100%

                pointer-events: none;
                z-index: 10;
            }

            #heroStats {
                display: flex;
                align-items: center;
                gap: 4px;
                color: #e0e4f0;
                font-size: 12px;
            }

            #heroHpBar {
                width: 80px;
                height: 6px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 3px;
                overflow: hidden;
                margin: 0 4px;
            }

            #heroHpFill {
                height: 100%;
                background: linear-gradient(90deg, #44ff88, #88ffaa);
                border-radius: 3px;
                transition: width 0.3s;
                box-shadow: 0 0 6px rgba(68, 255, 136, 0.4);
            }

            #heroLevel {
                font-size: 12px;
                color: #ffd700;
                margin-left: 4px;
            }

            #heroExpBar {

                height: 4px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 2px;
                overflow: hidden;
                margin-left: 4px;
            }

            #heroExpFill {
                height: 100%;
                background: linear-gradient(90deg, #ffaa44, #ffdd66);
                border-radius: 2px;
                transition: width 0.3s;
            }

            #ui > * {
                pointer-events: auto;
            }

            .stat {
                display: flex;
                align-items: center;
                gap: 6px;
                color: #e0e4f0;
                font-size: 14px;
                font-weight: 600;
                text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
            }

            .stat .icon {
                font-size: 18px;
            }

            .stat .val {
                color: #fff;
                font-size: 16px;
            }

            #hpBar {
                width: 140px;
                height: 8px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 4px;
                overflow: hidden;
            }

            #hpFill {

                border-radius: 4px;
                transition: width 0.3s;
                box-shadow: 0 0 8px rgba(255, 68, 102, 0.5);
            }

            #towerPanel {

                bottom: 0;
                left: 0;
                right: 0;
                padding: 10px 16px 14px;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;

                align-items: center;
                gap: 3px;

                border: 2px solid rgba(255, 255, 255, 0.12);
                border-radius: 10px;
                background: rgba(255, 255, 255, 0.05);
                color: #c0c4d0;
                cursor: pointer;
                transition: all 0.2s;
                min-width: 75px;

                background: rgba(100, 180, 255, 0.1);
                color: #fff;
                transform: scale(1.08);
                box-shadow: 0 0 20px rgba(100, 180, 255, 0.2);

            .tower-btn.selected {
                border-color: rgba(100, 200, 255, 0.7);
                background: rgba(100, 200, 255, 0.15);
                color: #fff;
                box-shadow: 0 0 24px rgba(100, 200, 255, 0.3);

                font-weight: 600;
            }

                opacity: 0.35;
                pointer-events: none;

                top: 155px;
                right: 20px;
                bottom: auto;
                padding: 12px 24px;
                border: 1.5px solid rgba(100, 255, 140, 0.5);
                border-radius: 12px;
                background: rgba(100, 255, 140, 0.08);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                color: #88ffaa;
                font-size: 13px;

                transition: all 0.3s;

            #overlay {
                position: absolute;
                inset: 0;

                border-radius: 6px;
                background: rgba(0, 0, 0, 0.85);

                align-items: center;
                justify-content: center;
                font-size: 12px;
                color: #fff;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.2s;
            }

                opacity: 1;
            }

            .skill-btn {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px;
                padding: 8px;
                border: 2px solid rgba(255, 255, 255, 0.12);
                border-radius: 8px;
                background: rgba(255, 255, 255, 0.05);

                border-color: rgba(255, 200, 100, 0.5);

                opacity: 0.5;

                align-items: center;
                justify-content: center;
                font-size: 16px;

            .skill-btn .s-name {
                font-size: 9px;
                font-weight: 700;
            }

                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border-radius: 6px;
                background: rgba(0, 0, 0, 0.8);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 12px;
                color: #fff;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.2s;
            }

            .skill-btn.on-cooldown .s-cooldown {
                opacity: 1;
            }

            @keyframes upgradePulse {
                0%,
                100% {
                    box-shadow: 0 0 12px rgba(100, 255, 100, 0.4);
                }
                50% {
                    box-shadow: 0 0 20px rgba(100, 255, 100, 0.7);
                }
            }

    </head>

    <body>
        <div id="gameContainer">
            <canvas id="gameCanvas"></canvas>
            <div id="ui">
                <div class="stat">
                    <span class="icon">❤️</span>
                    <div id="hpBar">
                        <div id="hpFill"></div>
                    </div>

                </div>
                <div class="stat"><span class="icon">🌊</span><span class="val" id="waveText">Đợt 0/10</span></div>
                <div class="stat"><span class="icon">💰</span><span class="val" id="goldText">100</span></div>
                <div id="heroStats">
                    <span class="icon">🛡️</span>

            <div id="towerPanel">
                <div class="tower-btn" data-type="basic" onclick="selectTower('basic')">

                    <div class="t-name">CƠ BẢN</div>
                    <div class="t-cost">💰 50</div>
                </div>
                <div class="tower-btn" data-type="rapid" onclick="selectTower('rapid')">
                    <div class="t-icon" style="background: rgba(255, 200, 50, 0.2)">🟡</div>
                    <div class="t-name">TỐC ĐỘ</div>
                    <div class="t-cost">💰 75</div>
                </div>
                <div class="tower-btn" data-type="heavy" onclick="selectTower('heavy')">
                    <div class="t-icon" style="background: rgba(255, 80, 80, 0.2)">🔴</div>
                    <div class="t-name">HẠNG NẶNG</div>
                    <div class="t-cost">💰 120</div>
                </div>
                <div class="tower-btn" data-type="aura" onclick="selectTower('aura')">
                    <div class="t-icon" style="background: rgba(255, 68, 102, 0.2)">💢</div>

                    <div class="t-cost">💰 80</div>
                </div>
                <div class="tower-btn" data-type="aura_speed" onclick="selectTower('aura_speed')">
                    <div class="t-icon" style="background: rgba(68, 136, 255, 0.2)">💨</div>
                    <div class="t-name">AURA SPD</div>
                    <div class="t-cost">💰 80</div>
                </div>
                <div class="tower-btn" data-type="aura_range" onclick="selectTower('aura_range')">
                    <div class="t-icon" style="background: rgba(170, 68, 255, 0.2)">🎯</div>
                    <div class="t-name">AURA RNG</div>
                    <div class="t-cost">💰 80</div>
                </div>
                <div class="tower-btn" data-type="fire" onclick="selectTower('fire')">
                    <div class="t-icon" style="background: rgba(255, 102, 0, 0.2)">🔥</div>
                    <div class="t-name">FIRE</div>
                    <div class="t-cost">💰 90</div>
                </div>
                <div class="tower-btn" data-type="poison" onclick="selectTower('poison')">
                    <div class="t-icon" style="background: rgba(68, 255, 68, 0.2)">☠️</div>
                    <div class="t-name">POISON</div>
                    <div class="t-cost">💰 95</div>
                </div>
                <div class="tower-btn" data-type="ice" onclick="selectTower('ice')">
                    <div class="t-icon" style="background: rgba(102, 170, 255, 0.2)">❄️</div>
                    <div class="t-name">ICE</div>
                    <div class="t-cost">💰 85</div>
                </div>
            </div>
            <button id="waveBtn" onclick="startNextWave()">▶ ĐỢT TIẾP THEO</button>
            <div id="sellInfo">
                <span id="sellLv"></span>
                <button id="upgradeBtn" onclick="upgradeTower()">NÂNG CẤP</button>
                <button onclick="sellTower()">BÁN</button>
            </div>
            <div id="skillPanel">
                <div class="skill-btn" data-skill="dash" onclick="useSkill('dash')">
                    <div class="s-icon">💨</div>
                    <div class="s-name">DASH</div>
                    <div class="s-cooldown" id="dashCooldown"></div>
                </div>
                <div class="skill-btn" data-skill="aoe" onclick="useSkill('aoe')">
                    <div class="s-icon">💥</div>
                    <div class="s-name">AOE</div>
                    <div class="s-cooldown" id="aoeCooldown"></div>
                </div>
            </div>
            <div id="overlay">

                <p>Đặt các tòa tháp để bảo vệ căn cứ của bạn khỏi kẻ thù!</p>
                <button onclick="startGame()">START GAME</button>
            </div>
        </div>

                    name: 'Ice',

                },

            const ENEMY_DEFS = {
                light: {
                    hp: 35,
                    speed: 110,
                    armor: 0,
                    color: '#44ff88',
                    size: 10,
                    reward: 8,
                    glowColor: 'rgba(68,255,136,0.4)',
                },
                balanced: {
                    hp: 70,

                    color: '#ff4466',
                    size: 16,
                    reward: 20,
                    glowColor: 'rgba(255,68,102,0.4)',
                },
            }

            const STATUS_DEFS = {
                burn: {
                    tickInterval: 0.5,
                    color: 'rgba(255,100,50,0.6)',
                    particleColor: '#ff6600',
                    deathEffect: 'explosion',
                },
                poison: {
                    tickInterval: 0.7,
                    color: 'rgba(100,255,100,0.6)',
                    particleColor: '#00ff00',
                    deathEffect: 'fade',
                    maxStacks: 3,
                },
                slow: {
                    tickInterval: 0, // no tick
                    color: 'rgba(100,150,255,0.6)',
                    particleColor: '#66aaff',
                    deathEffect: 'freeze',
                },
            }

            function lerp(a, b, t) {
                return a + (b - a) * t
            }

            function createHero() {
                return {
                    x: W / 2,
                    y: H / 2,
                    vx: 0,
                    vy: 0,
                    hp: 100,
                    maxHp: 100,
                    level: 1,
                    exp: 0,
                    expToNext: 100,
                    damage: 25,
                    range: 120,
                    fireRate: 1.5,
                    cooldown: 0,
                    speed: 150,
                    dashCooldown: 0,
                    dashDuration: 0.2,
                    dashSpeed: 600,
                    invincible: false,
                    invincibilityTimer: 0,
                    afterImages: [],
                    aoeCooldown: 0,
                    aoeRadius: 80,
                    aoeDamage: 50,
                    aoeKnockback: 100,
                    scaleAnim: 1,
                    idleTimer: 0,
                    flashFrames: 0,
                }
            }

            // Multi-lane paths (grid coords): Top, Middle, Bottom converge to Base
            const PATHS_GRID = [
                // Lane 0: Top
                [
                    { x: -1, y: 1 },
                    { x: 4, y: 1 },
                    { x: 4, y: 3 },
                    { x: 8, y: 3 },
                    { x: 8, y: 1 },
                    { x: 11, y: 1 },
                    { x: 11, y: 4 },
                    { x: 15, y: 4 },
                ],
                // Lane 1: Middle
                [
                    { x: -1, y: 4 },
                    { x: 3, y: 4 },
                    { x: 3, y: 6 },
                    { x: 7, y: 6 },
                    { x: 7, y: 2 },
                    { x: 11, y: 2 },
                    { x: 11, y: 4 },
                    { x: 15, y: 4 },
                ],
                // Lane 2: Bottom
                [
                    { x: -1, y: 7 },
                    { x: 4, y: 7 },
                    { x: 4, y: 5 },
                    { x: 8, y: 5 },
                    { x: 8, y: 8 },
                    { x: 11, y: 8 },
                    { x: 11, y: 4 },
                    { x: 15, y: 4 },
                ],
            ]
            const PATHS = PATHS_GRID.map((lane) =>
                lane.map((p) => ({ x: p.x * CELL + CELL / 2, y: p.y * CELL + CELL / 2 })),
            )

            // Determine path cells for all lanes (safe, integer-only)
            const pathCells = new Set()
            function markPathCells() {
                pathCells.clear()
                for (const lane of PATHS_GRID) {
                    for (let i = 0; i < lane.length - 1; i++) {
                        const a = lane[i],
                            b = lane[i + 1]
                        const dx = Math.sign(b.x - a.x),
                            dy = Math.sign(b.y - a.y)
                        const steps = Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y))
                        for (let s = 0; s <= steps; s++) {
                            const cx = a.x + dx * s,
                                cy = a.y + dy * s
                            const rx = Math.round(cx),
                                ry = Math.round(cy)
                            if (rx >= 0 && rx < COLS && ry >= 0 && ry < ROWS) pathCells.add(rx + ',' + ry)
                        }
                    }
                }
            }

            markPathCells()

            // ============ AUDIO ============
            const AudioCtx = window.AudioContext || window.webkitAudioContext
            let audioCtx
            function initAudio() {
                if (!audioCtx) audioCtx = new AudioCtx()
            }

            function playSound(type) {
                if (!audioCtx) return
                const now = audioCtx.currentTime
                const g = audioCtx.createGain()
                g.connect(audioCtx.destination)
                const o = audioCtx.createOscillator()
                o.connect(g)
                switch (type) {
                    case 'shoot':
                        o.type = 'square'
                        o.frequency.setValueAtTime(600, now)
                        o.frequency.exponentialRampToValueAtTime(200, now + 0.08)
                        g.gain.setValueAtTime(0.06, now)
                        g.gain.exponentialRampToValueAtTime(0.001, now + 0.08)
                        o.start(now)
                        o.stop(now + 0.08)
                        break
                    case 'hit':
                        o.type = 'sawtooth'
                        o.frequency.setValueAtTime(300, now)
                        o.frequency.exponentialRampToValueAtTime(100, now + 0.06)
                        g.gain.setValueAtTime(0.05, now)
                        g.gain.exponentialRampToValueAtTime(0.001, now + 0.06)
                        o.start(now)
                        o.stop(now + 0.06)
                        break
                    case 'kill':
                        o.type = 'sine'
                        o.frequency.setValueAtTime(800, now)
                        o.frequency.exponentialRampToValueAtTime(200, now + 0.15)
                        g.gain.setValueAtTime(0.08, now)
                        g.gain.exponentialRampToValueAtTime(0.001, now + 0.15)
                        o.start(now)
                        o.stop(now + 0.15)
                        break
                    case 'baseHit':
                        o.type = 'sawtooth'
                        o.frequency.setValueAtTime(120, now)
                        o.frequency.exponentialRampToValueAtTime(40, now + 0.25)
                        g.gain.setValueAtTime(0.12, now)
                        g.gain.exponentialRampToValueAtTime(0.001, now + 0.25)
                        o.start(now)
                        o.stop(now + 0.25)
                        break
                    case 'place':
                        o.type = 'sine'
                        o.frequency.setValueAtTime(400, now)
                        o.frequency.exponentialRampToValueAtTime(800, now + 0.1)
                        g.gain.setValueAtTime(0.07, now)
                        g.gain.exponentialRampToValueAtTime(0.001, now + 0.12)
                        o.start(now)
                        o.stop(now + 0.12)
                        break
                    case 'wave':
                        o.type = 'triangle'
                        o.frequency.setValueAtTime(300, now)
                        o.frequency.exponentialRampToValueAtTime(600, now + 0.2)
                        g.gain.setValueAtTime(0.08, now)
                        g.gain.exponentialRampToValueAtTime(0.001, now + 0.3)
                        o.start(now)
                        o.stop(now + 0.3)
                        break
                    case 'sell':
                        o.type = 'sine'
                        o.frequency.setValueAtTime(500, now)
                        o.frequency.exponentialRampToValueAtTime(300, now + 0.1)
                        g.gain.setValueAtTime(0.06, now)
                        g.gain.exponentialRampToValueAtTime(0.001, now + 0.1)
                        o.start(now)
                        o.stop(now + 0.1)
                        break
                    case 'upgrade':
                        o.type = 'sine'
                        o.frequency.setValueAtTime(400, now)
                        o.frequency.exponentialRampToValueAtTime(1200, now + 0.15)
                        g.gain.setValueAtTime(0.1, now)
                        g.gain.exponentialRampToValueAtTime(0.001, now + 0.2)
                        o.start(now)
                        o.stop(now + 0.2)
                        break
                }
            }

            // ============ POOLS ============
            const MAX_PARTICLES = 20
            const enemyPool = [],
                bulletPool = [],
                particlePool = [],
                statusPool = []

            function getFromPool(pool) {
                return pool.length > 0 ? pool.pop() : null
            }
            function returnToPool(pool, obj) {
                pool.push(obj)
            }

            // ============ GAME STATE ============
            let game = {
                hp: 20,
                maxHp: 20,
                gold: 200,
                wave: 0,
                maxWaves: 100,
                enemies: [],
                towers: [],
                bullets: [],
                particles: [],
                waveActive: false,
                spawnQueue: [],
                spawnTimer: 0,
                gameOver: false,
                selectedTowerType: null,
                hoveredCell: null,
                selectedPlacedTower: null,
                shakeAmount: 0,
                shakeDuration: 0,
                time: 0,
                lastTime: 0,
                auraUpdateTimer: 0,
                hero: null,
                cameraX: W / 2,
                cameraY: H / 2,
            }

            let keys = {}
            let isDragging = false
            let dragStartX = 0,
                dragStartY = 0

            // ============ ENEMY ============
            function createEnemy(type, laneID) {
                const def = ENEMY_DEFS[type]
                let e = getFromPool(enemyPool)
                if (!e) e = {}
                e.type = type
                e.laneID = laneID !== undefined ? laneID : 1
                e.hp = def.hp
                e.maxHp = def.hp
                e.speed = def.speed
                e.armor = def.armor
                e.color = def.color
                e.size = def.size
                e.reward = def.reward
                e.glowColor = def.glowColor
                e.pathIndex = 0
                const lanePath = PATHS[e.laneID]
                e.x = lanePath[0].x
                e.y = lanePath[0].y
                e.alive = true
                e.reachedBase = false
                e.hitFlash = 0
                e.scaleAnim = 1
                e.trail = []
                e.trailTimer = 0
                e.spawnAnim = 0
                e.statusList = []
                e.speedMultiplier = 1
                return e
            }

            function updateEnemy(e, dt) {
                if (!e.alive) return
                e.spawnAnim = Math.min(1, e.spawnAnim + dt * 4)
                e.hitFlash = Math.max(0, e.hitFlash - dt * 6)
                e.scaleAnim += (1 - e.scaleAnim) * dt * 8

                // Update status effects
                e.speedMultiplier = 1
                for (let i = e.statusList.length - 1; i >= 0; i--) {
                    const s = e.statusList[i]
                    s.duration -= dt
                    const def = STATUS_DEFS[s.type]
                    if (def.tickInterval > 0) {
                        s.tickTimer += dt
                        if (s.tickTimer >= def.tickInterval) {
                            s.tickTimer = 0
                            if (s.type === 'burn') {
                                damageEnemy(e, 2)
                            } else if (s.type === 'poison') {
                                const dmg = Math.floor(e.maxHp * 0.03 * s.value)
                                damageEnemy(e, dmg)
                            }
                        }
                    } else if (s.type === 'slow') {
                        e.speedMultiplier += s.value
                    }
                    if (s.duration <= 0) {
                        returnToPool(statusPool, s)
                        e.statusList.splice(i, 1)
                    }
                }

                // Trail for fast enemies
                if (e.speed > 90) {
                    e.trailTimer += dt
                    if (e.trailTimer > 0.03) {
                        e.trailTimer = 0
                        e.trail.push({ x: e.x, y: e.y, a: 0.5 })
                        if (e.trail.length > 8) e.trail.shift()
                    }
                }
                for (let t of e.trail) t.a -= dt * 2
                e.trail = e.trail.filter((t) => t.a > 0)

                // Movement using lane-specific path
                const lanePath = PATHS[e.laneID]
                if (e.pathIndex < lanePath.length - 1) {
                    const target = lanePath[e.pathIndex + 1]
                    const dx = target.x - e.x,
                        dy = target.y - e.y
                    const dist = Math.sqrt(dx * dx + dy * dy)
                    const move = e.speed * e.speedMultiplier * dt
                    if (dist <= move) {
                        e.x = target.x
                        e.y = target.y
                        e.pathIndex++
                    } else {
                        e.x += (dx / dist) * move
                        e.y += (dy / dist) * move
                    }
                }

                // Check collision with Hero
                if (game.hero && !game.hero.invincible) {
                    const dx = e.x - game.hero.x,
                        dy = e.y - game.hero.y
                    const dist = Math.sqrt(dx * dx + dy * dy)
                    if (dist < e.size + 20) {
                        game.hero.hp -= 10
                        game.hero.flashFrames = 5
                        if (game.hero.hp <= 0) endGame(false)
                        updateUI()
                    }
                }
                if (e.pathIndex >= lanePath.length - 1) {
                    e.reachedBase = true
                    e.alive = false
                    game.hp -= 1
                    // Tăng shakeAmount nếu nhiều enemy vào base cùng lúc
                    game.shakeAmount = Math.min(12, game.shakeAmount + 2)
                    game.shakeDuration = 0.25
                    playSound('baseHit')
                    updateUI()
                    if (game.hp <= 0) endGame(false)
                }
            }

            function applyStatus(enemy, type, duration, value) {
                if (!enemy.alive) return
                const existing = enemy.statusList.find((s) => s.type === type)
                if (existing) {
                    existing.duration = Math.max(existing.duration, duration)
                    if (type === 'slow') {
                        existing.value = Math.min(existing.value, value)
                    } else if (type === 'poison') {
                        existing.value = Math.min(existing.value + 1, STATUS_DEFS.poison.maxStacks)
                    }
                } else {
                    let status = getFromPool(statusPool)
                    if (!status) status = {}
                    status.type = type
                    status.duration = duration
                    status.value = value
                    status.tickTimer = 0
                    enemy.statusList.push(status)
                }
            }

            function damageEnemy(e, dmg) {
                if (!e.alive) return
                const actual = Math.max(1, dmg - e.armor)
                e.hp -= actual
                e.hitFlash = 1
                e.scaleAnim = 1.3
                playSound('hit')
                if (e.hp <= 0) {
                    e.alive = false
                    game.gold += e.reward
                    if (game.hero) game.hero.exp += e.reward * 2
                    playSound('kill')
                    const deathEffect = e.statusList.length > 0 ? STATUS_DEFS[e.statusList[0].type].deathEffect : null
                    spawnDeathParticles(e, deathEffect)
                    updateUI()
                }
            }

            // Lane tint colors (applied to enemy body)
            const LANE_TINT = [
                'rgba(80,200,255,0.25)',
                'rgba(200,140,255,0.25)',
                'rgba(255,180,80,0.25)',
            ]
            function drawEnemy(e) {
                if (!e.alive) return
                const def = ENEMY_DEFS[e.type]
                const s = e.size * e.spawnAnim
                const sc = e.scaleAnim
                const r = s * sc

                // Trail
                if (e.trail.length > 1) {
                    for (let i = 0; i < e.trail.length; i++) {
                        const t = e.trail[i]
                        ctx.globalAlpha = t.a * 0.4
                        ctx.fillStyle = e.color
                        ctx.beginPath()
                        ctx.arc(t.x, t.y, r * 0.5, 0, Math.PI * 2)
                        ctx.fill()
                    }
                    ctx.globalAlpha = 1
                }

                // Glow
                ctx.save()
                ctx.shadowColor = e.glowColor
                ctx.shadowBlur = 15

                // Armor glow (blue)
                if (e.armor > 0) {
                    ctx.shadowColor = 'rgba(100,180,255,0.5)'
                    ctx.shadowBlur = 20
                }

                // Body with lane tint
                const flash = e.hitFlash
                ctx.fillStyle = flash > 0 ? lerpColor(e.color, '#ffffff', flash) : e.color
                ctx.beginPath()
                ctx.arc(e.x, e.y, r, 0, Math.PI * 2)
                ctx.fill()

                // Lane tint overlay
                if (e.laneID !== undefined && LANE_TINT[e.laneID]) {
                    ctx.fillStyle = LANE_TINT[e.laneID]
                    ctx.beginPath()
                    ctx.arc(e.x, e.y, r, 0, Math.PI * 2)
                    ctx.fill()
                }

                // Status effects tint and particles
                const activeStatuses = e.statusList
                    .filter((s) => s.duration > 0)
                    .sort((a, b) => {
                        const priority = { slow: 3, burn: 2, poison: 1 }
                        return priority[b.type] - priority[a.type]
                    })
                    .slice(0, 2)
                for (let i = 0; i < activeStatuses.length; i++) {
                    const s = activeStatuses[i]
                    const def = STATUS_DEFS[s.type]
                    // Tint overlay
                    ctx.fillStyle = def.color
                    ctx.beginPath()
                    ctx.arc(e.x, e.y, r * (0.8 - i * 0.2), 0, Math.PI * 2)
                    ctx.fill()
                    // Small particles
                    const angle = game.time * 3 + i * Math.PI
                    const px = e.x + Math.cos(angle) * (r + 5)
                    const py = e.y + Math.sin(angle) * (r + 5)
                    ctx.fillStyle = def.particleColor
                    ctx.beginPath()
                    ctx.arc(px, py, 2, 0, Math.PI * 2)
                    ctx.fill()
                }
                ctx.restore()

                // Inner highlight
                ctx.fillStyle = 'rgba(255,255,255,0.25)'
                ctx.beginPath()
                ctx.arc(e.x - r * 0.2, e.y - r * 0.2, r * 0.45, 0, Math.PI * 2)
                ctx.fill()

                // HP bar
                if (e.hp < e.maxHp) {
                    const bw = r * 2.5,
                        bh = 3
                    const bx = e.x - bw / 2,
                        by = e.y - r - 8
                    ctx.fillStyle = 'rgba(0,0,0,0.5)'
                    ctx.fillRect(bx, by, bw, bh)
                    const pct = Math.max(0, e.hp / e.maxHp)
                    ctx.fillStyle = pct > 0.5 ? '#44ff88' : pct > 0.25 ? '#ffaa44' : '#ff4466'
                    ctx.fillRect(bx, by, bw * pct, bh)
                }

                // Armor indicator
                if (e.armor > 0) {
                    ctx.fillStyle = 'rgba(100,180,255,0.7)'
                    ctx.font = 'bold 9px sans-serif'
                    ctx.textAlign = 'center'
                    ctx.fillText('🛡' + e.armor, e.x, e.y + r + 12)
                }
            }

            // ============ TOWER ============
            function createTower(type, col, row, level = 1) {
                const def = TOWER_DEFS[type]
                const dmgMul = level === 1 ? 1 : level === 2 ? 1.4 : 1.8
                const rangeMul = level === 1 ? 1 : level === 2 ? 1.1 : 1.2
                const fireMul = level === 1 ? 1 : level === 2 ? 1.15 : 1.3
                const spdMul = level === 1 ? 1 : level === 2 ? 1.05 : 1.1
                return {
                    type,
                    col,
                    row,
                    x: col * CELL + CELL / 2,
                    y: row * CELL + CELL / 2,
                    level,
                    damage: def.damage ? def.damage * dmgMul : 0,
                    range: def.range * rangeMul,
                    fireRate: def.fireRate ? def.fireRate * fireMul : 0,
                    color: def.color,
                    bulletColor: def.bulletColor,
                    bulletSpeed: def.bulletSpeed ? def.bulletSpeed * spdMul : 0,
                    cooldown: 0,
                    target: null,
                    angle: 0,
                    totalCost: def.cost + (level > 1 ? def.upgradeCost.slice(1, level).reduce((a, b) => a + b, 0) : 0),
                    muzzleFlash: 0,
                    scaleAnim: 0,
                    upgradeAnim: 0,
                    buffs: { damage: 0, speed: 0, range: 0 },
                    scaleBuffAnim: 0,
                }
            }

            function updateTower(t, dt) {
                t.scaleAnim = Math.min(1, t.scaleAnim + dt * 5)
                t.upgradeAnim = Math.max(0, t.upgradeAnim - dt * 4)
                t.muzzleFlash = Math.max(0, t.muzzleFlash - dt * 8)
                t.scaleBuffAnim = Math.max(0, t.scaleBuffAnim - dt * 6)
                if (t.type.startsWith('aura')) {
                    t.cooldown = 0
                    return
                }
                t.cooldown -= dt

                const def = TOWER_DEFS[t.type]
                const finalDamage = (def.damage || 0) * (1 + (t.buffs ? t.buffs.damage : 0))
                const finalRange = (def.range || 0) * (1 + (t.buffs ? t.buffs.range : 0))
                const finalFireRate = (def.fireRate || 0) * (1 + (t.buffs ? t.buffs.speed : 0))

                // Find target
                t.target = null
                let minDist = Infinity
                for (const e of game.enemies) {
                    if (!e.alive) continue
                    const dx = e.x - t.x,
                        dy = e.y - t.y
                    const distSq = dx * dx + dy * dy
                    if (distSq <= finalRange * finalRange && distSq < minDist) {
                        minDist = distSq
                        t.target = e
                    }
                }

                if (t.target) {
                    t.angle = Math.atan2(t.target.y - t.y, t.target.x - t.x)
                    if (t.cooldown <= 0) {
                        t.cooldown = 1 / finalFireRate
                        fireBullet(t, finalDamage)
                    }
                }
            }

            function fireBullet(t, finalDamage) {
                const def = TOWER_DEFS[t.type]
                const dmg = finalDamage !== undefined ? finalDamage : t.damage
                const burstCount = t.level >= 3 && def.burst ? 3 : 1
                for (let b = 0; b < burstCount; b++) {
                    setTimeout(() => {
                        if (!t.target || !t.target.alive) return
                        let bullet = getFromPool(bulletPool)
                        if (!bullet) bullet = {}
                        bullet.x = t.x
                        bullet.y = t.y
                        bullet.target = t.target
                        bullet.damage = dmg
                        bullet.speed = t.bulletSpeed
                        bullet.color = t.bulletColor
                        bullet.alive = true
                        bullet.trail = []
                        bullet.trailTimer = 0
                        bullet.pierce = t.level >= 3 && def.pierce ? def.pierce + 1 : def.pierce || 1
                        bullet.hitList = []
                        bullet.splash = t.level >= 3 && def.splash ? 30 : 0
                        bullet.towerType = t.type
                        game.bullets.push(bullet)
                        t.muzzleFlash = 1
                        if (b === 0) playSound('shoot')
                    }, b * 80)
                }
            }

            function drawTower(t) {
                const def = TOWER_DEFS[t.type]
                const s = t.scaleAnim
                const upgradePulse = t.upgradeAnim > 0 ? t.upgradeAnim * 0.2 : 0
                const lv3 = t.level >= 3
                const r = (CELL * 0.35 + (lv3 ? 3 : 0) + upgradePulse) * s

                // Aura range preview / Aura zone
                if (t.type.startsWith('aura')) {
                    const radius = def.radius[t.level]
                    const pulse = 0.5 + 0.5 * Math.sin(game.time * 3)
                    const grad = ctx.createRadialGradient(t.x, t.y, r, t.x, t.y, radius)
                    grad.addColorStop(0, def.color + '30')
                    grad.addColorStop(1, def.color + '05')
                    ctx.fillStyle = grad
                    ctx.beginPath()
                    ctx.arc(t.x, t.y, radius, 0, Math.PI * 2)
                    ctx.fill()
                    // Pulse ring
                    ctx.strokeStyle = def.color + '40'
                    ctx.lineWidth = 1.5
                    ctx.beginPath()
                    ctx.arc(t.x, t.y, radius * (0.9 + 0.1 * pulse), 0, Math.PI * 2)
                    ctx.stroke()
                }

                // Range indicator when hovered or selected
                if (
                    game.selectedPlacedTower === t ||
                    (game.hoveredCell && game.hoveredCell.col === t.col && game.hoveredCell.row === t.row)
                ) {
                    const showRange = t.type.startsWith('aura') ? def.radius[t.level] : t.range
                    ctx.strokeStyle = 'rgba(255,255,255,0.08)'
                    ctx.fillStyle = 'rgba(255,255,255,0.02)'
                    ctx.lineWidth = 1
                    ctx.beginPath()
                    ctx.arc(t.x, t.y, showRange, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.stroke()
                }

                // Lv3 energy ring (both normal tower & aura)
                if (lv3) {
                    ctx.save()
                    ctx.translate(t.x, t.y)
                    ctx.rotate(game.time * 2)
                    ctx.strokeStyle = def.color
                    ctx.lineWidth = 2
                    ctx.shadowColor = def.color
                    ctx.shadowBlur = 12
                    ctx.beginPath()
                    ctx.arc(0, 0, r + 6, 0, Math.PI * 1.5)
                    ctx.stroke()
                    ctx.beginPath()
                    ctx.arc(0, 0, r + 6, Math.PI * 1.5, Math.PI * 2)
                    ctx.stroke()
                    ctx.restore()
                }

                // Aura Lv3 small particles
                if (lv3 && t.type.startsWith('aura')) {
                    for (let i = 0; i < 3; i++) {
                        const angle = game.time * 2 + (i * Math.PI * 2) / 3
                        const px = t.x + Math.cos(angle) * (r + 10)
                        const py = t.y + Math.sin(angle) * (r + 10)
                        ctx.fillStyle = def.color + '80'
                        ctx.beginPath()
                        ctx.arc(px, py, 2, 0, Math.PI * 2)
                        ctx.fill()
                    }
                }

                // Buff glow on tower (non-aura only)
                if (!t.type.startsWith('aura') && t.buffs) {
                    const glowColors = []
                    if (t.buffs.damage > 0) glowColors.push('#ff4466')
                    if (t.buffs.speed > 0) glowColors.push('#4488ff')
                    if (t.buffs.range > 0) glowColors.push('#aa44ff')
                    if (glowColors.length > 0) {
                        const glowR = r + 6 + 3 * Math.sin(game.time * 4)
                        ctx.strokeStyle = glowColors[0] + '50'
                        ctx.lineWidth = 2
                        ctx.beginPath()
                        ctx.arc(t.x, t.y, glowR, 0, Math.PI * 2)
                        ctx.stroke()
                    }
                }

                // Base
                ctx.save()
                ctx.shadowColor = def.color
                ctx.shadowBlur = 12 + (lv3 ? 8 : 0)
                ctx.fillStyle = 'rgba(20,20,40,0.9)'
                ctx.beginPath()
                ctx.arc(t.x, t.y, r + 4, 0, Math.PI * 2)
                ctx.fill()

                ctx.fillStyle = def.color
                ctx.beginPath()
                ctx.arc(t.x, t.y, r, 0, Math.PI * 2)
                ctx.fill()
                ctx.restore()

                // Turret barrel (only non-aura)
                if (!t.type.startsWith('aura')) {
                    ctx.save()
                    ctx.translate(t.x, t.y)
                    ctx.rotate(t.angle)
                    ctx.fillStyle = 'rgba(255,255,255,0.3)'
                    ctx.fillRect(0, -3, r + 8, 6)
                    ctx.restore()
                }

                // Muzzle flash
                if (t.muzzleFlash > 0) {
                    ctx.fillStyle = `rgba(255,255,255,${t.muzzleFlash * 0.6})`
                    ctx.beginPath()
                    ctx.arc(
                        t.x + Math.cos(t.angle) * (r + 8),
                        t.y + Math.sin(t.angle) * (r + 8),
                        5 * t.muzzleFlash,
                        0,
                        Math.PI * 2,
                    )
                    ctx.fill()
                }

                // Scale pop when buffed
                if (t.scaleBuffAnim > 0) {
                    ctx.save()
                    ctx.translate(t.x, t.y)
                    ctx.scale(1 + t.scaleBuffAnim * 0.3, 1 + t.scaleBuffAnim * 0.3)
                    ctx.strokeStyle = '#ffffff55'
                    ctx.lineWidth = 1.5
                    ctx.beginPath()
                    ctx.arc(0, 0, r + 5, 0, Math.PI * 2)
                    ctx.stroke()
                    ctx.restore()
                }

                // Center dot
                ctx.fillStyle = 'rgba(255,255,255,0.5)'
                ctx.beginPath()
                ctx.arc(t.x, t.y, 3, 0, Math.PI * 2)
                ctx.fill()

                // Level indicator
                if (t.level > 1) {
                    ctx.fillStyle = '#ffd700'
                    ctx.font = 'bold 9px sans-serif'
                    ctx.textAlign = 'center'
                    ctx.fillText('Lv' + t.level, t.x, t.y - r - 6)
                }
            }

            // ============ BULLET ============
            function updateBullet(b, dt) {
                if (!b.alive) return
                if (!b.target || !b.target.alive) {
                    if (b.target && !b.target.alive && b.splash) {
                        applySplash(b)
                    }
                    b.alive = false
                    return
                }
                const dx = b.target.x - b.x,
                    dy = b.target.y - b.y
                const dist = Math.sqrt(dx * dx + dy * dy)
                const move = b.speed * dt
                if (dist <= move + b.target.size) {
                    damageEnemy(b.target, b.damage)
                    // Apply status effect if tower has one
                    if (b.towerType && TOWER_DEFS[b.towerType].status) {
                        const def = TOWER_DEFS[b.towerType]
                        applyStatus(b.target, def.status, def.statusDuration, def.statusValue)
                    }
                    b.hitList.push(b.target)
                    if (b.pierce > b.hitList.length) {
                        b.alive = true
                    } else {
                        if (b.splash) applySplash(b)
                        b.alive = false
                        spawnHitParticles(b.x, b.y, b.color)
                    }
                    return
                }
                b.x += (dx / dist) * move
                b.y += (dy / dist) * move

                // Trail
                b.trailTimer += dt
                const trailLimit = b.pierce > 1 ? 10 : 6
                if (b.trailTimer > 0.02) {
                    b.trailTimer = 0
                    b.trail.push({ x: b.x, y: b.y, a: 0.6 })
                    if (b.trail.length > trailLimit) b.trail.shift()
                }
                for (let t of b.trail) t.a -= dt * 3
                b.trail = b.trail.filter((t) => t.a > 0)
            }

            function applySplash(b) {
                for (const e of game.enemies) {
                    if (!e.alive) continue
                    const dx = e.x - b.x,
                        dy = e.y - b.y
                    if (Math.sqrt(dx * dx + dy * dy) <= b.splash && !b.hitList.includes(e)) {
                        damageEnemy(e, b.damage * 0.5)
                    }
                }
            }

            function drawBullet(b) {
                if (!b.alive) return
                // Trail
                const trailAlpha = b.pierce > 1 ? 0.7 : 0.5
                const trailSize = b.splash ? 3 : 2
                for (let t of b.trail) {
                    ctx.globalAlpha = t.a * trailAlpha
                    ctx.fillStyle = b.color
                    ctx.beginPath()
                    ctx.arc(t.x, t.y, trailSize, 0, Math.PI * 2)
                    ctx.fill()
                }
                ctx.globalAlpha = 1

                ctx.save()
                ctx.shadowColor = b.color
                ctx.shadowBlur = b.pierce > 1 ? 16 : 8
                ctx.fillStyle = b.color
                ctx.beginPath()
                ctx.arc(b.x, b.y, b.splash ? 5 : 3.5, 0, Math.PI * 2)
                ctx.fill()
                // Lv3 glow
                if (b.pierce > 1 || b.splash) {
                    ctx.fillStyle = 'rgba(255,255,255,0.6)'
                    ctx.beginPath()
                    ctx.arc(b.x, b.y, 1.5, 0, Math.PI * 2)
                    ctx.fill()
                }
                ctx.restore()

                // Small particles for Lv3
                if (b.pierce > 1 || b.splash) {
                    for (let i = 0; i < 2; i++) {
                        ctx.globalAlpha = 0.4
                        ctx.fillStyle = b.color
                        ctx.beginPath()
                        ctx.arc(b.x + (Math.random() - 0.5) * 6, b.y + (Math.random() - 0.5) * 6, 1, 0, Math.PI * 2)
                        ctx.fill()
                    }
                    ctx.globalAlpha = 1
                }

                ctx.fillStyle = 'rgba(255,255,255,0.7)'
                ctx.beginPath()
                ctx.arc(b.x, b.y, 1.5, 0, Math.PI * 2)
                ctx.fill()
            }

            // ============ PARTICLES ============
            function spawnHitParticles(x, y, color) {
                if (game.particles.length >= MAX_PARTICLES) return
                const count = Math.min(4, MAX_PARTICLES - game.particles.length)
                for (let i = 0; i < count; i++) {
                    let p = getFromPool(particlePool)
                    if (!p) p = {}
                    p.x = x
                    p.y = y
                    const angle = Math.random() * Math.PI * 2
                    const speed = 40 + Math.random() * 80
                    p.vx = Math.cos(angle) * speed
                    p.vy = Math.sin(angle) * speed
                    p.life = 0.3 + Math.random() * 0.2
                    p.maxLife = p.life
                    p.color = color
                    p.size = 2 + Math.random() * 2
                    p.alive = true
                    game.particles.push(p)
                }
                // Flash
                let flash = getFromPool(particlePool)
                if (!flash) flash = {}
                flash.x = x
                flash.y = y
                flash.vx = 0
                flash.vy = 0
                flash.life = 0.12
                flash.maxLife = 0.12
                flash.color = '#ffffff'
                flash.size = 10
                flash.alive = true
                flash.isFlash = true
                game.particles.push(flash)
            }

            function spawnDeathParticles(e, deathEffect) {
                let count = Math.min(6, MAX_PARTICLES - game.particles.length)
                let speedMultiplier = 1
                let lifeMultiplier = 1
                let color = e.color
                if (deathEffect === 'explosion') {
                    count = Math.min(10, MAX_PARTICLES - game.particles.length)
                    speedMultiplier = 1.5
                    color = '#ff6600'
                } else if (deathEffect === 'fade') {
                    lifeMultiplier = 0.5
                    color = '#44ff44'
                } else if (deathEffect === 'freeze') {
                    speedMultiplier = 0.3
                    lifeMultiplier = 1.5
                    color = '#66aaff'
                }
                for (let i = 0; i < count; i++) {
                    let p = getFromPool(particlePool)
                    if (!p) p = {}
                    p.x = e.x
                    p.y = e.y
                    const angle = Math.random() * Math.PI * 2
                    const speed = (30 + Math.random() * 60) * speedMultiplier
                    p.vx = Math.cos(angle) * speed
                    p.vy = Math.sin(angle) * speed
                    p.life = (0.4 + Math.random() * 0.3) * lifeMultiplier
                    p.maxLife = p.life
                    p.color = color
                    p.size = 3 + Math.random() * 3
                    p.alive = true
                    p.isFlash = false
                    game.particles.push(p)
                }
            }

            function updateParticle(p, dt) {
                if (!p.alive) return
                p.life -= dt
                if (p.life <= 0) {
                    p.alive = false
                    return
                }
                p.x += p.vx * dt
                p.y += p.vy * dt
                if (!p.isFlash) {
                    p.vx *= 0.96
                    p.vy *= 0.96
                }
            }

            function drawParticle(p) {
                if (!p.alive) return
                const alpha = p.life / p.maxLife
                ctx.globalAlpha = alpha
                if (p.isFlash) {
                    ctx.fillStyle = p.color
                    ctx.beginPath()
                    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2)
                    ctx.fill()
                } else {
                    ctx.fillStyle = p.color
                    ctx.beginPath()
                    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2)
                    ctx.fill()
                }
                ctx.globalAlpha = 1
            }

            // ============ WAVES ============
            const WAVE_DEFS = [
                [{ type: 'light', count: 5, interval: 0.8 }],
                [{ type: 'light', count: 8, interval: 0.6 }],
                [
                    { type: 'light', count: 5, interval: 0.6 },
                    { type: 'balanced', count: 3, interval: 1.0 },
                ],
                [{ type: 'balanced', count: 6, interval: 0.8 }],
                [
                    { type: 'light', count: 10, interval: 0.4 },
                    { type: 'balanced', count: 4, interval: 0.8 },
                ],
                [
                    { type: 'balanced', count: 5, interval: 0.7 },
                    { type: 'tank', count: 2, interval: 1.5 },
                ],
                [
                    { type: 'light', count: 8, interval: 0.3 },
                    { type: 'tank', count: 3, interval: 1.2 },
                ],
                [
                    { type: 'balanced', count: 8, interval: 0.5 },
                    { type: 'tank', count: 4, interval: 1.0 },
                ],
                [
                    { type: 'light', count: 12, interval: 0.3 },
                    { type: 'balanced', count: 6, interval: 0.5 },
                    { type: 'tank', count: 3, interval: 1.0 },
                ],
                [
                    { type: 'tank', count: 8, interval: 0.8 },
                    { type: 'balanced', count: 10, interval: 0.4 },
                ],
            ]

            const MAX_ENEMY_PER_LANE = 8
            function assignLaneID() {
                // 50% chia đều, 50% dồn 1-2 làn ngẫu nhiên
                const roll = Math.random()
                if (roll < 0.5) {
                    return Math.floor(Math.random() * 3)
                } else {
                    // Dồn vào 1-2 làn
                    const lanes = [
                        0,
                        1,
                        2,
                    ]
                    const activeLanes = lanes.sort(() => Math.random() - 0.5).slice(0, Math.random() < 0.5 ? 1 : 2)
                    return activeLanes[Math.floor(Math.random() * activeLanes.length)]
                }
            }

            function startNextWave() {
                if (game.waveActive || game.wave >= game.maxWaves) return
                game.wave++
                game.waveActive = true
                game.spawnQueue = []
                let waveDef = WAVE_DEFS[game.wave - 1]
                // Fallback for waves beyond WAVE_DEFS
                if (!waveDef) {
                    const lastDef = WAVE_DEFS[WAVE_DEFS.length - 1]
                    const scale = 1 + (game.wave - WAVE_DEFS.length) / 10
                    waveDef = lastDef.map((g) => ({
                        type: g.type,
                        count: Math.ceil(g.count * scale),
                        interval: g.interval / scale,
                    }))
                }
                let timeOffset = 0
                for (const group of waveDef) {
                    for (let i = 0; i < group.count; i++) {
                        game.spawnQueue.push({ type: group.type, time: timeOffset, laneID: assignLaneID() })
                        timeOffset += group.interval
                    }
                }
                game.spawnQueue.sort((a, b) => a.time - b.time)
                game.spawnTimer = 0
                playSound('wave')
                document.getElementById('waveBtn').classList.add('hidden')
                updateUI()
            }

            function updateSpawning(dt) {
                if (!game.waveActive || game.spawnQueue.length === 0) return
                game.spawnTimer += dt
                while (game.spawnQueue.length > 0 && game.spawnQueue[0].time <= game.spawnTimer) {
                    const next = game.spawnQueue.shift()
                    // Giới hạn số lượng enemy mỗi làn
                    const countInLane = game.enemies.filter((e) => e.alive && e.laneID === next.laneID).length
                    if (countInLane < MAX_ENEMY_PER_LANE) {
                        const e = createEnemy(next.type, next.laneID)
                        game.enemies.push(e)
                    }
                }
                if (game.spawnQueue.length === 0) {
                    // Wave complete check happens in update
                }
            }

            // Lane colors for drawing (gradient + glow)
            const LANE_COLORS = [
                { stroke: 'rgba(80,200,255,0.09)', glow: 'rgba(80,200,255,0.04)', label: 'Top', spawnY: null },
                { stroke: 'rgba(200,140,255,0.09)', glow: 'rgba(200,140,255,0.04)', label: 'Mid', spawnY: null },
                { stroke: 'rgba(255,180,80,0.09)', glow: 'rgba(255,180,80,0.04)', label: 'Bot', spawnY: null },
            ]
            // Store spawn positions for each lane
            function getSpawnPos(laneID) {
                const p = PATHS[laneID][0]
                return { x: p.x, y: p.y }
            }
            function getBasePos() {
                return PATHS[0][PATHS[0].length - 2]
            }

            // Ambient particles for lanes
            const ambientParticles = []
            const MAX_AMBIENT = 15
            function updateAmbientParticles(dt) {
                for (const p of ambientParticles) {
                    p.life -= dt
                    if (p.life <= 0) {
                        p.alive = false
                        continue
                    }
                    // Move along lane path
                    p.segTimer += dt
                    const lanePath = PATHS[p.laneID]
                    if (p.segIndex < lanePath.length - 1) {
                        const a = lanePath[p.segIndex]
                        const b = lanePath[p.segIndex + 1]
                        const dx = b.x - a.x,
                            dy = b.y - a.y
                        const dist = Math.sqrt(dx * dx + dy * dy)
                        const move = p.speed * dt
                        p.segDist += move
                        if (p.segDist >= dist && dist > 0) {
                            p.segIndex++
                            p.segDist = 0
                            if (p.segIndex >= lanePath.length - 1) {
                                p.alive = false
                                continue
                            }
                        } else {
                            const t = dist > 0 ? p.segDist / dist : 0
                            p.x = a.x + dx * t
                            p.y = a.y + dy * t
                        }
                    } else {
                        p.alive = false
                    }
                }
                // Spawn new ambient particles
                if (ambientParticles.length < MAX_AMBIENT && Math.random() < 0.03) {
                    const laneID = Math.floor(Math.random() * 3)
                    const lanePath = PATHS[laneID]
                    ambientParticles.push({
                        laneID,
                        x: lanePath[0].x,
                        y: lanePath[0].y,
                        segIndex: 0,
                        segDist: 0,
                        speed: 20 + Math.random() * 30,
                        life: 3 + Math.random() * 4,
                        alive: true,
                        size: 1 + Math.random() * 1.5,
                        alpha: 0.15 + Math.random() * 0.15,
                    })
                }
                // Cleanup
                for (let i = ambientParticles.length - 1; i >= 0; i--) {
                    if (!ambientParticles[i].alive) ambientParticles.splice(i, 1)
                }
            }
            function drawAmbientParticles() {
                for (const p of ambientParticles) {
                    ctx.globalAlpha = p.alpha * (p.life < 1 ? p.life : 1)
                    ctx.fillStyle = LANE_COLORS[p.laneID].stroke.replace('0.09', '0.6')
                    ctx.beginPath()
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2)
                    ctx.fill()
                }
                ctx.globalAlpha = 1
            }

            // Helper: draw text with capsule background + glow (clamped to canvas bounds)
            function drawTextWithBg(text, x, y, fontSize, color, bgAlpha, pulse) {
                ctx.save()
                const pulseY = pulse ? Math.sin(game.time * 4) * 2 : 0
                ctx.font = `bold ${fontSize}px sans-serif`
                ctx.textAlign = 'center'
                const m = ctx.measureText(text)
                const padX = 10,
                    padY = 6
                const w = m.width + padX * 2
                const h = fontSize + padY * 2
                // Clamp x so capsule stays within canvas (left/right)
                const clampX = Math.max(w / 2 + 4, Math.min(W - w / 2 - 4, x))
                // Clamp y so capsule stays within canvas (top/bottom)
                const clampY = Math.max(h / 2 + 4, Math.min(H - h / 2 - 4, y + pulseY))
                // Capsule background (manual roundRect for compatibility)
                ctx.fillStyle = `rgba(10,10,30,${bgAlpha || 0.55})`
                const rx = clampX - w / 2,
                    ry = clampY - h / 2,
                    r = h / 2
                ctx.beginPath()
                ctx.moveTo(rx + r, ry)
                ctx.lineTo(rx + w - r, ry)
                ctx.arcTo(rx + w, ry, rx + w, ry + r, r)
                ctx.lineTo(rx + w, ry + h - r)
                ctx.arcTo(rx + w, ry + h, rx + w - r, ry + h, r)
                ctx.lineTo(rx + r, ry + h)
                ctx.arcTo(rx, ry + h, rx, ry + h - r, r)
                ctx.lineTo(rx, ry + r)
                ctx.arcTo(rx, ry, rx + r, ry, r)
                ctx.closePath()
                ctx.fill()
                // Glow
                ctx.shadowColor = color
                ctx.shadowBlur = 12
                ctx.fillStyle = color
                ctx.fillText(text, clampX, clampY + fontSize / 3)
                ctx.restore()
            }

            // ============ MAP DRAWING ============
            function drawMap() {
                // Background gradient
                const grad = ctx.createLinearGradient(0, 0, W, H)
                grad.addColorStop(0, '#0d1020')
                grad.addColorStop(1, '#151830')
                ctx.fillStyle = grad
                ctx.fillRect(0, 0, W, H)

                // Grid
                ctx.strokeStyle = 'rgba(255,255,255,0.03)'
                ctx.lineWidth = 0.5
                for (let x = 0; x <= COLS; x++) {
                    ctx.beginPath()
                    ctx.moveTo(x * CELL, 0)
                    ctx.lineTo(x * CELL, H)
                    ctx.stroke()
                }
                for (let y = 0; y <= ROWS; y++) {
                    ctx.beginPath()
                    ctx.moveTo(0, y * CELL)
                    ctx.lineTo(W, y * CELL)
                    ctx.stroke()
                }

                // Draw 3 lanes with different colors
                for (let laneID = 0; laneID < 3; laneID++) {
                    const lanePath = PATHS[laneID]
                    const colors = LANE_COLORS[laneID]

                    // Lane glow (broad stroke)
                    ctx.strokeStyle = colors.glow
                    ctx.lineWidth = CELL * 0.9
                    ctx.lineCap = 'round'
                    ctx.lineJoin = 'round'
                    ctx.beginPath()
                    ctx.moveTo(lanePath[0].x, lanePath[0].y)
                    for (let i = 1; i < lanePath.length; i++) ctx.lineTo(lanePath[i].x, lanePath[i].y)
                    ctx.stroke()

                    // Lane stroke (main)
                    ctx.strokeStyle = colors.stroke
                    ctx.lineWidth = CELL * 0.65
                    ctx.beginPath()
                    ctx.moveTo(lanePath[0].x, lanePath[0].y)
                    for (let i = 1; i < lanePath.length; i++) ctx.lineTo(lanePath[i].x, lanePath[i].y)
                    ctx.stroke()

                    // Lane dots
                    ctx.fillStyle = colors.stroke.replace('0.09', '0.05')
                    for (let i = 0; i < lanePath.length - 1; i++) {
                        const a = lanePath[i],
                            b = lanePath[i + 1]
                        const dx = Math.sign(b.x - a.x) * CELL,
                            dy = Math.sign(b.y - a.y) * CELL
                        const steps = Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y)) / CELL
                        for (let s = 0; s < steps; s++) {
                            const cx = a.x + dx * s,
                                cy = a.y + dy * s
                            ctx.beginPath()
                            ctx.arc(cx, cy, 2, 0, Math.PI * 2)
                            ctx.fill()
                        }
                    }
                }

                // Base with premium badge (clamped to canvas)
                const basePos = getBasePos()
                ctx.save()
                ctx.shadowColor = 'rgba(100,180,255,0.6)'
                ctx.shadowBlur = 30
                // Clamp radius so glow doesn't get cut off at canvas edge
                const maxR = Math.min(CELL * 0.65, W - basePos.x - 4)
                const innerR = Math.min(CELL * 0.38, W - basePos.x - 4)
                ctx.fillStyle = 'rgba(60,100,180,0.35)'
                ctx.beginPath()
                ctx.arc(basePos.x, basePos.y, maxR, 0, Math.PI * 2)
                ctx.fill()
                ctx.fillStyle = 'rgba(100,160,255,0.65)'
                ctx.beginPath()
                ctx.arc(basePos.x, basePos.y, innerR, 0, Math.PI * 2)
                ctx.fill()
                ctx.restore()
                // Premium badge label with pulse
                const basePulse = Math.sin(game.time * 3) * 1.5
                drawTextWithBg('🏰 CĂN CỨ', basePos.x, basePos.y + basePulse, 11, 'rgba(100,160,255,0.7)', 0.6, true)

                // Spawn points for each lane with premium labels
                for (let laneID = 0; laneID < 3; laneID++) {
                    const spawnPos = getSpawnPos(laneID)
                    const colors = LANE_COLORS[laneID]
                    // Count enemies in this lane
                    const countInLane = game.enemies.filter((e) => e.alive && e.laneID === laneID).length
                    // Pulse red warning if > 5 enemies
                    if (countInLane > 5) {
                        ctx.save()
                        ctx.shadowColor = 'rgba(255,60,60,0.7)'
                        ctx.shadowBlur = 22
                        ctx.fillStyle = `rgba(255,60,60,${0.2 + 0.15 * Math.sin(game.time * 6)})`
                        ctx.beginPath()
                        ctx.arc(spawnPos.x, spawnPos.y, CELL * 0.55, 0, Math.PI * 2)
                        ctx.fill()
                        ctx.restore()
                    }
                    // Spawn gate glow
                    ctx.save()
                    ctx.shadowColor = colors.stroke.replace('0.09', '0.7')
                    ctx.shadowBlur = 16
                    ctx.fillStyle = colors.stroke.replace('0.09', '0.35')
                    ctx.beginPath()
                    ctx.arc(spawnPos.x, spawnPos.y, CELL * 0.42, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.restore()
                    // Lane spawn badge "S1, S2, S3"
                    drawTextWithBg(
                        'S' + (laneID + 1),
                        spawnPos.x,
                        spawnPos.y,
                        9,
                        colors.stroke.replace('0.09', '0.9'),
                        0.5,
                        false,
                    )
                }
                // Faint global spawn label (only visible before wave)
                if (!game.waveActive && game.wave === 0) {
                    ctx.globalAlpha = 0.25 + 0.1 * Math.sin(game.time * 2)
                    drawTextWithBg(
                        'ĐIỂM XUẤT PHÁT',
                        PATHS[1][0].x,
                        PATHS[1][0].y - CELL * 1.2,
                        10,
                        'rgba(255,255,255,0.3)',
                        0.3,
                        false,
                    )
                    ctx.globalAlpha = 1
                }

                // Draw ambient particles
                drawAmbientParticles()
            }

            function drawHoverPreview() {
                if (!game.hoveredCell || game.selectedTowerType) return
                const { col, row } = game.hoveredCell
                const key = col + ',' + row
                const isPath = pathCells.has(key)
                const hasTower = game.towers.some((t) => t.col === col && t.row === row)

                if (!isPath && !hasTower && col >= 0 && col < COLS && row >= 0 && row < ROWS) {
                    ctx.fillStyle = 'rgba(255,255,255,0.04)'
                    ctx.fillRect(col * CELL, row * CELL, CELL, CELL)
                }
            }

            function drawBuildPreview() {
                if (!game.selectedTowerType || !game.hoveredCell) return
                const { col, row } = game.hoveredCell
                const key = col + ',' + row
                const isPath = pathCells.has(key)
                const hasTower = game.towers.some((t) => t.col === col && t.row === row)
                const def = TOWER_DEFS[game.selectedTowerType]
                const canAfford = game.gold >= def.cost
                const valid = !isPath && !hasTower && canAfford && col >= 0 && col < COLS && row >= 0 && row < ROWS

                if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return

                ctx.fillStyle = valid ? 'rgba(100,255,140,0.1)' : 'rgba(255,80,80,0.1)'
                ctx.fillRect(col * CELL, row * CELL, CELL, CELL)
                ctx.strokeStyle = valid ? 'rgba(100,255,140,0.3)' : 'rgba(255,80,80,0.3)'
                ctx.lineWidth = 1
                ctx.strokeRect(col * CELL, row * CELL, CELL, CELL)

                if (valid) {
                    const cx = col * CELL + CELL / 2,
                        cy = row * CELL + CELL / 2
                    // Range / Aura radius preview
                    const showRadius = def.radius ? def.radius[1] : def.range
                    ctx.strokeStyle = 'rgba(255,255,255,0.06)'
                    ctx.fillStyle = 'rgba(255,255,255,0.02)'
                    ctx.beginPath()
                    ctx.arc(cx, cy, showRadius, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.stroke()

                    // Tower preview
                    ctx.globalAlpha = 0.5
                    ctx.fillStyle = def.color
                    ctx.beginPath()
                    ctx.arc(cx, cy, CELL * 0.3, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.globalAlpha = 1
                }
            }

            // ============ UI ============
            function updateUI() {
                document.getElementById('hpFill').style.width = Math.max(0, (game.hp / game.maxHp) * 100) + '%'
                document.getElementById('hpText').textContent = Math.max(0, game.hp)
                document.getElementById('waveText').textContent = `Đợt ${game.wave}/${game.maxWaves}`
                document.getElementById('goldText').textContent = game.gold

                // Update Hero UI
                if (game.hero) {
                    document.getElementById('heroHpFill').style.width = (game.hero.hp / game.hero.maxHp) * 100 + '%'
                    document.getElementById('heroHpText').textContent = Math.max(0, game.hero.hp)
                    document.getElementById('heroLevel').textContent = 'Lv' + game.hero.level
                    document.getElementById('heroExpFill').style.width =
                        (game.hero.exp / game.hero.expToNext) * 100 + '%'

                    // Skills
                    const dashBtn = document.querySelector('.skill-btn[data-skill="dash"]')
                    const aoeBtn = document.querySelector('.skill-btn[data-skill="aoe"]')
                    if (game.hero.dashCooldown > 0) {
                        dashBtn.classList.add('on-cooldown')
                        document.getElementById('dashCooldown').textContent = game.hero.dashCooldown.toFixed(1)
                    } else {
                        dashBtn.classList.remove('on-cooldown')
                    }
                    if (game.hero.aoeCooldown > 0) {
                        aoeBtn.classList.add('on-cooldown')
                        document.getElementById('aoeCooldown').textContent = game.hero.aoeCooldown.toFixed(1)
                    } else {
                        aoeBtn.classList.remove('on-cooldown')
                    }
                }

                // Update tower buttons
                document.querySelectorAll('.tower-btn').forEach((btn) => {
                    const type = btn.dataset.type
                    const def = TOWER_DEFS[type]
                    if (game.gold < def.cost) btn.classList.add('disabled')
                    else btn.classList.remove('disabled')
                    if (game.selectedTowerType === type) btn.classList.add('selected')
                    else btn.classList.remove('selected')
                })

                // Upgrade button
                const upgradeBtn = document.getElementById('upgradeBtn')
                if (game.selectedPlacedTower && game.selectedPlacedTower.level < 3) {
                    const t = game.selectedPlacedTower
                    const def = TOWER_DEFS[t.type]
                    const cost = def.upgradeCost[t.level]
                    upgradeBtn.textContent = `NÂNG CẤP (💰${cost})`
                    upgradeBtn.classList.remove('max-level')
                    upgradeBtn.disabled = game.gold < cost
                } else if (game.selectedPlacedTower && game.selectedPlacedTower.level >= 3) {
                    upgradeBtn.textContent = 'TỐI ĐA'
                    upgradeBtn.classList.add('max-level')
                } else {
                    upgradeBtn.textContent = 'NÂNG CẤP'
                    upgradeBtn.classList.remove('max-level')
                }

                // Wave button
                const waveBtn = document.getElementById('waveBtn')
                if (game.waveActive || game.wave >= game.maxWaves) {
                    waveBtn.classList.add('hidden')
                } else {
                    waveBtn.classList.remove('hidden')
                }
            }

            function useSkill(skill) {
                if (!game.hero) return
                if (skill === 'dash' && game.hero.dashCooldown <= 0) {
                    keys[' '] = true
                    setTimeout(() => (keys[' '] = false), 100)
                } else if (skill === 'aoe' && game.hero.aoeCooldown <= 0) {
                    keys['q'] = true
                    setTimeout(() => (keys['q'] = false), 100)
                }
            }

            function selectTower(type) {
                initAudio()
                if (game.selectedTowerType === type) {
                    game.selectedTowerType = null
                } else {
                    game.selectedTowerType = type
                    game.selectedPlacedTower = null
                    document.getElementById('sellInfo').style.display = 'none'
                }
                // Show aura radius preview in UI when selecting aura type
                updateUI()
            }

            function sellTower() {
                if (!game.selectedPlacedTower) return
                const t = game.selectedPlacedTower
                const refund = Math.floor(t.totalCost * 0.6)
                game.gold += refund
                game.towers = game.towers.filter((tw) => tw !== t)
                game.selectedPlacedTower = null
                document.getElementById('sellInfo').style.display = 'none'
                playSound('sell')
                updateUI()
            }

            function upgradeTower() {
                if (!game.selectedPlacedTower) return
                const t = game.selectedPlacedTower
                if (t.level >= 3) return
                const def = TOWER_DEFS[t.type]
                const cost = def.upgradeCost[t.level]
                if (game.gold < cost) return
                game.gold -= cost
                t.level++
                t.damage = def.damage * (t.level === 2 ? 1.4 : 1.8)
                t.range = def.range * (t.level === 2 ? 1.1 : 1.2)
                t.fireRate = def.fireRate * (t.level === 2 ? 1.15 : 1.3)
                t.bulletSpeed = def.bulletSpeed * (t.level === 2 ? 1.05 : 1.1)
                t.totalCost += cost
                t.upgradeAnim = 1
                if (t.level === 3) {
                    if (def.pierce) t.pierce = def.pierce + 1
                    if (def.burst) t.burst = def.burst + 2
                    if (def.splash !== undefined) t.splash = 30
                }
                playSound('upgrade')
                updateUI()
            }

            // ============ INPUT ============
            window.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true
            })
            window.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false
            })

            canvas.addEventListener('mousedown', (e) => {
                isDragging = true
                dragStartX = e.clientX
                dragStartY = e.clientY
            })

            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect()
                const scaleX = W / rect.width,
                    scaleY = H / rect.height
                const mx = (e.clientX - rect.left) * scaleX
                const my = (e.clientY - rect.top) * scaleY
                // Convert screen to world coordinates
                const wx = mx - (W / 2 - game.cameraX)
                const wy = my - (H / 2 - game.cameraY)
                const col = Math.floor(wx / CELL)
                const row = Math.floor(wy / CELL)
                game.hoveredCell = { col, row, mx, my, wx, wy }

                if (isDragging && game.hero) {
                    game.hero.x = wx
                    game.hero.y = wy
                }
            })

            canvas.addEventListener('mouseleave', () => {
                game.hoveredCell = null
            })

            canvas.addEventListener('mouseup', () => {
                isDragging = false
            })

            canvas.addEventListener('click', (e) => {
                initAudio()
                if (game.gameOver) return
                const rect = canvas.getBoundingClientRect()
                const scaleX = W / rect.width,
                    scaleY = H / rect.height
                const mx = (e.clientX - rect.left) * scaleX
                const my = (e.clientY - rect.top) * scaleY
                // Convert screen to world coordinates
                const wx = mx - (W / 2 - game.cameraX)
                const wy = my - (H / 2 - game.cameraY)
                const col = Math.floor(wx / CELL)
                const row = Math.floor(wy / CELL)

                if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return

                // Check if clicking existing tower
                const existing = game.towers.find((t) => t.col === col && t.row === row)
                if (existing && !game.selectedTowerType) {
                    game.selectedPlacedTower = existing
