                    const sellInfo = document.getElementById('sellInfo')
                    const def = TOWER_DEFS[existing.type]
                    const refund = Math.floor(existing.totalCost * 0.6)
                    let lvText = 'Lv.' + existing.level
                    if (existing.level < 3) {
                        lvText += ' → ' + (existing.level + 1) + ' (💰' + def.upgradeCost[existing.level] + ')'
                    } else {
                        lvText += ' (MAX)'
                    }
                    // Show buff info for aura towers
                    let buffInfo = ''
                    if (existing.type.startsWith('aura')) {
                        const bv = def.buffValue[existing.level]
                        buffInfo = ` | Buff: Dmg+${bv.damage} Spd+${bv.speed} Rng+${bv.range}`
                    }
                    document.getElementById('sellLv').textContent = lvText + ' | Bán: 💰' + refund + buffInfo
                    sellInfo.style.display = 'block'
                    sellInfo.style.left = e.clientX - rect.left + 'px'
                    sellInfo.style.top = e.clientY - rect.top - 40 + 'px'
                    updateUI()
                    return
                }

                if (game.selectedTowerType) {
                    const key = col + ',' + row
                    const isPath = pathCells.has(key)
                    const hasTower = game.towers.some((t) => t.col === col && t.row === row)
                    const def = TOWER_DEFS[game.selectedTowerType]
                    if (!isPath && !hasTower && game.gold >= def.cost) {
                        game.gold -= def.cost
                        const tower = createTower(game.selectedTowerType, col, row)
                        game.towers.push(tower)
                        playSound('place')
                        game.selectedTowerType = null
                        updateUI()
                    }
                } else {
                    game.selectedPlacedTower = null
                    document.getElementById('sellInfo').style.display = 'none'
                }
            })

            // ============ GAME LOOP ============
            function updateHero(hero, dt) {
                // Input movement
                hero.vx = 0
                hero.vy = 0
                if (keys['w'] || keys['arrowup']) hero.vy -= hero.speed
                if (keys['s'] || keys['arrowdown']) hero.vy += hero.speed
                if (keys['a'] || keys['arrowleft']) hero.vx -= hero.speed
                if (keys['d'] || keys['arrowright']) hero.vx += hero.speed
                // Normalize diagonal
                if (hero.vx !== 0 && hero.vy !== 0) {
                    hero.vx *= 0.707
                    hero.vy *= 0.707
                }
                // Update position
                hero.x += hero.vx * dt
                hero.y += hero.vy * dt
                // Clamp to map
                hero.x = Math.max(20, Math.min(W - 20, hero.x))
                hero.y = Math.max(20, Math.min(H - 20, hero.y))

                // Auto attack
                hero.cooldown -= dt
                if (hero.cooldown <= 0) {
                    let target = null
                    let minDist = Infinity
                    for (const e of game.enemies) {
                        if (!e.alive) continue
                        const dx = e.x - hero.x,
                            dy = e.y - hero.y
                        const dist = dx * dx + dy * dy
                        if (dist <= hero.range * hero.range && dist < minDist) {
                            minDist = dist
                            target = e
                        }
                    }
                    if (target) {
                        hero.cooldown = 1 / hero.fireRate
                        const bullet = {
                            x: hero.x,
                            y: hero.y,
                            target,
                            damage: hero.damage,
                            speed: 300,
                            color: '#ffaa44',
                            alive: true,
                            trail: [],
                            trailTimer: 0,
                        }
                        game.bullets.push(bullet)
                    }
                }

                // Skills
                hero.dashCooldown -= dt
                hero.aoeCooldown -= dt
                hero.invincibilityTimer -= dt
                if (hero.invincibilityTimer <= 0) hero.invincible = false

                // Dash
                if (keys[' '] && hero.dashCooldown <= 0) {
                    hero.dashCooldown = 5
                    hero.invincible = true
                    hero.invincibilityTimer = 0.2
                    // Store after images
                    hero.afterImages = []
                    const dashDist = hero.dashSpeed * 0.2
                    const dirX = hero.vx || Math.random() - 0.5
                    const dirY = hero.vy || Math.random() - 0.5
                    const len = Math.sqrt(dirX * dirX + dirY * dirY)
                    if (len > 0) {
                        const dx = (dirX / len) * dashDist
                        const dy = (dirY / len) * dashDist
                        hero.x += dx
                        hero.y += dy
                        // After images
                        for (let i = 1; i <= 3; i++) {
                            hero.afterImages.push({
                                x: hero.x - dx * i * 0.3,
                                y: hero.y - dy * i * 0.3,
                                alpha: 0.5 - i * 0.1,
                            })
                        }
                    }
                }

                // AoE
                if (keys['q'] && hero.aoeCooldown <= 0) {
                    hero.aoeCooldown = 8
                    for (const e of game.enemies) {
                        if (!e.alive) continue
                        const dx = e.x - hero.x,
                            dy = e.y - hero.y
                        const dist = Math.sqrt(dx * dx + dy * dy)
                        if (dist <= hero.aoeRadius) {
                            damageEnemy(e, hero.aoeDamage)
                            const knockback = hero.aoeKnockback / dist
                            e.x += (dx / dist) * knockback
                            e.y += (dy / dist) * knockback
                        }
                    }
                    // Particles for AoE
                    for (let i = 0; i < 10; i++) {
                        const angle = (i / 10) * Math.PI * 2
                        const px = hero.x + Math.cos(angle) * hero.aoeRadius
                        const py = hero.y + Math.sin(angle) * hero.aoeRadius
                        spawnHitParticles(px, py, '#ff4466')
                    }
                }

                // Level up
                if (hero.exp >= hero.expToNext) {
                    hero.exp -= hero.expToNext
                    hero.level++
                    hero.expToNext = hero.level * 100
                    hero.damage += 5
                    hero.range += 10
                    hero.fireRate += 0.1
                    hero.maxHp += 20
                    hero.hp = hero.maxHp
                    hero.dashCooldown = Math.max(3, hero.dashCooldown - 0.5)
                    hero.aoeCooldown = Math.max(5, hero.aoeCooldown - 0.5)
                }

                // Animations
                hero.scaleAnim += (1 - hero.scaleAnim) * dt * 8
                hero.idleTimer += dt
                if (hero.idleTimer > 1) {
                    hero.idleTimer = 0
                    hero.scaleAnim = 1.05
                }

                // After images fade
                for (let ai of hero.afterImages) ai.alpha -= dt * 2
                hero.afterImages = hero.afterImages.filter((ai) => ai.alpha > 0)

                // Flash
                if (hero.flashFrames > 0) {
                    hero.flashFrames--
                    game.shakeAmount = Math.min(8, game.shakeAmount + 1)
                    game.shakeDuration = 0.15
                }
            }

            function updateAuraBuffs() {
                // Reset buffs
                for (const t of game.towers) {
                    t.buffs = { damage: 0, speed: 0, range: 0 }
                }
                // Apply aura buffs
                for (const aura of game.towers) {
                    if (!aura.type.startsWith('aura')) continue
                    const def = TOWER_DEFS[aura.type]
                    const radius = def.radius[aura.level]
                    const buffs = def.buffValue[aura.level]
                    for (const t of game.towers) {
                        if (t === aura) continue
                        const dx = t.x - aura.x,
                            dy = t.y - aura.y
                        if (dx * dx + dy * dy <= radius * radius) {
                            t.buffs.damage = Math.max(t.buffs.damage, buffs.damage)
                            t.buffs.speed = Math.max(t.buffs.speed, buffs.speed)
                            t.buffs.range = Math.max(t.buffs.range, buffs.range)
                            if (t.scaleBuffAnim <= 0) t.scaleBuffAnim = 1
                        }
                    }
                }
            }

            function update(dt) {
                if (game.gameOver) return
                game.time += dt

                // Shake
                if (game.shakeDuration > 0) {
                    game.shakeDuration -= dt
                    if (game.shakeDuration <= 0) game.shakeAmount = 0
                }

                // Ambient particles
                updateAmbientParticles(dt)

                // Spawning
                updateSpawning(dt)

                // Check wave complete
                if (game.waveActive && game.spawnQueue.length === 0) {
                    const allDone = game.enemies.every((e) => !e.alive)
                    if (allDone) {
                        game.waveActive = false
                        game.gold += 15 + game.wave * 5 // Wave bonus
                        updateUI()
                        if (game.wave >= game.maxWaves) {
                            endGame(true)
                        }
                    }
                }

                // Enemies
                for (const e of game.enemies) updateEnemy(e, dt)
                const deadEnemies = game.enemies.filter((e) => !e.alive)
                for (const e of deadEnemies) {
                    for (const s of e.statusList) {
                        returnToPool(statusPool, s)
                    }
                    e.statusList.length = 0
                }
                game.enemies = game.enemies.filter((e) => e.alive)

                // Aura buffs (cache 0.5s)
                game.auraUpdateTimer += dt
                if (game.auraUpdateTimer >= 0.5) {
                    game.auraUpdateTimer = 0
                    updateAuraBuffs()
                }

                // Towers
                for (const t of game.towers) updateTower(t, dt)

                // Hero
                if (game.hero) updateHero(game.hero, dt)

                // Bullets
                for (const b of game.bullets) updateBullet(b, dt)
                const deadBullets = game.bullets.filter((b) => !b.alive)
                for (const b of deadBullets) returnToPool(bulletPool, b)
                game.bullets = game.bullets.filter((b) => b.alive)

                // Particles
                for (const p of game.particles) updateParticle(p, dt)
                const deadParticles = game.particles.filter((p) => !p.alive)
                for (const p of deadParticles) returnToPool(particlePool, p)
                game.particles = game.particles.filter((p) => p.alive)
            }

            // UI: Mini lane indicator (3 dots + density bar)
            function drawHero(hero) {
                // After images
                for (const ai of hero.afterImages) {
                    ctx.globalAlpha = ai.alpha * 0.3
                    ctx.fillStyle = '#ffaa44'
                    ctx.shadowColor = '#ffaa44'
                    ctx.shadowBlur = 15
                    ctx.beginPath()
                    ctx.arc(ai.x, ai.y, 20 * ai.alpha, 0, Math.PI * 2)
                    ctx.fill()
                }
                ctx.globalAlpha = 1

                // Hero body
                ctx.shadowColor = '#ffaa44'
                ctx.shadowBlur = 20
                ctx.fillStyle = hero.invincible ? '#ffffff' : '#ffaa44'
                ctx.beginPath()
                ctx.arc(hero.x, hero.y, 20 * hero.scaleAnim, 0, Math.PI * 2)
                ctx.fill()

                // Inner highlight
                ctx.fillStyle = 'rgba(255,255,255,0.5)'
                ctx.beginPath()
                ctx.arc(hero.x - 5, hero.y - 5, 10, 0, Math.PI * 2)
                ctx.fill()
            }

            function drawLaneIndicator() {
                const ix = W - 60,
                    iy = 60
                const dotR = 6
                const gap = 18
                for (let laneID = 0; laneID < 3; laneID++) {
                    const colors = LANE_COLORS[laneID]
                    const count = game.enemies.filter((e) => e.alive && e.laneID === laneID).length
                    const maxCount = MAX_ENEMY_PER_LANE
                    const ratio = Math.min(1, count / maxCount)

                    // Dot background
                    ctx.fillStyle = 'rgba(0,0,0,0.5)'
                    ctx.beginPath()
                    ctx.arc(ix, iy + laneID * gap, dotR + 2, 0, Math.PI * 2)
                    ctx.fill()

                    // Dot color by lane
                    ctx.fillStyle = colors.stroke.replace('0.09', '0.8')
                    ctx.beginPath()
                    ctx.arc(ix, iy + laneID * gap, dotR, 0, Math.PI * 2)
                    ctx.fill()

                    // Pulse if > 5 enemies
                    if (count > 5) {
                        ctx.save()
                        ctx.shadowColor = 'rgba(255,60,60,0.7)'
                        ctx.shadowBlur = 12
                        ctx.strokeStyle = `rgba(255,60,60,${0.4 + 0.3 * Math.sin(game.time * 6)})`
                        ctx.lineWidth = 2
                        ctx.beginPath()
                        ctx.arc(ix, iy + laneID * gap, dotR + 4, 0, Math.PI * 2)
                        ctx.stroke()
                        ctx.restore()
                    }

                    // Count text
                    ctx.fillStyle = '#fff'
                    ctx.font = 'bold 9px sans-serif'
                    ctx.textAlign = 'left'
                    ctx.fillText(count, ix + 12, iy + laneID * gap + 3)

                    // Small density bar
                    ctx.fillStyle = 'rgba(255,255,255,0.1)'
                    ctx.fillRect(ix + 22, iy + laneID * gap - 3, 30, 4)
                    ctx.fillStyle = count > 5 ? 'rgba(255,80,80,0.7)' : colors.stroke.replace('0.09', '0.6')
                    ctx.fillRect(ix + 22, iy + laneID * gap - 3, 30 * ratio, 4)
                }
                // Label
                ctx.fillStyle = 'rgba(255,255,255,0.5)'
                ctx.font = 'bold 8px sans-serif'
                ctx.textAlign = 'left'
                ctx.fillText('LANES', ix - 2, iy - 12)
            }

            function draw() {
                // Clear entire canvas to prevent trailing artifacts
                ctx.fillStyle = '#0a0a1a'
                ctx.fillRect(0, 0, canvas.width, canvas.height)

                ctx.save()

                // Camera shake
                if (game.shakeAmount > 0 && game.shakeDuration > 0) {
                    const sx = (Math.random() - 0.5) * game.shakeAmount * 2
                    const sy = (Math.random() - 0.5) * game.shakeAmount * 2
                    ctx.translate(sx, sy)
                }

                // Camera follow Hero
                if (game.hero) {
                    game.cameraX = lerp(game.cameraX, game.hero.x, 0.05)
                    game.cameraY = lerp(game.cameraY, game.hero.y, 0.05)
                    ctx.translate(-game.cameraX + W / 2, -game.cameraY + H / 2)
                }

                drawMap()
                drawHoverPreview()
                drawBuildPreview()

                // Towers
                for (const t of game.towers) drawTower(t)

                // Enemies
                for (const e of game.enemies) drawEnemy(e)

                // Hero (drawn after enemies for proper layering)
                if (game.hero) drawHero(game.hero)

                // Bullets
                for (const b of game.bullets) drawBullet(b)

                // Particles
                for (const p of game.particles) drawParticle(p)

                ctx.restore()

                // Lane indicator UI (outside camera)
                drawLaneIndicator()
            }

            function lerpColor(color1, color2, amount) {
                const parseHex = (hex) => {
                    hex = hex.replace('#', '')
                    if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2]
                    return [
                        parseInt(hex.substring(0, 2), 16),
                        parseInt(hex.substring(2, 4), 16),
                        parseInt(hex.substring(4, 6), 16),
                    ]
                }
                const c1 = parseHex(color1),
                    c2 = parseHex(color2)
                const r = Math.round(c1[0] + (c2[0] - c1[0]) * amount)
                const g = Math.round(c1[1] + (c2[1] - c1[1]) * amount)
                const b = Math.round(c1[2] + (c2[2] - c1[2]) * amount)
                return `rgb(${r},${g},${b})`
            }

            function gameLoop(timestamp) {
                if (!game.lastTime) game.lastTime = timestamp
                let dt = (timestamp - game.lastTime) / 1000
                game.lastTime = timestamp
                dt = Math.min(dt, 0.05) // Cap delta

                update(dt)
                draw()
                requestAnimationFrame(gameLoop)
            }

            // ============ GAME CONTROL ============
            function startGame() {
                initAudio()
                document.getElementById('overlay').classList.add('hidden')
                game.hp = 20
                game.maxHp = 20
                game.gold = 200
                game.wave = 0
                game.enemies = []
                game.towers = []
                game.bullets = []
                game.particles = []
                game.waveActive = false
                game.spawnQueue = []
                game.gameOver = false
                game.selectedTowerType = null
                game.selectedPlacedTower = null
                game.shakeAmount = 0
                game.time = 0
                game.auraUpdateTimer = 0
                game.hero = createHero()
                game.cameraX = W / 2
                game.cameraY = H / 2
                ambientParticles.length = 0
                updateUI()
            }

            function endGame(won) {
                game.gameOver = true
                const overlay = document.getElementById('overlay')
                overlay.classList.remove('hidden')
                overlay.querySelector('h1').textContent = won ? '🎉 CHIẾN THẮNG!' : '💀 TRÒ CHƠI KẾT THÚC'
                overlay.querySelector('p').textContent = won
                    ? `Bạn đã sống sót qua tất cả ${game.maxWaves} đợt tấn công!`
                    : `You fell on wave ${game.wave}.`
                overlay.querySelector('button').textContent = 'CHƠI LẠI'
            }

            // ============ START ============
            updateUI()
            requestAnimationFrame(gameLoop)

            // Init buffs for existing towers (backward compatible)
            for (const t of game.towers) {
                if (!t.buffs) t.buffs = { damage: 0, speed: 0, range: 0 }
            }
        </script>
    </body>
</html>
