<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Neon Cat Platformer</title>
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23ff69b4'/><stop offset='100%25' stop-color='%23ff44aa'/></linearGradient></defs><ellipse cx='16' cy='18' rx='10' ry='11' fill='url(%23g)'/><ellipse cx='10' cy='10' rx='4' ry='5' fill='url(%23g)'/><ellipse cx='22' cy='10' rx='4' ry='5' fill='url(%23g)'/><circle cx='9' cy='9' r='1.5' fill='%230a0a1a'/><circle cx='21' cy='9' r='1.5' fill='%230a0a1a'/><ellipse cx='16' cy='15' rx='1.5' ry='1' fill='%230a0a1a'/></svg>"
            type="image/svg+xml"
        />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background: #0a0a1a;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                overflow: hidden;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            canvas {
                border-radius: 8px;
                box-shadow: 0 0 40px rgba(150, 100, 255, 0.3);
            }
        </style>
    </head>
    <body>
        <canvas id="gameCanvas"></canvas>
        <script>
            // ============================================================
            // CONFIGURATION
            // ============================================================
            const CONFIG = {
                WIDTH: 960,
                HEIGHT: 540,
                GRAVITY: 1200,
                PLAYER_SPEED: 280,
                PLAYER_JUMP: -520,
                ENEMY_SPEED: 80,
                CAMERA_SMOOTH: 0.08,
                SHAKE_DURATION: 0.3,
                SHAKE_INTENSITY: 8,
                MAX_PARTICLES: 200,
                JUMP_DUST_MAX: 20,
                BIOME_DISTANCE: 500,
                BIOMES: {
                    ice: {
                        name: 'ICE',
                        bg1: '#0a1a2e',
                        bg2: '#1a2a4e',
                        bg3: '#2a3a5e',
                        platform: '#66ccff',
                        platformGlow: '#88ddff',
                        particle: '#aaddff',
                        text: '#cceeff',
                        fogColor: 'rgba(150, 200, 255, 0.15)',
                        gameSpeed: 1.0,
                        friction: 0.92,
                        enemyMult: 1.0,
                    },
                    lava: {
                        name: 'LAVA',
                        bg1: '#2e0a0a',
                        bg2: '#4e1a1a',
                        bg3: '#5e2a1a',
                        platform: '#ff6622',
                        platformGlow: '#ff8844',
                        particle: '#ffaa44',
                        text: '#ffcc88',
                        fogColor: 'rgba(255, 100, 50, 0.2)',
                        gameSpeed: 1.0,
                        friction: 1.0,
                        enemyMult: 1.2,
                    },
                    cyber: {
                        name: 'CYBER',
                        bg1: '#1a0a2e',
                        bg2: '#2a1a4e',
                        bg3: '#3a2a5e',
                        platform: '#ff44aa',
                        platformGlow: '#ff66cc',
                        particle: '#ff88ff',
                        text: '#ffaaff',
                        fogColor: 'rgba(200, 100, 255, 0.15)',
                        gameSpeed: 1.15,
                        friction: 1.0,
                        enemyMult: 1.4,
                    },
                },
                COLORS: {
                    bg1: '#0a0a2e',
                    bg2: '#1a0a3e',
                    bg3: '#2a1a4e',
                    platform: '#7b68ee',
                    platformGlow: '#9b88ff',
                    player: '#ffb6c1',
                    playerDark: '#ff69b4',
                    enemy: '#ff6b6b',
                    enemyDark: '#ee4444',
                    fish: '#ffd700',
                    fishGlow: '#ffec80',
                    flag: '#00ff88',
                    flagGlow: '#88ffbb',
                    text: '#ffffff',
                    neonPink: '#ff6ec7',
                    neonBlue: '#7b68ee',
                    neonPurple: '#b44dff',
                    particle: '#ffb6c1',
                },
            }

            // ============================================================
            // POLYFILL for roundRect
            // ============================================================
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                    if (typeof r === 'number')
                        r = [
                            r,
                            r,
                            r,
                            r,
                        ]
                    else if (Array.isArray(r)) {
                        if (r.length === 1)
                            r = [
                                r[0],
                                r[0],
                                r[0],
                                r[0],
                            ]
                        else if (r.length === 2)
                            r = [
                                r[0],
                                r[1],
                                r[0],
                                r[1],
                            ]
                        else if (r.length === 3)
                            r = [
                                r[0],
                                r[1],
                                r[2],
                                r[1],
                            ]
                        else
                            r = [
                                r[0] || 0,
                                r[1] || 0,
                                r[2] || 0,
                                r[3] || 0,
                            ]
                    } else
                        r = [
                            0,
                            0,
                            0,
                            0,
                        ]
                    this.moveTo(x + r[0], y)
                    this.lineTo(x + w - r[1], y)
                    this.quadraticCurveTo(x + w, y, x + w, y + r[1])
                    this.lineTo(x + w, y + h - r[2])
                    this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h)
                    this.lineTo(x + r[3], y + h)
                    this.quadraticCurveTo(x, y + h, x, y + h - r[3])
                    this.lineTo(x, y + r[0])
                    this.quadraticCurveTo(x, y, x + r[0], y)
                    this.closePath()
                    return this
                }
            }

            // ============================================================
            // CANVAS SETUP
            // ============================================================
            const canvas = document.getElementById('gameCanvas')
            const ctx = canvas.getContext('2d')
            canvas.width = CONFIG.WIDTH
            canvas.height = CONFIG.HEIGHT

            // ============================================================
            // AUDIO MANAGER (Web Audio API)
            // ============================================================
            class AudioManager {
                constructor() {
                    this.ctx = null
                    this.initialized = false
                }
                init() {
                    if (this.initialized) return
                    try {
                        this.ctx = new (window.AudioContext || window.webkitAudioContext)()
                        this.initialized = true
                    } catch (e) {
                        console.log('Audio not available')
                    }
                }
                playTone(freq, duration, type = 'square', volume = 0.15, slide = 0) {
                    if (!this.initialized) return
                    const osc = this.ctx.createOscillator()
                    const gain = this.ctx.createGain()
                    osc.type = type
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime)
                    if (slide) osc.frequency.linearRampToValueAtTime(freq + slide, this.ctx.currentTime + duration)
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime)
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration)
                    osc.connect(gain)
                    gain.connect(this.ctx.destination)
                    osc.start(this.ctx.currentTime)
                    osc.stop(this.ctx.currentTime + duration)
                }
                jump() {
                    this.playTone(400, 0.15, 'square', 0.12, 300)
                    this.playTone(600, 0.1, 'sine', 0.08, 200)
                }
                collect() {
                    this.playTone(800, 0.1, 'sine', 0.12, 400)
                    setTimeout(() => this.playTone(1200, 0.15, 'sine', 0.1, 200), 60)
                }
                hit() {
                    this.playTone(150, 0.3, 'sawtooth', 0.15, -100)
                    this.playTone(100, 0.2, 'square', 0.1, -50)
                }
                stomp() {
                    this.playTone(300, 0.15, 'square', 0.12, -200)
                    this.playTone(500, 0.1, 'sine', 0.08)
                }
                win() {
                    ;[
                        0,
                        100,
                        200,
                        300,
                        400,
                    ].forEach((d, i) => {
                        setTimeout(() => this.playTone(500 + i * 100, 0.2, 'sine', 0.1), d)
                    })
                }
                lose() {
                    ;[
                        0,
                        150,
                        300,
                    ].forEach((d, i) => {
                        setTimeout(() => this.playTone(400 - i * 100, 0.3, 'sawtooth', 0.1), d)
                    })
                }
                petBuff() {
                    this.playTone(600, 0.1, 'sine', 0.08, 200)
                    this.playTone(800, 0.1, 'sine', 0.08, 300)
                }
            }

            // ============================================================
            // INPUT HANDLER
            // ============================================================
            class InputHandler {
                constructor() {
                    this.keys = {}
                    this.justPressed = {}
                    this.prevKeys = {}
                    window.addEventListener('keydown', (e) => {
                        e.preventDefault()
                        this.keys[e.code] = true
                    })
                    window.addEventListener('keyup', (e) => {
                        e.preventDefault()
                        this.keys[e.code] = false
                    })
                }
                update() {
                    for (const key in this.keys) {
                        this.justPressed[key] = this.keys[key] && !this.prevKeys[key]
                        this.prevKeys[key] = this.keys[key]
                    }
                }
                isDown(code) {
                    return !!this.keys[code]
                }
                isJustPressed(code) {
                    return !!this.justPressed[code]
                }
            }

            // ============================================================
            // PARTICLE SYSTEM (Object Pool)
            // ============================================================
            class Particle {
                constructor() {
                    this.reset()
                }
                reset() {
                    this.x = 0
                    this.y = 0
                    this.vx = 0
                    this.vy = 0
                    this.life = 0
                    this.maxLife = 0
                    this.size = 0
                    this.color = '#fff'
                    this.active = false
                    this.gravity = 0
                    this.alpha = 1
                    this.scale = 1
                    this.type = 'circle'
                }
                init(x, y, vx, vy, life, size, color, gravity = 0, type = 'circle') {
                    this.x = x
                    this.y = y
                    this.vx = vx
                    this.vy = vy
                    this.life = life
                    this.maxLife = life
                    this.size = size
                    this.color = color
                    this.active = true
                    this.gravity = gravity
                    this.alpha = 1
                    this.scale = 1
                    this.type = type
                }
                update(dt) {
                    if (!this.active) return
                    this.life -= dt
                    if (this.life <= 0) {
                        this.active = false
                        return
                    }
                    this.vy += this.gravity * dt
                    this.x += this.vx * dt
                    this.y += this.vy * dt
                    this.alpha = Math.max(0, this.life / this.maxLife)
                    this.scale = 0.5 + 0.5 * (this.life / this.maxLife)
                }
                draw(ctx, camX, camY) {
                    if (!this.active) return
                    const sx = this.x - camX
                    const sy = this.y - camY
                    ctx.globalAlpha = this.alpha
                    ctx.fillStyle = this.color
                    if (this.type === 'circle') {
                        ctx.beginPath()
                        ctx.arc(sx, sy, this.size * this.scale, 0, Math.PI * 2)
                        ctx.fill()
                    } else if (this.type === 'star') {
                        this.drawStar(ctx, sx, sy, this.size * this.scale)
                    } else if (this.type === 'text') {
                        ctx.font = `bold ${this.size}px 'Segoe UI'`
                        ctx.textAlign = 'center'
                        ctx.fillText(this.color, sx, sy)
                    }
                    ctx.globalAlpha = 1
                }
                drawStar(ctx, x, y, r) {
                    ctx.beginPath()
                    for (let i = 0; i < 5; i++) {
                        const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2
                        ctx.lineTo(x + Math.cos(angle) * r, y + Math.sin(angle) * r)
                    }
                    ctx.closePath()
                    ctx.fill()
                }
            }

            class ParticleSystem {
                constructor(maxParticles) {
                    this.pool = []
                    for (let i = 0; i < maxParticles; i++) {
                        this.pool.push(new Particle())
                    }
                    this.jumpDustCount = 0
                }
                getInactive() {
                    for (let i = 0; i < this.pool.length; i++) {
                        if (!this.pool[i].active) return this.pool[i]
                    }
                    return null
                }
                emit(x, y, vx, vy, life, size, color, gravity = 0, type = 'circle') {
                    const p = this.getInactive()
                    if (p) p.init(x, y, vx, vy, life, size, color, gravity, type)
                    return p
                }
                emitJumpDust(x, y) {
                    if (this.jumpDustCount >= CONFIG.JUMP_DUST_MAX) return
                    for (let i = 0; i < 5; i++) {
                        const p = this.getInactive()
                        if (p) {
                            p.init(
                                x + (Math.random() - 0.5) * 20,
                                y,
                                (Math.random() - 0.5) * 60,
                                -Math.random() * 80 - 20,
                                0.3 + Math.random() * 0.2,
                                3 + Math.random() * 3,
                                CONFIG.COLORS.particle,
                                200,
                            )
                            this.jumpDustCount++
                        }
                    }
                }
                emitCollectBurst(x, y) {
                    for (let i = 0; i < 12; i++) {
                        const angle = (i / 12) * Math.PI * 2
                        const speed = 80 + Math.random() * 60
                        this.emit(
                            x,
                            y,
                            Math.cos(angle) * speed,
                            Math.sin(angle) * speed,
                            0.4 + Math.random() * 0.3,
                            3 + Math.random() * 4,
                            CONFIG.COLORS.fishGlow,
                            100,
                            'star',
                        )
                    }
                }
                emitScorePopup(x, y, text) {
                    const p = this.getInactive()
                    if (p) {
                        p.init(x, y, 0, -60, 1.0, 18, text, 0, 'text')
                    }
                }
                emitStompBurst(x, y) {
                    for (let i = 0; i < 15; i++) {
                        const angle = (i / 15) * Math.PI * 2
                        const speed = 100 + Math.random() * 80
                        this.emit(
                            x,
                            y,
                            Math.cos(angle) * speed,
                            Math.sin(angle) * speed,
                            0.3 + Math.random() * 0.3,
                            4 + Math.random() * 5,
                            '#ffffff',
                            150,
                            'circle',
                        )
                    }
                }
                emitDeathBurst(x, y) {
                    for (let i = 0; i < 20; i++) {
                        const angle = (i / 20) * Math.PI * 2
                        const speed = 60 + Math.random() * 120
                        this.emit(
                            x,
                            y,
                            Math.cos(angle) * speed,
                            Math.sin(angle) * speed - 50,
                            0.5 + Math.random() * 0.5,
                            4 + Math.random() * 6,
                            CONFIG.COLORS.enemy,
                            200,
                            'circle',
                        )
                    }
                }
                update(dt) {
                    let dustActive = 0
                    for (let i = 0; i < this.pool.length; i++) {
                        this.pool[i].update(dt)
                        if (this.pool[i].active && this.pool[i].gravity > 0) dustActive++
                    }
                    this.jumpDustCount = dustActive
                }
                draw(ctx, camX, camY) {
                    for (let i = 0; i < this.pool.length; i++) {
                        this.pool[i].draw(ctx, camX, camY)
                    }
                }
            }

            // ============================================================
            // PLATFORM CLASS
            // ============================================================
            class Platform {
                constructor(x, y, w, h, type = 'normal', moveConfig = null) {
                    this.x = x
                    this.y = y
                    this.w = w
                    this.h = h
                    this.type = type
                    this.glowPulse = 0

                    // Moving platform config
                    this.moveConfig = moveConfig
                    this.startX = x
                    this.startY = y
                    this.moveOffset = 0
                    this.currentVx = 0

                    // Glow trail
                    this.trailAlpha = 0
                }
                update(dt) {
                    this.glowPulse += dt * 2

                    // Handle moving platforms
                    if (this.moveConfig) {
                        const range = this.moveConfig.range || 100
                        const speed = this.moveConfig.speed || 60

                        // Smooth sine movement using easing
                        this.moveOffset += speed * dt
                        const pos = this.moveOffset / range
                        const eased = Math.sin(pos * Math.PI * 2)
                        this.currentVx = eased * speed

                        // Calculate new position
                        const originalRange = this.moveConfig.range || 100
                        const displacement =
                            Math.sin((this.moveOffset / originalRange) * Math.PI * 2) * (originalRange / Math.PI)
                        this.x = this.startX + displacement

                        // Trail effect
                        this.trailAlpha = (Math.abs(displacement) / originalRange) * 0.3
                    }
                }
                draw(ctx, camX, camY, biomeKey = 'cyber') {
                    const sx = this.x - camX
                    const sy = this.y - camY
                    const glowAmount = 0.5 + 0.5 * Math.sin(this.glowPulse)

                    // Get biome colors
                    const biome = CONFIG.BIOMES[biomeKey] || CONFIG.BIOMES.cyber
                    const platformColor = biome.platform
                    const platformGlow = biome.platformGlow

                    // Draw glow trail for moving platforms
                    if (this.moveConfig && this.moveOffset > 0) {
                        const trailX = sx + (this.startX - this.x)
                        ctx.fillStyle = platformGlow.replace(')', ', 0.3)')
                        ctx.globalAlpha = this.trailAlpha * 0.3
                        ctx.fillRect(trailX + 4, sy + 2, this.w - 8, this.h - 4)
                        ctx.globalAlpha = 1
                    }

                    // Shadow with biome color
                    ctx.shadowColor = platformGlow
                    ctx.shadowBlur = 10 + glowAmount * 12

                    // Platform body
                    const grad = ctx.createLinearGradient(sx, sy, sx, sy + this.h)
                    grad.addColorStop(0, platformColor)
                    grad.addColorStop(1, platformColor)
                    ctx.fillStyle = grad

                    // Rounded rect
                    const r = 6
                    ctx.beginPath()
                    ctx.moveTo(sx + r, sy)
                    ctx.lineTo(sx + this.w - r, sy)
                    ctx.quadraticCurveTo(sx + this.w, sy, sx + this.w, sy + r)
                    ctx.lineTo(sx + this.w, sy + this.h - r)
                    ctx.quadraticCurveTo(sx + this.w, sy + this.h, sx + this.w - r, sy + this.h)
                    ctx.lineTo(sx + r, sy + this.h)
                    ctx.quadraticCurveTo(sx, sy + this.h, sx, sy + this.h - r)
                    ctx.lineTo(sx, sy + r)
                    ctx.quadraticCurveTo(sx, sy, sx + r, sy)
                    ctx.closePath()
                    ctx.fill()

                    // Top highlight
                    ctx.shadowBlur = 0
                    ctx.fillStyle = platformGlow
                    ctx.globalAlpha = 0.5 + glowAmount * 0.3
                    ctx.fillRect(sx + 2, sy, this.w - 4, 3)
                    ctx.globalAlpha = 1
                }
            }

            // ============================================================
            // PET CLASS (Jerry Companion)
            // ============================================================
            class Pet {
                constructor(owner) {
                    this.owner = owner
                    this.x = owner.x
                    this.y = owner.y - 60
                    this.targetX = this.x
                    this.targetY = this.y
                    this.w = 20
                    this.h = 20
                    this.floatOffset = 0
                    this.trailAlpha = 0
                    this.active = true

                    // Buff system
                    this.buffType = null
                    this.buffActive = false
                    this.buffCooldown = 0
                    this.buffDuration = 0
                    this.maxCooldown = 15
                    this.maxDuration = 8

                    // Buff colors
                    this.buffColors = {
                        magnet: '#00ffff',
                        shield: '#88ff88',
                        doubleScore: '#ffdd00',
                        attack: '#ff4444',
                    }

                    // Projectiles
                    this.projectiles = []
                    this.maxProjectiles = 5

                    // Trail particles
                    this.trail = []
                    this.maxTrail = 8
                }
                update(dt) {
                    if (!this.active || !this.owner.alive) return

                    // Float animation
                    this.floatOffset += dt * 3

                    // Follow owner with lerp delay
                    const followDist = 35
                    this.targetX = this.owner.x + followDist * this.owner.facing
                    this.targetY = this.owner.y - 40

                    const lerpSpeed = 6
                    this.x += (this.targetX - this.x) * lerpSpeed * dt
                    this.y += (this.targetY - this.y) * lerpSpeed * dt

                    // Trail effect when moving fast
                    const dx = this.targetX - this.x
                    if (Math.abs(dx) > 3) {
                        if (this.trail.length < this.maxTrail) {
                            this.trail.push({ x: this.x, y: this.y, alpha: 0.5 })
                        }
                    }

                    // Fade trail
                    for (let i = this.trail.length - 1; i >= 0; i--) {
                        this.trail[i].alpha -= dt * 2
                        if (this.trail[i].alpha <= 0) {
                            this.trail.splice(i, 1)
                        }
                    }

                    // Buff cooldown and duration
                    if (this.buffCooldown > 0) {
                        this.buffCooldown -= dt
                    }
                    if (this.buffActive && this.buffDuration > 0) {
                        this.buffDuration -= dt
                        if (this.buffDuration <= 0) {
                            this.buffActive = false
                            this.buffType = null
                        }
                    }

                    // Auto activate magnet periodically
                    if (!this.buffActive && this.buffCooldown <= 0 && Math.random() < 0.001) {
                        this.activateRandomBuff()
                    }

                    // Update projectiles
                    this.updateProjectiles(dt)
                }
                activateRandomBuff() {
                    const buffs = [
                        'magnet',
                        'shield',
                        'doubleScore',
                        'attack',
                    ]
                    this.buffType = buffs[Math.floor(Math.random() * buffs.length)]
                    this.buffActive = true
                    this.buffDuration = this.maxDuration
                    this.buffCooldown = this.maxCooldown
                }
                activate(key) {
                    if (this.buffCooldown <= 0 && !this.buffActive) {
                        this.activateRandomBuff()
                    }
                }
                updateProjectiles(dt) {
                    for (let i = this.projectiles.length - 1; i >= 0; i--) {
                        const p = this.projectiles[i]
                        p.x += p.vx * dt
                        p.y += p.vy * dt
                        p.life -= dt
                        p.trailAlpha -= dt * 2

                        if (p.life <= 0 || p.x > 3000) {
                            this.projectiles.splice(i, 1)
                        }
                    }
                }
                shoot() {
                    if (this.projectiles.length < this.maxProjectiles) {
                        const target = this.findNearestEnemy()
                        if (target) {
                            const dx = target.x - this.x
                            const dy = target.y - this.y
                            const dist = Math.sqrt(dx * dx + dy * dy)
                            const speed = 400

                            this.projectiles.push({
                                x: this.x,
                                y: this.y,
                                vx: (dx / dist) * speed,
                                vy: (dy / dist) * speed,
                                life: 3,
                                trailAlpha: 1,
                            })
                        }
                    }
                }
                findNearestEnemy() {
                    let nearest = null
                    let nearestDist = 400

                    return nearest
                }
                draw(ctx, camX, camY) {
                    if (!this.active) return

                    const sx = this.x - camX
                    const sy = this.y - camY + Math.sin(this.floatOffset) * 3

                    // Draw trail
                    for (const t of this.trail) {
                        ctx.fillStyle = this.buffType ? this.buffColors[this.buffType] : '#ff88aa'
                        ctx.globalAlpha = t.alpha * 0.3
                        ctx.beginPath()
                        ctx.arc(t.x - camX, t.y - camY, 4, 0, Math.PI * 2)
                        ctx.fill()
                    }
                    ctx.globalAlpha = 1

                    // Glow
                    const glowColor = this.buffType ? this.buffColors[this.buffType] : '#ff88aa'
                    ctx.shadowColor = glowColor
                    ctx.shadowBlur = 15 + Math.sin(Date.now() / 200) * 5

                    // Body (circular pet)
                    ctx.fillStyle = '#ff99bb'
                    ctx.beginPath()
                    ctx.arc(sx, sy, 10, 0, Math.PI * 2)
                    ctx.fill()

                    // Eyes
                    ctx.fillStyle = '#ffffff'
                    ctx.beginPath()
                    ctx.arc(sx - 3, sy - 2, 3, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.beginPath()
                    ctx.arc(sx + 3, sy - 2, 3, 0, Math.PI * 2)
                    ctx.fill()

                    // Pupils
                    ctx.fillStyle = '#1a1a2a'
                    ctx.beginPath()
                    ctx.arc(sx - 3, sy - 2, 1.5, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.beginPath()
                    ctx.arc(sx + 3, sy - 2, 1.5, 0, Math.PI * 2)
                    ctx.fill()

                    // Shield effect when active
                    if (this.buffType === 'shield' && this.buffActive) {
                        ctx.strokeStyle = glowColor
                        ctx.lineWidth = 2
                        ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 100) * 0.5
                        ctx.beginPath()
                        ctx.arc(sx, sy, 16, 0, Math.PI * 2)
                        ctx.stroke()
                        ctx.globalAlpha = 1
                    }

                    ctx.shadowBlur = 0

                    // Draw projectiles
                    for (const p of this.projectiles) {
                        ctx.fillStyle = '#ff4444'
                        ctx.globalAlpha = p.trailAlpha
                        ctx.beginPath()
                        ctx.arc(p.x - camX, p.y - camY, 4, 0, Math.PI * 2)
                        ctx.fill()
                        ctx.globalAlpha = 1
                    }

                    // Cooldown indicator
                    if (this.buffCooldown > 0) {
                        const ratio = this.buffCooldown / this.maxCooldown
                        ctx.strokeStyle = '#444466'
                        ctx.lineWidth = 2
                        ctx.beginPath()
                        ctx.arc(sx + 12, sy - 12, 6, 0, Math.PI * 2)
                        ctx.stroke()
                        ctx.strokeStyle = '#ff88aa'
                        ctx.beginPath()
                        ctx.arc(sx + 12, sy - 12, 6, -Math.PI / 2, Math.PI * 2 * (1 - ratio) - Math.PI / 2)
                        ctx.stroke()
                    }
                }
            }

            // ============================================================
            // PLAYER CLASS (Cat)
            // ============================================================
            class Player {
                constructor(x, y) {
                    this.x = x
                    this.y = y
                    this.w = 36
                    this.h = 44
                    this.vx = 0
                    this.vy = 0
                    this.onGround = false
                    this.facing = 1
                    this.alive = true
                    this.idleTime = 0
                    this.walkCycle = 0
                    this.jumpTimer = 0
                    this.invincible = 0
                    this.flashTimer = 0
                    this.coyoteCounter = 0
                    this.jumpBufferCounter = 0
                    this.justJumped = false
                    this.startX = x
                    this.startY = y
                }
                reset(x, y) {
                    this.x = x || this.startX
                    this.y = y || this.startY
                    this.vx = 0
                    this.vy = 0
                    this.onGround = false
                    this.alive = true
                    this.facing = 1
                    this.idleTime = 0
                    this.walkCycle = 0
                    this.invincible = 0
                    this.flashTimer = 0
                    this.coyoteCounter = 0
                    this.jumpBufferCounter = 0
                    this.justJumped = false
                    this.currentPlatform = null
                }
                update(dt, input, platforms, friction = 1.0) {
                    if (!this.alive) return

                    // Apply friction (lower = more slide on ice)
                    const frictionMult = friction

                    // Horizontal movement
                    let moveX = 0
                    if (input.isDown('ArrowLeft') || input.isDown('KeyA')) moveX = -1
                    if (input.isDown('ArrowRight') || input.isDown('KeyD')) moveX = 1

                    this.vx = moveX * CONFIG.PLAYER_SPEED
                    if (moveX !== 0) this.facing = moveX

                    // Apply momentum-based friction for ice biome
                    if (friction < 1.0 && this.onGround && Math.abs(moveX) < 0.5) {
                        this.vx *= frictionMult
                    }

                    // Coyote time
                    if (this.onGround) {
                        this.coyoteCounter = 0.1
                    } else {
                        this.coyoteCounter -= dt
                    }

                    // Jump buffer - store jump input when pressed early
                    if (input.isJustPressed('ArrowUp') || input.isJustPressed('KeyW') || input.isJustPressed('Space')) {
                        this.jumpBufferCounter = 0.1
                    }

                    // Jump execution
                    const canJump = this.onGround || this.coyoteCounter > 0
                    if (this.jumpBufferCounter > 0 && canJump) {
                        this.vy = CONFIG.PLAYER_JUMP
                        this.onGround = false
                        this.jumpTimer = 0.15
                        this.jumpBufferCounter = 0
                        this.coyoteCounter = 0
                        this.justJumped = true
                    }
                    this.jumpBufferCounter -= dt

                    // Variable jump height - maintain upward velocity while jump key is held
                    if (this.jumpTimer > 0) {
                        this.jumpTimer -= dt
                        if (input.isDown('ArrowUp') || input.isDown('KeyW') || input.isDown('Space')) {
                            this.vy = CONFIG.PLAYER_JUMP
                        } else {
                            this.jumpTimer = 0
                        }
                    }

                    // Gravity
                    this.vy += CONFIG.GRAVITY * dt
                    if (this.vy > 800) this.vy = 800

                    // Move X
                    this.x += this.vx * dt
                    this.resolveCollisionX(platforms)

                    // Move Y
                    this.y += this.vy * dt
                    this.onGround = false
                    this.resolveCollisionY(platforms, dt)

                    // Animations
                    if (moveX !== 0 && this.onGround) {
                        this.walkCycle += dt * 10
                    } else if (this.onGround) {
                        this.idleTime += dt
                    }

                    // Invincibility
                    if (this.invincible > 0) this.invincible -= dt
                    if (this.flashTimer > 0) this.flashTimer -= dt

                    return null
                }
                resolveCollisionX(platforms) {
                    for (const p of platforms) {
                        if (this.overlaps(p)) {
                            if (this.vx > 0) {
                                this.x = p.x - this.w
                            } else if (this.vx < 0) {
                                this.x = p.x + p.w
                            }
                            this.vx = 0
                        }
                    }
                }
                resolveCollisionY(platforms, dt) {
                    this.currentPlatform = null
                    for (const p of platforms) {
                        if (this.overlaps(p)) {
                            if (this.vy > 0) {
                                this.y = p.y - this.h
                                this.vy = 0
                                this.onGround = true
                                this.currentPlatform = p
                            } else if (this.vy < 0) {
                                this.y = p.y + p.h
                                this.vy = 0
                            }
                        }
                    }

                    // Stick to moving platform
                    if (this.onGround && this.currentPlatform && this.currentPlatform.moveConfig) {
                        this.x += this.currentPlatform.currentVx * dt
                    }
                }
                overlaps(other) {
                    return (
                        this.x < other.x + other.w &&
                        this.x + this.w > other.x &&
                        this.y < other.y + other.h &&
                        this.y + this.h > other.y
                    )
                }
                overlapsEnemy(enemy) {
                    return (
                        this.x < enemy.x + enemy.w &&
                        this.x + this.w > enemy.x &&
                        this.y < enemy.y + enemy.h &&
                        this.y + this.h > enemy.y
                    )
                }
                draw(ctx, camX, camY) {
                    if (!this.alive) return

                    const sx = this.x - camX + this.w / 2
                    const sy = this.y - camY + this.h / 2

                    // Flash when invincible
                    if (this.invincible > 0 && Math.floor(this.flashTimer * 20) % 2 === 0) return

                    ctx.save()
                    ctx.translate(sx, sy)
                    ctx.scale(this.facing, 1)

                    // Breathing animation
                    let breathe = 1
                    if (this.onGround && Math.abs(this.vx) < 10) {
                        breathe = 1 + Math.sin(this.idleTime * 3) * 0.03
                    }
                    ctx.scale(breathe, breathe)

                    // Walking bob
                    let bob = 0
                    if (this.onGround && Math.abs(this.vx) > 10) {
                        bob = Math.sin(this.walkCycle) * 2
                    }

                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.2)'
                    ctx.beginPath()
                    ctx.ellipse(0, this.h / 2 + 2, 16, 4, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Tail
                    const tailWag = Math.sin(this.idleTime * 4 + this.walkCycle) * 0.3
                    ctx.save()
                    ctx.translate(-14, -5 + bob)
                    ctx.rotate(tailWag - 0.5)
                    ctx.strokeStyle = CONFIG.COLORS.playerDark
                    ctx.lineWidth = 4
                    ctx.lineCap = 'round'
                    ctx.beginPath()
                    ctx.moveTo(0, 0)
                    ctx.quadraticCurveTo(-12, -15, -8, -25)
                    ctx.stroke()
                    ctx.restore()

                    // Body
                    ctx.fillStyle = CONFIG.COLORS.player
                    ctx.beginPath()
                    ctx.ellipse(0, 5 + bob, 14, 16, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Belly
                    ctx.fillStyle = '#ffe4e8'
                    ctx.beginPath()
                    ctx.ellipse(2, 8 + bob, 8, 10, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Head
                    ctx.fillStyle = CONFIG.COLORS.player
                    ctx.beginPath()
                    ctx.ellipse(0, -14 + bob, 13, 12, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Ears
                    ctx.fillStyle = CONFIG.COLORS.player
                    // Left ear
                    ctx.beginPath()
                    ctx.moveTo(-9, -22 + bob)
                    ctx.lineTo(-14, -34 + bob)
                    ctx.lineTo(-3, -24 + bob)
                    ctx.closePath()
                    ctx.fill()
                    // Right ear
                    ctx.beginPath()
                    ctx.moveTo(9, -22 + bob)
                    ctx.lineTo(14, -34 + bob)
                    ctx.lineTo(3, -24 + bob)
                    ctx.closePath()
                    ctx.fill()

                    // Inner ears
                    ctx.fillStyle = CONFIG.COLORS.playerDark
                    ctx.beginPath()
                    ctx.moveTo(-8, -23 + bob)
                    ctx.lineTo(-12, -31 + bob)
                    ctx.lineTo(-4, -24 + bob)
                    ctx.closePath()
                    ctx.fill()
                    ctx.beginPath()
                    ctx.moveTo(8, -23 + bob)
                    ctx.lineTo(12, -31 + bob)
                    ctx.lineTo(4, -24 + bob)
                    ctx.closePath()
                    ctx.fill()

                    // Eyes
                    const blinkCycle = Math.sin(this.idleTime * 1.5)
                    const eyeH = blinkCycle > 0.95 ? 1 : 4
                    ctx.fillStyle = '#2a2a4a'
                    ctx.beginPath()
                    ctx.ellipse(-5, -15 + bob, 3, eyeH, 0, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.beginPath()
                    ctx.ellipse(5, -15 + bob, 3, eyeH, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Eye shine
                    if (eyeH > 1) {
                        ctx.fillStyle = '#ffffff'
                        ctx.beginPath()
                        ctx.arc(-4, -16 + bob, 1.2, 0, Math.PI * 2)
                        ctx.fill()
                        ctx.beginPath()
                        ctx.arc(6, -16 + bob, 1.2, 0, Math.PI * 2)
                        ctx.fill()
                    }

                    // Nose
                    ctx.fillStyle = CONFIG.COLORS.playerDark
                    ctx.beginPath()
                    ctx.ellipse(0, -11 + bob, 2, 1.5, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Mouth
                    ctx.strokeStyle = '#cc8899'
                    ctx.lineWidth = 1
                    ctx.beginPath()
                    ctx.moveTo(0, -10 + bob)
                    ctx.lineTo(-3, -8 + bob)
                    ctx.moveTo(0, -10 + bob)
                    ctx.lineTo(3, -8 + bob)
                    ctx.stroke()

                    // Whiskers
                    ctx.strokeStyle = '#dda0b0'
                    ctx.lineWidth = 0.8
                    for (let side = -1; side <= 1; side += 2) {
                        for (let i = -1; i <= 1; i++) {
                            ctx.beginPath()
                            ctx.moveTo(side * 6, -12 + i * 2 + bob)
                            ctx.lineTo(side * 18, -14 + i * 4 + bob)
                            ctx.stroke()
                        }
                    }

                    // Legs
                    const legAnim = this.onGround && Math.abs(this.vx) > 10 ? Math.sin(this.walkCycle) * 5 : 0
                    ctx.fillStyle = CONFIG.COLORS.player
                    // Back legs
                    ctx.fillRect(-10, 16 + bob, 7, 8 + legAnim * 0.3)
                    ctx.fillRect(3, 16 + bob, 7, 8 - legAnim * 0.3)
                    // Paws
                    ctx.fillStyle = '#ffe4e8'
                    ctx.beginPath()
                    ctx.ellipse(-6, 25 + bob + legAnim * 0.3, 4, 2, 0, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.beginPath()
                    ctx.ellipse(7, 25 + bob - legAnim * 0.3, 4, 2, 0, 0, Math.PI * 2)
                    ctx.fill()

                    ctx.restore()
                }
            }

            // ============================================================
            // ENEMY CLASS
            // ============================================================
            class Enemy {
                constructor(x, y, minX, maxX) {
                    this.x = x
                    this.y = y
                    this.w = 32
                    this.h = 30
                    this.vx = CONFIG.ENEMY_SPEED
                    this.minX = minX
                    this.maxX = maxX
                    this.alive = true
                    this.bounceTime = 0
                    this.deathTimer = 0
                    this.dying = false
                    this.startX = x
                    this.startY = y
                    this.startMinX = minX
                    this.startMaxX = maxX
                }
                reset() {
                    this.x = this.startX
                    this.y = this.startY
                    this.vx = CONFIG.ENEMY_SPEED
                    this.minX = this.startMinX
                    this.maxX = this.startMaxX
                    this.alive = true
                    this.dying = false
                    this.deathTimer = 0
                    this.bounceTime = 0
                }
                update(dt) {
                    if (this.dying) {
                        this.deathTimer -= dt
                        if (this.deathTimer <= 0) this.alive = false
                        return
                    }
                    if (!this.alive) return

                    this.x += this.vx * dt
                    this.bounceTime += dt * 5

                    if (this.x <= this.minX) {
                        this.x = this.minX
                        this.vx = Math.abs(this.vx)
                    }
                    if (this.x + this.w >= this.maxX) {
                        this.x = this.maxX - this.w
                        this.vx = -Math.abs(this.vx)
                    }
                }
                stomp() {
                    this.dying = true
                    this.deathTimer = 0.4
                    this.vx = 0
                }
                draw(ctx, camX, camY) {
                    if (!this.alive) return

                    const sx = this.x - camX + this.w / 2
                    const sy = this.y - camY + this.h / 2

                    ctx.save()
                    ctx.translate(sx, sy)

                    if (this.dying) {
                        const t = 1 - this.deathTimer / 0.4
                        ctx.scale(1 + t * 0.5, 1 - t * 0.8)
                        ctx.globalAlpha = 1 - t
                    }

                    const bounce = Math.abs(Math.sin(this.bounceTime)) * 3
                    ctx.translate(0, -bounce)

                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.2)'
                    ctx.beginPath()
                    ctx.ellipse(0, this.h / 2 + bounce + 2, 14, 4, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Body (spiky blob)
                    ctx.fillStyle = CONFIG.COLORS.enemy
                    ctx.beginPath()
                    ctx.ellipse(0, 0, 14, 12, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Spikes
                    for (let i = 0; i < 8; i++) {
                        const angle = (i / 8) * Math.PI * 2
                        const spikeLen = 5 + Math.sin(this.bounceTime * 2 + i) * 2
                        ctx.fillStyle = CONFIG.COLORS.enemyDark
                        ctx.beginPath()
                        ctx.moveTo(Math.cos(angle) * 12, Math.sin(angle) * 10)
                        ctx.lineTo(Math.cos(angle) * (12 + spikeLen), Math.sin(angle) * (10 + spikeLen))
                        ctx.lineTo(Math.cos(angle + 0.3) * 12, Math.sin(angle + 0.3) * 10)
                        ctx.closePath()
                        ctx.fill()
                    }

                    // Eyes
                    ctx.fillStyle = '#ffffff'
                    ctx.beginPath()
                    ctx.ellipse(-5, -3, 4, 5, 0, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.beginPath()
                    ctx.ellipse(5, -3, 4, 5, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Pupils (look in movement direction)
                    const lookDir = this.vx > 0 ? 1 : -1
                    ctx.fillStyle = '#1a1a2a'
                    ctx.beginPath()
                    ctx.ellipse(-5 + lookDir * 1.5, -3, 2, 3, 0, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.beginPath()
                    ctx.ellipse(5 + lookDir * 1.5, -3, 2, 3, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Angry eyebrows
                    ctx.strokeStyle = '#1a1a2a'
                    ctx.lineWidth = 2
                    ctx.beginPath()
                    ctx.moveTo(-9, -9)
                    ctx.lineTo(-3, -7)
                    ctx.stroke()
                    ctx.beginPath()
                    ctx.moveTo(9, -9)
                    ctx.lineTo(3, -7)
                    ctx.stroke()

                    // Mouth
                    ctx.fillStyle = '#1a1a2a'
                    ctx.beginPath()
                    ctx.arc(0, 4, 4, 0, Math.PI)
                    ctx.fill()

                    // Teeth
                    ctx.fillStyle = '#ffffff'
                    ctx.fillRect(-3, 4, 2, 3)
                    ctx.fillRect(1, 4, 2, 3)

                    ctx.restore()
                }
            }

            // ============================================================
            // FISH COLLECTIBLE

            class Fish {

                    this.x = x
                    this.y = y
                    this.w = 24
                    this.h = 16
                    this.collected = false
                    this.collectTimer = 0
                    this.floatTime = Math.random() * Math.PI * 2

                    this.y = this.startY
                    this.collected = false

                }

                    this.floatTime += dt * 3
                    if (this.collected) {
                        this.collectTimer -= dt
                    }
                }
                draw(ctx, camX, camY) {
                    if (this.collected) return

                    const floatY = Math.sin(this.floatTime) * 4
                    const sx = this.x - camX + this.w / 2
                    const sy = this.y - camY + this.h / 2 + floatY

                    ctx.save()
                    ctx.translate(sx, sy)

                    // Glow
                    ctx.shadowColor = CONFIG.COLORS.fishGlow
                    ctx.shadowBlur = 12 + Math.sin(this.floatTime * 2) * 4

                    // Body
                    ctx.fillStyle = CONFIG.COLORS.fish
                    ctx.beginPath()
                    ctx.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Tail
                    ctx.beginPath()
                    ctx.moveTo(-8, 0)
                    ctx.lineTo(-16, -6)
                    ctx.lineTo(-16, 6)
                    ctx.closePath()
                    ctx.fill()

                    ctx.fillStyle = '#2a2a4a'

                    ctx.beginPath()
                    ctx.arc(5.5, -2.5, 0.8, 0, Math.PI * 2)

                    ctx.fillStyle = CONFIG.COLORS.fishGlow
                    ctx.beginPath()
                    ctx.moveTo(0, -5)
                    ctx.lineTo(-4, -12)
                    ctx.lineTo(4, -5)
                    ctx.closePath()
                    ctx.fill()

                    ctx.restore()
                }
