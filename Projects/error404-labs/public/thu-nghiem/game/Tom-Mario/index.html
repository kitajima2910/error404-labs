            // ============================================================
            // POLYFILL for roundRect
            // ============================================================
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                    if (typeof r === 'number')
                        r = [
                            r,
                            r,
                            r,
                            r,
                        ]
                    else if (Array.isArray(r)) {
                        if (r.length === 1)
                            r = [
                                r[0],
                                r[0],
                                r[0],
                                r[0],
                            ]
                        else if (r.length === 2)
                            r = [
                                r[0],
                                r[1],
                                r[0],
                                r[1],
                            ]
                        else if (r.length === 3)
                            r = [
                                r[0],
                                r[1],
                                r[2],
                                r[1],
                            ]
                        else
                            r = [
                                r[0] || 0,
                                r[1] || 0,
                                r[2] || 0,
                                r[3] || 0,
                            ]
                    } else
                        r = [
                            0,
                            0,
                            0,
                            0,
                        ]
                    this.moveTo(x + r[0], y)
                    this.lineTo(x + w - r[1], y)
                    this.quadraticCurveTo(x + w, y, x + w, y + r[1])
                    this.lineTo(x + w, y + h - r[2])
                    this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h)
                    this.lineTo(x + r[3], y + h)
                    this.quadraticCurveTo(x, y + h, x, y + h - r[3])
                    this.lineTo(x, y + r[0])
                    this.quadraticCurveTo(x, y, x + r[0], y)
                    this.closePath()
                    return this
                }
            }

            // ============================================================
            // AUDIO MANAGER (Web Audio API)
            // ============================================================
            class AudioManager {
                constructor() {
                    this.ctx = null
                    this.initialized = false
                    this.musicEnabled = true
                    this.sfxEnabled = true
                    this.volume = 0.5
                    this.masterGain = null
                    this.musicGain = null
                    this.sfxGain = null
                    this.sfxPanner = null
                    this.currentBGM = null
                    this.isPlayingBGM = false
                    this.bgmInterval = null
                }
                init() {
                    if (this.initialized) return
                    try {
                        this.ctx = new (window.AudioContext || window.webkitAudioContext)()
                        this.masterGain = this.ctx.createGain()
                        this.musicGain = this.ctx.createGain()
                        this.sfxGain = this.ctx.createGain()
                        this.sfxPanner = this.ctx.createStereoPanner()
                        this.masterGain.gain.value = this.volume
                        this.musicGain.gain.value = 0.3
                        this.sfxGain.gain.value = 0.8
                        this.masterGain.connect(this.ctx.destination)
                        this.musicGain.connect(this.masterGain)
                        this.sfxGain.connect(this.sfxPanner)
                        this.sfxPanner.connect(this.masterGain)
                        this.initialized = true
                    } catch (e) {
                        console.log('Audio not available')
                    }
                }
                playTone(freq, duration, type = 'square', volume = 0.15, slide = 0) {
                    if (!this.initialized) return
                    const osc = this.ctx.createOscillator()
                    const gain = this.ctx.createGain()
                    osc.type = type
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime)
                    if (slide) osc.frequency.linearRampToValueAtTime(freq + slide, this.ctx.currentTime + duration)
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime)
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration)
                    osc.connect(gain)
                    gain.connect(this.sfxGain)
                    osc.start(this.ctx.currentTime)
                    osc.stop(this.ctx.currentTime + duration)
                }
                jump() {
                    this.playSFX('jump')
                    this.playVoice('tom', 'jump')
                }
                collect() {
                    this.playSFX('collect')
                }
                hit() {
                    this.playSFX('hit')
                    this.playVoice('tom', 'hit')
                }
                stomp() {
                    this.playSFX('stomp')
                }
                win() {
                    this.playSFX('win')
                    this.playVoice('tom', 'win')
                }
                lose() {
                    this.playSFX('lose')
                }
                petBuff() {
                    this.playSFX('petBuff')
                    this.playVoice('jerry', 'buffReady')
                }
                setVolume(v) {
                    this.volume = Math.max(0, Math.min(1, v))
                    if (this.masterGain) this.masterGain.gain.value = this.volume
                }
                toggleMusic() {
                    this.musicEnabled = !this.musicEnabled
                    if (this.musicGain) {
                        this.musicGain.gain.value = this.musicEnabled ? 0.3 : 0
                    }
                    if (!this.musicEnabled) {
                        this.stopBGM()
                    }
                }
                toggleSFX() {
                    this.sfxEnabled = !this.sfxEnabled
                    if (this.sfxGain) {
                        this.sfxGain.gain.value = this.sfxEnabled ? 0.8 : 0
                    }
                }
                stopBGM() {
                    this.isPlayingBGM = false
                    if (this.bgmInterval) {
                        clearInterval(this.bgmInterval)
                        this.bgmInterval = null
                    }
                }
                playMusicTone(freq, dur, type = 'sine', vol = 0.1) {
                    if (!this.initialized) return
                    const osc = this.ctx.createOscillator()
                    const gain = this.ctx.createGain()
                    osc.type = type
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime)
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime)
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur)
                    osc.connect(gain)
                    gain.connect(this.musicGain)
                    osc.start(this.ctx.currentTime)
                    osc.stop(this.ctx.currentTime + dur)
                }
                playBGM(type) {
                    this.stopBGM()
                    if (!this.musicEnabled) return
                    this.currentBGM = type
                    this.isPlayingBGM = true
                    const patterns = {
                        ice: [
                            { freq: 200, dur: 0.5, type: 'sine', vol: 0.1 },
                            { freq: 250, dur: 0.5, type: 'sine', vol: 0.1 },
                            { freq: 300, dur: 0.5, type: 'sine', vol: 0.1 },
                        ],
                        lava: [
                            { freq: 150, dur: 0.3, type: 'sawtooth', vol: 0.15 },
                            { freq: 180, dur: 0.3, type: 'sawtooth', vol: 0.15 },
                        ],
                        cyber: [
                            { freq: 400, dur: 0.2, type: 'square', vol: 0.1 },
                            { freq: 600, dur: 0.2, type: 'square', vol: 0.1 },
                            { freq: 800, dur: 0.2, type: 'square', vol: 0.1 },
                        ],
                    }
                    const pattern = patterns[type] || patterns.cyber
                    let index = 0
                    this.bgmInterval = setInterval(() => {
                        if (!this.isPlayingBGM) return
                        const note = pattern[index % pattern.length]
                        this.playMusicTone(note.freq, note.dur, note.type, note.vol)
                        index++
                    }, 600)
                }
                duckMusic(duration = 0.5, reduction = 0.1) {
                    if (!this.musicGain) return
                    this.musicGain.gain.cancelScheduledValues(this.ctx.currentTime)
                    this.musicGain.gain.setValueAtTime(this.musicGain.gain.value, this.ctx.currentTime)
                    this.musicGain.gain.exponentialRampToValueAtTime(reduction, this.ctx.currentTime + 0.1)
                    this.musicGain.gain.exponentialRampToValueAtTime(0.3, this.ctx.currentTime + duration)
                }
                playSFX(name, volume = 0.15, pan = 0) {
                    if (!this.sfxEnabled) return
                    this.sfxPanner.pan.value = Math.max(-1, Math.min(1, pan))
                    switch (name) {
                        case 'jump':
                            this.playTone(400, 0.15, 'square', volume, 300)
                            break
                        case 'collect':
                            this.playTone(800, 0.1, 'sine', volume, 400)
                            setTimeout(() => this.playTone(1200, 0.15, 'sine', volume * 0.8, 200), 60)
                            break
                        case 'hit':
                            this.playTone(150, 0.3, 'sawtooth', volume, -100)
                            this.playTone(100, 0.2, 'square', volume * 0.7, -50)
                            break
                        case 'stomp':
                            this.playTone(300, 0.15, 'square', volume, -200)
                            this.playTone(500, 0.1, 'sine', volume * 0.7)
                            break
                        case 'win':
                            ;[
                                0,
                                100,
                                200,
                                300,
                                400,
                            ].forEach((d, i) => setTimeout(() => this.playTone(500 + i * 100, 0.2, 'sine', volume), d))
                            break
                        case 'lose':
                            ;[
                                0,
                                150,
                                300,
                            ].forEach((d, i) =>
                                setTimeout(() => this.playTone(400 - i * 100, 0.3, 'sawtooth', volume), d),
                            )
                            break
                        case 'petBuff':
                            this.playTone(600, 0.1, 'sine', volume, 200)
                            this.playTone(800, 0.1, 'sine', volume, 300)
                            break
                    }
                }
                playVoice(character, event) {
                    if (!this.sfxEnabled) return
                    this.duckMusic(0.5, 0.1)
                    if (character === 'tom') {
                        if (event === 'jump') this.playTone(300, 0.1, 'sine', 0.1)
                        if (event === 'hit') this.playTone(200, 0.2, 'sawtooth', 0.15)
                        if (event === 'win') this.playTone(500, 0.3, 'sine', 0.2)
                    } else if (character === 'jerry') {
                        if (event === 'buffReady') this.playTone(600, 0.15, 'sine', 0.1, 200)
                    } else if (character === 'boss') {
                        if (event === 'attack') this.playTone(100, 0.5, 'sawtooth', 0.2)
                    }
                }
            }

            // ============================================================
            // INPUT HANDLER
            // ============================================================
            class InputHandler {
                constructor() {
                    this.keys = {}
                    this.justPressed = {}
                    this.prevKeys = {}
                    window.addEventListener('keydown', (e) => {
                        e.preventDefault()
                        this.keys[e.code] = true
                    })
                    window.addEventListener('keyup', (e) => {
                        e.preventDefault()
                        this.keys[e.code] = false
                    })
                }
                update() {
                    for (const key in this.keys) {
                        this.justPressed[key] = this.keys[key] && !this.prevKeys[key]
                        this.prevKeys[key] = this.keys[key]
                    }
                }
                isDown(code) {
                    return !!this.keys[code]
                }
                isJustPressed(code) {
                    return !!this.justPressed[code]
                }
            }

            // ============================================================
            // PARTICLE SYSTEM (Object Pool)
            // ============================================================
            class Particle {
                constructor() {
                    this.reset()
                }
                reset() {
                    this.x = 0
                    this.y = 0
                    this.vx = 0
                    this.vy = 0
                    this.life = 0
                    this.maxLife = 0
                    this.size = 0
                    this.color = '#fff'
                    this.active = false
                    this.gravity = 0
                    this.alpha = 1
                    this.scale = 1
                    this.type = 'circle'
                }
                init(x, y, vx, vy, life, size, color, gravity = 0, type = 'circle') {
                    this.x = x
                    this.y = y
                    this.vx = vx
                    this.vy = vy
                    this.life = life
                    this.maxLife = life
                    this.size = size
                    this.color = color
                    this.active = true
                    this.gravity = gravity
                    this.alpha = 1
                    this.scale = 1
                    this.type = type
                }
                update(dt) {
                    if (!this.active) return
                    this.life -= dt
                    if (this.life <= 0) {
                        this.active = false
                        return
                    }
                    this.vy += this.gravity * dt
                    this.x += this.vx * dt
                    this.y += this.vy * dt
                    this.alpha = Math.max(0, this.life / this.maxLife)
                    this.scale = 0.5 + 0.5 * (this.life / this.maxLife)
                }
                draw(ctx, camX, camY) {
                    if (!this.active) return
                    const sx = this.x - camX
                    const sy = this.y - camY
                    ctx.globalAlpha = this.alpha
                    ctx.fillStyle = this.color
                    if (this.type === 'circle') {
                        ctx.beginPath()
                        ctx.arc(sx, sy, this.size * this.scale, 0, Math.PI * 2)
                        ctx.fill()
                    } else if (this.type === 'star') {
                        this.drawStar(ctx, sx, sy, this.size * this.scale)
                    } else if (this.type === 'text') {
                        ctx.font = `bold ${this.size}px 'Segoe UI'`
                        ctx.textAlign = 'center'
                        ctx.fillText(this.color, sx, sy)
                    }
                    ctx.globalAlpha = 1
                }
                drawStar(ctx, x, y, r) {
                    ctx.beginPath()
                    for (let i = 0; i < 5; i++) {
                        const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2
                        ctx.lineTo(x + Math.cos(angle) * r, y + Math.sin(angle) * r)
                    }
                    ctx.closePath()
                    ctx.fill()
                }
            }

            class ParticleSystem {
                constructor(maxParticles) {
                    this.pool = []
                    for (let i = 0; i < maxParticles; i++) {
                        this.pool.push(new Particle())
                    }
                    this.jumpDustCount = 0
                }
                getInactive() {
                    for (let i = 0; i < this.pool.length; i++) {
                        if (!this.pool[i].active) return this.pool[i]
                    }
                    return null
                }
                emit(x, y, vx, vy, life, size, color, gravity = 0, type = 'circle') {
                    const p = this.getInactive()
                    if (p) p.init(x, y, vx, vy, life, size, color, gravity, type)
                    return p
                }
                emitJumpDust(x, y, skinKey = 'pink') {
                    if (this.jumpDustCount >= CONFIG.JUMP_DUST_MAX) return
                    const skin = CONFIG.SKINS[skinKey] || CONFIG.SKINS.pink
                    for (let i = 0; i < 5; i++) {
                        const p = this.getInactive()
                        if (p) {
                            p.init(
                                x + (Math.random() - 0.5) * 20,
                                y,
                                (Math.random() - 0.5) * 60,
                                -Math.random() * 80 - 20,
                                0.3 + Math.random() * 0.2,
                                3 + Math.random() * 3,
                                skin.particleColor,
                                200,
                            )
                            this.jumpDustCount++
                        }
                    }
                }
                emitCollectBurst(x, y) {
                    for (let i = 0; i < 12; i++) {
                        const angle = (i / 12) * Math.PI * 2
                        const speed = 80 + Math.random() * 60
                        this.emit(
                            x,
                            y,
                            Math.cos(angle) * speed,
                            Math.sin(angle) * speed,
                            0.4 + Math.random() * 0.3,
                            3 + Math.random() * 4,
                            CONFIG.COLORS.fishGlow,
                            100,
                            'star',
                        )
                    }
                }
                emitScorePopup(x, y, text) {
                    const p = this.getInactive()
                    if (p) {
                        p.init(x, y, 0, -60, 1.0, 18, text, 0, 'text')
                    }
                }
                emitStompBurst(x, y) {
                    for (let i = 0; i < 15; i++) {
                        const angle = (i / 15) * Math.PI * 2
                        const speed = 100 + Math.random() * 80
                        this.emit(
                            x,
                            y,
                            Math.cos(angle) * speed,
                            Math.sin(angle) * speed,
                            0.3 + Math.random() * 0.3,
                            4 + Math.random() * 5,
                            '#ffffff',
                            150,
                            'circle',
                        )
                    }
                }
                emitDeathBurst(x, y) {
                    for (let i = 0; i < 20; i++) {
                        const angle = (i / 20) * Math.PI * 2
                        const speed = 60 + Math.random() * 120
                        this.emit(
                            x,
                            y,
                            Math.cos(angle) * speed,
                            Math.sin(angle) * speed - 50,
                            0.5 + Math.random() * 0.5,
                            4 + Math.random() * 6,
                            CONFIG.COLORS.enemy,
                            200,
                            'circle',
                        )
                    }
                }
                update(dt) {
                    let dustActive = 0
                    for (let i = 0; i < this.pool.length; i++) {
                        this.pool[i].update(dt)
                        if (this.pool[i].active && this.pool[i].gravity > 0) dustActive++
                    }
                    this.jumpDustCount = dustActive
                }
                draw(ctx, camX, camY) {
                    for (let i = 0; i < this.pool.length; i++) {
                        this.pool[i].draw(ctx, camX, camY)
                    }
                }
            }

            // ============================================================
            // PLATFORM CLASS
            // ============================================================
            class Platform {
                constructor(x, y, w, h, type = 'normal', moveConfig = null) {
                    this.x = x
                    this.y = y
                    this.w = w
                    this.h = h
                    this.type = type
                    this.glowPulse = 0

                    // Moving platform config
                    this.moveConfig = moveConfig
                    this.startX = x
                    this.startY = y
                    this.moveOffset = 0
                    this.currentVx = 0

                    // Glow trail
                    this.trailAlpha = 0
                }
                update(dt) {
                    this.glowPulse += dt * 2

                    // Handle moving platforms
                    if (this.moveConfig) {
                        const range = this.moveConfig.range || 100
                        const speed = this.moveConfig.speed || 60

                        // Smooth sine movement using easing
                        this.moveOffset += speed * dt
                        const pos = this.moveOffset / range
                        const eased = Math.sin(pos * Math.PI * 2)
                        this.currentVx = eased * speed

                        // Calculate new position
                        const originalRange = this.moveConfig.range || 100
                        const displacement =
                            Math.sin((this.moveOffset / originalRange) * Math.PI * 2) * (originalRange / Math.PI)
                        this.x = this.startX + displacement

                        // Trail effect
                        this.trailAlpha = (Math.abs(displacement) / originalRange) * 0.3
                    }
                }
                draw(ctx, camX, camY, biomeKey = 'cyber') {
                    const sx = this.x - camX
                    const sy = this.y - camY
                    const glowAmount = 0.5 + 0.5 * Math.sin(this.glowPulse)

                    // Get biome colors
                    const biome = CONFIG.BIOMES[biomeKey] || CONFIG.BIOMES.cyber
                    const platformColor = biome.platform
                    const platformGlow = biome.platformGlow

                    // Draw glow trail for moving platforms
                    if (this.moveConfig && this.moveOffset > 0) {
                        const trailX = sx + (this.startX - this.x)
                        ctx.fillStyle = platformGlow.replace(')', ', 0.3)')
                        ctx.globalAlpha = this.trailAlpha * 0.3
                        ctx.fillRect(trailX + 4, sy + 2, this.w - 8, this.h - 4)
                        ctx.globalAlpha = 1
                    }

                    // Shadow with biome color
                    ctx.shadowColor = platformGlow
                    ctx.shadowBlur = 10 + glowAmount * 12

                    // Platform body
                    const grad = ctx.createLinearGradient(sx, sy, sx, sy + this.h)
                    grad.addColorStop(0, platformColor)
                    grad.addColorStop(1, platformColor)
                    ctx.fillStyle = grad

                    // Rounded rect
                    const r = 6
                    ctx.beginPath()
                    ctx.moveTo(sx + r, sy)
                    ctx.lineTo(sx + this.w - r, sy)
                    ctx.quadraticCurveTo(sx + this.w, sy, sx + this.w, sy + r)
                    ctx.lineTo(sx + this.w, sy + this.h - r)
                    ctx.quadraticCurveTo(sx + this.w, sy + this.h, sx + this.w - r, sy + this.h)
                    ctx.lineTo(sx + r, sy + this.h)
                    ctx.quadraticCurveTo(sx, sy + this.h, sx, sy + this.h - r)
                    ctx.lineTo(sx, sy + r)
                    ctx.quadraticCurveTo(sx, sy, sx + r, sy)
                    ctx.closePath()
                    ctx.fill()

                    // Top highlight
                    ctx.shadowBlur = 0
                    ctx.fillStyle = platformGlow
                    ctx.globalAlpha = 0.5 + glowAmount * 0.3
                    ctx.fillRect(sx + 2, sy, this.w - 4, 3)
                    ctx.globalAlpha = 1
                }
            }

            // ============================================================
            // PET CLASS (Jerry Companion)
            // ============================================================
            class Pet {
                constructor(owner) {
                    this.owner = owner
                    this.x = owner.x
                    this.y = owner.y - 60
                    this.targetX = this.x
                    this.targetY = this.y
                    this.w = 20
                    this.h = 20
                    this.floatOffset = 0
                    this.trailAlpha = 0
                    this.active = true

                    // Buff system
                    this.buffType = null
                    this.buffActive = false
                    this.buffCooldown = 0
                    this.buffDuration = 0
                    this.maxCooldown = 15
                    this.maxDuration = 8

                    // Buff colors
                    this.buffColors = {
                        magnet: '#00ffff',
                        shield: '#88ff88',
                        doubleScore: '#ffdd00',
                        attack: '#ff4444',
                    }

                    // Projectiles
                    this.projectiles = []
                    this.maxProjectiles = 5

                    // Trail particles
                    this.trail = []
                    this.maxTrail = 8
                }
                update(dt) {
                    if (!this.active || !this.owner.alive) return

                    // Float animation
                    this.floatOffset += dt * 3

                    // Follow owner with lerp delay
                    const followDist = 35
                    this.targetX = this.owner.x + followDist * this.owner.facing
                    this.targetY = this.owner.y - 40

                    const lerpSpeed = 6
                    this.x += (this.targetX - this.x) * lerpSpeed * dt
                    this.y += (this.targetY - this.y) * lerpSpeed * dt

                    // Trail effect when moving fast
                    const dx = this.targetX - this.x
                    if (Math.abs(dx) > 3) {
                        if (this.trail.length < this.maxTrail) {
                            this.trail.push({ x: this.x, y: this.y, alpha: 0.5 })
                        }
                    }

                    // Fade trail
                    for (let i = this.trail.length - 1; i >= 0; i--) {
                        this.trail[i].alpha -= dt * 2
                        if (this.trail[i].alpha <= 0) {
                            this.trail.splice(i, 1)
                        }
                    }

                    // Buff cooldown and duration
                    if (this.buffCooldown > 0) {
                        this.buffCooldown -= dt
                    }
                    if (this.buffActive && this.buffDuration > 0) {
                        this.buffDuration -= dt
                        if (this.buffDuration <= 0) {
                            this.buffActive = false
                            this.buffType = null
                        }
                    }

                    // Auto activate magnet periodically
                    if (!this.buffActive && this.buffCooldown <= 0 && Math.random() < 0.001) {
                        this.activateRandomBuff()
                    }

                    // Update projectiles
                    this.updateProjectiles(dt)
                }
                activateRandomBuff() {
                    const buffs = [
                        'magnet',
                        'shield',
                        'doubleScore',
                        'attack',
                    ]
                    const buffNames = {
                        magnet: 'NAM CHÂM',
                        shield: 'GIÁP HỘ THÂN',
                        doubleScore: 'X2 ĐIỂM',
                        attack: 'PHÓNG ĐẠN',
                    }
                    this.buffType = buffs[Math.floor(Math.random() * buffs.length)]
                    this.buffActive = true
                    this.buffDuration = this.maxDuration
                    this.buffCooldown = this.maxCooldown

                    // Emit text popup
                    if (this.owner.game) {
                        this.owner.game.particles.emitScorePopup(this.x, this.y - 20, buffNames[this.buffType])
                    }
                }
                reset() {
                    this.x = this.owner.x
                    this.y = this.owner.y - 60
                    this.buffType = null
                    this.buffActive = false
                    this.buffCooldown = 0
                    this.buffDuration = 0
                    this.projectiles = []
                    this.trail = []
                }
                activate(key) {
                    if (this.buffCooldown <= 0 && !this.buffActive) {
                        this.activateRandomBuff()
                    }
                }
                updateProjectiles(dt) {
                    for (let i = this.projectiles.length - 1; i >= 0; i--) {
                        const p = this.projectiles[i]
                        p.x += p.vx * dt
                        p.y += p.vy * dt
                        p.life -= dt
                        p.trailAlpha -= dt * 2

                        if (p.life <= 0 || p.x > 3000) {
                            this.projectiles.splice(i, 1)
                        }
                    }
                }
                shoot() {
                    if (this.projectiles.length < this.maxProjectiles) {
                        const target = this.findNearestEnemy()
                        if (target) {
                            const dx = target.x - this.x
                            const dy = target.y - this.y
                            const dist = Math.sqrt(dx * dx + dy * dy)
                            const speed = 400

                            this.projectiles.push({
                                x: this.x,
                                y: this.y,
                                vx: (dx / dist) * speed,
                                vy: (dy / dist) * speed,
                                life: 3,
                                trailAlpha: 1,
                            })
                        }
                    }
                }
                findNearestEnemy() {
                    let nearest = null
                    let nearestDist = 400

                    return nearest
                }
                draw(ctx, camX, camY, skinKey = 'pink') {
                    if (!this.active) return

                    const sx = this.x - camX
                    const sy = this.y - camY + Math.sin(this.floatOffset) * 3

                    const skin = CONFIG.SKINS[skinKey] || CONFIG.SKINS.pink

                    // Draw trail
                    for (const t of this.trail) {
                        ctx.fillStyle = this.buffType ? this.buffColors[this.buffType] : skin.trailColor
                        ctx.globalAlpha = t.alpha * 0.3
                        ctx.beginPath()
                        ctx.arc(t.x - camX, t.y - camY, 4, 0, Math.PI * 2)
                        ctx.fill()
                    }
                    ctx.globalAlpha = 1

                    // Glow
                    const glowColor = this.buffType ? this.buffColors[this.buffType] : skin.accentColor
                    ctx.shadowColor = glowColor
                    ctx.shadowBlur = 15 + Math.sin(Date.now() / 200) * 5

                    // Body (circular pet)
                    ctx.fillStyle = skin.primaryColor
                    ctx.beginPath()
                    ctx.arc(sx, sy, 10, 0, Math.PI * 2)
                    ctx.fill()

                    // Eyes
                    ctx.fillStyle = '#ffffff'
                    ctx.beginPath()
                    ctx.arc(sx - 3, sy - 2, 3, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.beginPath()
                    ctx.arc(sx + 3, sy - 2, 3, 0, Math.PI * 2)
                    ctx.fill()

                    // Pupils
                    ctx.fillStyle = '#1a1a2a'
                    ctx.beginPath()
                    ctx.arc(sx - 3, sy - 2, 1.5, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.beginPath()
                    ctx.arc(sx + 3, sy - 2, 1.5, 0, Math.PI * 2)
                    ctx.fill()

                    // Shield effect when active
                    if (this.buffType === 'shield' && this.buffActive) {
                        ctx.strokeStyle = glowColor
                        ctx.lineWidth = 2
                        ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 100) * 0.5
                        ctx.beginPath()
                        ctx.arc(sx, sy, 16, 0, Math.PI * 2)
                        ctx.stroke()
                        ctx.globalAlpha = 1
                    }

                    ctx.shadowBlur = 0

                    // Draw projectiles
                    for (const p of this.projectiles) {
                        ctx.fillStyle = '#ff4444'
                        ctx.globalAlpha = p.trailAlpha
                        ctx.beginPath()
                        ctx.arc(p.x - camX, p.y - camY, 4, 0, Math.PI * 2)
                        ctx.fill()
                        ctx.globalAlpha = 1
                    }

                    // Cooldown indicator
                    if (this.buffCooldown > 0) {
                        const ratio = this.buffCooldown / this.maxCooldown
                        ctx.strokeStyle = '#444466'
                        ctx.lineWidth = 2
                        ctx.beginPath()
                        ctx.arc(sx + 12, sy - 12, 6, 0, Math.PI * 2)
                        ctx.stroke()
                        ctx.strokeStyle = '#ff88aa'
                        ctx.beginPath()
                        ctx.arc(sx + 12, sy - 12, 6, -Math.PI / 2, Math.PI * 2 * (1 - ratio) - Math.PI / 2)
                        ctx.stroke()
                    }
                }
            }

            // ============================================================
            // PLAYER CLASS (Cat)
            // ============================================================
            class Player {
                constructor(x, y) {
                    this.x = x
                    this.y = y
                    this.w = 36
                    this.h = 44
                    this.vx = 0
                    this.vy = 0
                    this.onGround = false
                    this.facing = 1
                    this.alive = true
                    this.idleTime = 0
                    this.walkCycle = 0
                    this.jumpTimer = 0
                    this.invincible = 0
                    this.flashTimer = 0
                    this.coyoteCounter = 0
                    this.jumpBufferCounter = 0
                    this.justJumped = false
                    this.startX = x
                    this.startY = y
                    this.trail = []
                    this.maxTrail = 10
                }
                reset(x, y) {
                    this.x = x || this.startX
                    this.y = y || this.startY
                    this.vx = 0
                    this.vy = 0
                    this.onGround = false
                    this.alive = true
                    this.facing = 1
                    this.idleTime = 0
                    this.walkCycle = 0
                    this.invincible = 0
                    this.flashTimer = 0
                    this.coyoteCounter = 0
                    this.jumpBufferCounter = 0
                    this.justJumped = false
                    this.currentPlatform = null
                    this.trail = []
                }
                update(dt, input, platforms, friction = 1.0, skinKey = 'pink') {
                    if (!this.alive) return

                    // Apply friction (lower = more slide on ice)
                    const frictionMult = friction

                    // Horizontal movement
                    let moveX = 0
                    if (input.isDown('ArrowLeft') || input.isDown('KeyA')) moveX = -1
                    if (input.isDown('ArrowRight') || input.isDown('KeyD')) moveX = 1

                    this.vx = moveX * CONFIG.PLAYER_SPEED
                    if (moveX !== 0) this.facing = moveX

                    // Apply momentum-based friction for ice biome
                    if (friction < 1.0 && this.onGround && Math.abs(moveX) < 0.5) {
                        this.vx *= frictionMult
                    }

                    // Coyote time
                    if (this.onGround) {
                        this.coyoteCounter = 0.1
                    } else {
                        this.coyoteCounter -= dt
                    }

                    // Jump buffer - store jump input when pressed early
                    if (input.isJustPressed('ArrowUp') || input.isJustPressed('KeyW') || input.isJustPressed('Space')) {
                        this.jumpBufferCounter = 0.1
                    }

                    // Jump execution
                    const canJump = this.onGround || this.coyoteCounter > 0
                    if (this.jumpBufferCounter > 0 && canJump) {
                        this.vy = CONFIG.PLAYER_JUMP
                        this.onGround = false
                        this.jumpTimer = 0.15
                        this.jumpBufferCounter = 0
                        this.coyoteCounter = 0
                        this.justJumped = true
                    }
                    this.jumpBufferCounter -= dt

                    // Variable jump height - maintain upward velocity while jump key is held
                    if (this.jumpTimer > 0) {
                        this.jumpTimer -= dt
                        if (input.isDown('ArrowUp') || input.isDown('KeyW') || input.isDown('Space')) {
                            this.vy = CONFIG.PLAYER_JUMP
                        } else {
                            this.jumpTimer = 0
                        }
                    }

                    // Gravity
                    this.vy += CONFIG.GRAVITY * dt
                    if (this.vy > 800) this.vy = 800

                    // Move X
                    this.x += this.vx * dt
                    this.resolveCollisionX(platforms)

                    // Move Y
                    this.y += this.vy * dt
                    this.onGround = false
                    this.resolveCollisionY(platforms, dt)

                    // Animations
                    if (moveX !== 0 && this.onGround) {
                        this.walkCycle += dt * 10
                    } else if (this.onGround) {
                        this.idleTime += dt
                    }

                    // Invincibility
                    if (this.invincible > 0) this.invincible -= dt
                    if (this.flashTimer > 0) this.flashTimer -= dt

                    // Trail effects for special skins
                    const skin = CONFIG.SKINS[skinKey] || CONFIG.SKINS.pink
                    if (skin.effects && skin.effects.includes('snowTrail') && Math.abs(this.vx) > 50) {
                        if (this.trail.length < this.maxTrail) {
                            this.trail.push({ x: this.x, y: this.y, life: 1.0 })
                        }
                    } else if (skin.effects && skin.effects.includes('fireTrail') && Math.abs(this.vx) > 50) {
                        if (this.trail.length < this.maxTrail) {
                            this.trail.push({ x: this.x, y: this.y, life: 1.0 })
                        }
                    }

                    // Update trail
                    for (let i = this.trail.length - 1; i >= 0; i--) {
                        this.trail[i].life -= dt * 2
                        if (this.trail[i].life <= 0) {
                            this.trail.splice(i, 1)
                        }
                    }

                    return null
                }
                resolveCollisionX(platforms) {
                    for (const p of platforms) {
                        if (this.overlaps(p)) {
                            if (this.vx > 0) {
                                this.x = p.x - this.w
                            } else if (this.vx < 0) {
                                this.x = p.x + p.w
                            }
                            this.vx = 0
                        }
                    }
                }
                resolveCollisionY(platforms, dt) {
                    this.currentPlatform = null
                    for (const p of platforms) {
                        if (this.overlaps(p)) {
                            if (this.vy > 0) {
                                this.y = p.y - this.h
                                this.vy = 0
                                this.onGround = true
                                this.currentPlatform = p
                            } else if (this.vy < 0) {
                                this.y = p.y + p.h
                                this.vy = 0
                            }
                        }
                    }

                    // Stick to moving platform
                    if (this.onGround && this.currentPlatform && this.currentPlatform.moveConfig) {
                        this.x += this.currentPlatform.currentVx * dt
                    }
                }
                overlaps(other) {
                    return (
                        this.x < other.x + other.w &&
                        this.x + this.w > other.x &&
                        this.y < other.y + other.h &&
                        this.y + this.h > other.y
                    )
                }
                overlapsEnemy(enemy) {
                    return (
                        this.x < enemy.x + enemy.w &&
                        this.x + this.w > enemy.x &&
                        this.y < enemy.y + enemy.h &&
                        this.y + this.h > enemy.y
                    )
                }
                lightenColor(color, amount) {
                    // Simple color lightening - convert hex to rgb, lighten, back to hex
                    const hex = color.replace('#', '')
                    const r = Math.min(255, parseInt(hex.substr(0, 2), 16) + amount * 255)
                    const g = Math.min(255, parseInt(hex.substr(2, 2), 16) + amount * 255)
                    const b = Math.min(255, parseInt(hex.substr(4, 2), 16) + amount * 255)
                    return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`
                }
                draw(ctx, camX, camY, skinKey = 'pink') {
                    if (!this.alive) return

                    const skin = CONFIG.SKINS[skinKey] || CONFIG.SKINS.pink

                    const sx = this.x - camX + this.w / 2
                    const sy = this.y - camY + this.h / 2

                    // Draw trail
                    for (const t of this.trail) {
                        ctx.globalAlpha = t.life * 0.5
                        ctx.fillStyle = skin.trailColor
                        if (skin.effects && skin.effects.includes('snowTrail')) {
                            ctx.beginPath()
                            ctx.arc(t.x - camX + this.w / 2, t.y - camY + this.h / 2, 3 * t.life, 0, Math.PI * 2)
                            ctx.fill()
                        } else if (skin.effects && skin.effects.includes('fireTrail')) {
                            ctx.fillStyle = skin.trailColor
                            ctx.beginPath()
                            ctx.arc(t.x - camX + this.w / 2, t.y - camY + this.h / 2, 4 * t.life, 0, Math.PI * 2)
                            ctx.fill()
                        }
                    }
                    ctx.globalAlpha = 1

                    // Flash when invincible
                    if (this.invincible > 0 && Math.floor(this.flashTimer * 20) % 2 === 0) return

                    ctx.save()
                    ctx.translate(sx, sy)
                    ctx.scale(this.facing, 1)

                    // Breathing animation
                    let breathe = 1
                    if (this.onGround && Math.abs(this.vx) < 10) {
                        breathe = 1 + Math.sin(this.idleTime * 3) * 0.03
                    }
                    ctx.scale(breathe, breathe)

                    // Walking bob
                    let bob = 0
                    if (this.onGround && Math.abs(this.vx) > 10) {
                        bob = Math.sin(this.walkCycle) * 2
                    }

                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.2)'
                    ctx.beginPath()
                    ctx.ellipse(0, this.h / 2 + 2, 16, 4, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Body
                    ctx.fillStyle = skin.primaryColor
                    ctx.beginPath()
                    ctx.ellipse(0, 5 + bob, 14, 16, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Belly (lighter shade)
                    const bellyColor = this.lightenColor(skin.primaryColor, 0.3)
                    ctx.fillStyle = bellyColor
                    ctx.beginPath()
                    ctx.ellipse(2, 8 + bob, 8, 10, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Head
                    ctx.fillStyle = skin.primaryColor
                    ctx.beginPath()
                    ctx.ellipse(0, -14 + bob, 13, 12, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Ears
                    ctx.fillStyle = CONFIG.COLORS.player
                    // Left ear
                    ctx.beginPath()
                    ctx.moveTo(-9, -22 + bob)
                    ctx.lineTo(-14, -34 + bob)
                    ctx.lineTo(-3, -24 + bob)
                    ctx.closePath()
                    ctx.fill()
                    // Right ear
                    ctx.beginPath()
                    ctx.moveTo(9, -22 + bob)
                    ctx.lineTo(14, -34 + bob)
                    ctx.lineTo(3, -24 + bob)
                    ctx.closePath()
                    ctx.fill()

                    // Inner ears
                    ctx.fillStyle = skin.accentColor
                    ctx.beginPath()
                    ctx.moveTo(-8, -23 + bob)
                    ctx.lineTo(-12, -31 + bob)
                    ctx.lineTo(-4, -24 + bob)
                    ctx.closePath()
                    ctx.fill()
                    ctx.beginPath()
                    ctx.moveTo(8, -23 + bob)
                    ctx.lineTo(12, -31 + bob)
                    ctx.lineTo(4, -24 + bob)
                    ctx.closePath()
                    ctx.fill()

                    // Eyes
                    const blinkCycle = Math.sin(this.idleTime * 1.5)
                    const eyeH = blinkCycle > 0.95 ? 1 : 4
                    ctx.fillStyle = '#2a2a4a'
                    ctx.beginPath()
                    ctx.ellipse(-5, -15 + bob, 3, eyeH, 0, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.beginPath()
                    ctx.ellipse(5, -15 + bob, 3, eyeH, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Eye shine
                    if (eyeH > 1) {
                        ctx.fillStyle = '#ffffff'
                        ctx.beginPath()
                        ctx.arc(-4, -16 + bob, 1.2, 0, Math.PI * 2)
                        ctx.fill()
                        ctx.beginPath()
                        ctx.arc(6, -16 + bob, 1.2, 0, Math.PI * 2)
                        ctx.fill()
                    }

                    // Nose
                    ctx.fillStyle = skin.accentColor
                    ctx.beginPath()
                    ctx.ellipse(0, -11 + bob, 2, 1.5, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Mouth
                    ctx.strokeStyle = skin.accentColor
                    ctx.lineWidth = 1
                    ctx.beginPath()
                    ctx.moveTo(0, -10 + bob)
                    ctx.lineTo(-3, -8 + bob)
                    ctx.moveTo(0, -10 + bob)
                    ctx.lineTo(3, -8 + bob)
                    ctx.stroke()

                    // Whiskers
                    ctx.strokeStyle = this.lightenColor(skin.primaryColor, 0.2)
                    ctx.lineWidth = 0.8
                    for (let side = -1; side <= 1; side += 2) {
                        for (let i = -1; i <= 1; i++) {
                            ctx.beginPath()
                            ctx.moveTo(side * 6, -12 + i * 2 + bob)
                            ctx.lineTo(side * 18, -14 + i * 4 + bob)
                            ctx.stroke()
                        }
                    }

                    // Legs
                    const legAnim = this.onGround && Math.abs(this.vx) > 10 ? Math.sin(this.walkCycle) * 5 : 0
                    ctx.fillStyle = skin.primaryColor
                    // Back legs
                    ctx.fillRect(-10, 16 + bob, 7, 8 + legAnim * 0.3)
                    ctx.fillRect(3, 16 + bob, 7, 8 - legAnim * 0.3)
                    // Paws
                    ctx.fillStyle = bellyColor
                    ctx.beginPath()
                    ctx.ellipse(-6, 25 + bob + legAnim * 0.3, 4, 2, 0, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.beginPath()
                    ctx.ellipse(7, 25 + bob - legAnim * 0.3, 4, 2, 0, 0, Math.PI * 2)
                    ctx.fill()

                    ctx.restore()
                }
            }

            // ============================================================
            // ENEMY CLASS
            // ============================================================
            class Enemy {
                constructor(x, y, minX, maxX) {
                    this.x = x
                    this.y = y
                    this.w = 32
                    this.h = 30
                    this.vx = CONFIG.ENEMY_SPEED
                    this.minX = minX
                    this.maxX = maxX
                    this.alive = true
                    this.bounceTime = 0
                    this.deathTimer = 0
                    this.dying = false
                    this.startX = x
                    this.startY = y
                    this.startMinX = minX
                    this.startMaxX = maxX
                }
                reset() {
                    this.x = this.startX
                    this.y = this.startY
                    this.vx = CONFIG.ENEMY_SPEED
                    this.minX = this.startMinX
                    this.maxX = this.startMaxX
                    this.alive = true
                    this.dying = false
                    this.deathTimer = 0
                    this.bounceTime = 0
                }
                update(dt) {
                    if (this.dying) {
                        this.deathTimer -= dt
                        if (this.deathTimer <= 0) this.alive = false
                        return
                    }
                    if (!this.alive) return

                    this.x += this.vx * dt
                    this.bounceTime += dt * 5

                    if (this.x <= this.minX) {
                        this.x = this.minX
                        this.vx = Math.abs(this.vx)
                    }
                    if (this.x + this.w >= this.maxX) {
                        this.x = this.maxX - this.w
                        this.vx = -Math.abs(this.vx)
                    }
                }
                stomp() {
                    this.dying = true
                    this.deathTimer = 0.4
                    this.vx = 0
                }
                draw(ctx, camX, camY) {
                    if (!this.alive) return

                    const sx = this.x - camX + this.w / 2
                    const sy = this.y - camY + this.h / 2

                    ctx.save()
                    ctx.translate(sx, sy)

                    if (this.dying) {
                        const t = 1 - this.deathTimer / 0.4
                        ctx.scale(1 + t * 0.5, 1 - t * 0.8)
                        ctx.globalAlpha = 1 - t
                    }

                    const bounce = Math.abs(Math.sin(this.bounceTime)) * 3
                    ctx.translate(0, -bounce)

                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.2)'
                    ctx.beginPath()
                    ctx.ellipse(0, this.h / 2 + bounce + 2, 14, 4, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Body (spiky blob)
                    ctx.fillStyle = CONFIG.COLORS.enemy
                    ctx.beginPath()
                    ctx.ellipse(0, 0, 14, 12, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Spikes
                    for (let i = 0; i < 8; i++) {
                        const angle = (i / 8) * Math.PI * 2
                        const spikeLen = 5 + Math.sin(this.bounceTime * 2 + i) * 2
                        ctx.fillStyle = CONFIG.COLORS.enemyDark
                        ctx.beginPath()
                        ctx.moveTo(Math.cos(angle) * 12, Math.sin(angle) * 10)
                        ctx.lineTo(Math.cos(angle) * (12 + spikeLen), Math.sin(angle) * (10 + spikeLen))
                        ctx.lineTo(Math.cos(angle + 0.3) * 12, Math.sin(angle + 0.3) * 10)
                        ctx.closePath()
                        ctx.fill()
                    }

                    // Eyes
                    ctx.fillStyle = '#ffffff'
                    ctx.beginPath()
                    ctx.ellipse(-5, -3, 4, 5, 0, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.beginPath()
                    ctx.ellipse(5, -3, 4, 5, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Pupils (look in movement direction)
                    const lookDir = this.vx > 0 ? 1 : -1
                    ctx.fillStyle = '#1a1a2a'
                    ctx.beginPath()
                    ctx.ellipse(-5 + lookDir * 1.5, -3, 2, 3, 0, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.beginPath()
                    ctx.ellipse(5 + lookDir * 1.5, -3, 2, 3, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Angry eyebrows
                    ctx.strokeStyle = '#1a1a2a'
                    ctx.lineWidth = 2
                    ctx.beginPath()
                    ctx.moveTo(-9, -9)
                    ctx.lineTo(-3, -7)
                    ctx.stroke()
                    ctx.beginPath()
                    ctx.moveTo(9, -9)
                    ctx.lineTo(3, -7)
                    ctx.stroke()

                    // Mouth
                    ctx.fillStyle = '#1a1a2a'
                    ctx.beginPath()
                    ctx.arc(0, 4, 4, 0, Math.PI)
                    ctx.fill()

                    // Teeth
                    ctx.fillStyle = '#ffffff'
                    ctx.fillRect(-3, 4, 2, 3)
                    ctx.fillRect(1, 4, 2, 3)

                    ctx.restore()
                }
            }

            // ============================================================
            // FISH COLLECTIBLE
            // ============================================================
            class Fish {
                constructor(x, y) {
                    this.x = x
                    this.y = y
                    this.w = 24
                    this.h = 16
                    this.collected = false
                    this.collectTimer = 0
                    this.floatTime = Math.random() * Math.PI * 2
                    this.startX = x

                }
                reset() {
                    this.x = this.startX
                    this.y = this.startY
                    this.collected = false
                    this.collectTimer = 0
                }
                update(dt) {
                    this.floatTime += dt * 3
                    if (this.collected) {
                        this.collectTimer -= dt
                    }
                }
                draw(ctx, camX, camY) {
                    if (this.collected) return

                    const floatY = Math.sin(this.floatTime) * 4
                    const sx = this.x - camX + this.w / 2
                    const sy = this.y - camY + this.h / 2 + floatY

                    ctx.save()
                    ctx.translate(sx, sy)

                    // Glow
                    ctx.shadowColor = CONFIG.COLORS.fishGlow
                    ctx.shadowBlur = 12 + Math.sin(this.floatTime * 2) * 4

                    // Body
                    ctx.fillStyle = CONFIG.COLORS.fish
                    ctx.beginPath()
                    ctx.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2)
                    ctx.fill()

                    // Tail
                    ctx.beginPath()
                    ctx.moveTo(-8, 0)
                    ctx.lineTo(-16, -6)
                    ctx.lineTo(-16, 6)
                    ctx.closePath()
                    ctx.fill()

                    // Eye
                    ctx.shadowBlur = 0
                    ctx.fillStyle = '#2a2a4a'
                    ctx.beginPath()
                    ctx.arc(5, -2, 2, 0, Math.PI * 2)

                    ctx.fillStyle = '#fff'
                    ctx.beginPath()
                    ctx.arc(5.5, -2.5, 0.8, 0, Math.PI * 2)
                    ctx.fill()

                    // Fin
                    ctx.fillStyle = CONFIG.COLORS.fishGlow
                    ctx.beginPath()
                    ctx.moveTo(0, -5)
                    ctx.lineTo(-4, -12)
                    ctx.lineTo(4, -5)
                    ctx.closePath()
                    ctx.fill()

                    ctx.restore()
