            // ============================================================
            // GOAL FLAG
            // ============================================================
            class GoalFlag {
                constructor(x, y) {
                    this.x = x
                    this.y = y
                    this.w = 40
                    this.h = 80
                    this.pulseTime = 0
                }
                update(dt) {
                    this.pulseTime += dt * 3
                }
                draw(ctx, camX, camY) {
                    const sx = this.x - camX
                    const sy = this.y - camY
                    const pulse = 0.5 + 0.5 * Math.sin(this.pulseTime)

                    ctx.save()

                    // Pole
                    ctx.fillStyle = '#ccccdd'
                    ctx.fillRect(sx + 4, sy, 4, this.h)

                    // Flag
                    ctx.shadowColor = CONFIG.COLORS.flagGlow
                    ctx.shadowBlur = 15 + pulse * 10
                    ctx.fillStyle = CONFIG.COLORS.flag
                    ctx.beginPath()
                    ctx.moveTo(sx + 8, sy + 2)
                    ctx.lineTo(sx + 38 + pulse * 4, sy + 12)
                    ctx.lineTo(sx + 8, sy + 28)
                    ctx.closePath()
                    ctx.fill()

                    // Star on flag
                    ctx.shadowBlur = 0
                    ctx.fillStyle = '#ffffff'
                    this.drawStar(ctx, sx + 20 + pulse * 2, sy + 15, 5)

                    // Glow ring at base
                    ctx.shadowColor = CONFIG.COLORS.flagGlow
                    ctx.shadowBlur = 20 + pulse * 10
                    ctx.strokeStyle = CONFIG.COLORS.flag
                    ctx.lineWidth = 2
                    ctx.beginPath()
                    ctx.ellipse(sx + 6, sy + this.h, 12 + pulse * 3, 4, 0, 0, Math.PI * 2)
                    ctx.stroke()

                    ctx.restore()
                }
                drawStar(ctx, x, y, r) {
                    ctx.beginPath()
                    for (let i = 0; i < 5; i++) {
                        const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2
                        ctx.lineTo(x + Math.cos(angle) * r, y + Math.sin(angle) * r)
                    }
                    ctx.closePath()
                    ctx.fill()
                }
            }

            // ============================================================
            // BACKGROUND PARTICLES (Multi-layer Parallax)
            // ============================================================
            class BackgroundParticle {
                constructor() {
                    this.layer = 0 // 0=far, 1=mid, 2=near
                    this.reset(true)
                }
                reset(initial = false) {
                    this.layer = Math.random() < 0.4 ? 0 : Math.random() < 0.6 ? 1 : 2
                    this.x = Math.random() * CONFIG.WIDTH * 4
                    this.y = initial ? Math.random() * CONFIG.HEIGHT : -10
                    this.size = 1 + Math.random() * (this.layer + 2)
                    this.speed = 10 + Math.random() * 20 + this.layer * 15
                    this.alpha = 0.1 + Math.random() * 0.3 * (3 - this.layer) * 0.3
                    this.drift = (Math.random() - 0.5) * 15
                    this.pulse = Math.random() * Math.PI * 2
                    this.pulseSpeed = 1 + Math.random() * 2
                }
                update(dt) {
                    this.y += this.speed * dt
                    this.x += this.drift * dt
                    this.pulse += this.pulseSpeed * dt
                    if (this.y > CONFIG.HEIGHT + 20) this.reset()
                }
                draw(ctx, camX, camY) {
                    const parallax = 0.1 + this.layer * 0.15
                    const alpha = this.alpha * (0.5 + 0.5 * Math.sin(this.pulse))
                    ctx.fillStyle =
                        this.layer === 0
                            ? `rgba(100, 80, 150, ${alpha})`
                            : this.layer === 1
                              ? `rgba(140, 100, 180, ${alpha})`
                              : `rgba(180, 140, 220, ${alpha})`
                    ctx.beginPath()
                    ctx.arc(this.x - camX * parallax, this.y, this.size, 0, Math.PI * 2)
                    ctx.fill()
                }
            }

            // ============================================================
            // LEVEL GENERATOR (Procedural Chunk System)
            // ============================================================
            class LevelGenerator {
                constructor() {
                    this.chunkSize = 500
                    this.lastChunkX = 0
                    this.difficulty = 1
                    this.distanceTraveled = 0
                    this.lastPlatformY = 460
                    this.lastPlatformRight = 0
                    this.enemyMultiplier = 1.0
                }
                updateDifficulty(distance, enemyMult = 1.0) {
                    this.difficulty = 1 + Math.floor(distance / 1000) * 0.2
                    this.enemyMultiplier = enemyMult
                }
                generateChunk(startX) {
                    const chunk = { platforms: [], enemies: [], fish: [] }
                    let x = startX
                    const platformsInChunk = 3 + Math.floor(Math.random() * 3)

                    for (let i = 0; i < platformsInChunk; i++) {
                        const baseGap = 120 + Math.random() * 80
                        const gap = Math.min(baseGap + this.difficulty * 10, 250)
                        x += gap

                        const heightVar = (Math.random() - 0.5) * 100
                        let y = this.lastPlatformY + heightVar
                        y = Math.max(200, Math.min(480, y))

                        const w = 80 + Math.random() * 120
                        const h = 20

                        const isMoving = Math.random() < 0.15 + this.difficulty * 0.05
                        const moveConfig = isMoving
                            ? { range: 50 + Math.random() * 50, speed: 40 + Math.random() * 30 }
                            : null

                        chunk.platforms.push({
                            x: x,
                            y: y,
                            w: w,
                            h: h,
                            type: 'normal',
                            moveConfig: moveConfig,
                        })

                        x += w

                        if (Math.random() < (0.4 + this.difficulty * 0.1) * (this.enemyMultiplier || 1)) {
                            const enemyX = x - w / 2
                            chunk.enemies.push({
                                x: enemyX,
                                y: y - 30,
                                minX: enemyX - 30,
                                maxX: enemyX + 30,
                            })
                        }

                        if (Math.random() < 0.6) {
                            chunk.fish.push({
                                x: x - w / 2,
                                y: y - 50 - Math.random() * 30,
                            })
                        }
                    }

                    this.lastPlatformY = chunk.platforms[chunk.platforms.length - 1].y
                    this.lastPlatformRight = x
                    this.lastChunkX = startX

                    return chunk
                }
            }

            // ============================================================
            // OBJECT POOL
            // ============================================================
            class ObjectPool {
                constructor(createFn, size) {
                    this.createFn = createFn
                    this.pool = []
                    this.active = []
                    for (let i = 0; i < size; i++) {
                        this.pool.push(createFn())
                    }
                }
                get() {
                    if (this.pool.length > 0) {
                        const obj = this.pool.pop()
                        this.active.push(obj)
                        return obj
                    }
                    const obj = this.createFn()
                    this.active.push(obj)
                    return obj
                }
                release(obj) {
                    const idx = this.active.indexOf(obj)
                    if (idx >= 0) {
                        this.active.splice(idx, 1)
                        this.pool.push(obj)
                    }
                }
                releaseAll() {
                    while (this.active.length > 0) {
                        this.pool.push(this.active.pop())
                    }
                }
            }

            // ============================================================
            // UI MANAGER
            // ============================================================
            class UIManager {
                constructor() {
                    this.score = 0
                    this.state = 'menu' // menu, modeSelect, chapterSelect, skinMenu, cutscene, playing, paused, win, lose, modMenu
                    this.fadeAlpha = 0
                    this.targetFade = 1
                    this.message = ''
                    this.buttonHover = false
                    this.scorePopups = []
                    this.settings = { music: true, sfx: true, volume: 0.5 }
                    this.showSettings = false
                    this.modStatus = ''
                    this.modList = [
                        { name: 'Siêu Nhảy', key: 'superJump', enabled: false, config: { PLAYER_JUMP: -900 } },
                        { name: 'Siêu Tốc Độ', key: 'superSpeed', enabled: false, config: { PLAYER_SPEED: 600 } },
                        { name: 'Trọng Lực Thấp', key: 'lowGravity', enabled: false, config: { GRAVITY: 800 } },
                        { name: 'Bất Tử', key: 'invincible', enabled: false, config: { INVINCIBLE: true } },
                    ]
                }
                setState(state) {
                    this.state = state
                    this.targetFade = state === 'playing' ? 0 : 1
                }
                update(dt) {
                    this.fadeAlpha += (this.targetFade - this.fadeAlpha) * dt * 4
                }
                draw(ctx, distance = 0, biomeKey = 'cyber', game = null) {
                    if (
                        this.state === 'playing' ||
                        this.state === 'menu' ||
                        this.state === 'modeSelect' ||
                        this.state === 'chapterSelect' ||
                        this.state === 'skinMenu'
                    ) {
                        this.drawHUD(ctx, distance, biomeKey, game)
                    }
                    if (this.state === 'menu') {
                        this.drawMenu(ctx)
                        if (this.showSettings) {
                            this.drawSettingsMenu(ctx)
                        }
                    }
                    if (this.state === 'modeSelect') {
                        this.drawModeSelect(ctx)
                    }
                    if (this.state === 'chapterSelect') {
                        this.drawChapterSelect(ctx, game)
                    }
                    if (this.state === 'skinMenu') {
                        this.drawSkinMenu(ctx, game)
                    }
                    if (this.state === 'cutscene') {
                        this.drawCutscene(ctx, game)
                    }
                    if (this.state === 'win') {
                        this.drawOverlay(ctx, '🎉 BẠN THẮNG! 🎉', 'Điểm: ' + this.score, '#00ff88')
                    }
                    if (this.state === 'lose') {
                        this.drawOverlay(ctx, '💀 THUA RỒI 💀', 'Điểm: ' + this.score, '#ff6b6b')
                    }
                    if (this.state === 'paused') {
                        this.drawPauseMenu(ctx)
                    }
                    if (this.state === 'modMenu') {
                        this.drawModMenu(ctx, game)
                    }
                }
                drawHUD(ctx, distance = 0, biomeKey = 'cyber', game = null) {
                    const biome = CONFIG.BIOMES[biomeKey] || CONFIG.BIOMES.cyber

                    // MODDED indicator
                    if (game && game.activeMods.length > 0) {
                        ctx.save()
                        ctx.textAlign = 'left'
                        ctx.font = "bold 14px 'Segoe UI'"
                        ctx.shadowColor = '#ff6ec7'
                        ctx.shadowBlur = 10 + Math.sin(Date.now() / 150) * 5
                        ctx.fillStyle = '#ff6ec7'
                        ctx.fillText('MODDED', 12, CONFIG.HEIGHT - 12)
                        ctx.restore()
                    }

                    // Biome indicator (top center)
                    ctx.save()
                    ctx.textAlign = 'center'
                    ctx.font = "bold 24px 'Segoe UI'"

                    // Glow effect
                    ctx.shadowColor = biome.text
                    ctx.shadowBlur = 15 + Math.sin(Date.now() / 200) * 5

                    // Text with fade
                    ctx.fillStyle = biome.text
                    ctx.globalAlpha = 0.7 + Math.sin(Date.now() / 500) * 0.3
                    ctx.fillText('KHU VỰC: ' + biome.name, CONFIG.WIDTH / 2, 32)
                    ctx.globalAlpha = 1
                    ctx.restore()

                    // Score background
                    ctx.fillStyle = 'rgba(10, 10, 30, 0.6)'
                    ctx.beginPath()
                    ctx.roundRect(12, 12, 160, 40, 10)
                    ctx.fill()

                    ctx.strokeStyle = 'rgba(123, 104, 238, 0.5)'
                    ctx.lineWidth = 1
                    ctx.beginPath()
                    ctx.roundRect(12, 12, 160, 40, 10)
                    ctx.stroke()

                    // Fish icon
                    ctx.fillStyle = CONFIG.COLORS.fish
                    ctx.beginPath()
                    ctx.ellipse(36, 32, 8, 5, 0, 0, Math.PI * 2)
                    ctx.fill()
                    ctx.beginPath()
                    ctx.moveTo(28, 32)
                    ctx.lineTo(22, 28)
                    ctx.lineTo(22, 36)
                    ctx.closePath()
                    ctx.fill()

                    // Score text
                    ctx.fillStyle = CONFIG.COLORS.text
                    ctx.font = "bold 18px 'Segoe UI'"
                    ctx.textAlign = 'left'
                    ctx.fillText(this.score, 50, 39)

                    // Distance meter
                    const distMeters = Math.floor(distance / 10)
                    const distX = CONFIG.WIDTH - 155
                    const distY = 12
                    const distW = 85
                    const distH = 40
                    ctx.fillStyle = 'rgba(10, 10, 30, 0.6)'
                    ctx.beginPath()
                    ctx.roundRect(distX, distY, distW, distH, 10)
                    ctx.fill()
                    ctx.strokeStyle = 'rgba(123, 104, 238, 0.5)'
                    ctx.beginPath()
                    ctx.roundRect(distX, distY, distW, distH, 10)
                    ctx.stroke()

                    // Running icon + distance text centered
                    ctx.fillStyle = '#88ffbb'
                    ctx.shadowColor = '#88ffbb'
                    ctx.shadowBlur = 10
                    ctx.font = "bold 16px 'Segoe UI'"
                    ctx.textAlign = 'center'
                    ctx.fillText('🏃 ' + distMeters + 'm', distX + distW / 2, 39)
                    ctx.shadowBlur = 0

                    // Pause button
                    const pauseBtnX = CONFIG.WIDTH - 60
                    const pauseBtnY = 12
                    const pauseBtnW = 40
                    const pauseBtnH = 40
                    const mx = this._mouseX || 0
                    const my = this._mouseY || 0
                    const isHovered =
                        mx >= pauseBtnX && mx <= pauseBtnX + pauseBtnW && my >= pauseBtnY && my <= pauseBtnY + pauseBtnH

                    ctx.fillStyle = isHovered ? 'rgba(255, 110, 199, 0.8)' : 'rgba(10, 10, 30, 0.6)'
                    ctx.shadowColor = isHovered ? '#ff6ec7' : 'rgba(123, 104, 238, 0.3)'
                    ctx.shadowBlur = isHovered ? 15 : 5
                    ctx.beginPath()
                    ctx.roundRect(pauseBtnX, pauseBtnY, pauseBtnW, pauseBtnH, 10)
                    ctx.fill()
                    ctx.strokeStyle = isHovered ? '#ff6ec7' : 'rgba(123, 104, 238, 0.5)'
                    ctx.lineWidth = 2
                    ctx.stroke()
                    ctx.shadowBlur = 0

                    // Pause icon
                    ctx.fillStyle = '#ffffff'
                    ctx.fillRect(pauseBtnX + 12, pauseBtnY + 10, 6, 20)
                    ctx.fillRect(pauseBtnX + 22, pauseBtnY + 10, 6, 20)
                }
                drawMenu(ctx) {
                    // Cyberpunk overlay
                    const bgGrad = ctx.createRadialGradient(
                        CONFIG.WIDTH / 2,
                        CONFIG.HEIGHT / 2,
                        0,
                        CONFIG.WIDTH / 2,
                        CONFIG.HEIGHT / 2,
                        400,
                    )
                    bgGrad.addColorStop(0, 'rgba(10, 10, 30, 0.9)')
                    bgGrad.addColorStop(1, 'rgba(26, 26, 42, 0.95)')
                    ctx.fillStyle = bgGrad
                    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT)

                    // Decorative corner elements
                    ctx.strokeStyle = '#ff6ec7'
                    ctx.lineWidth = 2
                    ctx.shadowColor = '#ff6ec7'
                    ctx.shadowBlur = 10
                    // Top-left
                    ctx.beginPath()
                    ctx.moveTo(50, 50)
                    ctx.lineTo(100, 50)
                    ctx.lineTo(50, 100)
                    ctx.closePath()
                    ctx.stroke()
                    // Top-right
                    ctx.beginPath()
                    ctx.moveTo(CONFIG.WIDTH - 50, 50)
                    ctx.lineTo(CONFIG.WIDTH - 100, 50)
                    ctx.lineTo(CONFIG.WIDTH - 50, 100)
                    ctx.closePath()
                    ctx.stroke()
                    // Bottom-left
                    ctx.beginPath()
                    ctx.moveTo(50, CONFIG.HEIGHT - 50)
                    ctx.lineTo(100, CONFIG.HEIGHT - 50)
                    ctx.lineTo(50, CONFIG.HEIGHT - 100)
                    ctx.closePath()
                    ctx.stroke()
                    // Bottom-right
                    ctx.beginPath()
                    ctx.moveTo(CONFIG.WIDTH - 50, CONFIG.HEIGHT - 50)
                    ctx.lineTo(CONFIG.WIDTH - 100, CONFIG.HEIGHT - 50)
                    ctx.lineTo(CONFIG.WIDTH - 50, CONFIG.HEIGHT - 100)
                    ctx.closePath()
                    ctx.stroke()
                    ctx.shadowBlur = 0

                    // Fake barcode
                    ctx.strokeStyle = '#00f3ff'
                    ctx.lineWidth = 1
                    for (let i = 0; i < 20; i++) {
                        const x = 20 + i * 10
                        const height = Math.random() * 50 + 20
                        ctx.beginPath()
                        ctx.moveTo(x, CONFIG.HEIGHT - 20 - height)
                        ctx.lineTo(x, CONFIG.HEIGHT - 20)
                        ctx.stroke()
                    }

                    ctx.fillStyle = '#ffffff'

                    const textY = boxY + 30

                    if (game.cutsceneIndex < game.cutsceneText.length) {
                        const currentText = game.cutsceneText[game.cutsceneIndex]
                        const elapsed = Date.now() - game.cutsceneStartTime
                        const charCount = Math.floor(elapsed / 40)
                        const displayText = currentText.substring(0, Math.min(currentText.length, charCount))
                        this.drawWrappedText(ctx, displayText, textX, textY, maxWidth, 20)

                        // Draw skip/next hint
                        if (charCount > currentText.length + 5) {
                            ctx.save()
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'
                            ctx.font = "italic 12px 'Segoe UI'"
                            ctx.textAlign = 'right'
                            ctx.fillText('Click hoặc Space để tiếp tục...', CONFIG.WIDTH - 40, boxY + boxHeight - 15)

                        }

                drawCharacterPortrait(ctx, speaker, x, y) {
                    ctx.save()
                    ctx.translate(x, y)

                    if (speaker === 'tom') {
                        // Tom portrait
                        ctx.fillStyle = CONFIG.COLORS.player
                        ctx.beginPath()
                        ctx.ellipse(0, -10, 25, 20, 0, 0, Math.PI * 2)

                        ctx.fillStyle = '#2a2a4a'

                        ctx.fill()
                        ctx.beginPath()
                        ctx.ellipse(8, -15, 4, 6, 0, 0, Math.PI * 2)
                        ctx.fill()
                    } else if (speaker === 'jerry') {
                        // Jerry portrait
                        ctx.fillStyle = '#ff99bb'
                        ctx.beginPath()
                        ctx.arc(0, -10, 20, 0, Math.PI * 2)
                        ctx.fill()

                        // Eyes
                        ctx.fillStyle = '#ffffff'
                        ctx.beginPath()
                        ctx.arc(-6, -12, 6, 0, Math.PI * 2)
                        ctx.fill()
                        ctx.beginPath()
                        ctx.arc(6, -12, 6, 0, Math.PI * 2)
                        ctx.fill()

                        ctx.beginPath()
                        ctx.arc(-6, -12, 3, 0, Math.PI * 2)
                        ctx.fill()
                        ctx.beginPath()
                        ctx.arc(6, -12, 3, 0, Math.PI * 2)
                        ctx.fill()
                    }

                    ctx.restore()
                }
                drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
                    const words = text.split(' ')
                    let line = ''
                    let currentY = y

                    for (let i = 0; i < words.length; i++) {
                        const testLine = line + words[i] + ' '
                        const metrics = ctx.measureText(testLine)
                        const testWidth = metrics.width

                        if (testWidth > maxWidth && i > 0) {
                            ctx.fillText(line, x, currentY)
                            line = words[i] + ' '
                            currentY += lineHeight
                        } else {
                            line = testLine
                        }
                    }
                    ctx.fillText(line, x, currentY)
                }

                    ctx.shadowColor = color
                    ctx.shadowBlur = 30
                    ctx.fillStyle = color
                    ctx.font = "bold 48px 'Segoe UI'"
                    ctx.textAlign = 'center'
                    ctx.fillText(title, CONFIG.WIDTH / 2, 200)
                    ctx.restore()

                    ctx.fillStyle = '#ddddff'
                    ctx.font = "bold 24px 'Segoe UI'"
                    ctx.textAlign = 'center'

                    this.drawButton(ctx, CONFIG.WIDTH / 2, 370, '🔄 CHƠI LẠI')

                drawButton(ctx, x, y, text, fixedWidth, fixedHeight) {
                    ctx.font = "bold 24px 'Segoe UI'"
                    ctx.textAlign = 'center'
                    const padding = 40
                    let w = fixedWidth || ctx.measureText(text).width + padding
                    if (!fixedWidth && w < 140) w = 140 // minimum width only if not fixed
                    const h = fixedHeight || 56
                    const bx = x - w / 2,
                        by = y - h / 2

                    // Check hover
                    const mx = this._mouseX || 0,
                        my = this._mouseY || 0
                    this.buttonHover = mx >= bx && mx <= bx + w && my >= by && my <= by + h

                    const scale = this.buttonHover ? 1.08 : 1
                    const glow = this.buttonHover ? 35 : 20
                    const borderColor = this.buttonHover ? '#ff6ec7' : '#7b68ee'

                    ctx.save()
                    ctx.translate(x, y)
                    ctx.scale(scale, scale)

                    // Glassmorphism background
                    const bgGrad = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2)
                    bgGrad.addColorStop(0, 'rgba(26, 26, 42, 0.95)') // deep purple
                    bgGrad.addColorStop(0.5, 'rgba(123, 104, 238, 0.7)') // neon purple
                    bgGrad.addColorStop(1, 'rgba(255, 110, 199, 0.6)') // cyber pink
                    ctx.fillStyle = bgGrad
                    ctx.shadowColor = borderColor
                    ctx.shadowBlur = glow

                    ctx.beginPath()
                    ctx.roundRect(-w / 2, -h / 2, w, h, 16)
                    ctx.fill()

                    // Inner highlight
                    ctx.shadowBlur = 0
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'
                    ctx.fillRect(-w / 2 + 6, -h / 2 + 6, w - 12, 12)

                    // Neon border
                    ctx.strokeStyle = borderColor
                    ctx.lineWidth = 3
                    ctx.stroke()

                    // Text with glow
                    ctx.textBaseline = 'middle'
                    ctx.shadowColor = '#ffffff'
                    ctx.shadowBlur = 8
                    ctx.fillStyle = '#ffffff'
                    ctx.fillText(text, 0, 0)
                    ctx.shadowBlur = 0

                    ctx.restore()
                }

                buildLevel() {
                    this.platforms = []
                    this.enemies = []
                    this.fish = []
                    this.generatedChunks = []
                    this.lastGeneratedX = 0
                    this.distance = 0
                    this.levelGenerator = new LevelGenerator()

                    if (this.gameMode === 'story') {
                        const chapter = CONFIG.CHAPTERS[this.currentChapter]
                        // Force specific biomes for story mode
                        this.levelGenerator.enemyMultiplier = 1.0 + (this.currentChapter - 1) * 0.2
                    }

                    // Generate initial ground
                    this.platforms.push(new Platform(0, 460, 400, 80, 'grass'))
                    this.lastGeneratedX = 400

                    // Generate starting platform area
                    this.generateAhead(0, 1500)

                    // Set initial playable area
                    this.playableArea = { left: 0, right: this.lastGeneratedX }
                }
                generateAhead(cameraX, distance) {
                    // Check for custom chunks from mods
                    if (this.customChunks && this.customChunks.length > 0) {
                        const currentChunkIndex = Math.floor(this.lastGeneratedX / this.levelGenerator.chunkSize)
                        if (currentChunkIndex < this.customChunks.length) {
                            const customChunk = this.customChunks[currentChunkIndex]
                            if (
                                customChunk &&
                                this.lastGeneratedX < customChunk.startX + this.levelGenerator.chunkSize
                            ) {
                                // Use custom chunk instead of generating
                                this.generatedChunks.push(customChunk)

                                for (const p of customChunk.platforms) {
                                    this.platforms.push(
                                        new Platform(p.x, p.y, p.w, p.h, p.type || 'normal', p.moveConfig || null),
                                    )
                                }

                                for (const e of customChunk.enemies || []) {
                                    if (this.gameMode === 'story') {
                                        const chapter = CONFIG.CHAPTERS[this.currentChapter]
                                        if (e.x > chapter.targetDistance) continue
                                    }
                                    this.enemies.push(new Enemy(e.x, e.y, e.minX, e.maxX))
                                }

                                for (const f of customChunk.fish || []) {
                                    if (this.gameMode === 'story') {
                                        const chapter = CONFIG.CHAPTERS[this.currentChapter]
                                        if (f.x > chapter.targetDistance) continue
                                    }
                                    this.fish.push(new Fish(f.x, f.y))
                                }

                                this.lastGeneratedX = customChunk.startX + this.levelGenerator.chunkSize
                                return
                            }
                        }
                    }

                    let generateUntil = cameraX + distance + CONFIG.WIDTH

                    if (this.gameMode === 'story') {
                        const chapter = CONFIG.CHAPTERS[this.currentChapter]
                        const maxGenerate = chapter.targetDistance + 1000 // buffer vùng kết thúc
                        if (generateUntil > maxGenerate) {
                            generateUntil = maxGenerate
                        }
                    }

                    while (this.lastGeneratedX < generateUntil) {
                        const chunk = this.levelGenerator.generateChunk(this.lastGeneratedX)
                        this.generatedChunks.push(chunk)

                        for (const p of chunk.platforms) {
                            const platform = new Platform(p.x, p.y, p.w, p.h, p.type, p.moveConfig)
                            this.platforms.push(platform)
                        }

                        for (const e of chunk.enemies) {
                            if (this.gameMode === 'story') {
                                const chapter = CONFIG.CHAPTERS[this.currentChapter]
                                if (e.x > chapter.targetDistance) continue // không sinh quái sau lá cờ
                            }
                            this.enemies.push(new Enemy(e.x, e.y, e.minX, e.maxX))
                        }

                        for (const f of chunk.fish) {
                            if (this.gameMode === 'story') {
                                const chapter = CONFIG.CHAPTERS[this.currentChapter]
                                if (f.x > chapter.targetDistance) continue // không sinh cá sau lá cờ
                            }
                            this.fish.push(new Fish(f.x, f.y))
                        }

                        this.lastGeneratedX = this.levelGenerator.lastPlatformRight
                    }
                }
                cleanupBehind(cameraX) {
                    const despawnX = cameraX - 200

                    // Remove platforms behind camera
                    this.platforms = this.platforms.filter((p) => {
                        if (p.x + p.w < despawnX) {
                            return false
                        }
                        return true
                    })

                    // Remove enemies behind camera
                    this.enemies = this.enemies.filter((e) => {
                        if (e.x + e.w < despawnX) {
                            return false
                        }
                        return true
                    })

                    // Remove fish behind camera
                    this.fish = this.fish.filter((f) => {
                        if (f.x + f.w < despawnX) {
                            return false
                        }
                        return true
                    })
                }
                updateLevel(cameraX, dt, enemyMult = 1.0) {
                    // Update distance
                    this.distance = Math.max(this.distance, this.player.x)

                    // Update skin stats distance
                    this.skinStats.distance = Math.max(this.skinStats.distance, this.distance)
                    this.checkSkinUnlocks()

                    // Update difficulty (apply biome enemy multiplier)
                    this.levelGenerator.updateDifficulty(this.distance, enemyMult)

                    // Generate new chunks ahead
                    this.generateAhead(cameraX, 800)

                    // Clean up old entities
                    this.cleanupBehind(cameraX)

                    // Update playable area
                    this.playableArea.right = this.lastGeneratedX
                }

                        const chapter = CONFIG.CHAPTERS[this.currentChapter]
                        // Add goal flag for story mode - place on the last platform
                        const lastPlatform = this.platforms[this.platforms.length - 1]
                        const flagY = lastPlatform ? lastPlatform.y - 80 : 400
                        this.goal = new GoalFlag(chapter.targetDistance, flagY)
                    } else {
                        this.goal = null
                    }
                }
                restartGame() {
                    this.ui.setState('playing')
                    this.ui.score = 0
                    this.score = 0
                    this.player.reset()
                    this.pet.reset()
                    this.buildLevel()
                    this.camera.x = 0
                    this.camera.y = 0
                    this.shake.timer = 0
                }
                triggerShake(intensity = CONFIG.SHAKE_INTENSITY) {
                    this.shake.timer = CONFIG.SHAKE_DURATION
                    this.shake.intensity = intensity
                }
                update(dt) {
                    this.time += dt
                    this.input.update()
                    this.ui.update(dt)

                    // Handle pause toggle
                    if (this.input.isJustPressed('Escape') || this.input.isJustPressed('KeyP')) {
                        if (this.ui.state === 'playing') {
                            this.ui.setState('paused')
                            this.audio.duckMusic(0.3, 0.1)
                        } else if (this.ui.state === 'paused' && !this.ui.showSettings) {
                            this.ui.setState('playing')
                        }
                    }

                    if (this.ui.state === 'cutscene') {
                        if (
                            this.input.isJustPressed('Space') ||
                            this.input.isJustPressed('Enter') ||
                            this.input.isJustPressed('KeyE')
                        ) {
                            this.advanceCutscene()
                        }
                        for (const bp of this.bgParticles) bp.update(dt)
                        return
                    }

                    if (this.ui.state === 'paused') {
                        // Still render particles and UI when paused
                        this.particles.update(dt)
                        for (const bp of this.bgParticles) bp.update(dt)
                        return
                    }

                    if (this.ui.state !== 'playing') {
                        // Still update bg particles
                        for (const bp of this.bgParticles) bp.update(dt)
                        return
                    }

                    // Update platforms
                    for (const p of this.platforms) p.update(dt)

                    // Apply biome speed modifier
                    const gameSpeed = this.biome.gameSpeed
                    const adjustedDt = dt * gameSpeed

                    // Update player
                    this.player.update(adjustedDt, this.input, this.platforms, this.biome.friction, this.selectedSkin)
                    if (this.player.justJumped) {
                        this.player.justJumped = false
                        this.audio.jump()
                        this.particles.emitJumpDust(
                            this.player.x + this.player.w / 2,
                            this.player.y + this.player.h,
                            this.selectedSkin,
                        )
                    }

                    // Kiểm tra nếu player đi quá xa lá cờ mà chưa thắng (chỉ trong Story Mode)
                    if (
                        this.gameMode === 'story' &&
                        this.goal &&
                        this.player.x > this.goal.x + 100 &&
                        this.ui.state === 'playing'
                    ) {
                        this.winGame()
                    }

                    // Update pet
                    this.pet.update(dt)
                    if (this.input.isJustPressed('KeyE')) {
                        this.pet.activate('KeyE')
                        this.audio.petBuff()
                        if (this.pet.buffType === 'attack') {
                            this.pet.shoot()
                        }
                    }

                    // Apply magnet buff
                    if (this.pet.buffType === 'magnet' && this.pet.buffActive) {
                        this.applyMagnet(dt)
                    }

                    // Apply double score buff
                    if (this.pet.buffType === 'doubleScore' && this.pet.buffActive) {
                        // Score multiplier handled in fish collection
                    }

                    // Check projectile hits
                    this.checkProjectileHits()

                    // Fall death
                    if (this.player.y > CONFIG.HEIGHT + 100) {
                        this.playerDie()
                    }

                    // Update enemies
                    for (const e of this.enemies) {
                        e.update(dt)
                        if (!e.alive || e.dying) continue

                        if (this.player.alive && this.player.invincible <= 0 && this.player.overlapsEnemy(e)) {
                            // Check if stomping (player falling and player's feet above enemy center)
                            if (this.player.vy > 0 && this.player.y + this.player.h < e.y + e.h * 0.5) {
                                // Stomp!
                                e.stomp()
                                this.player.vy = CONFIG.PLAYER_JUMP * 0.6
                                this.score += 50
                                this.ui.score = this.score
                                const pan = ((e.x - this.player.x) / CONFIG.WIDTH) * 2 - 1
                                this.audio.playSFX('stomp', 0.15, pan)
                                this.particles.emitStompBurst(e.x + e.w / 2, e.y + e.h / 2)
                                this.particles.emitScorePopup(e.x + e.w / 2, e.y - 10, '+50')
                                this.triggerShake(5)

                                // Update skin stats - count as boss kill
                                this.skinStats.bossKills++
                                this.checkSkinUnlocks()
                            } else {
                                // Hit by enemy - check shield
                                if (this.pet.buffType === 'shield' && this.pet.buffActive) {
                                    // Shield blocks the hit
                                    this.pet.buffActive = false
                                    this.pet.buffType = null
                                    this.pet.buffDuration = 0
                                    this.pet.buffCooldown = 5
                                    this.triggerShake(3)
                                    // Push enemy away
                                    e.x = e.x - 50
                                } else {
                                    const pan = ((e.x - this.player.x) / CONFIG.WIDTH) * 2 - 1
                                    this.audio.playSFX('hit', 0.15, pan)
                                    this.playerDie()
                                }
                            }
                        }
                    }

                    // Update fish
                    for (const f of this.fish) {
                        f.update(dt)
                        if (!f.collected && this.player.alive && this.player.overlaps(f)) {
                            f.collected = true
                            f.collectTimer = 0.5

                            // Double score buff
                            const scoreGain = this.pet.buffType === 'doubleScore' && this.pet.buffActive ? 20 : 10
                            this.score += scoreGain
                            this.ui.score = this.score
                            this.audio.collect()
                            this.particles.emitCollectBurst(f.x + f.w / 2, f.y + f.h / 2)
                            this.particles.emitScorePopup(f.x + f.w / 2, f.y - 10, '+' + scoreGain)

                            // Update skin stats
                            this.skinStats.fish++
                            this.checkSkinUnlocks()
                        }
                    }

                    // Update goal (check for null in procedural generation mode)
                    if (this.goal) {
                        this.goal.update(dt)
                        if (this.player.alive) {
                            const gx = this.goal.x,
                                gy = this.goal.y
                            if (
                                this.player.x + this.player.w > gx &&
                                this.player.x < gx + this.goal.w &&
                                this.player.y + this.player.h > gy &&
                                this.player.y < gy + this.goal.h
                            ) {
                                this.winGame()
                            }
                        }
                    }

                    // Update particles
                    this.particles.update(dt)

                    // Update bg particles
                    for (const bp of this.bgParticles) bp.update(dt)

                    // Procedural level generation
                    this.updateLevel(this.camera.x, dt, this.biome.enemyMult)

                    // Biome transition
                    if (this.distance > this.nextBiomeDistance) {
                        this.nextBiomeDistance += CONFIG.BIOME_DISTANCE

                        if (this.gameMode === 'story') {
                            const chapter = CONFIG.CHAPTERS[this.currentChapter]
                            const biomes = chapter.biomes
                            const currentIdx = biomes.indexOf(this.biomeKey)
                            if (currentIdx < biomes.length - 1) {
                                this.biomeKey = biomes[currentIdx + 1]
                            } else {
                                // Stay in last biome
                                this.biomeKey = biomes[biomes.length - 1]
                            }
                        } else {
                            // Endless mode: random biomes
                            const biomeKeys = Object.keys(CONFIG.BIOMES)
                            const currentIdx = biomeKeys.indexOf(this.biomeKey)
                            let nextIdx = Math.floor(Math.random() * biomeKeys.length)
                            while (nextIdx === currentIdx && biomeKeys.length > 1) {
                                nextIdx = Math.floor(Math.random() * biomeKeys.length)
                            }
                            this.biomeKey = biomeKeys[nextIdx]
                        }

                        // Update skin stats biome visits
                        this.skinStats.biomeVisits[this.biomeKey] = (this.skinStats.biomeVisits[this.biomeKey] || 0) + 1
                        this.checkSkinUnlocks()
                    }

                    // Smooth biome transition
                    if (this.biomeTransition > 0) {
                        this.biomeTransition -= dt * this.biomeTransitionSpeed
                        if (this.biomeTransition < 0) this.biomeTransition = 0
                    }

                    // Apply current biome
                    this.biome = CONFIG.BIOMES[this.biomeKey]

                    // Update BGM on biome change
                    if (this.biomeKey !== this.currentBiomeKey) {
                        this.currentBiomeKey = this.biomeKey
                        this.audio.playBGM(this.biomeKey)
                    }

                    // Screen pulse and glow for music sync
                    this.screenPulse = Math.sin(this.time * 4) * 0.05
                    this.glowIntensity = 0.5 + Math.sin(this.time * 2) * 0.2

                    // Camera
                    this.camera.targetX = this.player.x + this.player.w / 2 - CONFIG.WIDTH / 2

                    this.camera.x += (this.camera.targetX - this.camera.x) * CONFIG.CAMERA_SMOOTH
                    this.camera.y += (this.camera.targetY - this.camera.y) * CONFIG.CAMERA_SMOOTH

                    // Screen shake
                    if (this.shake.timer > 0) {
                        this.shake.timer -= dt
                        const shakeX =
                            (Math.random() - 0.5) * this.shake.intensity * (this.shake.timer / CONFIG.SHAKE_DURATION)
                        const shakeY =
                            (Math.random() - 0.5) * this.shake.intensity * (this.shake.timer / CONFIG.SHAKE_DURATION)
                        this.camera.x += shakeX
                        this.camera.y += shakeY
                    }
                }

                // ============================================================
                // MOD SYSTEM
                // ============================================================
                loadMod(jsonString) {
                    try {
                        const mod = JSON.parse(jsonString)

                        // Validate mod structure
                        if (!mod || typeof mod !== 'object') {
                            return { success: false, error: 'Mod phải là object JSON hợp lệ' }
                        }

                        // Restore default config first
                        this.restoreDefaultConfig()

                        // Apply gameplay overrides
                        if (mod.gameplay) {
                            if (typeof mod.gameplay.GRAVITY === 'number') CONFIG.GRAVITY = mod.gameplay.GRAVITY
                            if (typeof mod.gameplay.PLAYER_SPEED === 'number')
                                CONFIG.PLAYER_SPEED = mod.gameplay.PLAYER_SPEED
                            if (typeof mod.gameplay.PLAYER_JUMP === 'number')
                                CONFIG.PLAYER_JUMP = mod.gameplay.PLAYER_JUMP
                        }

                        // Add custom skins
                        if (mod.skins && typeof mod.skins === 'object') {
                            for (const [
                                key,
                                skin,
                            ] of Object.entries(mod.skins)) {
                                CONFIG.SKINS[key] = { ...skin, isModded: true }
                            }
                        }

                        // Load custom chunks
                        if (mod.customChunks && Array.isArray(mod.customChunks)) {
                            this.customChunks = mod.customChunks
                        }

                        // Add to active mods
                        this.activeMods.push({
                            id: mod.id || `mod_${Date.now()}`,
                            name: mod.name || 'Mod không tên',
                            author: mod.author || 'Ẩn danh',
                            ...mod,
                        })

                        return { success: true, mod: mod }
                    } catch (e) {
                        return { success: false, error: e.message }
                    }
                }

                restoreDefaultConfig() {
                    // Restore core config
                    CONFIG.GRAVITY = DEFAULT_CONFIG.GRAVITY
                    CONFIG.PLAYER_SPEED = DEFAULT_CONFIG.PLAYER_SPEED
                    CONFIG.PLAYER_JUMP = DEFAULT_CONFIG.PLAYER_JUMP

                    // Restore skins (keep default ones only)
                    CONFIG.SKINS = JSON.parse(JSON.stringify(DEFAULT_CONFIG.SKINS))

                    // Clear custom chunks
                    this.customChunks = null

                    // Clear active mods
                    this.activeMods = []
                }

                applyMods(modList) {
                    // Restore default first
                    this.restoreDefaultConfig()

                    // Apply enabled mods
                    modList.forEach((mod) => {
                        if (!mod.enabled) return
                        if (mod.config) {
                            if (typeof mod.config.GRAVITY === 'number') CONFIG.GRAVITY = mod.config.GRAVITY
                            if (typeof mod.config.PLAYER_SPEED === 'number')
                                CONFIG.PLAYER_SPEED = mod.config.PLAYER_SPEED
                            if (typeof mod.config.PLAYER_JUMP === 'number') CONFIG.PLAYER_JUMP = mod.config.PLAYER_JUMP
                        }
                    })
                }

                playerDie() {
                    if (!this.player.alive) return
                    this.player.alive = false
                    this.audio.lose()
                    this.particles.emitDeathBurst(this.player.x + this.player.w / 2, this.player.y + this.player.h / 2)
                    this.triggerShake(10)
                    this.saveSkinStats()
                    setTimeout(() => this.ui.setState('lose'), 800)
                }
                winGame() {
                    this.audio.win()
                    this.triggerShake(6)
                    this.saveSkinStats()

                    if (this.gameMode === 'story') {
                        this.startChapterOutro()
                    } else {
                        this.ui.setState('win')
                    }
                }
                applyMagnet(dt) {
                    const magnetRange = 150
                    const magnetSpeed = 300

                    for (const f of this.fish) {
                        if (f.collected) continue

                        const dx = this.player.x - f.x
                        const dy = this.player.y - f.y
                        const dist = Math.sqrt(dx * dx + dy * dy)

                        if (dist < magnetRange) {
                            f.x += (dx / dist) * magnetSpeed * dt * (1 - dist / magnetRange)
                            f.y += (dy / dist) * magnetSpeed * dt * (1 - dist / magnetRange)
                        }
                    }
                }
                checkProjectileHits() {
                    for (const p of this.pet.projectiles) {
                        for (const e of this.enemies) {
                            if (!e.alive || e.dying) continue

                            const dx = p.x - (e.x + e.w / 2)
                            const dy = p.y - (e.y + e.h / 2)
                            const dist = Math.sqrt(dx * dx + dy * dy)

                            if (dist < 15) {
                                e.stomp()
                                this.score += 50
                                this.ui.score = this.score
                                this.audio.stomp()
                                p.life = 0
                                this.particles.emitStompBurst(e.x + e.w / 2, e.y + e.h / 2)
                                break
                            }
                        }
                    }
                }
                checkSkinUnlocks() {
                    for (const skinKey in CONFIG.SKINS) {
                        if (this.unlockedSkins.includes(skinKey)) continue

                        const req = CONFIG.SKINS[skinKey].unlockRequirements
                        let unlocked = false

                        if (req.default) {
                            unlocked = true
                        } else if (req.fish && this.skinStats.fish >= req.fish) {
                            unlocked = true
                        } else if (req.distance && this.skinStats.distance >= req.distance) {
                            unlocked = true
                        } else if (req.bossKills && this.skinStats.bossKills >= req.bossKills) {
                            unlocked = true
                        } else if (
                            req.biome &&
                            req.fish &&
                            this.skinStats.biomeVisits[req.biome] &&
                            this.skinStats.fish >= req.fish
                        ) {
                            unlocked = true
                        } else if (req.storyComplete && this.highestChapter >= 5) {
                            unlocked = true
                        }

                        if (unlocked) {
                            this.unlockedSkins.push(skinKey)
                            localStorage.setItem('unlockedSkins', JSON.stringify(this.unlockedSkins))
                            // Emit unlock effect
                            this.particles.emitScorePopup(
                                this.player.x + this.player.w / 2,
                                this.player.y - 30,
                                'SKIN MỚI!',
                            )
                        }
                    }
                }
                saveSkinStats() {
                    localStorage.setItem('skinStats', JSON.stringify(this.skinStats))
                }
                startChapterIntro() {
                    const chapter = CONFIG.CHAPTERS[this.currentChapter]
                    this.cutsceneText = chapter.introText
                    this.cutsceneIndex = 0
                    this.cutsceneStartTime = Date.now()
                    this.cutsceneSpeaker = 'tom'
                    this.ui.setState('cutscene')
                }
                startChapterOutro() {
                    const chapter = CONFIG.CHAPTERS[this.currentChapter]
                    this.cutsceneText = chapter.outroText
                    this.cutsceneIndex = 0
                    this.cutsceneStartTime = Date.now()
                    this.cutsceneSpeaker = 'tom'
                    this.ui.setState('cutscene')
                }
                advanceCutscene() {
                    if (this.cutsceneIndex < this.cutsceneText.length - 1) {
                        this.cutsceneIndex++
                        this.cutsceneStartTime = Date.now()
                        this.cutsceneSpeaker = this.cutsceneSpeaker === 'tom' ? 'jerry' : 'tom'
                    } else {
                        // End cutscene
                        if (this.gameMode === 'story') {
                            // Check if this is outro (after completing chapter)
                            const chapter = CONFIG.CHAPTERS[this.currentChapter]
                            const isOutro = this.cutsceneText === chapter.outroText

                            if (isOutro) {
                                // After outro, complete chapter and go back to chapter select
                                this.completeChapter(true) // skip outro since we're already in it
                                this.cutsceneText = []
                                this.cutsceneIndex = 0
                                this.ui.setState('chapterSelect')
                            } else if (this.distance >= chapter.targetDistance) {
                                // Chapter completed, start outro
                                this.completeChapter()
                            } else {
                                // Intro finished, start game
                                this.cutsceneText = []
                                this.cutsceneIndex = 0
                                this.startGame()
                            }
                        } else {
                            this.cutsceneText = []
                            this.cutsceneIndex = 0
                            this.ui.setState('menu')
                        }
                    }
                }
                completeChapter(skipOutro = false) {
                    if (this.currentChapter > this.highestChapter) {
                        this.highestChapter = this.currentChapter
                        localStorage.setItem('highestChapter', this.highestChapter.toString())
                    }

                    // Apply rewards
                    const reward = CONFIG.CHAPTERS[this.currentChapter].reward
                    if (reward.unlockSkin) {
                        if (!this.unlockedSkins.includes(reward.unlockSkin)) {
                            this.unlockedSkins.push(reward.unlockSkin)
                            localStorage.setItem('unlockedSkins', JSON.stringify(this.unlockedSkins))
                        }
                    }

                    if (this.currentChapter === 5) {
                        // Game completed
                        this.ui.setState('win')
                    } else if (!skipOutro) {
                        this.startChapterOutro()
                    }
                    // If skipOutro is true, don't start outro (already in it)
                }
                draw() {
                    // Background gradient with biome
                    const bgGrad = ctx.createLinearGradient(0, 0, 0, CONFIG.HEIGHT)
                    const transition = this.biomeTransition
                    const b = this.biome

                    // Interpolate colors for transition effect
                    bgGrad.addColorStop(0, b.bg1)
                    bgGrad.addColorStop(0.5, b.bg2)
                    bgGrad.addColorStop(1, b.bg3)
                    ctx.fillStyle = bgGrad
                    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT)

                    // Fog effect per biome
                    if (b.fogColor && transition > 0) {
                        ctx.fillStyle = b.fogColor
                        ctx.globalAlpha = transition * 0.3 * Math.sin(this.time * 2)
                        ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT)
                        ctx.globalAlpha = 1
                    }

                    // Background particles (parallax)
                    for (const bp of this.bgParticles) {
                        bp.draw(ctx, this.camera.x, this.camera.y)
                    }

                    // Background decoration - distant mountains
                    this.drawBackgroundMountains()

                    // Game objects
                    for (const p of this.platforms) {
                        p.draw(ctx, this.camera.x, this.camera.y, this.biomeKey)
                    }
                    for (const f of this.fish) {
                        f.draw(ctx, this.camera.x, this.camera.y)
                    }
                    if (this.goal) {
                        this.goal.draw(ctx, this.camera.x, this.camera.y)
                    }
                    for (const e of this.enemies) {
                        e.draw(ctx, this.camera.x, this.camera.y)
                    }
                    this.player.draw(ctx, this.camera.x, this.camera.y, this.selectedSkin)
                    this.pet.draw(ctx, this.camera.x, this.camera.y, this.selectedSkin)
                    this.particles.draw(ctx, this.camera.x, this.camera.y)

                    // UI overlay
                    this.ui.draw(ctx, this.distance, this.biomeKey, this)
                }
                drawBackgroundMountains() {
                    const camX = this.camera.x

                    // Far mountains
                    ctx.fillStyle = 'rgba(30, 20, 60, 0.5)'
                    ctx.beginPath()
                    ctx.moveTo(0, CONFIG.HEIGHT)
                    for (let x = 0; x <= CONFIG.WIDTH; x += 60) {
                        const worldX = x + camX * 0.1
                        const h = 80 + Math.sin(worldX * 0.005) * 40 + Math.sin(worldX * 0.012) * 20
                        ctx.lineTo(x, CONFIG.HEIGHT - h)
                    }
                    ctx.lineTo(CONFIG.WIDTH, CONFIG.HEIGHT)
                    ctx.closePath()
                    ctx.fill()

                    // Mid mountains
                    ctx.fillStyle = 'rgba(40, 25, 70, 0.4)'
                    ctx.beginPath()
                    ctx.moveTo(0, CONFIG.HEIGHT)
                    for (let x = 0; x <= CONFIG.WIDTH; x += 40) {
                        const worldX = x + camX * 0.2
                        const h = 50 + Math.sin(worldX * 0.008) * 30 + Math.sin(worldX * 0.02) * 15
                        ctx.lineTo(x, CONFIG.HEIGHT - h)
                    }
                    ctx.lineTo(CONFIG.WIDTH, CONFIG.HEIGHT)
                    ctx.closePath()
                    ctx.fill()
                }
            }

            // ============================================================
            // MAIN LOOP
            // ============================================================
            const game = new GameManager()
            let lastTime = 0

            function gameLoop(timestamp) {
                const dt = Math.min((timestamp - lastTime) / 1000, 0.05)
                lastTime = timestamp

                game.update(dt)
                game.draw()

                requestAnimationFrame(gameLoop)
            }

            // Handle resize
            function resize() {
                const aspect = CONFIG.WIDTH / CONFIG.HEIGHT
                let w = window.innerWidth
                let h = window.innerHeight
                if (w / h > aspect) {
                    w = h * aspect
                } else {
                    h = w / aspect
                }
                canvas.style.width = w + 'px'
                canvas.style.height = h + 'px'
            }
            window.addEventListener('resize', resize)
            resize()

            requestAnimationFrame(gameLoop)
        </script>
    </body>
</html>
