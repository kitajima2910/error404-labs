<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <!-- Tracks -->
  <rect x="2" y="6" width="5" height="20" rx="1" fill="url(#trackGrad)"/>
  <rect x="25" y="6" width="5" height="20" rx="1" fill="url(#trackGrad)"/>
  <!-- Track details -->
  <line x1="3" y1="9" x2="6" y2="9" stroke="#1a5e20" stroke-width="0.8"/>
  <line x1="3" y1="13" x2="6" y2="13" stroke="#1a5e20" stroke-width="0.8"/>
  <line x1="3" y1="17" x2="6" y2="17" stroke="#1a5e20" stroke-width="0.8"/>
  <line x1="3" y1="21" x2="6" y2="21" stroke="#1a5e20" stroke-width="0.8"/>
  <line x1="26" y1="9" x2="29" y2="9" stroke="#1a5e20" stroke-width="0.8"/>
  <line x1="26" y1="13" x2="29" y2="13" stroke="#1a5e20" stroke-width="0.8"/>
  <line x1="26" y1="17" x2="29" y2="17" stroke="#1a5e20" stroke-width="0.8"/>
  <line x1="26" y1="21" x2="29" y2="21" stroke="#1a5e20" stroke-width="0.8"/>
  <!-- Body -->
  <rect x="8" y="6" width="16" height="20" rx="2" fill="url(#bodyGrad)" stroke="#1b5e20" stroke-width="0.8"/>
  <!-- Body highlight -->
  <rect x="10" y="8" width="12" height="3" rx="1" fill="rgba(255,255,255,0.12)"/>
  <!-- Turret base (circle) -->
  <circle cx="16" cy="16" r="4.5" fill="#388e3c" stroke="#1b5e20" stroke-width="0.8"/>
  <!-- Barrel -->
  <rect x="14.5" y="5" width="3" height="10" rx="1" fill="#66bb6a" stroke="#2e7d32" stroke-width="0.5"/>
  <!-- Barrel tip -->
  <rect x="14.5" y="3" width="3" height="2.5" rx="0.8" fill="#81c784"/>
</svg>
