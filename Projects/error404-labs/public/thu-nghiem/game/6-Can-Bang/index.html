<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Cân Bằng+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='28' width='48' height='8' rx='4' fill='%238b5b21'/%3E%3Ccircle cx='32' cy='20' r='10' fill='%23efe6d8' stroke='%23212b36' stroke-width='4'/%3E%3Ccircle cx='36' cy='18' r='3' fill='%2337a2ce'/%3E%3C/svg%3E" />
  <link rel="shortcut icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='28' width='48' height='8' rx='4' fill='%238b5b21'/%3E%3Ccircle cx='32' cy='20' r='10' fill='%23efe6d8' stroke='%23212b36' stroke-width='4'/%3E%3Ccircle cx='36' cy='18' r='3' fill='%2337a2ce'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='28' width='48' height='8' rx='4' fill='%238b5b21'/%3E%3Ccircle cx='32' cy='20' r='10' fill='%23efe6d8' stroke='%23212b36' stroke-width='4'/%3E%3Ccircle cx='36' cy='18' r='3' fill='%2337a2ce'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon-precomposed"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='28' width='48' height='8' rx='4' fill='%238b5b21'/%3E%3Ccircle cx='32' cy='20' r='10' fill='%23efe6d8' stroke='%23212b36' stroke-width='4'/%3E%3Ccircle cx='36' cy='18' r='3' fill='%2337a2ce'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(92, 154, 198, 0.22), transparent 45%),
        linear-gradient(180deg, #08111b 0%, #03070e 100%);
      touch-action: none;
      user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-family: "Montserrat", system-ui, sans-serif;
    }

    canvas {
      display: block;
      border: 1px solid rgba(173, 229, 255, 0.14);
      box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      background: #050b12;
      outline: none;
    }
  </style>
</head>

<body>
  <canvas id="game" aria-label="Game Can Bang Plus" tabindex="0"></canvas>
  <script>
    (() => {
      "use strict";

      const VIEW_W = 1600;
      const VIEW_H = 900;
      const FIXED_DT = 1 / 60;
      const MAX_FRAME_DT = 1 / 20;
      const GRAVITY = 1580;
      const BOARD_MAX_ANGLE = Math.PI / 5.8;
      const BOARD_SAFE_ANGLE = Math.PI / 12;
      const MAX_WIND_FORCE = 840;
      const BALL_BASE_MASS = 1;
      const BALL_RADIUS = 34;
      const BOARD_LENGTH = 560;
      const BOARD_HEIGHT = 28;
      const GROUND_Y = 96;
      const PARTICLE_COUNT = 96;

      const canvas = document.getElementById("game");
      const gl = canvas.getContext("webgl2", {
        alpha: false,
        antialias: true,
        depth: false,
        stencil: false,
        premultipliedAlpha: false,
      });

      if (!gl) {
        document.body.innerHTML = "<div style='color:#eaf7ff;font:600 18px Verdana,sans-serif;padding:24px'>Trình duyệt này không hỗ trợ WebGL2.</div>";
        return;
      }

      const uiCanvas = document.createElement("canvas");
      uiCanvas.width = VIEW_W;
      uiCanvas.height = VIEW_H;
      const uiCtx = uiCanvas.getContext("2d");

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function mix(a, b, t) {
        return [
          lerp(a[0], b[0], t),
          lerp(a[1], b[1], t),
          lerp(a[2], b[2], t),
          lerp(a[3], b[3], t),
        ];
      }

      function containsPoint(rect, x, y) {
        return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
      }

      function mulberry32(seed) {
        let value = seed >>> 0;
        return () => {
          value |= 0;
          value = (value + 0x6d2b79f5) | 0;
          let t = Math.imul(value ^ (value >>> 15), 1 | value);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function createShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(shader) || "Shader compile failed");
        }
        return shader;
      }

      function createProgram(vertexSource, fragmentSource) {
        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl.VERTEX_SHADER, vertexSource));
        gl.attachShader(program, createShader(gl.FRAGMENT_SHADER, fragmentSource));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program) || "Program link failed");
        }
        return program;
      }

      function createOrthoMatrix(left, right, bottom, top) {
        const lr = 1 / (left - right);
        const bt = 1 / (bottom - top);
        return new Float32Array([
          -2 * lr, 0, 0, 0,
          0, -2 * bt, 0, 0,
          0, 0, 1, 0,
          (left + right) * lr, (top + bottom) * bt, 0, 1,
        ]);
      }

      class Renderer {
        constructor() {
          this.maxVertices = 32768;
          this.colorStride = 6;
          this.colorData = new Float32Array(this.maxVertices * this.colorStride);
          this.colorCount = 0;
          this.colorProgram = createProgram(
            `#version 300 es
            precision mediump float;
            layout(location = 0) in vec2 a_position;
            layout(location = 1) in vec4 a_color;
            uniform mat4 u_matrix;
            out vec4 v_color;
            void main() {
              gl_Position = u_matrix * vec4(a_position, 0.0, 1.0);
              v_color = a_color;
            }`,
            `#version 300 es
            precision mediump float;
            in vec4 v_color;
            out vec4 outColor;
            void main() {
              outColor = v_color;
            }`
          );
          this.uColorMatrix = gl.getUniformLocation(this.colorProgram, "u_matrix");
          this.colorBuffer = gl.createBuffer();
          this.colorVao = gl.createVertexArray();
          gl.bindVertexArray(this.colorVao);
          gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuffer);
          gl.bufferData(gl.ARRAY_BUFFER, this.colorData.byteLength, gl.DYNAMIC_DRAW);
          gl.enableVertexAttribArray(0);
          gl.vertexAttribPointer(0, 2, gl.FLOAT, false, this.colorStride * 4, 0);
          gl.enableVertexAttribArray(1);
          gl.vertexAttribPointer(1, 4, gl.FLOAT, false, this.colorStride * 4, 2 * 4);
          gl.bindVertexArray(null);

          this.textureProgram = createProgram(
            `#version 300 es
            precision mediump float;
            layout(location = 0) in vec2 a_position;
            layout(location = 1) in vec2 a_uv;
            uniform mat4 u_matrix;
            out vec2 v_uv;
            void main() {
              gl_Position = u_matrix * vec4(a_position, 0.0, 1.0);
              v_uv = a_uv;
            }`,
            `#version 300 es
            precision mediump float;
            in vec2 v_uv;
            uniform sampler2D u_texture;
            uniform float u_alpha;
            out vec4 outColor;
            void main() {
              vec4 sampleColor = texture(u_texture, v_uv);
              outColor = vec4(sampleColor.rgb, sampleColor.a * u_alpha);
            }`
          );
          this.uTexMatrix = gl.getUniformLocation(this.textureProgram, "u_matrix");
          this.uTexAlpha = gl.getUniformLocation(this.textureProgram, "u_alpha");
          this.uTexture = gl.getUniformLocation(this.textureProgram, "u_texture");
          this.textureBuffer = gl.createBuffer();
          this.textureVao = gl.createVertexArray();
          gl.bindVertexArray(this.textureVao);
          gl.bindBuffer(gl.ARRAY_BUFFER, this.textureBuffer);
          const quad = new Float32Array([
            0, 0, 0, 1,
            VIEW_W, 0, 1, 1,
            VIEW_W, VIEW_H, 1, 0,
            0, 0, 0, 1,
            VIEW_W, VIEW_H, 1, 0,
            0, VIEW_H, 0, 0,
          ]);
          gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
          gl.enableVertexAttribArray(0);
          gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 4 * 4, 0);
          gl.enableVertexAttribArray(1);
          gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 4 * 4, 2 * 4);
          gl.bindVertexArray(null);

          this.uiTexture = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, this.uiTexture);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, VIEW_W, VIEW_H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);

          this.matrix = createOrthoMatrix(0, VIEW_W, 0, VIEW_H);
        }

        resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
          const scale = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
          canvas.width = Math.round(VIEW_W * dpr);
          canvas.height = Math.round(VIEW_H * dpr);
          canvas.style.width = `${Math.round(VIEW_W * scale)}px`;
          canvas.style.height = `${Math.round(VIEW_H * scale)}px`;
          gl.viewport(0, 0, canvas.width, canvas.height);
        }

        begin() {
          this.colorCount = 0;
          gl.disable(gl.DEPTH_TEST);
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
          gl.clearColor(0.02, 0.04, 0.08, 1);
          gl.clear(gl.COLOR_BUFFER_BIT);
        }

        ensure(neededVertices) {
          if (this.colorCount + neededVertices >= this.maxVertices) {
            this.flush();
          }
        }

        pushVertex(x, y, color) {
          const offset = this.colorCount * this.colorStride;
          this.colorData[offset] = x;
          this.colorData[offset + 1] = y;
          this.colorData[offset + 2] = color[0];
          this.colorData[offset + 3] = color[1];
          this.colorData[offset + 4] = color[2];
          this.colorData[offset + 5] = color[3];
          this.colorCount += 1;
        }

        triangle(a, b, c, ca, cb = ca, cc = ca) {
          this.ensure(3);
          this.pushVertex(a.x, a.y, ca);
          this.pushVertex(b.x, b.y, cb);
          this.pushVertex(c.x, c.y, cc);
        }

        quad(a, b, c, d, ca, cb = ca, cc = ca, cd = ca) {
          this.ensure(6);
          this.pushVertex(a.x, a.y, ca);
          this.pushVertex(b.x, b.y, cb);
          this.pushVertex(c.x, c.y, cc);
          this.pushVertex(a.x, a.y, ca);
          this.pushVertex(c.x, c.y, cc);
          this.pushVertex(d.x, d.y, cd);
        }

        rect(cx, cy, width, height, rotation, color) {
          const hw = width * 0.5;
          const hh = height * 0.5;
          const cos = Math.cos(rotation);
          const sin = Math.sin(rotation);
          const p1 = { x: cx - hw * cos + hh * sin, y: cy - hw * sin - hh * cos };
          const p2 = { x: cx + hw * cos + hh * sin, y: cy + hw * sin - hh * cos };
          const p3 = { x: cx + hw * cos - hh * sin, y: cy + hw * sin + hh * cos };
          const p4 = { x: cx - hw * cos - hh * sin, y: cy - hw * sin + hh * cos };
          this.quad(p1, p2, p3, p4, color);
        }

        rectGradient(x, y, width, height, topColor, bottomColor) {
          this.quad(
            { x, y: y + height },
            { x: x + width, y: y + height },
            { x: x + width, y },
            { x, y },
            bottomColor,
            bottomColor,
            topColor,
            topColor
          );
        }

        circle(cx, cy, radius, color, segments = 28) {
          const center = { x: cx, y: cy };
          for (let i = 0; i < segments; i += 1) {
            const a0 = (i / segments) * Math.PI * 2;
            const a1 = ((i + 1) / segments) * Math.PI * 2;
            this.triangle(
              center,
              { x: cx + Math.cos(a0) * radius, y: cy + Math.sin(a0) * radius },
              { x: cx + Math.cos(a1) * radius, y: cy + Math.sin(a1) * radius },
              color
            );
          }
        }

        ring(cx, cy, outerRadius, innerRadius, color, segments = 32) {
          for (let i = 0; i < segments; i += 1) {
            const a0 = (i / segments) * Math.PI * 2;
            const a1 = ((i + 1) / segments) * Math.PI * 2;
            const o0 = { x: cx + Math.cos(a0) * outerRadius, y: cy + Math.sin(a0) * outerRadius };
            const o1 = { x: cx + Math.cos(a1) * outerRadius, y: cy + Math.sin(a1) * outerRadius };
            const i0 = { x: cx + Math.cos(a0) * innerRadius, y: cy + Math.sin(a0) * innerRadius };
            const i1 = { x: cx + Math.cos(a1) * innerRadius, y: cy + Math.sin(a1) * innerRadius };
            this.quad(i0, i1, o1, o0, color);
          }
        }

        line(x1, y1, x2, y2, thickness, color) {
          const dx = x2 - x1;
          const dy = y2 - y1;
          const len = Math.hypot(dx, dy) || 1;
          const nx = -dy / len;
          const ny = dx / len;
          const half = thickness * 0.5;
          const a = { x: x1 + nx * half, y: y1 + ny * half };
          const b = { x: x2 + nx * half, y: y2 + ny * half };
          const c = { x: x2 - nx * half, y: y2 - ny * half };
          const d = { x: x1 - nx * half, y: y1 - ny * half };
          this.quad(a, b, c, d, color);
        }

        flush() {
          if (!this.colorCount) {
            return;
          }
          gl.useProgram(this.colorProgram);
          gl.uniformMatrix4fv(this.uColorMatrix, false, this.matrix);
          gl.bindVertexArray(this.colorVao);
          gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuffer);
          gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.colorData.subarray(0, this.colorCount * this.colorStride));
          gl.drawArrays(gl.TRIANGLES, 0, this.colorCount);
          gl.bindVertexArray(null);
          this.colorCount = 0;
        }

        uploadUi() {
          gl.bindTexture(gl.TEXTURE_2D, this.uiTexture);
          gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, uiCanvas);
        }

        drawUi(alpha = 1) {
          gl.useProgram(this.textureProgram);
          gl.uniformMatrix4fv(this.uTexMatrix, false, this.matrix);
          gl.uniform1f(this.uTexAlpha, alpha);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, this.uiTexture);
          gl.uniform1i(this.uTexture, 0);
          gl.bindVertexArray(this.textureVao);
          gl.drawArrays(gl.TRIANGLES, 0, 6);
          gl.bindVertexArray(null);
        }
      }

      class AudioSystem {
        constructor() {
          this.ctx = null;
          this.master = null;
          this.windGain = null;
          this.windFilter = null;
          this.rollGain = null;
          this.rollOsc = null;
          this.musicGain = null;
          this.musicLfo = null;
          this.musicVoices = [];
          this.musicLastStep = -1;
          this.ready = false;
        }

        ensure() {
          if (this.ready) {
            return;
          }
          const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextCtor) {
            return;
          }
          this.ctx = new AudioContextCtor();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.3;
          this.master.connect(this.ctx.destination);

          const noiseBuffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
          const channel = noiseBuffer.getChannelData(0);
          for (let i = 0; i < channel.length; i += 1) {
            channel[i] = Math.random() * 2 - 1;
          }

          const windSource = this.ctx.createBufferSource();
          windSource.buffer = noiseBuffer;
          windSource.loop = true;
          this.windFilter = this.ctx.createBiquadFilter();
          this.windFilter.type = "bandpass";
          this.windFilter.frequency.value = 380;
          this.windFilter.Q.value = 0.35;
          this.windGain = this.ctx.createGain();
          this.windGain.gain.value = 0;
          windSource.connect(this.windFilter);
          this.windFilter.connect(this.windGain);
          this.windGain.connect(this.master);
          windSource.start();

          this.rollOsc = this.ctx.createOscillator();
          this.rollOsc.type = "triangle";
          this.rollOsc.frequency.value = 110;
          const rollFilter = this.ctx.createBiquadFilter();
          rollFilter.type = "lowpass";
          rollFilter.frequency.value = 380;
          this.rollGain = this.ctx.createGain();
          this.rollGain.gain.value = 0;
          this.rollOsc.connect(rollFilter);
          rollFilter.connect(this.rollGain);
          this.rollGain.connect(this.master);
          this.rollOsc.start();

          this.musicGain = this.ctx.createGain();
          this.musicGain.gain.value = 0.0001;
          const musicFilter = this.ctx.createBiquadFilter();
          musicFilter.type = "lowpass";
          musicFilter.frequency.value = 1200;
          this.musicGain.connect(musicFilter);
          musicFilter.connect(this.master);

          this.musicLfo = this.ctx.createOscillator();
          const musicLfoGain = this.ctx.createGain();
          this.musicLfo.type = "sine";
          this.musicLfo.frequency.value = 0.21;
          musicLfoGain.gain.value = 0.012;
          this.musicLfo.connect(musicLfoGain);
          musicLfoGain.connect(this.musicGain.gain);
          this.musicLfo.start();

          const notes = [220, 277.18, 329.63];
          for (let i = 0; i < notes.length; i += 1) {
            const voice = this.ctx.createOscillator();
            const voiceGain = this.ctx.createGain();
            voice.type = i === 0 ? "triangle" : "sine";
            voice.frequency.value = notes[i];
            voiceGain.gain.value = i === 0 ? 0.03 : 0.022;
            voice.connect(voiceGain);
            voiceGain.connect(this.musicGain);
            voice.start();
            this.musicVoices.push({ osc: voice, gain: voiceGain });
          }

          this.ready = true;
        }

        resume() {
          this.ensure();
          if (this.ctx && this.ctx.state !== "running") {
            this.ctx.resume();
          }
        }

        update(currentState) {
          if (!this.ready || !this.ctx) {
            return;
          }
          const now = this.ctx.currentTime;
          const windAmount = currentState.mode === "playing" ? currentState.wind.strength : 0;
          const rollingAmount = currentState.mode === "playing" && currentState.ball.onBoard
            ? clamp(Math.abs(currentState.ball.sVel) / 420, 0, 1) * (0.28 + currentState.ball.danger * 0.72)
            : 0;
          const musicAmount = currentState.mode === "playing" ? 1 : (currentState.mode === "title" ? 0.72 : 0.38);

          this.windGain.gain.cancelScheduledValues(now);
          this.windGain.gain.linearRampToValueAtTime(0.005 + windAmount * 0.06, now + 0.08);
          this.windFilter.frequency.cancelScheduledValues(now);
          this.windFilter.frequency.linearRampToValueAtTime(240 + windAmount * 1200, now + 0.08);

          this.rollGain.gain.cancelScheduledValues(now);
          this.rollGain.gain.linearRampToValueAtTime(rollingAmount * 0.075, now + 0.05);
          this.rollOsc.frequency.cancelScheduledValues(now);
          this.rollOsc.frequency.linearRampToValueAtTime(
            90 + clamp(Math.abs(currentState.ball.sVel), 0, 600) * 0.35 + (currentState.ball.massNorm - 1) * 45,
            now + 0.05
          );

          this.musicGain.gain.cancelScheduledValues(now);
          this.musicGain.gain.linearRampToValueAtTime(0.04 * musicAmount, now + 0.15);

          const chordStep = Math.floor(currentState.time * 0.5) % 4;
          if (chordStep !== this.musicLastStep && this.musicVoices.length === 3) {
            const chordMap = [
              [220, 277.18, 329.63],
              [196, 246.94, 329.63],
              [174.61, 220, 293.66],
              [196, 246.94, 293.66],
            ];
            this.musicLastStep = chordStep;
            const freqs = chordMap[chordStep];
            for (let i = 0; i < this.musicVoices.length; i += 1) {
              this.musicVoices[i].osc.frequency.cancelScheduledValues(now);
              this.musicVoices[i].osc.frequency.linearRampToValueAtTime(freqs[i], now + 0.45);
            }
          }
        }

        playGameOver() {
          if (!this.ready || !this.ctx) {
            return;
          }
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(280, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(70, this.ctx.currentTime + 0.6);
          gain.gain.setValueAtTime(0.0001, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.12, this.ctx.currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.64);
          osc.connect(gain);
          gain.connect(this.master);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.66);
        }
      }

      const renderer = new Renderer();
      const audio = new AudioSystem();

      const state = {
        rng: mulberry32(0x4046cb),
        mode: "title",
        time: 0,
        score: 0,
        bestScore: 0,
        accumulator: 0,
        board: {
          x: VIEW_W * 0.5,
          y: 406,
          length: BOARD_LENGTH,
          height: BOARD_HEIGHT,
          angle: 0,
          prevAngle: 0,
          angularVelocity: 0,
          control: 0,
        },
        ball: {
          radius: BALL_RADIUS,
          x: 0,
          y: 0,
          prevX: 0,
          prevY: 0,
          vx: 0,
          vy: 0,
          s: 0,
          prevS: 0,
          sVel: 0,
          spin: 0,
          prevSpin: 0,
          mass: BALL_BASE_MASS,
          massNorm: 1,
          weightNoise: 0,
          weightTarget: 0,
          weightTimer: 0,
          danger: 0,
          onBoard: true,
          prevOnBoard: true,
        },
        wind: {
          current: 0,
          prevCurrent: 0,
          target: 0,
          strength: 0,
          timer: 0,
          direction: 1,
          spawnCarry: 0,
        },
        camera: {
          x: 0,
          y: 0,
        },
        flash: 0,
        pulse: 0,
        lastActionLabel: "tap-start",
        ui: {
          startButton: { x: VIEW_W * 0.5 - 164, y: 504, w: 328, h: 76 },
          restartButton: { x: VIEW_W * 0.5 - 164, y: 470, w: 328, h: 76 },
        },
        particles: new Array(PARTICLE_COUNT).fill(0).map(() => ({
          active: false,
          x: 0,
          y: 0,
          vx: 0,
          vy: 0,
          life: 0,
          maxLife: 1,
          len: 0,
          width: 0,
          alpha: 0,
        })),
        particleCursor: 0,
      };

      const input = {
        leftKey: false,
        rightKey: false,
        leftTouch: false,
        rightTouch: false,
        axis: 0,
        smoothAxis: 0,
        boost: 0,
        activePointers: new Map(),
      };

      function rand() {
        return state.rng();
      }

      function randRange(min, max) {
        return min + (max - min) * rand();
      }

      function getCanvasCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const x = ((clientX - rect.left) / rect.width) * VIEW_W;
        const y = ((clientY - rect.top) / rect.height) * VIEW_H;
        return { x, y };
      }

      function recalcPointerSides() {
        let left = false;
        let right = false;
        input.activePointers.forEach((pointer) => {
          if (pointer.x < VIEW_W * 0.5) {
            left = true;
          } else {
            right = true;
          }
        });
        input.leftTouch = left;
        input.rightTouch = right;
      }

      function updateAttachedBallPosition() {
        const tangentX = Math.cos(state.board.angle);
        const tangentY = Math.sin(state.board.angle);
        const normalX = -Math.sin(state.board.angle);
        const normalY = Math.cos(state.board.angle);
        const offset = state.board.height * 0.5 + state.ball.radius + 4;
        const radialX = tangentX * state.ball.s + normalX * offset;
        const radialY = tangentY * state.ball.s + normalY * offset;
        state.ball.x = state.board.x + radialX;
        state.ball.y = state.board.y + radialY;
        state.ball.vx = tangentX * state.ball.sVel - state.board.angularVelocity * radialY;
        state.ball.vy = tangentY * state.ball.sVel + state.board.angularVelocity * radialX;
      }

      function chooseWind(forceFull) {
        const power = Math.pow(rand(), 0.78);
        const intensity = (forceFull ? 0.18 : 0.22) + power * (forceFull ? 0.36 : 0.68);
        state.wind.direction = rand() > 0.5 ? 1 : -1;
        state.wind.target = state.wind.direction * intensity * MAX_WIND_FORCE;
        state.wind.timer = randRange(forceFull ? 1.7 : 1.1, forceFull ? 3.4 : 3.1);
      }

      function resetGame(mode = "title") {
        state.mode = mode;
        state.time = 0;
        state.score = 0;
        state.flash = 0;
        state.pulse = 0;
        state.lastActionLabel = mode === "playing" ? "balance" : "tap-start";

        state.board.angle = 0;
        state.board.prevAngle = 0;
        state.board.angularVelocity = 0;
        state.board.control = 0;

        state.ball.s = randRange(-16, 16);
        state.ball.prevS = state.ball.s;
        state.ball.sVel = 0;
        state.ball.spin = 0;
        state.ball.prevSpin = 0;
        state.ball.massNorm = 1;
        state.ball.mass = BALL_BASE_MASS;
        state.ball.weightNoise = 0;
        state.ball.weightTarget = 0;
        state.ball.weightTimer = randRange(0.4, 0.9);
        state.ball.danger = 0;
        state.ball.onBoard = true;
        state.ball.prevOnBoard = true;
        updateAttachedBallPosition();
        state.ball.prevX = state.ball.x;
        state.ball.prevY = state.ball.y;

        state.wind.current = 0;
        state.wind.prevCurrent = 0;
        state.wind.target = 0;
        state.wind.strength = 0;
        state.wind.spawnCarry = 0;
        chooseWind(true);

        state.camera.x = 0;
        state.camera.y = 0;

        for (let i = 0; i < state.particles.length; i += 1) {
          state.particles[i].active = false;
        }
      }

      function startGame() {
        audio.resume();
        resetGame("playing");
      }

      function triggerGameOver() {
        if (state.mode !== "playing") {
          return;
        }
        state.mode = "gameover";
        state.bestScore = Math.max(state.bestScore, state.score);
        state.flash = 0.9;
        state.lastActionLabel = "restart-available";
        audio.playGameOver();
      }

      function updateInput(dt) {
        const leftActive = input.leftKey || input.leftTouch;
        const rightActive = input.rightKey || input.rightTouch;
        const rawAxis = (rightActive ? 1 : 0) - (leftActive ? 1 : 0);
        if (rawAxis !== 0) {
          input.boost = clamp(input.boost + dt * 1.65, 0, 1);
        } else {
          input.boost = clamp(input.boost - dt * 2.3, 0, 1);
        }
        input.axis = rawAxis * (0.68 + input.boost * 0.42);
        input.smoothAxis += (input.axis - input.smoothAxis) * Math.min(1, dt * 8.5);
      }

      function capturePreviousState() {
        state.board.prevAngle = state.board.angle;
        state.ball.prevOnBoard = state.ball.onBoard;
        state.ball.prevS = state.ball.s;
        state.ball.prevX = state.ball.x;
        state.ball.prevY = state.ball.y;
        state.ball.prevSpin = state.ball.spin;
        state.wind.prevCurrent = state.wind.current;
      }

      function updateWeight(dt) {
        state.ball.weightTimer -= dt;
        if (state.ball.weightTimer <= 0) {
          state.ball.weightTimer = randRange(0.35, 0.95);
          state.ball.weightTarget = randRange(-0.12, 0.2);
        }
        state.ball.weightNoise += (state.ball.weightTarget - state.ball.weightNoise) * Math.min(1, dt * 3.5);
        const oscillation = Math.sin(state.time * 1.85) * 0.22;
        const ripple = Math.sin(state.time * 5.6 + 0.8) * 0.03;
        state.ball.massNorm = clamp(1 + oscillation + ripple + state.ball.weightNoise, 0.68, 1.55);
        state.ball.mass = BALL_BASE_MASS * state.ball.massNorm;
      }

      function updateWind(dt) {
        state.wind.timer -= dt;
        if (state.wind.timer <= 0) {
          chooseWind(false);
        }
        state.wind.current += (state.wind.target - state.wind.current) * Math.min(1, dt * 2.2);
        state.wind.strength = clamp(Math.abs(state.wind.current) / MAX_WIND_FORCE, 0, 1);
      }

      function updateBoard(dt) {
        const edgeRatio = clamp(Math.abs(state.ball.s) / (state.board.length * 0.5), 0, 1);
        const loadTorque = state.ball.onBoard ? -(state.ball.s / (state.board.length * 0.5)) * (10 + state.ball.massNorm * 10.5) : 0;
        const controlTorque = -input.smoothAxis * 24.5;
        const restoreTorque = -Math.sin(state.board.angle) * 8.8;
        const windTorque = -state.wind.current * 0.0011 * (state.ball.onBoard ? 1 : 0.25);
        const wobbleTorque = Math.sin(state.time * 28 + state.ball.massNorm * 3.6) * edgeRatio * 1.1;
        state.board.angularVelocity += (controlTorque + loadTorque + restoreTorque + windTorque + wobbleTorque - state.board.angularVelocity * 6.25) * dt;
        state.board.angle += state.board.angularVelocity * dt;
        if (state.board.angle > BOARD_MAX_ANGLE) {
          state.board.angle = BOARD_MAX_ANGLE;
          state.board.angularVelocity *= 0.3;
        } else if (state.board.angle < -BOARD_MAX_ANGLE) {
          state.board.angle = -BOARD_MAX_ANGLE;
          state.board.angularVelocity *= 0.3;
        }
      }

      function detachBall() {
        if (!state.ball.onBoard) {
          return;
        }
        state.ball.onBoard = false;
        const tangentX = Math.cos(state.board.angle);
        const tangentY = Math.sin(state.board.angle);
        const releaseBoost = 120 + clamp(Math.abs(state.board.angle) / BOARD_MAX_ANGLE, 0, 1) * 160;
        const pushSign = state.ball.sVel !== 0 ? Math.sign(state.ball.sVel) : Math.sign(state.ball.s || state.board.angle || 1);
        state.ball.vx += tangentX * releaseBoost * pushSign;
        state.ball.vy += tangentY * releaseBoost * pushSign;
      }

      function updateBall(dt) {
        if (state.ball.onBoard) {
          const tiltDanger = clamp((Math.abs(state.board.angle) - BOARD_SAFE_ANGLE) / (BOARD_MAX_ANGLE - BOARD_SAFE_ANGLE), 0, 1);
          const slopeAccel = -GRAVITY * Math.sin(state.board.angle);
          const windAccel = state.wind.current / state.ball.massNorm;
          const angularInfluence = -state.board.angularVelocity * 320;
          const jitter = (rand() - 0.5) * (18 + tiltDanger * 110);
          let accel = slopeAccel + windAccel * 0.3 + angularInfluence + jitter;
          const friction = 610 * (1.08 - tiltDanger * 0.45);
          if (Math.abs(state.ball.sVel) > 5) {
            accel += -Math.sign(state.ball.sVel) * friction;
          } else {
            accel += -Math.sign(accel || 1) * Math.min(Math.abs(accel), friction * 0.6);
          }
          if (Math.abs(state.board.angle) > BOARD_SAFE_ANGLE) {
            accel += -Math.sign(state.board.angle) * tiltDanger * 320;
          }

          state.ball.sVel += accel * dt;
          state.ball.s += state.ball.sVel * dt;
          state.ball.spin -= (state.ball.sVel / state.ball.radius) * dt;
          updateAttachedBallPosition();

          const halfLength = state.board.length * 0.5 - state.ball.radius * 0.18;
          if (Math.abs(state.ball.s) >= halfLength || (tiltDanger > 0.9 && Math.abs(state.ball.s) > halfLength * 0.78)) {
            detachBall();
          }
        }

        if (!state.ball.onBoard) {
          state.ball.vx += (state.wind.current / state.ball.massNorm) * 0.26 * dt;
          state.ball.vy -= GRAVITY * dt;
          state.ball.x += state.ball.vx * dt;
          state.ball.y += state.ball.vy * dt;
          state.ball.spin -= (state.ball.vx / state.ball.radius) * dt * 0.4;

          if (state.ball.y <= GROUND_Y + state.ball.radius * 0.28 || state.ball.x < -120 || state.ball.x > VIEW_W + 120) {
            triggerGameOver();
          }
        }

        const edgeDanger = state.ball.onBoard
          ? clamp((Math.abs(state.ball.s) - (state.board.length * 0.5 - state.ball.radius * 1.7)) / (state.ball.radius * 1.5), 0, 1)
          : 1;
        const tiltDanger = clamp((Math.abs(state.board.angle) - BOARD_SAFE_ANGLE) / (BOARD_MAX_ANGLE - BOARD_SAFE_ANGLE), 0, 1);
        const targetDanger = Math.max(edgeDanger, tiltDanger);
        state.ball.danger += (targetDanger - state.ball.danger) * Math.min(1, dt * 5.4);
      }

      function spawnWindParticle() {
        const particle = state.particles[state.particleCursor];
        state.particleCursor = (state.particleCursor + 1) % state.particles.length;
        particle.active = true;
        particle.life = 0;
        particle.maxLife = randRange(0.55, 1.3);
        particle.len = randRange(22, 70);
        particle.width = randRange(1.2, 3.5);
        particle.alpha = randRange(0.08, 0.22);
        particle.x = state.wind.direction > 0 ? -80 : VIEW_W + 80;
        particle.y = randRange(180, VIEW_H - 170);
        particle.vx = state.wind.direction * randRange(260, 620) * (0.45 + state.wind.strength * 0.9);
        particle.vy = randRange(-18, 18);
      }

      function updateParticles(dt) {
        state.wind.spawnCarry += state.wind.strength * 42 * dt;
        while (state.wind.spawnCarry >= 1) {
          spawnWindParticle();
          state.wind.spawnCarry -= 1;
        }

        for (let i = 0; i < state.particles.length; i += 1) {
          const particle = state.particles[i];
          if (!particle.active) {
            continue;
          }
          particle.life += dt;
          if (particle.life >= particle.maxLife) {
            particle.active = false;
            continue;
          }
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          if (particle.x < -140 || particle.x > VIEW_W + 140) {
            particle.active = false;
          }
        }
      }

      function updatePlaying(dt) {
        updateInput(dt);
        updateWeight(dt);
        updateWind(dt);
        updateBoard(dt);
        updateBall(dt);
        updateParticles(dt);

        state.score += dt;
        state.flash = Math.max(state.flash * (1 - dt * 3.6), state.ball.danger * 0.35);
        state.pulse += dt * (4.5 + state.ball.danger * 6.5);
        state.camera.x = Math.sin(state.time * 36) * (state.wind.strength * 7 + state.ball.danger * 3.4);
        state.camera.y = Math.cos(state.time * 29) * (state.wind.strength * 3.8);
      }

      function updateAmbient(dt) {
        updateWind(dt);
        updateParticles(dt);
        state.flash = Math.max(0, state.flash - dt * 1.6);
        state.camera.x = Math.sin(state.time * 18) * state.wind.strength * 2.5;
        state.camera.y = Math.cos(state.time * 13) * state.wind.strength * 1.4;
      }

      function step(dt) {
        state.time += dt;
        capturePreviousState();
        if (state.mode === "playing") {
          updatePlaying(dt);
        } else {
          updateInput(dt);
          updateAmbient(dt);
        }
        audio.update(state);
      }

      function drawBackground() {
        renderer.rectGradient(0, 0, VIEW_W, VIEW_H, [0.2, 0.33, 0.47, 1], [0.03, 0.06, 0.1, 1]);
        renderer.rectGradient(0, 0, VIEW_W, 260, [0.18, 0.14, 0.09, 1], [0.06, 0.05, 0.03, 1]);

        const haze = [
          [120, 170, 240, 0.08],
          [100, 145, 195, 0.06],
          [80, 118, 160, 0.05],
        ];
        for (let i = 0; i < haze.length; i += 1) {
          const height = 170 - i * 26;
          const alpha = haze[i][3];
          renderer.rectGradient(
            0,
            300 + i * 40,
            VIEW_W,
            height,
            [haze[i][0] / 255, haze[i][1] / 255, haze[i][2] / 255, alpha],
            [haze[i][0] / 255, haze[i][1] / 255, haze[i][2] / 255, 0]
          );
        }

        renderer.rectGradient(0, 0, VIEW_W, GROUND_Y + 32, [0.18, 0.17, 0.12, 1], [0.06, 0.05, 0.03, 1]);
        renderer.rectGradient(0, GROUND_Y - 16, VIEW_W, 60, [0.08, 0.1, 0.09, 0.35], [0.16, 0.17, 0.12, 0]);
      }

      function drawAmbientFx() {
        const aurora = 0.12 + Math.sin(state.time * 0.65) * 0.05;
        const auroraShift = Math.sin(state.time * 0.42) * 220;
        renderer.rectGradient(
          180 + auroraShift,
          VIEW_H - 360,
          520,
          260,
          [0.2, 0.5, 0.75, aurora],
          [0.2, 0.5, 0.75, 0]
        );
        renderer.rectGradient(
          900 - auroraShift * 0.55,
          VIEW_H - 320,
          460,
          230,
          [0.12, 0.36, 0.6, aurora * 0.8],
          [0.12, 0.36, 0.6, 0]
        );

        const beat = 0.55 + Math.sin(state.time * 2.4) * 0.45;
        const ringAlpha = (state.mode === "playing" ? 0.08 : 0.05) * beat;
        renderer.ring(
          VIEW_W * 0.5,
          170,
          120 + beat * 22,
          110 + beat * 22,
          [0.56, 0.82, 1, ringAlpha],
          42
        );
      }

      function drawParticles(offsetX, offsetY) {
        for (let i = 0; i < state.particles.length; i += 1) {
          const particle = state.particles[i];
          if (!particle.active) {
            continue;
          }
          const lifeT = 1 - particle.life / particle.maxLife;
          const color = [0.8, 0.92, 1, particle.alpha * lifeT];
          const dx = particle.len * Math.sign(particle.vx);
          renderer.line(
            particle.x + offsetX,
            particle.y + offsetY,
            particle.x - dx + offsetX,
            particle.y + offsetY,
            particle.width,
            color
          );
        }
      }

      function drawBoard(interpolatedAngle, offsetX, offsetY) {
        const visualAngle = interpolatedAngle + Math.sin(state.time * 40) * state.ball.danger * 0.006;
        renderer.rect(state.board.x + offsetX, state.board.y - 7 + offsetY, state.board.length + 36, 22, visualAngle, [0, 0, 0, 0.18]);

        renderer.rect(state.board.x + offsetX, state.board.y + offsetY, state.board.length, state.board.height, visualAngle, [0.42, 0.24, 0.08, 1]);
        renderer.rect(state.board.x + offsetX, state.board.y + offsetY, state.board.length - 8, state.board.height - 6, visualAngle, [0.58, 0.35, 0.12, 1]);

        const stripeColor = [0.33, 0.18, 0.06, 0.72];
        for (let i = -1; i <= 1; i += 1) {
          const offset = (state.board.length * 0.19) * i;
          const cx = state.board.x + Math.cos(visualAngle) * offset + offsetX;
          const cy = state.board.y + Math.sin(visualAngle) * offset + offsetY;
          renderer.rect(cx, cy, state.board.length * 0.11, state.board.height - 4, visualAngle, stripeColor);
        }

        renderer.rect(state.board.x + offsetX, state.board.y - 55 + offsetY, 34, 150, 0, [0.2, 0.22, 0.24, 0.55]);
        renderer.triangle(
          { x: state.board.x - 44 + offsetX, y: state.board.y - 34 + offsetY },
          { x: state.board.x + 44 + offsetX, y: state.board.y - 34 + offsetY },
          { x: state.board.x + offsetX, y: state.board.y + 18 + offsetY },
          [0.15, 0.16, 0.18, 0.85]
        );
        renderer.circle(state.board.x + offsetX, state.board.y + offsetY, 18, [0.14, 0.16, 0.2, 0.92], 24);
        renderer.circle(state.board.x + offsetX, state.board.y + offsetY, 7, [0.65, 0.75, 0.83, 0.72], 18);
      }

      function drawBall(alpha, offsetX, offsetY) {
        const ix = lerp(state.ball.prevX, state.ball.x, alpha);
        const iy = lerp(state.ball.prevY, state.ball.y, alpha);
        const spin = lerp(state.ball.prevSpin, state.ball.spin, alpha);
        const pulse = 1 + Math.sin(state.pulse) * 0.085 * state.ball.danger + (state.ball.massNorm - 1) * 0.04;
        const radius = state.ball.radius * pulse;
        const baseColor = state.ball.onBoard ? [0.92, 0.89, 0.83, 1] : [0.95, 0.84, 0.78, 1];
        const ringColor = mix([0.12, 0.16, 0.21, 1], [0.95, 0.24, 0.19, 1], state.ball.danger);
        const coreColor = mix([0.14, 0.57, 0.78, 0.95], [0.97, 0.61, 0.24, 0.98], clamp(Math.abs(state.wind.current) / MAX_WIND_FORCE, 0, 1));

        renderer.circle(ix + offsetX, iy - radius * 0.08 + offsetY, radius + 4, [0, 0, 0, 0.12], 28);
        renderer.circle(ix + offsetX, iy + offsetY, radius + 6, [ringColor[0], ringColor[1], ringColor[2], 0.28 + state.ball.danger * 0.18], 32);
        renderer.circle(ix + offsetX, iy + offsetY, radius, baseColor, 32);
        renderer.ring(ix + offsetX, iy + offsetY, radius + 2, radius - 4, [ringColor[0], ringColor[1], ringColor[2], 0.92], 32);

        const coreOffset = radius * 0.34;
        renderer.circle(
          ix + Math.cos(spin) * coreOffset + offsetX,
          iy + Math.sin(spin) * coreOffset + offsetY,
          radius * 0.28,
          coreColor,
          24
        );
        renderer.circle(
          ix + Math.cos(spin) * coreOffset + offsetX,
          iy + Math.sin(spin) * coreOffset + offsetY,
          radius * 0.12,
          [0.97, 0.96, 0.92, 0.8],
          18
        );
      }

      function drawDangerGlow() {
        if (state.ball.danger <= 0.02 && state.flash <= 0.03) {
          return;
        }
        const strength = Math.max(state.ball.danger * 0.18, state.flash * 0.15);
        renderer.rect(VIEW_W * 0.5, VIEW_H * 0.5, VIEW_W, VIEW_H, 0, [0.55, 0.03, 0.03, strength]);
      }

      function drawUi() {
        uiCtx.clearRect(0, 0, VIEW_W, VIEW_H);
        uiCtx.save();
        const fontStack = '"Montserrat", system-ui, sans-serif';
        const leftPanelX = 40;
        const panelY = 28;
        const sidePanelW = 304;
        const centerPanelX = VIEW_W * 0.5 - 228;
        const centerPanelW = 456;
        const rightPanelX = VIEW_W - 344;
        const drawWrappedText = (text, x, y, maxWidth, lineHeight) => {
          const words = text.split(" ");
          let line = "";
          let cursorY = y;
          for (let i = 0; i < words.length; i += 1) {
            const testLine = line ? `${line} ${words[i]}` : words[i];
            if (uiCtx.measureText(testLine).width > maxWidth && line) {
              uiCtx.fillText(line, x, cursorY);
              line = words[i];
              cursorY += lineHeight;
            } else {
              line = testLine;
            }
          }
          if (line) {
            uiCtx.fillText(line, x, cursorY);
          }
          return cursorY;
        };

        uiCtx.fillStyle = "rgba(5, 12, 20, 0.18)";
        uiCtx.fillRect(0, 0, VIEW_W, VIEW_H);

        uiCtx.fillStyle = "rgba(8, 16, 24, 0.6)";
        uiCtx.strokeStyle = "rgba(180, 223, 255, 0.14)";
        uiCtx.lineWidth = 1.5;
        uiCtx.beginPath();
        uiCtx.roundRect(leftPanelX, panelY, sidePanelW, 106, 24);
        uiCtx.fill();
        uiCtx.stroke();

        uiCtx.beginPath();
        uiCtx.roundRect(centerPanelX, panelY, centerPanelW, 106, 24);
        uiCtx.fill();
        uiCtx.stroke();

        uiCtx.beginPath();
        uiCtx.roundRect(rightPanelX, panelY, sidePanelW, 106, 24);
        uiCtx.fill();
        uiCtx.stroke();

        uiCtx.fillStyle = "#b8d8ec";
        uiCtx.font = "700 20px Montserrat, system-ui, sans-serif";
        uiCtx.fillText("THỜI GIAN", 56, 56);
        uiCtx.fillText("GIÓ", VIEW_W * 0.5 - 188, 56);
        uiCtx.fillText("TRỌNG LƯỢNG", VIEW_W - 308, 56);

        uiCtx.fillStyle = "#eff8ff";
        uiCtx.font = "700 44px Montserrat, system-ui, sans-serif";
        uiCtx.fillText(`${state.score.toFixed(1)}s`, 56, 96);

        const windBaseX = centerPanelX + 18;
        const windBaseY = panelY + 42;
        const windWidth = centerPanelW - 36;
        const windStrength = clamp(Math.abs(state.wind.current) / MAX_WIND_FORCE, 0, 1);
        uiCtx.fillStyle = "rgba(255,255,255,0.08)";
        uiCtx.beginPath();
        uiCtx.roundRect(windBaseX, windBaseY, windWidth, 20, 10);
        uiCtx.fill();

        const windFill = windWidth * windStrength;
        uiCtx.fillStyle = state.wind.current >= 0 ? "rgba(123, 221, 255, 0.85)" : "rgba(255, 178, 110, 0.88)";
        if (state.wind.current >= 0) {
          uiCtx.beginPath();
          uiCtx.roundRect(windBaseX + windWidth * 0.5, windBaseY, windFill * 0.5, 20, 10);
          uiCtx.fill();
        } else {
          uiCtx.beginPath();
          uiCtx.roundRect(windBaseX + windWidth * 0.5 - windFill * 0.5, windBaseY, windFill * 0.5, 20, 10);
          uiCtx.fill();
        }

        uiCtx.strokeStyle = "rgba(255,255,255,0.22)";
        uiCtx.lineWidth = 2;
        uiCtx.beginPath();
        uiCtx.moveTo(windBaseX + windWidth * 0.5, windBaseY - 8);
        uiCtx.lineTo(windBaseX + windWidth * 0.5, windBaseY + 28);
        uiCtx.stroke();

        const arrowDir = state.wind.current >= 0 ? 1 : -1;
        const arrowCenterX = windBaseX + windWidth * 0.5 + arrowDir * (30 + windStrength * 92);
        uiCtx.strokeStyle = uiCtx.fillStyle;
        uiCtx.lineWidth = 4;
        uiCtx.beginPath();
        uiCtx.moveTo(arrowCenterX - arrowDir * 42, windBaseY + 44);
        uiCtx.lineTo(arrowCenterX, windBaseY + 44);
        uiCtx.stroke();
        uiCtx.beginPath();
        uiCtx.moveTo(arrowCenterX, windBaseY + 44);
        uiCtx.lineTo(arrowCenterX - arrowDir * 14, windBaseY + 34);
        uiCtx.lineTo(arrowCenterX - arrowDir * 14, windBaseY + 54);
        uiCtx.closePath();
        uiCtx.fill();

        uiCtx.fillStyle = "#f4fbff";
        uiCtx.font = "600 18px Montserrat, system-ui, sans-serif";
        uiCtx.fillText(state.wind.current >= 0 ? "gió phải" : "gió trái", VIEW_W * 0.5 - 188, 115);
        uiCtx.fillText(`${Math.round(windStrength * 100)}%`, VIEW_W * 0.5 + 138, 115);

        const weightBaseX = rightPanelX + 20;
        const weightBaseY = panelY + 42;
        const weightWidth = sidePanelW - 40;
        const weightRatio = (state.ball.massNorm - 0.68) / (1.55 - 0.68);
        uiCtx.fillStyle = "rgba(255,255,255,0.08)";
        uiCtx.beginPath();
        uiCtx.roundRect(weightBaseX, weightBaseY, weightWidth, 20, 10);
        uiCtx.fill();
        const weightGradient = uiCtx.createLinearGradient(weightBaseX, weightBaseY, weightBaseX + weightWidth, weightBaseY);
        weightGradient.addColorStop(0, "rgba(114, 193, 249, 0.9)");
        weightGradient.addColorStop(1, "rgba(255, 120, 76, 0.92)");
        uiCtx.fillStyle = weightGradient;
        uiCtx.beginPath();
        uiCtx.roundRect(weightBaseX, weightBaseY, weightWidth * clamp(weightRatio, 0, 1), 20, 10);
        uiCtx.fill();
        uiCtx.fillStyle = "#f4fbff";
        uiCtx.fillText(`${state.ball.massNorm.toFixed(2)}x`, weightBaseX, 115);
        uiCtx.fillText(state.ball.massNorm >= 1 ? "nặng hơn" : "nhẹ hơn", VIEW_W - 148, 115);

        if (state.flash > 0.02) {
          uiCtx.strokeStyle = `rgba(255, 70, 48, ${0.2 + state.flash * 0.5})`;
          uiCtx.lineWidth = 16;
          uiCtx.strokeRect(8, 8, VIEW_W - 16, VIEW_H - 16);
        }

        uiCtx.fillStyle = "rgba(236, 245, 252, 0.72)";
        uiCtx.font = "600 18px Montserrat, system-ui, sans-serif";
        uiCtx.fillText("← / A nghiêng trái   |   → / D nghiêng phải   |   chạm nửa trái/phải   |   F toàn màn hình", 44, VIEW_H - 34);

        if (state.mode === "title") {
          uiCtx.fillStyle = "rgba(1, 6, 12, 0.58)";
          uiCtx.fillRect(0, 0, VIEW_W, VIEW_H);
          uiCtx.fillStyle = "rgba(10, 18, 28, 0.84)";
          uiCtx.strokeStyle = "rgba(168, 226, 255, 0.18)";
          uiCtx.lineWidth = 2;
          uiCtx.beginPath();
          uiCtx.roundRect(VIEW_W * 0.5 - 360, 136, 720, 526, 34);
          uiCtx.fill();
          uiCtx.stroke();

          uiCtx.textAlign = "center";
          uiCtx.fillStyle = "#f1fbff";
          uiCtx.font = "800 68px Montserrat, system-ui, sans-serif";
          uiCtx.fillText("CÂN BẰNG+", VIEW_W * 0.5, 240);
          uiCtx.fillStyle = "#96d8ff";
          uiCtx.font = "600 20px Montserrat, system-ui, sans-serif";
          drawWrappedText("Giữ vật thể sống sót giữa gió đổi chiều và trọng lượng biến thiên.", VIEW_W * 0.5, 286, 540, 26);
          uiCtx.textAlign = "left";

          uiCtx.fillStyle = "#d7edf8";
          uiCtx.font = "600 18px Montserrat, system-ui, sans-serif";
          drawWrappedText("1. Điều chỉnh góc khối gỗ với độ trễ nhẹ.", VIEW_W * 0.5 - 252, 348, 520, 25);
          drawWrappedText("2. Gió đổi hướng sau mỗi 1–3 giây, càng mạnh càng rung camera.", VIEW_W * 0.5 - 252, 386, 520, 25);
          drawWrappedText("3. Trọng lượng quả cầu dao động liên tục, khiến mô-men xoắn thay đổi.", VIEW_W * 0.5 - 252, 446, 520, 25);
          drawWrappedText("4. Mép đỏ + nhịp phồng báo hiệu sắp rơi. Giữ càng lâu điểm càng cao.", VIEW_W * 0.5 - 252, 508, 520, 25);

          state.ui.startButton.x = VIEW_W * 0.5 - 170;
          state.ui.startButton.y = 556;
          state.ui.startButton.w = 340;
          state.ui.startButton.h = 80;

          uiCtx.fillStyle = "rgba(86, 197, 255, 0.15)";
          uiCtx.beginPath();
          uiCtx.roundRect(state.ui.startButton.x, state.ui.startButton.y, state.ui.startButton.w, state.ui.startButton.h, 24);
          uiCtx.fill();
          uiCtx.strokeStyle = "rgba(114, 214, 255, 0.65)";
          uiCtx.lineWidth = 2;
          uiCtx.stroke();

          uiCtx.textAlign = "center";
          uiCtx.fillStyle = "#f5fdff";
          uiCtx.font = "700 38px Montserrat, system-ui, sans-serif";
          uiCtx.fillText("BẮT ĐẦU", VIEW_W * 0.5, state.ui.startButton.y + 54);

          uiCtx.fillStyle = "#92d8ff";
          uiCtx.font = "600 20px Montserrat, system-ui, sans-serif";
          uiCtx.fillText("Enter / Space / chạm nút", VIEW_W * 0.5, state.ui.startButton.y + 170);
          uiCtx.textAlign = "left";
        } else if (state.mode === "gameover") {
          uiCtx.textAlign = "center";
          uiCtx.fillStyle = "rgba(1, 6, 12, 0.54)";
          uiCtx.fillRect(0, 0, VIEW_W, VIEW_H);
          uiCtx.fillStyle = "rgba(12, 18, 28, 0.88)";
          uiCtx.strokeStyle = "rgba(255, 109, 92, 0.28)";
          uiCtx.lineWidth = 2;
          uiCtx.beginPath();
          uiCtx.roundRect(VIEW_W * 0.5 - 300, 184, 600, 420, 32);
          uiCtx.fill();
          uiCtx.stroke();

          uiCtx.fillStyle = "#ffddd7";
          uiCtx.font = "800 72px Montserrat, system-ui, sans-serif";
          uiCtx.fillText("RƠI MẤT RỒI", VIEW_W * 0.5, 312);
          uiCtx.fillStyle = "#f1fbff";
          uiCtx.font = "700 54px Montserrat, system-ui, sans-serif";
          uiCtx.fillText(`${state.score.toFixed(1)}s`, VIEW_W * 0.5, 378);

          uiCtx.fillStyle = "#9fdfff";
          uiCtx.font = "600 24px Montserrat, system-ui, sans-serif";
          uiCtx.fillText(`Kỷ lục: ${state.bestScore.toFixed(1)}s`, VIEW_W * 0.5, 430);

          uiCtx.fillStyle = "rgba(255, 128, 98, 0.16)";
          uiCtx.beginPath();
          uiCtx.roundRect(state.ui.restartButton.x, state.ui.restartButton.y, state.ui.restartButton.w, state.ui.restartButton.h, 24);
          uiCtx.fill();
          uiCtx.strokeStyle = "rgba(255, 140, 116, 0.72)";
          uiCtx.lineWidth = 2;
          uiCtx.stroke();

          uiCtx.fillStyle = "#fff8f5";
          uiCtx.font = "700 32px Montserrat, system-ui, sans-serif";
          uiCtx.fillText("CHƠI LẠI", VIEW_W * 0.5, state.ui.restartButton.y + 48);

          uiCtx.fillStyle = "#ffd4ca";
          uiCtx.font = "600 20px Montserrat, system-ui, sans-serif";
          uiCtx.fillText("Enter / Space / chạm nút", VIEW_W * 0.5, state.ui.restartButton.y + 198);
          uiCtx.textAlign = "left";
        }

        uiCtx.restore();
      }

      function render(alpha) {
        renderer.begin();
        drawBackground();
        drawAmbientFx();

        const offsetX = state.camera.x;
        const offsetY = state.camera.y;

        drawParticles(offsetX * 0.35, offsetY * 0.35);
        const interpolatedAngle = lerp(state.board.prevAngle, state.board.angle, alpha);
        drawBoard(interpolatedAngle, offsetX, offsetY);
        drawBall(alpha, offsetX, offsetY);
        drawDangerGlow();
        renderer.flush();
        drawUi();
        renderer.uploadUi();
        renderer.drawUi();
      }

      let rafId = 0;
      let lastTime = performance.now();
      let manualStepUntil = 0;

      function tick(now) {
        const delta = Math.min((now - lastTime) / 1000, MAX_FRAME_DT);
        lastTime = now;

        if (now > manualStepUntil) {
          state.accumulator += delta;
          while (state.accumulator >= FIXED_DT) {
            step(FIXED_DT);
            state.accumulator -= FIXED_DT;
          }
        }

        render(Math.max(0, Math.min(1, state.accumulator / FIXED_DT)));
        rafId = requestAnimationFrame(tick);
      }

      function advanceSimulation(ms) {
        manualStepUntil = performance.now() + 220;
        let remaining = Math.max(0, ms) / 1000;
        while (remaining > 0) {
          const dt = Math.min(FIXED_DT, remaining);
          state.accumulator = 0;
          step(dt);
          remaining -= dt;
        }
        render(1);
        return Promise.resolve();
      }

      window.advanceTime = advanceSimulation;

      window.render_game_to_text = () => JSON.stringify({
        coordinateSystem: "origin bottom-left, +x right, +y up",
        mode: state.mode,
        score: Number(state.score.toFixed(2)),
        board: {
          x: Number(state.board.x.toFixed(1)),
          y: Number(state.board.y.toFixed(1)),
          angleDeg: Number((state.board.angle * 180 / Math.PI).toFixed(1)),
          angularVelocity: Number(state.board.angularVelocity.toFixed(3)),
        },
        ball: {
          x: Number(state.ball.x.toFixed(1)),
          y: Number(state.ball.y.toFixed(1)),
          vx: Number(state.ball.vx.toFixed(1)),
          vy: Number(state.ball.vy.toFixed(1)),
          onBoard: state.ball.onBoard,
          offsetOnBoard: Number(state.ball.s.toFixed(1)),
          mass: Number(state.ball.massNorm.toFixed(2)),
          danger: Number(state.ball.danger.toFixed(2)),
        },
        wind: {
          direction: state.wind.current >= 0 ? "right" : "left",
          force: Number(state.wind.current.toFixed(1)),
          strength: Number(state.wind.strength.toFixed(2)),
          timer: Number(state.wind.timer.toFixed(2)),
        },
        prompt: state.lastActionLabel,
      });

      function handleActionFromKeyboard(code) {
        if ((code === "Enter" || code === "Space") && state.mode !== "playing") {
          startGame();
        }
        if (code === "KeyF") {
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else {
            canvas.requestFullscreen().catch(() => { });
          }
        }
      }

      window.addEventListener("keydown", (event) => {
        if (event.code === "ArrowLeft" || event.code === "KeyA") {
          input.leftKey = true;
        } else if (event.code === "ArrowRight" || event.code === "KeyD") {
          input.rightKey = true;
        } else {
          handleActionFromKeyboard(event.code);
        }
      });

      window.addEventListener("keyup", (event) => {
        if (event.code === "ArrowLeft" || event.code === "KeyA") {
          input.leftKey = false;
        } else if (event.code === "ArrowRight" || event.code === "KeyD") {
          input.rightKey = false;
        }
      });

      function handlePointerDown(event) {
        const point = getCanvasCoords(event.clientX, event.clientY);
        canvas.focus({ preventScroll: true });
        audio.resume();

        if (state.mode === "title" && containsPoint(state.ui.startButton, point.x, point.y)) {
          startGame();
          return;
        }
        if (state.mode === "gameover" && containsPoint(state.ui.restartButton, point.x, point.y)) {
          startGame();
          return;
        }

        if (state.mode !== "playing" && point.y >= VIEW_H * 0.5) {
          startGame();
          return;
        }

        input.activePointers.set(event.pointerId, point);
        recalcPointerSides();
      }

      function handlePointerMove(event) {
        if (!input.activePointers.has(event.pointerId)) {
          return;
        }
        input.activePointers.set(event.pointerId, getCanvasCoords(event.clientX, event.clientY));
        recalcPointerSides();
      }

      function handlePointerUp(event) {
        input.activePointers.delete(event.pointerId);
        recalcPointerSides();
      }

      canvas.addEventListener("pointerdown", handlePointerDown);
      canvas.addEventListener("pointermove", handlePointerMove);
      canvas.addEventListener("pointerup", handlePointerUp);
      canvas.addEventListener("pointercancel", handlePointerUp);
      canvas.addEventListener("pointerleave", handlePointerUp);

      window.addEventListener("resize", () => {
        renderer.resize();
        render(1);
      });

      renderer.resize();
      resetGame("title");
      render(1);
      rafId = requestAnimationFrame(tick);

      window.addEventListener("beforeunload", () => {
        cancelAnimationFrame(rafId);
      });
    })();
  </script>
</body>

</html>
