<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Donate Poster</title>
        <!-- BEGIN: External Scripts -->
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <!-- END: External Scripts -->
        <!-- BEGIN: Style Configurations -->
        <style data-purpose="custom-gradients">
            /* Soft pastel gradient background for the whole page */
            .bg-pastel-gradient {
                background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
                background-attachment: fixed;
            }

            /* Soft colorful background shapes */
            .floating-shape-1 {
                background: radial-gradient(circle, rgba(255, 182, 193, 0.4) 0%, rgba(255, 182, 193, 0) 70%);
                filter: blur(40px);
            }
            .floating-shape-2 {
                background: radial-gradient(circle, rgba(173, 216, 230, 0.4) 0%, rgba(173, 216, 230, 0) 70%);
                filter: blur(40px);
            }
        </style>
        <style data-purpose="glassmorphism">
            /* Glassmorphism effect for the QR card */
            .glass-card {
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.4);
                box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            }
        </style>
        <style data-purpose="animations">
            @keyframes float {
                0% {
                    transform: translateY(0px);
                }
                50% {
                    transform: translateY(-10px);
                }
                100% {
                    transform: translateY(0px);
                }
            }
            .animate-float {
                animation: float 4s ease-in-out infinite;
            }

            @keyframes sparkle {
                0%,
                100% {
                    opacity: 0.3;
                    transform: scale(1);
                }
                50% {
                    opacity: 1;
                    transform: scale(1.2);
                }
            }
            .sparkle-icon {
                animation: sparkle 2s infinite;
            }
        </style>
        <!-- END: Style Configurations -->
    </head>
    <body class="bg-pastel-gradient min-h-screen flex items-center justify-center p-6 overflow-hidden font-sans">
        <!-- BEGIN: Background Elements -->
        <div class="fixed inset-0 pointer-events-none" data-purpose="background-decoration">
            <div class="floating-shape-1 absolute -top-20 -left-20 w-96 h-96 rounded-full"></div>
            <div class="floating-shape-2 absolute -bottom-20 -right-20 w-80 h-80 rounded-full"></div>
            <!-- Decorative floating sparkles -->
            <div class="sparkle-icon absolute top-1/4 right-10 text-yellow-400 text-2xl">✦</div>
            <div class="sparkle-icon absolute bottom-1/4 left-10 text-blue-300 text-3xl" style="animation-delay: 1s">
                ✦
            </div>
            <div class="sparkle-icon absolute top-1/3 left-20 text-pink-300 text-xl" style="animation-delay: 0.5s">
                ✧
            </div>
        </div>
        <!-- END: Background Elements -->
        <!-- BEGIN: Poster Content -->
        <main class="relative z-10 w-full max-w-md flex flex-col items-center gap-8" data-purpose="poster-container">
            <!-- Header Text -->
            <header class="text-center space-y-2">
                <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight">Ủng Hộ Mình Nhé 💖</h1>
                <p class="text-slate-500 font-medium">Sự ủng hộ của bạn giúp mình có tinh thần rất lớn!</p>
            </header>
            <!-- BEGIN: QR Card Section -->
            <section class="w-full" data-purpose="qr-card-section">
                <div class="glass-card rounded-[2.5rem] p-10 flex flex-col items-center relative">
                    <!-- Mascot Character pointing to QR -->
                    <div class="absolute -left-24 -right-4 w-40 h-40 animate-float" data-purpose="mascot-container">
                        <!-- Placeholder for mascot: Friendly blob-style character -->
                        <svg
                            class="w-full h-full drop-shadow-xl"
                            viewbox="0 0 200 200"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M45.7,-77.2C59.2,-69.1,70.1,-57.4,77.7,-43.9C85.3,-30.5,89.6,-15.2,88.7,-0.5C87.8,14.2,81.7,28.4,73.5,41C65.2,53.7,54.8,64.8,42.4,72.4C30,80,15,84.1,-0.7,85.2C-16.4,86.4,-32.8,84.7,-46.7,77.9C-60.6,71.1,-72.1,59.3,-79.7,45.4C-87.3,31.6,-91.1,15.8,-90.1,0.6C-89.1,-14.7,-83.4,-29.3,-74.6,-41.2C-65.8,-53.1,-53.9,-62.3,-40.8,-70.7C-27.7,-79.1,-13.9,-86.7,1,-88.4C15.9,-90.1,32.1,-85.4,45.7,-77.2Z"
                                fill="#FFD1DC"
                                transform="translate(100 100)"
                            ></path>
                            <!-- Cute Face -->
                            <circle cx="80" cy="85" fill="#4A5568" r="6"></circle>
                            <circle cx="120" cy="85" fill="#4A5568" r="6"></circle>
                            <path
                                d="M90 110 Q100 120 110 110"
                                fill="transparent"
                                stroke="#4A5568"
                                stroke-linecap="round"
                                stroke-width="4"
                            ></path>
                            <!-- Pointing Hand -->
                            <circle cx="50" cy="130" fill="#FFD1DC" r="15" stroke="#fff" stroke-width="2"></circle>
                            <path d="M65 130 L100 110" stroke="#FFD1DC" stroke-linecap="round" stroke-width="12"></path>
                        </svg>
                    </div>
                    <!-- Main QR Code Container -->
                    <div
                        class="bg-white p-4 rounded-3xl shadow-inner border border-gray-100"
                        data-purpose="qr-image-container"
                    >
                        <img alt="Donation QR Code" class="w-64 h-64 rounded-xl" src="beMoMo.avif" />
                    </div>
                </div>
            </section>
            <!-- END: QR Card Section -->
            <!-- Secondary Call to Action -->
            <footer class="w-full flex flex-col items-center gap-4" data-purpose="poster-footer">
                <p class="text-xs text-slate-400 text-center max-w-[250px]">
                    Quét mã bằng ứng dụng camera của bạn hoặc bất kỳ trình quét thanh toán nào để ủng hộ.
                </p>
            </footer>
        </main>
        <!-- END: Poster Content -->
    </body>
</html>
