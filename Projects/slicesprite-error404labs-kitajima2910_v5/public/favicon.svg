<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  
  <!-- Content: Sprite Grid with a Slice -->
  <g filter="url(#s)">
    <!-- Sprite Grid Backdrop -->
    <rect x="7" y="7" width="18" height="18" rx="2" fill="white" fill-opacity="0.1"/>
    
    <!-- Grid Lines -->
    <line x1="13" y1="7" x2="13" y2="25" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="19" y1="7" x2="19" y2="25" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="7" y1="13" x2="25" y2="13" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="7" y1="19" x2="25" y2="19" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
    
    <!-- Outer Border -->
    <rect x="7" y="7" width="18" height="18" rx="2" stroke="white" stroke-opacity="0.6" fill="none" stroke-width="1.5"/>
    
    <!-- Highlighted Sprite (Top Right) -->
    <rect x="19" y="7" width="6" height="6" rx="1" fill="white" fill-opacity="0.9"/>
    
    <!-- The Slice (Blade/Knife Path) -->
    <path d="M5 27L27 5" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M5 27L27 5" stroke="#6366f1" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"/>
  </g>
</svg>
