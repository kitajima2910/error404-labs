<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Trình giả lập Java ME Web - CheerpJ 4.2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23131b26'/%3E%3Ctext x='50%25' y='58%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-size='28' fill='%236be08f'%3EJ%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://cjrtnc.leaningtech.com" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <h1>Trình giả lập Java ME Web</h1>
      <div class="top-actions">
        <label class="file-btn" for="jar-input">Tải lên .jar</label>
        <input id="jar-input" type="file" accept=".jar" multiple />
        <label class="screen-size-label" for="screen-size-select">Màn hình</label>
        <select id="screen-size-select" class="screen-size-select">
          <option value="240x320">240x320 (Dọc)</option>
          <option value="320x240">320x240 (Ngang)</option>
          <option value="176x220">176x220 (Dọc)</option>
          <option value="220x176">220x176 (Ngang)</option>
          <option value="128x160">128x160 (Dọc)</option>
          <option value="160x128">160x128 (Ngang)</option>
        </select>
      </div>
    </header>

    <section class="loaders">
      <section class="dropzone" id="dropzone" aria-label="Kéo thả JAR tại đây">
        Kéo thả file .jar vào đây hoặc bấm Tải lên .jar
      </section>

      <section class="url-loader" aria-label="Tải game từ URL">
        <input id="url-input" type="url" placeholder="https://example.com/game.jar hoặc games/snake.jar" />
        <button id="url-add-btn" type="button">Thêm URL</button>
      </section>
    </section>

    <section class="workspace" aria-label="Khu vực giả lập">
      <div class="game-area-panel" id="game-area-panel">
        <div id="game-screen" tabindex="0" aria-label="Màn hình game">
          <div id="game-viewport"></div>
        </div>
        <button id="show-keypad-btn" type="button" class="show-keypad-btn" hidden>Hiện bàn phím</button>
        <div class="status-row">
          <span id="status-text">Sẵn sàng</span>
        </div>
      </div>

      <aside class="keypad-panel" id="keypad-panel" aria-label="Bàn phím ảo Nokia">
        <div class="keypad-wrap">
          <h3>Bàn phím Nokia</h3>

          <div class="keypad-block dpad-grid">
            <button class="key soft" data-key="SoftLeft">Phím trái</button>
            <button class="key nav" data-key="ArrowUp">Lên</button>
            <button class="key soft" data-key="SoftRight">Phím phải</button>

            <button class="key nav" data-key="ArrowLeft">Trái</button>
            <button class="key nav ok" data-key="Enter">OK</button>
            <button class="key nav" data-key="ArrowRight">Phải</button>

            <button class="key util" data-key="Backspace">Lùi</button>
            <button class="key nav" data-key="ArrowDown">Xuống</button>
            <button class="key util" data-key="Escape">Menu</button>
          </div>

          <div class="keypad-block numpad-grid">
            <button class="key" data-key="1">1</button>
            <button class="key" data-key="2">2</button>
            <button class="key" data-key="3">3</button>

            <button class="key" data-key="4">4</button>
            <button class="key" data-key="5">5</button>
            <button class="key" data-key="6">6</button>

            <button class="key" data-key="7">7</button>
            <button class="key" data-key="8">8</button>
            <button class="key" data-key="9">9</button>

            <button class="key" data-key="*">*</button>
            <button class="key" data-key="0">0</button>
            <button class="key" data-key="#">#</button>
          </div>

          <div class="keypad-block tool-grid">
            <button class="key util wide" id="hide-keypad-btn" type="button">Ẩn bàn phím</button>
          </div>
        </div>
      </aside>
    </section>

    <section class="library-panel" aria-label="Thư viện game">
      <h2>Danh sách game</h2>
      <div id="game-list" class="game-list"></div>
    </section>
  </div>

  <script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
