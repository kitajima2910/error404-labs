<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error404-Labs Launcher</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css">

    <style>
        html, body {
            font-family: "Open Sans", sans-serif;
            font-size: 14px;
            margin: 0;
            padding: 0;
            min-height: 180px;
            width: 384px;
        }

        h1 {
            font-family: "Menlo", monospace;
            font-size: 20px;
            font-weight: 400;
            margin: 0;
            color: #2B7FFF;
        }

        .logo-icon {
            width: 100%;
            height: 100%;
            max-width: 30px;
            aspect-ratio: 1;
            object-fit: cover;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            width: 100%;
        }

        a:link, a:visited {
            color: black;
            outline: 0;
            text-decoration: none;
        }

        .modal-header {
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 0.5px solid #dadada;
            height: 50px;
        }

        .modal-content {
            padding: 0 22px;
            text-align: center;
        }

        .modal-icons {
            border-top: 0.5 solid #dadada;
            height: 50px;
            width: 100%;
        }

        .version {
            color: #444;
        }

        .flex-container {
            display: flex;
            justify-content: space-evenly;
        }

        .flex {
            opacity: 1;
            transition: opacity 0.2s ease-in-out;
        }

        .flex:hover {
            opacity: 0.4;
        }

        .flex .fa {
            font-size: 25px;
            color: #1a6ce7;
        }
    </style>

</head>
<body>
    <div class="modal-header">
        <h1 class="logo">
            <img src="images/avatar_v2.jpg" alt="Error404-Labs" class="logo-icon"> Error404-Labs Launcher <span class="version">(1.0.0)</span>
        </h1>
    </div>
    <div class="modal-content">
        <p>Easily access Error404-Labs content</p>
    </div>
    <div class="modal-icons">
        <div class="flex-container">
            <div class="flex">
                <a href="https://www.error404-labs.info.vn/" target="_blank">
                    <i class="fa fa-globe" aria-hidden="true"></i>
                </a>
            </div>
            <div class="flex">
                <a href="https://www.facebook.com/kitajima2910" target="_blank">
                    <i class="fa fa-facebook" aria-hidden="true"></i>
                </a>
            </div>
            <div class="flex">
                <a href="https://github.com/kitajima2910" target="_blank">
                    <i class="fa fa-github" aria-hidden="true"></i>
                </a>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
