<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8800;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" />
      <feOffset dx="0.5" dy="0.5" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="url(#grad)" />
  
  <!-- Slice Grid Lines -->
  <line x1="16" y1="4" x2="16" y2="28" stroke="white" stroke-width="0.5" stroke-opacity="0.3" />
  <line x1="4" y1="16" x2="28" y2="16" stroke="white" stroke-width="0.5" stroke-opacity="0.3" />
  
  <!-- Stylized Sprite Slices -->
  <g filter="url(#shadow)">
    <!-- Top Left -->
    <rect x="7" y="7" width="8" height="8" rx="2" fill="white" />
    <!-- Bottom Right -->
    <rect x="17" y="17" width="8" height="8" rx="2" fill="white" fill-opacity="0.8" />
    
    <!-- Slice Path -->
    <path d="M4 28 L28 4" stroke="white" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
