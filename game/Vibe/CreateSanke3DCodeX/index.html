<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classic Snake</title>
  <link rel="stylesheet" href="./main.css" />
</head>
<body>
  <main class="app">
    <h1>Snake</h1>
    <section class="hud" aria-label="Game status">
      <p>Score: <span id="score">0</span></p>
      <p>Status: <span id="status">Running</span></p>
    </section>

    <canvas id="board" width="480" height="480" aria-label="Snake game board"></canvas>

    <div class="controls">
      <button id="pause" type="button">Pause (P)</button>
      <button id="restart" type="button">Restart (R)</button>
      <p class="hint">Use Arrow keys or WASD</p>
    </div>
  </main>

  <script src="./main.js"></script>
</body>
</html>
