<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.0.5/p5.min.js"></script>
        <script>
            function setup() {
                createCanvas(400, 400);
            }

            function draw() {
                background(220);

                var y = 70;
                var size = 30;

                // Cái đầu
                ellipse(125, 100, 150, 150);

                // Hai con mắt
                ellipse(100, y, size, size);
                ellipse(150, y, size, size);
            }
        </script>
    </body>
</html>
