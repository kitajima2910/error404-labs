<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Thử thách: Vẽ ngày trời nắng và có tuyết</title>
    </head>
    <body>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.0.5/p5.min.js"></script>
        <script>
            function setup() {
                createCanvas(400, 400);
            }

            function draw() {
                // Màu nền
                background(50, 200, 200);

                // Mặt trời
                fill(255, 204, 0);
                ellipse(50, 100, 50);

                // Mặt đất
                fill(100, 255, 100);
                rect(0, 350, 400, 50);

                // Người tuyết
                fill(255);
                ellipse(200, 330, 100);
                ellipse(200, 270, 80);
                ellipse(200, 230, 50);
            }
        </script>
    </body>
</html>
