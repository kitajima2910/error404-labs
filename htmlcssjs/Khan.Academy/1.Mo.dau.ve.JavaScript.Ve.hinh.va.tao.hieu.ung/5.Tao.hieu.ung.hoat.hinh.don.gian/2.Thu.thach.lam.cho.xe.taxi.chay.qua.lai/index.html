<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Thử thách: Làm cho xe taxi chạy qua lại</title>
    </head>
    <body>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.0.5/p5.min.js"></script>
        <script>
            var taxiX;
            var taxiLeftToRight;

            function setup() {
                createCanvas(400, 400);
                noStroke();

                taxiX = 0;
                taxiLeftToRight = true;
            }

            function draw() {
                background(151, 244, 247);

                // Vẽ xe taxi
                fill(150, 0, 0);
                rect(taxiX + 50, 200, 100, 30); // Thân xe

                fill(0);
                ellipse(taxiX + 80, 230, 20); // Bánh xe trước
                ellipse(taxiX + 120, 230, 20); // Bánh xe sau

                fill(255);
                rect(taxiX + 65, 180, 70, 30); // Cabin xe

                // Cho xe ta xi di chuyển qua lại khi đụng cạnh
                if (taxiLeftToRight) {
                    taxiX += 1;
                    if (taxiX + 150 >= width) {
                        taxiLeftToRight = false;
                    }
                } else {
                    taxiX -= 1;
                    if (taxiX <= 0 - 50) {
                        taxiLeftToRight = true;
                    }
                }
            }
        </script>
    </body>
</html>
