<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Thử thách: Vẽ người tuyết đơn giản</title>
    </head>
    <body>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.0.5/p5.min.js"></script>
        <script>
            function setup() {
                createCanvas(400, 400, WEBGL);
            }

            function draw() {
                background(200);

                rect(-200, 150, 400, 50);

                ellipse(0, 120, 150, 150);
                ellipse(0, 50, 110, 110);
                ellipse(0, 0, 90, 90);

                line(-100, -90, -40, 60);
                line(100, -90, 40, 60);

                ellipse(-20, -5, 20, 20);
                ellipse(20, -5, 20, 20);

                rect(-15, 15, 30, 10);

                line(-30, -20, -10, -20);
                line(30, -20, 10, -20);
            }
        </script>
    </body>
</html>
