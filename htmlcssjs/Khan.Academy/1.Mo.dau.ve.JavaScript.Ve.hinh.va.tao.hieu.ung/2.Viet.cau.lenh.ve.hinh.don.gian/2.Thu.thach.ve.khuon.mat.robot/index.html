<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Thử thách: Vẽ khuôn mặt Robot</title>
    </head>
    <body>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.0.5/p5.min.js"></script>
        <script>
            function setup() {
                createCanvas(400, 400, WEBGL);
            }

            function draw() {
                background(200);

                rect(-125, -120, 250, 250); // Khuôn mặt

                rect(-30, 130, 70, 60); // Cổ

                rect(40, -40, 40, 40); // Mắt phải

                rect(-80, -40, 40, 40); // Mắt trái

                rect(-75, 40, 150, 50); // Miệng

                // Chân mày
                line(-70, -60, 70, -60);
            }
        </script>
    </body>
</html>
