<!DOCTYPE html>
<html lang="vi" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="icon" type="image/avif" href="./avatar.avif">

    <!-- SEO Meta Tags -->
    <title>Phạm Xuân Hoài | R&D Programmer & SaaS Architect | 2026</title>
    <meta name="description"
        content="Khám phá chuyên môn R&D và thiết kế kiến trúc hệ thống của Phạm Xuân Hoài, cùng các dự án SaaS đột phá. Trải nghiệm giải pháp công nghệ tiên tiến.">
    <meta name="keywords"
        content="Phạm Xuân Hoài, R&D Programmer, SaaS Architect, Software Engineer, Web Development, SaaS">
    <meta name="author" content="Phạm Xuân Hoài">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Phạm Xuân Hoài | R&D Programmer & SaaS Architect">
    <meta property="og:description"
        content="Chuyên môn R&D và thiết kế kiến trúc hệ thống, phát triển các dự án SaaS chất lượng cao.">
    <meta property="og:image"
        content="https://placehold.co/1200x630?text=Ph%E1%BA%A1m+Xu%C3%A2n+Ho%C3%A0i+-+R%26D+Programmer+%26+SaaS+Architect">
    <meta property="og:url" content="https://www.error404-labs.info.vn/">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Phạm Xuân Hoài | R&D Programmer & SaaS Architect">
    <meta name="twitter:description"
        content="Chuyên môn R&D và thiết kế kiến trúc hệ thống, phát triển các dự án SaaS chất lượng cao.">
    <meta name="twitter:image"
        content="https://placehold.co/1200x630?text=Ph%E1%BA%A1m+Xu%C3%A2n+Ho%C3%A0i+-+R%26D+Programmer+%26+SaaS+Architect">

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Phạm Xuân Hoài",
      "jobTitle": "R&D Programmer & SaaS Architect",
      "url": "https://www.error404-labs.info.vn/",
      "sameAs": [
        "https://github.com/kitajima2910"
      ]
    }
    </script>

    <!-- Main Compiled CSS -->
    <link rel="stylesheet" href="./style.css">

    <!-- Scripts: Alpine.js 3.x & Lucide Icons -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-base-200 text-base-content font-sans antialiased"
    x-data="{ shareModalOpen: false, theme: localStorage.getItem('theme') || 'dark', themes: ['light', 'dark', 'cupcake', 'bumblebee', 'emerald', 'corporate', 'synthwave', 'retro', 'cyberpunk', 'valentine', 'halloween', 'garden', 'forest', 'aqua', 'lofi', 'pastel', 'fantasy', 'wireframe', 'black', 'luxury', 'dracula', 'cmyk', 'autumn', 'business', 'acid', 'lemonade', 'night', 'coffee', 'winter', 'dim', 'nord', 'sunset'], init() { if(typeof lucide !== 'undefined') lucide.createIcons(); document.documentElement.setAttribute('data-theme', this.theme); } }">

    <main class="mx-auto w-full max-w-lg px-4 py-10 flex flex-col items-center gap-5 relative">

        <!-- Theme Controller -->
        <div class="absolute top-4 right-4 z-50">
            <div class="relative" x-data="{ themeOpen: false }" @click.outside="themeOpen = false">
                <div role="button" @click="themeOpen = !themeOpen"
                    class="btn btn-ghost btn-circle bg-base-100/50 hover:bg-base-200 backdrop-blur-sm shadow-sm"
                    aria-label="Theme Switcher">
                    <i data-lucide="palette" class="w-5 h-5"></i>
                </div>
                <ul x-show="themeOpen" style="display: none;"
                    x-transition:enter="transition ease-out duration-100"
                    x-transition:enter-start="transform opacity-0 scale-95"
                    x-transition:enter-end="transform opacity-100 scale-100"
                    x-transition:leave="transition ease-in duration-75"
                    x-transition:leave-start="transform opacity-100 scale-100"
                    x-transition:leave-end="transform opacity-0 scale-95"
                    class="absolute right-0 top-full mt-2 bg-base-100 text-base-content rounded-box z-[1] w-48 p-2 shadow-2xl h-[60vh] max-h-96 overflow-y-auto flex flex-col gap-1 border border-base-content/5">
                    <template x-for="t in themes" :key="t">
                        <li>
                            <button
                                @click="theme = t; localStorage.setItem('theme', t); document.documentElement.setAttribute('data-theme', t); themeOpen = false;"
                                class="w-full text-left btn btn-sm btn-ghost justify-start"
                                :class="theme === t ? 'bg-primary/10 text-primary font-bold' : ''">
                                <span class="capitalize" x-text="t"></span>
                            </button>
                        </li>
                    </template>
                </ul>
            </div>
        </div>

        <!-- Header Profile -->
        <header class="text-center space-y-3 animate-fade-in relative mt-8">
            <div class="avatar relative">
                <div
                    class="w-28 md:w-32 rounded-full ring-4 ring-primary ring-offset-base-200 ring-offset-4 ring-glow animate-pulse-slow">
                    <img src="./avatar.avif" alt="Phạm Xuân Hoài Avatar" />
                </div>
            </div>

            <div class="space-y-2 mt-4">
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight flex items-center justify-center gap-2">
                    Phạm Xuân Hoài
                    <i data-lucide="badge-check" class="w-7 h-7 text-info fill-info/20"></i>
                </h1>

                <h2 class="text-base font-medium text-base-content/80 mt-1">
                    Building Future with AI & Micro-SaaS
                </h2>
            </div>
        </header>

        <!-- Links Section -->
        <section class="w-full flex flex-col gap-3 mt-0">
            <!-- Link 1 -->
            <a href="https://www.error404-labs.info.vn/" target="_blank"
                class="btn btn-outline border-base-content/10 bg-base-100/50 hover:bg-base-100 hover:-translate-y-1 hover:shadow-lg hover:border-primary h-auto py-3.5 px-5 w-full flex justify-between items-center group transition-all duration-300 rounded-2xl relative overflow-hidden text-left">
                <div class="flex items-center gap-4 relative z-10">
                    <div class="p-2.5 bg-base-200 rounded-xl group-hover:bg-primary/20 transition-colors">
                        <i data-lucide="globe" class="w-6 h-6 group-hover:text-primary transition-colors"></i>
                    </div>
                    <span class="font-bold text-[1.05rem]">Personal Website</span>
                </div>
                <div class="flex items-center relative z-10 shrink-0">
                    <i data-lucide="arrow-right"
                        class="w-5 h-5 opacity-40 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>
                </div>
            </a>

            <!-- Link 2 -->
            <a href="#"
                class="btn btn-outline border-base-content/10 bg-base-100/50 hover:bg-base-100 hover:-translate-y-1 hover:shadow-lg hover:border-secondary h-auto py-3.5 px-5 w-full flex justify-between items-center group transition-all duration-300 rounded-2xl relative overflow-hidden text-left">
                <div class="flex items-center gap-4 relative z-10">
                    <div class="p-2.5 bg-base-200 rounded-xl group-hover:bg-secondary/20 transition-colors">
                        <i data-lucide="briefcase" class="w-6 h-6 group-hover:text-secondary transition-colors"></i>
                    </div>
                    <span class="font-bold text-[1.05rem]">SaaS Portfolio</span>
                </div>
                <div class="flex items-center relative z-10 shrink-0">
                    <i data-lucide="arrow-right"
                        class="w-5 h-5 opacity-40 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>
                </div>
            </a>

            <!-- Link 3 -->
            <a href="https://github.com/kitajima2910" target="_blank"
                class="btn btn-outline border-base-content/10 bg-base-100/50 hover:bg-base-100 hover:-translate-y-1 hover:shadow-lg hover:border-accent h-auto py-3.5 px-5 w-full flex justify-between items-center group transition-all duration-300 rounded-2xl relative overflow-hidden text-left">
                <div class="flex items-center gap-4 relative z-10">
                    <div class="p-2.5 bg-base-200 rounded-xl group-hover:bg-accent/20 transition-colors">
                        <i data-lucide="github" class="w-6 h-6 group-hover:text-accent transition-colors"></i>
                    </div>
                    <span class="font-bold text-[1.05rem]">GitHub Profile</span>
                </div>
                <div class="flex items-center relative z-10 shrink-0">
                    <i data-lucide="arrow-right"
                        class="w-5 h-5 opacity-40 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>
                </div>
            </a>

            <!-- Link 4 -->
            <a href="#"
                class="btn btn-outline border-base-content/10 bg-base-100/50 hover:bg-base-100 hover:-translate-y-1 hover:shadow-lg hover:border-info h-auto py-3.5 px-5 w-full flex justify-between items-center group transition-all duration-300 rounded-2xl relative overflow-hidden text-left">
                <div class="flex items-center gap-4 relative z-10">
                    <div class="p-2.5 bg-base-200 rounded-xl group-hover:bg-info/20 transition-colors">
                        <i data-lucide="linkedin" class="w-6 h-6 group-hover:text-info transition-colors"></i>
                    </div>
                    <span class="font-bold text-[1.05rem]">LinkedIn Network</span>
                </div>
                <div class="flex items-center relative z-10 shrink-0">
                    <i data-lucide="arrow-right"
                        class="w-5 h-5 opacity-40 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>
                </div>
            </a>

            <!-- Link 5 -->
            <a href="https://www.facebook.com/kitajima2910" target="_blank"
                class="btn btn-outline border-base-content/10 bg-base-100/50 hover:bg-base-100 hover:-translate-y-1 hover:shadow-lg hover:border-warning h-auto py-3.5 px-5 w-full flex justify-between items-center group transition-all duration-300 rounded-2xl relative overflow-hidden text-left">
                <div class="flex items-center gap-4 relative z-10">
                    <div class="p-2.5 bg-base-200 rounded-xl group-hover:bg-warning/20 transition-colors">
                        <i data-lucide="mail" class="w-6 h-6 group-hover:text-warning transition-colors"></i>
                    </div>
                    <span class="font-bold text-[1.05rem]">Contact Me</span>
                </div>
                <div class="flex items-center relative z-10 shrink-0">
                    <i data-lucide="arrow-right"
                        class="w-5 h-5 opacity-40 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>
                </div>
            </a>
        </section>

        <!-- Share Action Button -->
        <button @click="shareModalOpen = true"
            class="btn btn-ghost hover:bg-base-200 text-base-content/70 hover:text-primary gap-2 rounded-full px-6 mt-1 mb-1 shrink-0">
            <i data-lucide="share-2" class="w-4 h-4"></i> Share My Profile
        </button>

        <!-- Footer -->
        <footer
            class="mt-2 pb-4 text-center text-sm text-base-content/40 font-medium w-full flex flex-col gap-2 shrink-0">
            <div class="divider before:bg-base-content/10 after:bg-base-content/10 h-0 my-0"></div>
            <p class="mt-2 flex items-center justify-center gap-1">Built with <i data-lucide="coffee"
                    class="w-4 h-4"></i> and Vibe Coding.</p>
        </footer>

    </main>

    <!-- Share Modal using Alpine.js -->
    <div x-show="shareModalOpen" class="relative z-50">
        <!-- Overlay -->
        <div x-show="shareModalOpen" @click="shareModalOpen = false" x-transition.opacity
            class="fixed inset-0 bg-black/50 backdrop-blur-sm"></div>

        <dialog class="modal sm:modal-middle" :class="shareModalOpen ? 'modal-open' : ''" open>
            <div class="modal-box bg-base-100 relative max-w-sm" @click.outside="shareModalOpen = false">
                <!-- Close Button -->
                <button type="button" @click="shareModalOpen = false"
                    class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>

                <h3 class="font-bold text-lg mb-6 flex items-center gap-2">
                    <i data-lucide="qr-code" class="w-5 h-5 text-primary"></i> Scan QR Code
                </h3>

                <div class="flex flex-col items-center justify-center gap-4">
                    <div class="bg-white p-4 rounded-2xl shadow-inner">
                        <img src="https://placehold.co/200x200?text=QR+CODE" alt="QR Code"
                            class="w-48 h-48 rounded-lg" />
                    </div>
                    <p class="text-sm text-base-content/70 mt-2 text-center">
                        Scan from another device to visit my profile directly.
                    </p>

                    <button class="btn btn-primary w-full mt-4 gap-2 rounded-xl"
                        @click="navigator.clipboard.writeText(window.location.href); alert('Đã copy link!'); shareModalOpen = false;">
                        <i data-lucide="copy" class="w-4 h-4"></i> Copy URL
                    </button>
                </div>
            </div>
        </dialog>
    </div>

    <!-- Script that runs only when loaded directly in browser for dev, to assure icons load -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
</body>

</html>
