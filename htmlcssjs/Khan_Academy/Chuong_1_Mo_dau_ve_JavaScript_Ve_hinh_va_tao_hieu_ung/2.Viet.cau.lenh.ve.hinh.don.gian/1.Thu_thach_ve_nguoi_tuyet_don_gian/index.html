<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Thử thách: Vẽ người tuyết đơn giản</title>
    </head>
    <body>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.0.5/p5.min.js"></script>
        <script>
            function setup() {
                createCanvas(400, 400, WEBGL);
            }

            function draw() {
                background(200);

                ellipse(0, 120, 150, 150);
                ellipse(0, 50, 110, 110);
                ellipse(0, 0, 90, 90);
            }
        </script>
    </body>
